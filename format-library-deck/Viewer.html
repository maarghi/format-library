m (Bay Area)\n37) Maverick Metals - chemistry for critical metal extraction (Austin)\n\nCalculated based on percentage of new team members added in the past few months.\n\nAdding direct links to their career pages in the comments\n\n\ud83d\udc4b follow me for more lists like this every week: Ben Lang\n\n\u2728 thank you to Harmonic (startup database) for helping me source the list\n\n\u2764\ufe0f for more lists like this, join Next Play | 41 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/benmlang_companies-that-just-raised-10-50m-hiring-activity-7413979426264186880-eXTf":{"text":"COMPANIES THAT JUST RAISED $10-50M (HIRING LIST)\n\nAll 33 of these companies are backed by top-tier funds and actively hiring:\n\n1) Studio  - marketplace for creators to build AI businesses (NYC)\n2) Pirros - detail management for AEC (LA)\n3) FINNY - AI prospecting for financial advisors (NYC)\n4) Tutor - robotic workforce (Watertown, MA)\n5) Supper - AI data agent (NYC)\n6) Ritten - EMR platform for behavioral health (Philadelphia)\n7) Qargo TMS - transport management (London / Ghent / EU remote)\n8) Simular - AI agents for computer tasks (Bay Area / Singapore / Remote)\n9) Trial Library - clinical trial recruitment and retention (Bay Area / Remote)\n10) Bobyard - AI takeoffs for landscapers (Bay Area)\n11) BoldVoice - accent training (NYC)\n12) Bitstack - bitcoin investing round-up app (Paris / France remote)\n13) Fin - crypto deposits and withdrawals (NYC / Remote)\n14) Trigger.dev - open source AI workflows (UK / EU remote)\n15) Tin Can - screen-free kid-friendly home phone (Seattle)\n16) Clarity Pediatrics - virtual pediatric care (Texas / California)\n17) Vinci4D.ai - AI hardware design platform (Bay Area)\n18) Safebooks AI - aligned revenue data (Tel Aviv / Bay Area / Remote)\n19) duvo.ai - secure AI workforce for retail (Prague / Paris / Munich / Madrid)\n20) Outset - AI-moderated research platform (Bay Area)\n21) Hnry - tax automation and accounting (Sydney / Wellington / London)\n22) Ostium - self-custodial leveraged trading (NYC)\n23) Pryzm - AI command center for federal capture (Boston / DC / NYC)\n24) Leona Health - WhatsApp co-pilot for doctors (Mexico City / SF / remote)\n25) Truemed - HSA/FSA payments (Bay Area / LA / Austin / NYC / Remote)\n26) Runware - unified API for generative media (London / UK remote)\n27) Unlimited Industries - AI engineering and construction (Bay Area)\n28) AnySignal - RF networking (LA)\n29) Ray studios - laser tattoo removal (Paris)\n30) Prime Security - automated security and privacy reviews (Tel Aviv / NYC)\n31) Hello Vet - same-day veterinary care (London)\n32) Gradial- agentic AI for content supply chains (Seattle)\n33) Reema Health - behavioral health and social needs navigation (US)\n\nAdding direct links to their career pages in the comments\n\n\ud83d\udc4b follow me for more lists like this every week: Ben Lang\n\n\u2728 thank you to Harmonic (startup database) for helping me source the list\n\n\ud83d\udcaa make sure to join Next Play if you're exploring what comes next in your career | 44 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/antonosika_lovable-just-raised-330m-at-a-66b-valuation-activity-7407404663626649600-cQAZ":{"text":"Lovable just raised $330M at a $6.6B valuation.\n\nIt's been an iconic, insane, wonderful journey so far.\n\nThank you to everyone who made this possible:\n\nThe millions of people who build with Lovable. It started with individuals building tools. Now some of the world's largest enterprises trust Lovable \u2013 and apps built with Lovable \u2013 with their data. Apps built with Lovable have gotten over half a billion visits combined in the last 6 months.\n\nThe Lovable team: 120 of the most talented people I've ever met. Including people who moved across the world to help us build a generational company from Europe. They're the reason Lovable has become a product trusted by millions.\n\nThe investors backing Lovable. Lovable's $330M fundraise was led by CapitalG and Menlo Ventures' Anthology fund. Additional investors include the venture arms of leading companies building the future of work: NVentures (Nvidia), Salesforce Ventures, Databricks Ventures, T. Capital (Deutsche Telekom), Atlassian Ventures, and HubSpot Ventures. They're joined by Khosla Ventures, DST Global, EQT Growth, Kinship Ventures, and returning investors Accel, Creandum, and Evantic.\n\nNow with Lovable, anyone can build million-dollar companies and products trusted by the world's largest enterprises.\n\nThis is the age of the builder.\t\n\nhttps://lnkd.in/eKqu96n6 | 582 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQFdmUCCeNMpOA/image-shrink_800/B4EZsxjSKgIUAg-/0/1766062892979?e=2147483647&v=beta&t=cZCTQW0z9RJuXld_pJ6YdIIT2UPWWqQQTVKUTbMFG3Y"},"https://www.linkedin.com/posts/tankots_we-just-raised-another-25m-after-10xing-activity-7397302293429268480-Yf3H":{"text":"We just raised another $25M after 10x'ing our ARR in 5 months. The crazy part is this almost never happened.\n\n17 years ago, I watched Iron Man as a 10-year-old kid in Delhi. That night, I pulled my first all-nighter teaching myself to code. Not because I wanted to build apps or make money.\n\nBecause I wanted to build Jarvis.\n\nMy parents gave me 1 hour of screen time per day. So I coded in secret, sleeping every alternate night through middle school and high school. Built 50+ apps. Got a cease and desist from Google at age 12.\n\nAll for this one obsession: making computers understand us like humans do.\n\nFast forward to today:\n- We've raised $81M total to build the voice operating system\n- Growing revenue 40% month-over-month this year\n- 70% user retention after one year (unheard of in consumer)\n- Teams at 270 of the Fortune 500 use Wispr Flow daily\n\nOur Series A2 was led by Hans Tung at Notable Capital (who was an early investor in five companies that made it to $100B valuation like Slack, Tiktok, and Airbnb). Steven Bartlett also joined as an investor and partner. \n\nBut here's what matters more than the money:\n\nWe cracked voice input. Not transcription - actual understanding. Our users hit \"send\" in under 0.5 seconds without checking. They trust it blindly. That's never existed before.\n\nIn a recent benchmark, Wispr came out as 3-4x more accurate than OpenAI, ElevenLabs, and Siri. \n\nAnd we're just getting started. Voice input was step one. Now we're building the assistant that actually does things for you.\n\nTo my co-founder Sahaj Garg - there's no one else I'd rather build Jarvis with than my college roommate and closest friend.\n\nTo our team pulling all-nighters and shipping magic - you're the reason that 10-year-old kid's dream is becoming real.\n\nWe're hiring cracked engineers and growth marketers who want to build the future of human-computer interaction.\n\nThe keyboard had a good 150-year run.\n\nTime to build what comes next.\n\nPS: like, repost, and comment \"Wispr\" to get Wispr Flow for free for 3 months \u2764\ufe0f\n\n\u2014 Written with Wispr Flow | 562 comments on LinkedIn","author":"Tanay Kothari","image":"https://dms.licdn.com/playlist/vid/v2/D5605AQGFogNf3FPTWg/thumbnail-with-play-button-overlay-high/B56Zqh_KjpKADM-/0/1763654287915?e=2147483647&v=beta&t=MCt1vpPw4eG3QygaSLaJbwecPWQN6KTTmAqLg7rMOak"},"https://www.linkedin.com/posts/carlesreina_q2-was-unique-at-elevenlabs-we-had-share-7480216645743972352-uOvi":{"text":"Q2 was unique at ElevenLabs - \n\u25aa\ufe0f We had the best consecutive 14 days ever in terms of Enterprise ARR\n\u25aa\ufe0f Grew first sale to be 66% outbound = We are in full control of our growth\n\u25aa\ufe0f We announced we had passed $500M ARR\n\u25aa\ufe0f Launched in Spain and Australia\n\u25aa\ufe0f Partnered with the UK, Greek & Polish governments for Agentic Gov workflows\n\u25aa\ufe0f Launched our Ads Engine within the Creative Platform\n\u25aa\ufe0f AI Avatars are now part of our product suite\n\u25aa\ufe0f Introduced V2 Dubbing, the world's SOTA speech-to-speech dubbing model\n\u25aa\ufe0f V2 Music was released, SOTA trained on fully licensed data\n\u25aa\ufe0f Crossed $22M in payouts to people who have their voice in the Marketplace\n\nLet's gooo! \ud83d\ude80  | 21 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/gracelee5332_excited-to-share-that-ive-joined-virio-as-activity-7383202064786579458-Ke_6":{"text":"Excited to share that I've joined Virio.\n\nMy path into startups wasn't planned at all. \n\nI started doing marketing work for a real estate firm, which evolved into partnering with the CEO to build internal tools and eventually, products for the broader proptech industry. I entered the game without knowing what I'm getting myself into. \n\nBut those years taught me invaluable lessons. And that's exactly why I moved from Seattle to LA. I wanted to be in the thick of it, learning by doing.\n\nIt wasn't until I came to SF that it felt like this is where I need to be. \n\nI thought building my own startups was the ultimate challenge, but being here has shown me there are always new limits to push. Every day brings a new lesson and it's been more exciting than ever.\n\nI'm excited to be working with the Virio team, and special shoutout to co-founders Eric Lay and Emmett Chen-Ran for believing in me and making this opportunity possible. \n\nI am more than thrilled to start this new chapter and to connect with more builders in the city. \n\nIf you're working in the GTM space in SF, would love to connect! | 85 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQFBsGCfTiv4iw/feedshare-shrink_1280/B56ZnZnJlAHUAs-/0/1760292544133?e=2147483647&v=beta&t=uk3s3D9Ktw0KirZIG2tl_a6_CmudTHiQgZvagyAgYgs"},"https://www.linkedin.com/posts/jeremyro_im-excited-to-share-that-ive-joined-virio-ugcPost-7381417662683328513-xLuy":{"text":"I\u2019m excited to share that I\u2019ve joined Virio as Founding GTM.\n\nIf you told me I\u2019d be building a startup 180 days ago, I wouldn\u2019t believe it.\n\n5 months ago I dmed Eric Lay to be his personal videographer - funny enough he originally ghosted me for a full month before getting back to me.\n\nI didn\u2019t have any startup experience, but we talked and he took a bold bet: \u201cLet\u2019s see where you fit.\u201d\n\nSoon enough, I found myself running around putting out fires I didn\u2019t even know could exist.\n- pulling off humiliating growth stunts\n- butchering cold calls to Fortune 500 execs\n- doing damage control on deals that could\u2019ve brought in 6-figures\n- reading hundreds of hateful comments on a post that hit 300K impressions\n\nThere was a long period of time where i was on the brink of being fired because I wasn\u2019t hitting my KPIs.\n\nand honestly\u2026 that continues to be a risk.\n\nThe bar rises as we grow. Every single day is a new, seemingly impossible standard to hurdle.\n\nYet somehow, we continue to rise up to the challenge.\n\nI've poured everything I have into this company.\n\nI have no desire stronger than to produce my greatest work, in the greatest city in the world. San Francisco.\n\ni have 3 chips on each shoulder and an insatiable desire to win. So that\u2019s what i\u2019ll continue to do. | 112 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/bjhguerin_anthropic-just-bought-a-super-bowl-ad-to-ugcPost-7424874098679304193-AT25":{"text":"Anthropic just bought a Super Bowl ad to say they\u2019ll never run ads.\n\nThere are four spots in the campaign. This one\u2019s my favourite.\n\nA guy doing pull-ups asks how to get a six-pack. Good advice at first, then it pivots into a pitch for insoles so \u201cshort kings can stand tall.\u201d\n\nPunchline: \u201cAds are coming to AI. But not to Claude.\u201d\n\nThree weeks ago OpenAI announced ads in ChatGPT. Anthropic\u2019s response? Spend millions on the biggest ad slot in the world to say they\u2019ll never do the same.\n\nMother absolutely nailed the creative. Too many tech brands default to bland purpose-driven nonsense, or worse: a laundry list of features.\n\nThis differentiates on something real, highlighting a product decision that actually matters to users.\n\nBut here\u2019s what makes it really smart.\n\nAnthropic\u2019s argument isn\u2019t just \u201cads are annoying.\u201d It\u2019s that AI conversations are fundamentally different to search or social. People share more with a chatbot than they ever would with Google. Ads in that context don\u2019t just interrupt, they erode trust.\n\nAnd this line from their blog stuck with me: \u201cThe most useful AI interaction might be a short one.\u201d\n\nThat\u2019s the opposite of every ad-funded platform ever built!\n\nOf course, it helps that Anthropic\u2019s revenue is enterprise-heavy while OpenAI is burning cash.\n\nIt\u2019s easier to be principled when your business model allows it. But that doesn\u2019t make it less smart.\n\n\u201cWe won\u2019t show you ads\u201d isn\u2019t an aspiration or a brand value. It\u2019s a product decision with real revenue consequences. And that\u2019s what makes it very hard to compete with. | 57 comments on LinkedIn","author":"Ben Guerin","image":"https://dms.licdn.com/playlist/vid/v2/D5605AQEOSHBfH8BNrw/thumbnail-with-play-button-overlay-high/B56ZwpzpyIKEDU-/0/1770227933889?e=2147483647&v=beta&t=3rMq52qSiZxyPolJEOgN1x0HT6038QrxsPY6h7Eaf4o"},"https://www.linkedin.com/posts/ericlay-virio_claude-just-posted-a-320kyear-ghostwriter-activity-7395151060652433408-58Vl":{"text":"Claude just posted a $320k/year ghostwriter position. Anthropic\u2019s Claude, the supposed \u201cbest\u201d AI writing LLM available. Hiring a human writer. For $320k. \n\nIf you\u2019ve been active in the AI space over the last 18-24 months, you\u2019ll understand exactly why this is hilarious:\n\nThe premiere AI writing tool (the one everyone is claiming \u201cwrites the most human-like content\u201d) recognizes they need a human tastemaker, what does that tell you?\n\nIf THEY aren\u2019t even using their own tools, you shouldn't either.\n\nIt means even the best model can\u2019t replace human taste. If you ask me? AI generated content is starting to really turn people off. Train your models on billions of words, fine-tune it to match someone\u2019s tone of voice to try to make it sound human \u2026 you can\u2019t teach it taste. \n\nApparently, the price for good taste is $320k right now.\n\nIf you\u2019ve been paying attention, you\u2019d see that we just paid 2x+ that. Why? Because we believe great content is going to be the forefront of what drives pipeline in 2026. \n\nSo yea, comment \u201cGTM strategy\u201d for your 892+ flow N8N strategy, subscribe $9/mo for your AI UGC creator, or pay influencers $4000 a post to shill for your product. \n\nWe\u2019re going all in on our humans. \n\nIf you're a successful LinkedIn creator, a ghostwriting agency owner, a head of marketing/content, or anyone in GTM with a proven track record of building an audience, we're hiring.\n | 132 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQEE4FcrLDTfpQ/feedshare-shrink_800/B4EZqDas1ZHEAg-/0/1763141406792?e=2147483647&v=beta&t=C05PJmaL7Q8f4mcsb5bPih1HUSNSluYBKyeJeQj3O-c"},"https://www.linkedin.com/posts/sugju-choi_hey-linkedin-im-linkedins-one-of-the-first-activity-7419070510862319616-tSUL":{"text":"Hey LinkedIn! I\u2019m LinkedIn\u2019s one of the first ever Product Builder - and I want your UNFILTERED feedback.\n\nWhat do you HATE the most about LinkedIn?\n\nWhether you\u2019re a:\n> recruiter or a founder looking for the right talent\n> job seeker hunting for opportunities\n> creator building your personal brand\n> developer sharing your work\n> or just here to network\n\nDoesn\u2019t matter WHY you\u2019re here, but I wanna know WHAT frustrates you the most .\n\nLeave a comment below, I\u2019ll read every single one - even the spicy ones.\n\u00a0\nBonus - I will give 6 month of FREE LinkedIn premium ($180 worth) to the best suggestion! \ud83d\udc97  | 960 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQFK9bz6nxNQUQ/feedshare-shrink_800/B56ZvXVUIPIcAg-/0/1768844248372?e=2147483647&v=beta&t=CVEHReg_C4eQp5KbR4uNbFzOaYorLutqdQF_Lrnh4X4"},"https://www.linkedin.com/posts/daniel-dhawan_2019-i-was-rejected-by-yc-for-the-first-activity-7430271916046790656-c8Ao":{"text":"2019: I was rejected by YC for the first time\n2021: I was rejected by YC 2 times\n2022: I was rejected by YC 2 times\n2023: I was rejected by YC 2 times\n2024: I was rejected by YC 2 times\n2025: I raised $3M+ led by a16z speedrun\n\nThe gap between rejection \u21169 and acceptance wasn't luck. It was 6 years of compounding effort that finally broke through.\n\nTo every founder collecting rejection emails right now:\nRejections \u2260 the end. Just keep building! | 196 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQHuSZUCgDTPFw/feedshare-shrink_800/B56Zx2g7vvJAAk-/0/1771514871204?e=2147483647&v=beta&t=gVQ2WWcjsc_4p1hKrQGsUIPhVyoui3x3X3GMrcbrlJ0"},"https://www.linkedin.com/posts/rachael-higgins-becauseofmarketing_2024-close-to-quitting-on-my-business-2025-activity-7413919456810176515-f_Ya":{"text":"2024: close to quitting on my business\n2025: huge breakthrough and made it our most successful year\n\n\nBack in 2024, I lost my spark with Because of Marketing. \n\nMy Dad got diagnosed with Lewy Body Dementia and my priorities shifted.\n\nI spent most of my days worrying about him as we adjusted to the diagnosis, and as a result I struggled to get the business wheels in motion. \n\nBut I really didn\u2019t want to quit on my dream and believed in what Because of Marketing could be! \n\n\nOn the 1st of January 2025 at 00:01 I wrote on my notes app:\n\n\u20182025 will be the year Because of Marketing will be financially successful\u2019. \n\nAnd then I locked in.\n\nEvery single month of 2025, I was in complete focus mode: \n\n\u2022\u2060  Got intentional with social media \n\u2060\nI posted less on mine and BoM\u2019s LinkedIn to build out our Instagram and Substack newsletter.\n\nLetting go of control and outsourcing to brilliant freelancers massively reduced my workload.\n\n\n\u2022\u2060  Made sacrifices\n\n\u2060I spent my 29th birthday still living in my mum\u2019s house vs hoping to have had my own house.\n \n\u2060I focused on building my business from my \u00a355 walnut dining table - I had to swap it out with my wardrobe in my bedroom to make space.\n\n\n\u2022\u2060  \u2060I worked across 3 time zones, US, UK and Australia. \n\nI wanted to be connected, not leave money on the table and stay updated as news moves fast (e.g I stayed up between 12-4am to ensure we had Super Bowl ad coverage)\n\n\nBut it all paid off and I genuinely couldn\u2019t be more proud. \n\n1 year of focus.\n1 year of risk.\n1 year of growth.\n\n\nHere\u2019s how 2025 went for the business: \n\n\u2192 Substack: 6,200 \u2192 43,400 subscribers (+590% and #7 bestselling substack in business)\n\n\u2192 Instagram: +270K followers, 22.4M views\n\n\u2192 TikTok: +55K followers, 15M views\n\n\u2192 LinkedIn: 295K \u2192 325K\n\n\n- We gained over 330,000 new followers.\n\n- Hosted an event with SEEN Group in London.\n\n- Partnered with Sipsmith during Wimbledon.\n\n- Launched our premium newsletter subscription\n\n- Took an exciting call with Apple!! \n\n\nBecause of Marketing has transformed from an Instagram page I created in my childhood bedroom into a global community and marketing media brand. \n\nWith the support from our followers and community, my team and I can continue creating what we love, breaking down the campaigns, providing analysis, trends and ideas to inspire the marketing industry. \n\n\nTo think I was SO close to quitting\u2026 when I was just on the brink of a breakthrough. \n\n2026, it\u2019s time to do it all again, but we aim higher!!\n\nHappy New Year everyone - don\u2019t give up on your dreams this year \ud83e\udd0e | 171 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFmeN-IzHADsA/feedshare-shrink_800/B4EZuOIYY2HUAg-/0/1767616135058?e=2147483647&v=beta&t=-KAlesOHbBLGodfUQGDaxJKJWXp6h9ssLkyyJLxXxJ0"}};       // {postLink: {text, author, image}} — backfills copy/author the sheet never captured
let SAVED = [];
let FORMATS = BUNDLED.slice();
const CLIENTS = ["Arceus","Caspian","Crescendo","Futurify","Goody","Percents"];
// Starter ICPs pre-filled per client (editable in the drafting menu — edits are saved and win).
const DEFAULT_ICPS = {
  Arceus:"Founders & GTM/RevOps leaders at early-stage B2B startups evaluating Arceus.",
  Caspian:"Ops, finance & compliance leaders at mid-market companies modernizing manual workflows.",
  Crescendo:"CX & support leaders scaling customer service without ballooning headcount.",
  Futurify:"Product & innovation leaders at enterprises modernizing legacy systems.",
  Goody:"People, marketing & sales leaders who send corporate gifts to build relationships.",
  Percents:"Founders & finance leaders managing company cash and looking for yield."
};
const STAGES = [{key:"ALL",nm:"All"},{key:"TOFU",nm:"TOFU"},{key:"MOFU",nm:"MOFU"},{key:"BOFU",nm:"BOFU"},{key:"ABM",nm:"ABM"}];
const state = {stages:new Set(), sources:new Set(), labels:new Set(), q:"", client:"", source_text:"", recent:0, useInterview:false, showHidden:false};
const $ = s => document.querySelector(s);

let VIEW = [];      // filtered list currently in the carousel
let active = 0;
let queueMode = false;   // D = browse the drafting queue in the same coverflow

// ---------- filtering ----------
function postKey(f){ return (f.examples&&f.examples[0]&&f.examples[0].url) || (f.name+"|"+(f.author||"")+"|"+(f.library||"")); }
function labelsOf(f){ return Array.isArray(f.labels) ? f.labels : (f.labels ? [String(f.labels)] : []); }   // sheets can return a bare string
function matches(f){
  if(f.lane==="ABM") return false;                                   // ABM retired — TOFU/MOFU/BOFU only
  const isHidden = hidden.has(postKey(f));
  if(state.showHidden){ if(!isHidden) return false; }                // "Hidden" view shows ONLY hidden posts
  else if(isHidden) return false;                                    // normal view hides them
  if(state.stages.size && !state.stages.has(f.lane)) return false;   // multi-select funnel
  if(state.sources.size){                                            // multi-select source (people + Virio/Millie)
    // "Millie" = her saved posts + the curated "Millie's List" bundled, as ONE source
    const hit = (f.person && state.sources.has(f.person)) || state.sources.has(f.library)
             || (state.sources.has("millies") && f.person==="Millie");
    if(!hit) return false;
  }
  if(state.recent){   // recently added (saved posts only — bundled refs have no save date)
    if(f.library!=="saved") return false;
    const t=f.savedAt?Date.parse(f.savedAt):NaN;
    if(isNaN(t) || (Date.now()-t) > state.recent*86400000) return false;
  }
  if(state.labels.size && !labelsOf(f).some(l=>state.labels.has(l))) return false;   // multi-select label (any)
  if(state.q){
    const hay=(f.name+" "+(f.archetype||"")+" "+(f.hook||"")+" "+(f.author||"")+" "+f.lane+" "+labelsOf(f).join(" ")+" "+(f.note||"")+" "+(f.example_text||"")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

// ---------- sidebar builders ----------
const libName = l => ({virio:"Virio List",millies:"Millie's List",saved:"Saved",marghi:"Saved"}[l]||l);
function initials(n){return ((n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0]).join("")||"?").toUpperCase();}
// record-sleeve colors — all inside the page's teal / olive / gold / terracotta family

// ---- left rail filters (multi-select: click several) ----
function railItem(nm, count, sel, onClick){
  const b=document.createElement("button"); b.className="fi"; b.setAttribute("aria-pressed", sel);
  b.innerHTML=`<span class="dot"></span><span class="nm">${esc(nm)}</span>${count!=null?`<span class="ct">${count}</span>`:""}`;
  b.onclick=onClick; return b;
}
function buildStages(){
  const el=$("#stages"); if(!el) return; el.innerHTML="";
  el.appendChild(railItem("All", FORMATS.length, state.stages.size===0, ()=>{ state.stages.clear(); rebuild(); buildStages(); }));
  ["TOFU","MOFU","BOFU"].forEach(k=>{
    const n=FORMATS.filter(f=>f.lane===k).length;
    el.appendChild(railItem(k, n, state.stages.has(k), ()=>{ state.stages.has(k)?state.stages.delete(k):state.stages.add(k); rebuild(); buildStages(); }));
  });
}
function buildRecents(){
  const el=$("#recents"); if(!el) return; el.innerHTML="";
  [[0,"Any time"],[7,"Last 7 days"],[30,"Last 30 days"]].forEach(([d,nm])=>{
    el.appendChild(railItem(nm, null, state.recent===d, ()=>{ state.recent=d; rebuild(); buildRecents(); }));
  });
}
function buildSources(){
  const el=$("#sources"); if(!el) return; el.innerHTML="";
  const people=[...new Set(SAVED.map(f=>f.person).filter(Boolean))].sort();
  el.appendChild(railItem("Everyone", FORMATS.length, state.sources.size===0, ()=>{ state.sources.clear(); rebuild(); buildSources(); }));
  const add=(v,nm,n)=>el.appendChild(railItem(nm, n, state.sources.has(v), ()=>{ state.sources.has(v)?state.sources.delete(v):state.sources.add(v); rebuild(); buildSources(); }));
  people.filter(p=>p!=="Millie").forEach(p=>add(p,p,FORMATS.filter(f=>f.person===p).length));
  if(BUNDLED.some(f=>f.library==="virio")) add("virio",libName("virio"),FORMATS.filter(f=>f.library==="virio").length);
  // Millie = her saved posts + the curated "Millie's List" bundled, as ONE consolidated source
  const millieN=FORMATS.filter(f=>f.person==="Millie"||f.library==="millies").length;
  if(millieN) add("millies","Millie",millieN);
}
function ownerOf(f){   // whose collection a post belongs to (Millie saved + list merge to one)
  if(f.person) return f.person;
  if(f.library==="millies") return "Millie";
  return libName(f.library);
}
function labelRow(l,count){
  const b=railItem(l, count, state.labels.has(l), ()=>{ state.labels.has(l)?state.labels.delete(l):state.labels.add(l); rebuild(); buildLabels(); });
  const mng=document.createElement("span"); mng.className="fi-mng";
  mng.innerHTML='<span class="fi-edit" title="Rename label">&#9998;</span><span class="fi-del" title="Delete label from the library">&times;</span>';
  mng.querySelector(".fi-edit").onclick=e=>{ e.stopPropagation(); const nw=prompt('Rename label “'+l+'” to:', l); if(nw&&nw.trim()&&nw.trim()!==l) renameLabelEverywhere(l,nw.trim()); };
  mng.querySelector(".fi-del").onclick=e=>{ e.stopPropagation(); if(confirm('Delete “'+l+'” from the whole library? This removes it from every post.')) deleteLabelEverywhere(l); };
  b.appendChild(mng); return b;
}
function buildLabels(){
  const el=$("#labels"); if(!el) return; el.innerHTML="";
  const byOwner={};   // owner -> {label: count}; a shared label appears under each person who uses it
  FORMATS.forEach(f=>labelsOf(f).forEach(l=>{ const o=ownerOf(f); (byOwner[o]=byOwner[o]||{})[l]=(byOwner[o][l]||0)+1; }));
  const owners=Object.keys(byOwner).sort();
  if(!owners.length){el.innerHTML='<div style="font-family:var(--mono);font-size:10px;color:var(--ink-3)">No labels yet — add them when you save a post.</div>';return;}
  owners.forEach(o=>{
    const collapsed=collapsedOwners.has(o);
    const h=document.createElement("div"); h.className="lblowner"+(collapsed?" collapsed":"");
    h.innerHTML=`<span class="lblcaret">&#9662;</span> ${esc(o)}`;
    const group=document.createElement("div"); group.className="lblgroup"; if(collapsed) group.hidden=true;
    Object.keys(byOwner[o]).sort((a,b)=>byOwner[o][b]-byOwner[o][a]||a.localeCompare(b))
      .forEach(l=>group.appendChild(labelRow(l, byOwner[o][l])));
    h.onclick=()=>{ collapsed?collapsedOwners.delete(o):collapsedOwners.add(o); saveLS('fl_collapsedOwners',[...collapsedOwners]); buildLabels(); };
    el.appendChild(h); el.appendChild(group);
  });
}
function deleteLabelEverywhere(l){
  FORMATS.forEach(f=>{ if(f.labels) f.labels=f.labels.filter(x=>x!==l); });
  state.labels.delete(l);
  if(window.google&&google.script&&google.script.run){ try{ google.script.run.deleteLabelEverywhere(l); }catch(e){} }
  rebuild(); buildLabels(); toast('Deleted “'+l+'”');
}
function renameLabelEverywhere(o,n){
  FORMATS.forEach(f=>{ if(f.labels) f.labels=f.labels.map(x=>x===o?n:x); });
  if(state.labels.has(o)){ state.labels.delete(o); state.labels.add(n); }
  if(window.google&&google.script&&google.script.run){ try{ google.script.run.renameLabel(o,n); }catch(e){} }
  rebuild(); buildLabels(); toast('Renamed to “'+n+'”');
}

// ---------- card markup ----------
// Every entry renders as a real LinkedIn post. Funnel + name + labels float underneath.
function cardHTML(f){
  const saved=f.library==="saved";
  const m0=parseMeta((f.examples&&f.examples[0]?f.examples[0].meta:"")||"");
  const author = saved ? (f.author||"LinkedIn author") : (m0.author||"LinkedIn author");
  const sub = saved ? "" : (m0.org||"");
  const react = saved ? f.reactions : m0.react;
  const comm  = saved ? f.comments  : m0.comm;
  const text = bodyOf(f);   // clean copy → real name; never the reactions header
  const link = (f.examples&&f.examples[0])?f.examples[0].url:"";
  const media = f.image ? `<div class="li-media"><img loading="lazy" data-img="${esc(f.image)}" alt=""></div>` : "";   // no image → clean text-only post
  const hideCorner = `<button class="li-hide" title="${state.showHidden?"Restore this post":"Hide this post"}" onclick="event.stopPropagation()">${state.showHidden
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.16 3.19m-6.72-1.07A3 3 0 1 1 9.9 9.9"/><path d="M1 1l22 22"/><path d="M4.2 4.2A18 18 0 0 0 2 12s3 8 10 8a9 9 0 0 0 4.3-1.1"/></svg>`}</button>`;
  const stats=(react||comm)
    ? `<div class="li-stats"><span class="li-reacts"><span class="rd" style="background:#0a66c2">&#128077;</span><span class="rd" style="background:#e06847">&#10084;</span><span class="rd" style="background:#d7a029">&#128079;</span><span class="n">${esc(react||"")}</span></span><span>${comm?esc(comm)+" comments":""}</span></div>` : "";
  const saver = f.person || (f.library==="millies"?"Millie":f.library==="virio"?"Virio":"the library");
  const metaLine = "Saved by "+esc(saver)+" · ";   // always show who saved it (never the date)
  const openCorner = link
    ? `<a class="li-open" href="${esc(link)}" target="_blank" rel="noopener" title="Open original on LinkedIn" onclick="event.stopPropagation()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg></a>` : "";
  return `<div class="float">
    <div class="li-post">
      ${openCorner}${hideCorner}
      <div class="li-head">
        <div class="li-ava" style="background:var(--stage)">${esc(initials(author))}</div>
        <div class="li-idwrap"><div class="li-name">${esc(author)}</div>
          ${sub?`<div class="li-sub">${esc(sub)}</div>`:``}
          <div class="li-meta">${metaLine}&#127760;</div></div>
      </div>
      <div class="li-text clamped">${esc(text)}</div>
      ${media}
      ${stats}
      <div class="li-actions">
        <button type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM7 11l4.2-7.4a1.8 1.8 0 0 1 3.1 1.8L13 10h5.6a2 2 0 0 1 2 2.4l-1.4 6.5a2 2 0 0 1-2 1.6H7"/></svg>Like</button>
        <button type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6A8.4 8.4 0 1 1 21 11.5z"/></svg>Comment</button>
        <button type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 2l4 4-4 4"/><path d="M3 12V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v3a3 3 0 0 1-3 3H3"/></svg>Repost</button>
        <button type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>Send</button>
      </div>
    </div>
    <div class="underrow"><span class="ufunnel">${esc(f.lane||"—")}</span></div>
  </div>`;
}

// ---------- build the carousel ----------
const track=$("#track");
function rebuild(){
  VIEW = queueMode ? queue.slice() : FORMATS.filter(matches);
  renderTrack();
  updateFilterBar();
}
function renderTrack(){
  active = 0;
  track.innerHTML="";
  const ex=$("#stage").querySelector(".empty"); if(ex) ex.remove();
  if(!VIEW.length){
    const e=document.createElement("div"); e.className="empty"; e.textContent="No formats match those filters";
    $("#stage").appendChild(e); layout(); updateCorners(); return;
  }
  const frag=document.createDocumentFragment();
  VIEW.forEach((f,i)=>{
    const s=document.createElement("div"); s.className="slide"; s.setAttribute("data-stage",f.lane||""); s.dataset.i=i;
    try{ s.innerHTML=cardHTML(f); }catch(err){ s.innerHTML='<div class="float"><div class="li-post"><div class="li-text">'+esc(f.name||"Post")+'</div></div></div>'; }   // one bad post can't break the deck
    // click any card → center it AND open its drafting menu (the exact post you clicked)
    s.addEventListener("click",(e)=>{
      if(e.target.closest(".li-open,.li-hide")) return;                 // let the corner buttons work
      if(+s.dataset.i!==active){ setActive(i); return; }                // click a side card → center it
      const t=s.querySelector(".li-text");
      if(t && t.classList.contains("clamped")){ t.classList.remove("clamped"); return; }   // 1st click on centered card → read the full post
      openSheet(f);                                                     // click again → open the drafting menu
    });
    const img=s.querySelector("img[data-img]"); if(img) attachImage(img);
    const hb=s.querySelector(".li-hide"); if(hb) hb.onclick=(ev)=>{ ev.stopPropagation(); toggleHidden(f); };
    frag.appendChild(s);
  });
  track.appendChild(frag);
  slides=[...track.children];
  layout(); updateCorners();
}
function shuffle(){
  if(VIEW.length<2) return;
  for(let i=VIEW.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=VIEW[i]; VIEW[i]=VIEW[j]; VIEW[j]=t; }
  renderTrack(); toast("Shuffled","&#128256;");
}

let slides=[];
const isMobile=()=>window.matchMedia("(max-width:760px)").matches;
function layout(){
  if(isMobile()){ slides.forEach(s=>{s.style.transform="";s.style.opacity="";s.classList.toggle("active",+s.dataset.i===active);}); return; }
  slides.forEach(s=>{
    const d=(+s.dataset.i)-active, ad=Math.abs(d), dir=Math.sign(d);
    let x,z,ry,sc,op;
    if(d===0){x=0;z=0;ry=0;sc=1;op=1;}
    else{
      // posts face you and stay visible; neighbors angle back slightly, spread WIDE
      x = dir*(496 + (ad-1)*338);
      z = -190*ad;
      ry = -dir*16;
      sc = Math.max(0.68, 1-0.12*ad);
      op = ad>4?0:Math.max(0.26,1-0.22*ad);
    }
    s.style.transform=`translate(-50%,-50%) translateX(${x}px) translateZ(${z}px) rotateY(${ry}deg) scale(${sc})`;
    s.style.opacity=op;
    s.style.zIndex=String(200-ad);
    s.style.pointerEvents = ad>4 ? "none" : "auto";
    s.classList.toggle("active", d===0);
  });
}
function setActive(i){
  active=Math.max(0,Math.min(VIEW.length-1,i));
  slides.forEach(s=>{const t=s.querySelector(".li-text"); if(t) t.classList.add("clamped");}); // re-clamp on move
  layout(); updateCorners();
}
function step(dir){ if(VIEW.length) setActive(active+dir); }
// ↓ : first press expands the focused post, second opens the drafting menu
function onDown(){
  const s=[...slides].find(x=>+x.dataset.i===active); if(!s){ draftNow(); return; }
  const t=s.querySelector(".li-text");
  if(t && t.classList.contains("clamped")){ t.classList.remove("clamped"); return; }  // 1st ↓ = read more
  const post=s.querySelector(".li-post");                                                             // then let ↓ scroll the post…
  if(post && post.scrollHeight - post.clientHeight - post.scrollTop > 8){
    post.scrollBy({top:Math.max(160,post.clientHeight*0.72),behavior:"smooth"}); return;
  }
  draftNow();                                                                                         // …only draft once you've read to the end
}
function toggleQueueMode(){
  if(!queueMode && !queue.length){ toast("Queue is empty — press ↑ on a post to add it","&#9873;"); return; }
  queueMode=!queueMode; rebuild(); updateModeUI();
}
function updateModeUI(){
  document.querySelector(".app").classList.toggle("queuemode", queueMode);
  const kq=$("#kQueue"); if(kq) kq.classList.toggle("on", queueMode);
  const ku=$("#kUp"); if(ku) ku.innerHTML = queueMode ? `<span class="ar">&#9650;</span> Remove` : `<span class="ar">&#9650;</span> Queue`;
  updateCorners();
}
function removeCurrentFromQueue(){
  if(!queueMode||!VIEW.length) return;
  queue.splice(active,1); saveLS('fl_queue',queue); updateQueue();
  if(!queue.length){ queueMode=false; updateModeUI(); rebuild(); return; }
  rebuild(); setActive(Math.min(active,queue.length-1)); toast("Removed from queue");
}

function updateCorners(){
  const f=VIEW[active];
  $("#cTL").innerHTML = queueMode ? `Drafting queue<br><b>D or Esc to exit</b>` : `Format Library<br><b>Viral LinkedIn formats</b>`;
  $("#cTR").innerHTML = f ? `${esc(libName(f.library))}${f&&f.person?" · "+esc(f.person):""}<br><b>${esc(f.lane||"")}</b>` : "";
  $("#cBL").innerHTML = VIEW.length ? `<b>${String(active+1).padStart(3,"0")}</b> / ${String(VIEW.length).padStart(3,"0")}` : "000 / 000";
  const hidLink = hidden.size ? `<br><a class="hidtog" id="hidTog">${state.showHidden?"← back to library":hidden.size+" hidden — view"}</a>` : "";
  $("#railfoot").innerHTML = queueMode ? `${queue.length} queued` : `${VIEW.length} in view<br>${FORMATS.length} total${hidLink}`;
  const ht=$("#hidTog"); if(ht) ht.onclick=toggleHiddenView;
}

// ---------- navigation inputs ----------
$("#prev").onclick=()=>step(-1);
$("#next").onclick=()=>step(1);
$("#railToggle").onclick=()=>{ document.querySelector(".app").classList.toggle("railhidden"); setTimeout(layout,60); };
$("#rfClear").onclick=clearAllFilters;
$("#keypad").addEventListener("click",e=>{ const b=e.target.closest(".kbtn"); if(!b)return; const k=b.dataset.k;
  if(k==="left")step(-1); else if(k==="right")step(1);
  else if(k==="up"){ queueMode?removeCurrentFromQueue():queueCurrent(); }
  else if(k==="down")onDown(); else if(k==="queue")toggleQueueMode();
  else if(k==="shuffle")shuffle(); else if(k==="hide"){ const f=VIEW[active]; if(f) toggleHidden(f); } });
document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    if(e.key==="Escape"){ e.preventDefault(); e.target.blur(); }  // Esc drops focus → arrows work again
    return;
  }
  if(modalOpen){                                                     // inside an open post (drafting menu)
    if(e.key==="Escape"||e.key==="Backspace"||e.key==="ArrowLeft"){e.preventDefault();closeSheet();}
    else if(e.key==="ArrowUp"){e.preventDefault();queueCurrent();}
    return;
  }
  const k=e.key;
  if(k==="ArrowRight"){e.preventDefault();step(1);}                   // library / queue
  else if(k==="ArrowLeft"){e.preventDefault();step(-1);}
  else if(k==="ArrowUp"){e.preventDefault(); queueMode?removeCurrentFromQueue():queueCurrent();}   // ↑ = queue the post
  else if(k==="ArrowDown"){e.preventDefault(); onDown();}
  else if(k==="Enter"){e.preventDefault(); draftNow();}
  else if(k==="q"||k==="Q"||k==="d"||k==="D"){e.preventDefault(); toggleQueueMode();}             // Q = go to the queue
  else if(k==="s"||k==="S"){e.preventDefault(); shuffle();}
  else if(k==="h"||k==="H"){e.preventDefault(); const f=VIEW[active]; if(f) toggleHidden(f);}
  else if(k==="Escape"&&queueMode){e.preventDefault(); toggleQueueMode();}
});

// applied-filter chips — shown in the rail, click × to remove
function updateFilterBar(){
  const bar=$("#filterbar"); if(!bar) return;
  const chips=[];
  [...state.stages].forEach(s=>chips.push(["Funnel: "+s, ()=>state.stages.delete(s)]));
  [...state.sources].forEach(s=>chips.push(["Source: "+libName(s), ()=>state.sources.delete(s)]));
  if(state.recent) chips.push(["Last "+state.recent+" days", ()=>state.recent=0]);
  [...state.labels].forEach(l=>chips.push(["Label: "+l, ()=>state.labels.delete(l)]));
  if(state.q) chips.push(["“"+state.q+"”", ()=>{state.q="";const s2=$("#search");if(s2)s2.value="";}]);
  bar.innerHTML="";
  chips.forEach(([txt,fn])=>{
    const c=document.createElement("span"); c.className="fchip"; c.innerHTML=esc(txt)+' <span class="fx">×</span>';
    c.querySelector(".fx").onclick=()=>{ fn(); refreshAll(); };
    bar.appendChild(c);
  });
  const wrap=$("#railfilters"); if(wrap) wrap.hidden = chips.length===0;
}
function clearAllFilters(){ state.stages.clear(); state.sources.clear(); state.labels.clear(); state.recent=0; state.q="";
  const b=$("#search"); if(b)b.value=""; refreshAll(); }
let wheelLock=false;
$("#stage").addEventListener("wheel",e=>{
  if(isMobile())return;
  // vertical wheel scrolls the focused post (so you can read long ones); only a
  // horizontal swipe navigates the coverflow. Arrows / chevrons also navigate.
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;   // let the post scroll
  e.preventDefault();
  if(wheelLock)return; wheelLock=true; setTimeout(()=>wheelLock=false,220);
  step(e.deltaX>0?1:-1);
},{passive:false});
// drag
let dragX=null;
$("#stage").addEventListener("pointerdown",e=>{dragX=e.clientX;});
$("#stage").addEventListener("pointerup",e=>{ if(dragX===null)return; const dx=e.clientX-dragX; dragX=null; if(Math.abs(dx)>60) step(dx<0?1:-1); });
window.addEventListener("resize",()=>layout());
$("#search").addEventListener("input",e=>{state.q=e.target.value.toLowerCase().trim();rebuild();});

// ---------- images ----------
function attachImage(img){
  const u=img.getAttribute("data-img"); if(!u) return;
  img.addEventListener("error",function onErr(){
    img.removeEventListener("error",onErr);
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(d=>{d?img.src=d:imgFail(img);}).withFailureHandler(()=>imgFail(img)).getImageDataUri(u);
    } else imgFail(img);
  });
  img.src=u;
}
// If a baked image fails to load, drop the whole media band so the post reads as clean text-only.
function imgFail(img){
  const media=img.closest(".li-media"); if(media){ media.remove(); return; }
  img.remove();
}

// ---------- modal ----------
const scrim=$("#scrim"), sheet=$("#sheet");
function openSheet(f){
  // Per-draft client: default to NONE every time so a stale client can never carry over.
  // A queued post keeps the client it was queued for (an explicit earlier choice).
  setClient(f.client!=null ? (f.client==="Unassigned"?"":f.client) : "");
  const saved=f.library==="saved";
  const url0=(f.examples&&f.examples[0])?f.examples[0].url:"";
  const m0=parseMeta((f.examples&&f.examples[0]?f.examples[0].meta:"")||"");
  const author=saved?(f.author||"LinkedIn author"):(m0.author||"LinkedIn author");
  const react=saved?f.reactions:m0.react, comm=saved?f.comments:m0.comm;
  const bodyText=bodyOf(f);
  const firstLine=bodyText.split("\n").map(s=>s.trim()).filter(Boolean)[0]||f.archetype||f.name||"";
  const thumb=f.image?`<img data-img="${esc(f.image)}" alt="">`:"";
  const liPost=(saved||f.example_text)?`
    <div class="li-post">
      <div class="li-head">
        <div class="li-ava" style="background:var(--stage)">${esc(initials(author))}</div>
        <div class="li-idwrap"><div class="li-name">${esc(author)}</div>
          ${(!saved&&m0.org)?`<div class="li-sub">${esc(m0.org)}</div>`:``}
          <div class="li-meta">Saved by ${esc(f.person||(f.library==="millies"?"Millie":f.library==="virio"?"Virio":"the library"))} · &#127760;</div></div>
      </div>
      <div class="li-text">${esc(bodyText)}</div>
      ${f.image?`<div class="li-media"><img id="modimg" data-img="${esc(f.image)}" alt=""></div>`:``}
      ${(react||comm)?`<div class="li-stats"><span class="li-reacts"><span class="rd" style="background:#0a66c2">&#128077;</span><span class="rd" style="background:#e06847">&#10084;</span><span class="rd" style="background:#d7a029">&#128079;</span><span class="n">${esc(react||"")}</span></span><span>${comm?esc(comm)+" comments":""}</span></div>`:``}
    </div>`:`<p class="linknote">This one's link-only — open it on LinkedIn.</p>`;
  openedIndex = VIEW.indexOf(f); if(openedIndex<0) openedIndex=active;   // return to THIS post on Back
  sheet.className="sheet draft"; sheet.setAttribute("data-stage",f.lane||"");
  sheet.innerHTML=`
    <div class="draft-head">
      <button class="back" id="x">&#8592; Back</button>
      <span class="draft-badge" id="dBadge"><span class="dbdot"></span>Drafting${state.client?` &middot; <b>${esc(state.client)}</b>`:""}</span>
      ${url0?`<a class="draft-open" href="${esc(url0)}" target="_blank" rel="noopener" title="Open original on LinkedIn">↗</a>`:`<span style="width:32px"></span>`}
    </div>
    <div class="sbody">
      <div class="post-mini" id="postToggle">
        <div class="pm-thumb">${thumb||`<span class="pm-noimg">${esc(f.lane||'—')}</span>`}</div>
        <div class="pm-body">
          <div class="pm-top"><span class="pm-funnel">${esc(f.lane||"—")}</span> <span class="pm-author">${esc(author)}</span></div>
          <div class="pm-line">${esc(clip(firstLine,110))}</div>
        </div>
        <span class="pm-caret" id="pmCaret">&#9662; Post</span>
      </div>
      <div class="post-full" id="postFull" hidden>${liPost}</div>
      ${composerHTML()}
    </div>
    <div class="actions">
      <button class="btn accent" id="cp">Copy prompt</button>
      <a class="btn" id="openClaude" target="_blank" rel="noopener">&#10022;&nbsp;Open Claude</a>
      <button class="btn" id="qm">&#9650;&nbsp;Queue</button>
    </div>`;
  modalOpen=true;
  scrim.classList.add("open"); document.body.style.overflow="hidden";
  $("#x").onclick=closeSheet;
  $("#qm").onclick=()=>{ queueOne(f); flyToQueueFrom($("#postToggle")); };
  const th=sheet.querySelector(".pm-thumb img"); if(th) attachImage(th);
  const pf=$("#postFull"), pt=$("#postToggle"), pc=$("#pmCaret");
  pt.onclick=()=>{ if(pf.hasAttribute("hidden")){ pf.removeAttribute("hidden"); pc.innerHTML="&#9652; Hide"; const mi=$("#modimg"); if(mi) attachImage(mi); } else { pf.setAttribute("hidden",""); pc.innerHTML="&#9662; Post"; } };
  const cc=$("#cClient"), ci=$("#cIcp"), cso=$("#cSource"), cpv=$("#cPrompt");
  let promptDirty=false;   // once the user hand-edits the prompt, stop auto-rebuilding it
  const refreshBadge=()=>{ const b=$("#dBadge"); if(b) b.innerHTML=`<span class="dbdot"></span>Drafting${state.client?` &middot; <b>${esc(state.client)}</b>`:""}`; };
  if(cc){
    cc.value=state.client||"";
    if(ci) ci.value=getIcp(state.client);
    if(cso) cso.value=state.source_text;
    const refresh=()=>{ if(cpv){ cpv.value=buildPrompt(f); promptDirty=false; } };
    refresh();
    const onClient=()=>{ setClient(cc.value); if(ci) ci.value=getIcp(state.client); refresh(); refreshBadge(); };
    cc.onchange=onClient; cc.addEventListener("input",onClient);   // update prompt+badge the instant a client is picked
    if(ci) ci.oninput=e=>{ setIcp(state.client, e.target.value); refresh(); };
    if(cso) cso.oninput=e=>{ state.source_text=e.target.value; refresh(); };
    if(cpv) cpv.oninput=()=>{ promptDirty=true; };
    const cint=$("#cInterview"); if(cint){ cint.checked=state.useInterview; cint.onchange=e=>{ state.useInterview=e.target.checked; refresh(); }; }
  }
  // Always send what the dropdown SHOWS. If a pending <select> change never committed to
  // state.client (iframe select quirk), resync from cc.value at click time and rebuild.
  function currentPrompt(){
    if(cc && cc.value!==(state.client||"")){ setClient(cc.value); if(ci) ci.value=getIcp(state.client); if(cpv){ cpv.value=buildPrompt(f); promptDirty=false; } refreshBadge(); }
    return (promptDirty && cpv) ? cpv.value : buildPrompt(f);
  }
  // Two SEPARATE actions, no coupling: "Copy prompt" puts the CURRENT prompt on your clipboard
  // and confirms it worked; "Open Claude" just opens a blank /new chat. Copy → open → paste.
  const sayCopied=(ok)=>toast(ok===false?"Copy failed — select the prompt and press ⌘C":("Prompt copied"+(state.client?" · "+state.client:"")), ok===false?"&#9888;":"&#128203;");
  const cpBtn=$("#cp"); if(cpBtn) cpBtn.onclick=()=>{ copy(currentPrompt()).then(sayCopied); };
  // Open Claude: set href in JS (a hardcoded href in the markup gets stripped by the Apps Script
  // sandbox, which removed the button). It ONLY opens a fresh blank tab — never copies — so no stale path.
  const oc=$("#openClaude");
  if(oc){ oc.href="https://claude.ai/new"; oc.onclick=()=>toast("Opening Claude — paste your copied prompt","&#10022;"); }
}
function composerHTML(){
  const opts=['<option value="">— generic / no client —</option>'].concat(CLIENTS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`)).join("");
  return `<div class="draft-panel">
    <label class="dlabel">Writing for</label>
    <select id="cClient" class="dinput">${opts}</select>
    <label class="dlabel">ICP / target reader <span class="dhint">remembered per client</span></label>
    <textarea id="cIcp" class="dinput mini" placeholder="Who is this client's ideal reader? e.g. Series A founders, 10–50 eng, drowning in hiring…"></textarea>
    <label class="dlabel">Optional instructions for Claude</label>
    <label class="dcheck"><input type="checkbox" id="cInterview"> Draft from my most recent content interview with this client</label>
    <textarea id="cSource" class="dinput mini" placeholder="e.g. use the story about the failed launch · keep it under 150 words"></textarea>
    <label class="dlabel">Claude prompt <span class="dhint">editable</span></label>
    <textarea id="cPrompt" class="dinput promptbox" spellcheck="false"></textarea>
  </div>`;
}
// Back = return to the scrolling menu on the SAME post (never jump a post).
let modalOpen=false, openedIndex=-1;
function hideModal(){ if(!modalOpen)return; modalOpen=false; scrim.classList.remove("open"); document.body.style.overflow=""; if(openedIndex>=0) setActive(openedIndex); }
function closeSheet(){ hideModal(); }
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
// Reward animation: the post flies off toward the queue counter.
function flyToQueueFrom(el){
  const qb=$("#queueBtn"); if(!el||!qb){ return; }
  const r=el.getBoundingClientRect(), q=qb.getBoundingClientRect();
  const clone=el.cloneNode(true);
  clone.style.cssText=`position:fixed;margin:0;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:500;background:#fff;border:1px solid #eceef0;box-shadow:0 24px 60px rgba(0,0,0,.28);transition:transform .55s cubic-bezier(.5,0,.2,1),opacity .55s;pointer-events:none`;
  document.body.appendChild(clone);
  requestAnimationFrame(()=>{ const dx=(q.left+q.width/2)-(r.left+r.width/2), dy=(q.top+q.height/2)-(r.top+r.height/2);
    clone.style.transform=`translate(${dx}px,${dy}px) rotate(11deg) scale(.09)`; clone.style.opacity="0"; });
  setTimeout(()=>clone.remove(),600); pulseQueue();
}
function pulseQueue(){ const qb=$("#queueBtn"); if(qb){ qb.classList.add("pulse"); setTimeout(()=>qb.classList.remove("pulse"),450); } }

// ---------- prompt builder ----------
function buildPrompt(f){
  const who=state.client||"my client";
  const interview=state.useInterview?"Pull material from my latest content-interview call (find it in my recent Fathom calls) and draft from what came up there.\n":"";
  const srcv=interview+(state.source_text.trim()||(interview?"":"[paste your raw material here — or tell Claude which Fathom call / content interview to pull from]"));
  const icp=(state.client?getIcp(state.client):"").trim();
  const icpLine=icp?`\nICP / target reader: ${icp}`:"";
  const clientLine=(state.client?`Pull ${state.client}'s context file and recent Fathom calls / content interviews for voice, proof, and specifics.`:`If this is for a specific client, load their context file and recent Fathom calls first.`)+(icp?` Write for this ICP: ${icp}.`:"");
  const imgLine=f.image?`\nPOST IMAGE (look at how the visual complements the copy, and suggest a matching visual): ${f.image}`:"";
  if(f.library==="saved"||f.linkOnly){
    return `Reverse-engineer this viral LinkedIn post's format for ${who}.

Funnel stage: ${f.lane}${icpLine}${imgLine}
Name: ${f.name}${f.author?`\nOriginal author: ${f.author}`:""}${f.example_text?`\n\nPOST TEXT:\n"""\n${f.example_text}\n"""`:""}

STEP 1 — Extract its format: the hook pattern, the block-by-block skeleton, the rhythm/formatting, and why it works.
STEP 2 — Write 1 post that follows that same format in ${who}'s voice, at the ${f.lane} funnel stage. ${clientLine}

Keep the reference's structure; swap in real specifics from my source material below. De-slop the draft (strip AI tells) and run the QA gate before showing me.

MY SOURCE MATERIAL:
${srcv}`;
  }
  const skel=(f.skeleton||[]).map((s,i)=>`${i+1}. ${s}`).join("\n");
  return `Reverse-engineer this viral LinkedIn format for ${who}.

FORMAT: ${f.name}  (${f.lane}${f.library?` · ${libName(f.library)}`:""})${icpLine}${imgLine}
Archetype: ${f.archetype||""}
Hook pattern: ${f.hook||""}
Skeleton:
${skel}

REFERENCE POST — match its SHAPE and rhythm, not its content:
"""
${f.example_text||""}
"""

MY SOURCE MATERIAL:
${srcv}

TASK: Write 1 post that follows this format's skeleton, hook pattern, and rhythm, in ${who}'s voice. ${clientLine} De-slop the draft (strip AI tells) and run the QA gate before showing me.`;
}

// ---------- utils ----------
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function parseMeta(m){m=m||"";
  const react=(m.match(/([\d,]+)\s*reactions?/i)||[])[1]||"", comm=(m.match(/([\d,]+)\s*comments?/i)||[])[1]||"";
  let author=(m.split(",")[0]||"").trim(),org=""; const om=author.match(/^(.*?)\s*\(([^)]+)\)\s*$/); if(om){author=om[1].trim();org=om[2].trim();}
  const dm=m.match(/(\d{4}-\d{2}-\d{2})|([A-Za-z]{3,9}\s+\d{4})/); return {author,org,react,comm,date:dm?dm[0]:""};
}
function clip(s,n){s=s||"";return s.length>n?s.slice(0,n-1)+"…":s;}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(()=>true).catch(()=>fallbackCopy(t));}return Promise.resolve(fallbackCopy(t));}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);return ok;}
let toastT; function toast(msg,em){const t=$("#toast");t.innerHTML=`<span class="em">${em||""}</span>${esc(msg)}`;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}

// ---------- drafting queue + per-client ICP (persisted) ----------
function loadLS(k,d){ try{ const v=localStorage.getItem(k); if(v==null) return d; const p=JSON.parse(v);
  return (Array.isArray(d)&&!Array.isArray(p)) ? d : p;   // guard: corrupt/mistyped value can't crash new Set(...) at boot
}catch(e){ return d; } }
function saveLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const asArr = x => Array.isArray(x) ? x : [];                 // never let a bad stored value crash boot
let queue = asArr(loadLS('fl_queue',[]));
let icps  = loadLS('fl_icps',{});
let hidden = new Set(asArr(loadLS('fl_hidden',[])));          // post keys the user has hidden as stale
let seenCount = loadLS('fl_seenCount', null);                 // #saved posts at last visit (for "N added" toast)
let collapsedOwners = new Set(asArr(loadLS('fl_collapsedOwners',[])));   // which label groups are collapsed
state.client = loadLS('fl_draftClient', state.client);
function saveHidden(){ saveLS('fl_hidden',[...hidden]); }
function toggleHidden(f){
  if(queueMode){ toast("Exit the queue to hide posts","&#9873;"); return; }   // hiding from the queue view is confusing — block it
  const k=postKey(f); hidden.has(k)?hidden.delete(k):hidden.add(k); saveHidden();
  toast(hidden.has(k)?"Post hidden":"Post restored", hidden.has(k)?"&#128584;":"&#128064;");
  if(state.showHidden && hidden.size===0) state.showHidden=false;             // don't get trapped in an empty Hidden view
  refreshAll(); }
function toggleHiddenView(){ state.showHidden=!state.showHidden; refreshAll(); }
function getIcp(c){ return c ? (icps[c] || DEFAULT_ICPS[c] || "") : ""; }
function setIcp(c,v){ if(!c)return; icps[c]=v; saveLS('fl_icps',icps); }
function setClient(v){ state.client=v; saveLS('fl_draftClient',v||""); }   // client is chosen inside the drafting panel now
function snapshot(f){ return {name:f.name,lane:f.lane,library:f.library,person:f.person,author:f.author,archetype:f.archetype,hook:f.hook,skeleton:f.skeleton,example_text:f.example_text,image:f.image,reactions:f.reactions,comments:f.comments,labels:f.labels,examples:f.examples}; }
function queueOne(f){
  if(!f){toast("Nothing to queue","&#9888;&#65039;");return;}
  const client=state.client||"Unassigned";
  const q=snapshot(f); q.client=client; queue.push(q);
  saveLS('fl_queue',queue); updateQueue();
  toast(`Queued for ${client} · ${queue.length} in queue`,"&#9873;");
}
function queueCurrent(){
  const f=VIEW[active]; if(!f)return;
  const s=[...slides].find(x=>+x.dataset.i===active); const card=s&&s.querySelector(".li-post");
  queueOne(f);
  if(card) flyToQueueFrom(card);
  if(active<VIEW.length-1) step(1);
}
function draftNow(){ const f=VIEW[active]; if(f) openSheet(f); }   // ↓ / Enter = open the post ("see more")
function updateQueue(){ const qn=$("#qn"); if(qn) qn.textContent=queue.length; }
$("#queueBtn").onclick=toggleQueueMode;   // browse the queue in the coverflow

// ---------- boot + live data ----------
function refreshAll(){ [buildStages,buildRecents,buildSources,buildLabels,updateQueue,rebuild].forEach(fn=>{ try{ fn(); }catch(e){ try{window.__showErr((fn.name||'builder')+': '+(e&&e.message||e), 'refreshAll');}catch(_){}}}); }   // one bad builder can't blank the rest
function fillImages(rows){
  (rows||[]).forEach(f=>{
    const url = (f.examples && f.examples[0]) ? f.examples[0].url : "";
    const m = url ? POST_META[url] : null;
    if(!f.image){
      if(m && m.image) f.image=m.image;
      else if(url && POST_IMAGES[url]) f.image=POST_IMAGES[url];
    }
    if(m && (!f.author || !f.author.trim()) && m.author) f.author=m.author;
    // Prefer the cleaned sheet copy; if the sheet only captured reactions, use the og copy instead.
    const cleaned = stripSocial(f.example_text||"");
    const metaText = (m && m.text) ? stripSocial(m.text) : "";
    f.example_text = cleaned || metaText || "";
  });
  return rows;
}
// LinkedIn's social-proof header ("Jane Doe and 500 others reacted") sometimes gets captured
// as the first lines of the post. Strip those leading lines so the real hook shows.
const SOCIAL_RE=/(\band\s[\d,]+\s+others\b|reacted$|(commented on|reposted|shared) this$|(likes|loves|celebrates|supports|finds) this( insightful)?$|^[\d,]+\s+(reactions?|comments?|reposts?)$|^(Promoted|Following|\+?\s*Follow)$)/i;
function stripSocial(t){
  if(t==null) return "";
  t=String(t);                                  // sheet cells can come back as Numbers/Booleans — never call .split on those
  if(!t) return t;
  const lines=t.split("\n"); let i=0;
  while(i<lines.length){
    const ln=lines[i].trim();
    if(ln==="" || (ln.length<90 && SOCIAL_RE.test(ln))){ i++; continue; }
    break;
  }
  return lines.slice(i).join("\n").trim();   // may be "" if the text was ONLY social-proof — caller decides the fallback
}
// The post body to show: clean sheet copy → else the real name (never the reactions).
function bodyOf(f){ return stripSocial(f.example_text||"") || f.archetype || f.name || ""; }
function dropEmpty(rows){   // hide saved posts that have neither copy nor image
  return (rows||[]).filter(f=>(f.example_text&&f.example_text.trim())||f.image);
}
function orderFormats(){   // newest saves first (feels fresh); reference library shuffled each visit
  const saved=SAVED.slice().sort((a,b)=>(Date.parse(b.savedAt||"")||0)-(Date.parse(a.savedAt||"")||0));
  const bundled=BUNDLED.slice();
  for(let i=bundled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=bundled[i]; bundled[i]=bundled[j]; bundled[j]=t; }
  FORMATS = saved.concat(bundled);
}
function announceNew(){   // "N formats added since you've been gone"
  const now=SAVED.length;
  if(seenCount!=null && now>seenCount){ const n=now-seenCount; toast(`${n} new format${n>1?"s":""} added since you were gone`,"&#10024;"); }
  seenCount=now; saveLS('fl_seenCount',now);
}
const bootAt=Date.now(); let booted=false;
// Apps Script serves the viewer inside an iframe, so key events don't reach it until it has
// focus. Grab focus on boot + first hover so arrow keys work without a manual click first.
function grabFocus(){ try{ window.focus(); const st=$("#stage"); if(st){ if(!st.hasAttribute("tabindex")) st.tabIndex=-1; st.focus({preventScroll:true}); } }catch(e){} }
window.addEventListener("mousemove", grabFocus, {once:true});
window.addEventListener("pointerdown", grabFocus, {once:true});
function hideWelcome(){   // dismiss once real data is in — but show for ~1.2s min so it never just flashes
  if(booted) return; booted=true;
  const w=$("#welcome"); if(w) setTimeout(()=>w.classList.add("gone"), Math.max(0, 1200-(Date.now()-bootAt)));
  grabFocus();
}
function ingest(rows){
  try{ SAVED=dropEmpty(fillImages(rows||[])); orderFormats(); refreshAll(); announceNew(); }
  catch(e){                                     // never let one bad saved row blank the whole app — show the library at least
    try{ window.__showErr((e&&e.message||e)+((e&&e.stack)?(' | '+String(e.stack).split('\n')[1]):''), 'ingest'); }catch(_){}
    SAVED=[]; FORMATS=BUNDLED.slice(); try{ refreshAll(); }catch(_){}
  }
  hideWelcome();
}
function loadLive(){
  if(window.google&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(rows=>ingest(rows)).withFailureHandler(()=>{ refreshAll(); hideWelcome(); }).getViewerData();
  } else { ingest(window.__MOCK_SAVED__||[]); }
}
setTimeout(hideWelcome, 4000);   // safety net if the sheet fetch hangs (failsafe script also covers catastrophic errors)
let hiddenAt=0;   // refresh + re-announce when you return after being away a bit
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(Date.now()-hiddenAt > 15000){ loadLive(); }
});
try{ refreshAll(); }catch(e){ try{window.__showErr((e&&e.message||e)+((e&&e.stack)?(' | '+String(e.stack).split('\n')[1]):''), 'boot.refreshAll');}catch(_){}}
try{ loadLive(); }catch(e){ try{window.__showErr((e&&e.message||e), 'boot.loadLive');}catch(_){} hideWelcome(); }
</script>
