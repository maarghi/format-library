Fs"},"https://www.linkedin.com/posts/hahnbee-lee_intern-spotlight-meet-aadit-shah-our-share-7487599971710615553-yiiA/":{"text":"Intern Spotlight \ud83d\udd0e\n\nMeet Aadit Shah. Our Texas A&M University junior engineer.\n\nOn our first call, he told me that he first learned about Mintlify when he saw our billboard while visiting SF with his family (first campaign!).\n\n2 months later, Aadit's friend introduced him to Nicholas Khami through Twitter. He went through the interview process, was given an offer, and joined us in our SF office 10 weeks ago.\n\nSince then he's been leading some important AI work at Mintlify:\n- Integrations\n- Our Slack agent\n- Our fastest growing usage-based AI revenue products\n\nHe hit the ground running and has always stepped up to take on whatever needed to be done.\n\nKeep up the great work Aadit!\n\n- I guess our billboard converted after all :) | 13 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQHaLu8nS_yVyg/feedshare-shrink_800/B4EZ.lMfxAJIAg-/0/1785182945702?e=2147483647&v=beta&t=aNvJJVazY1QuexFMP28WgmuNiIy67tJuaQGCJG26JxE"},"https://www.linkedin.com/posts/karinehsu_wow-cursor-is-really-investing-in-creator-ugcPost-7486038737282392065-AME3/":{"text":"Wow Cursor is really investing in creator marketing + events\n\nPics below from their most recent private dinner in LA with 30 tech/AI creators\n\nCursor is \"the coding agent for building ambitious software\", recently acquired by SpaceX for $60B. \n\nThe level of detail + care in this creator dinner series shows that they're trying to appeal beyond just traditional developers - to creators, storytellers, the people shaping how AI tools get talked about...\n\nI actually saw these pics from the events agency behind the series, a team that usually does lifestyle work across fashion, food & beverage, and beauty brands. Cursor tapped that exact talent to build their brand world offline.\n\nI've said it many times: tech companies are borrowing the consumer playbook from lifestyle brands to activate users IRL in interesting, memorable ways IRL - interesting merch, events, and more. This is one of many examples. \n\nThe companies winning the next wave of AI won't just have great product. They'll have a brand world people want to be part of.\n\nExcited to see how they continue to elevate their brand via marketing + activations :) | 25 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQH1Bmp-oBJ3yw/feedshare-shrink_1280/B4EZ.PAj46K4AQ-/0/1784810717040?e=2147483647&v=beta&t=hyUNrRVDDALdG_ugtFzVCvULk1C3uhhM2uvaiKeSJ9U"},"https://www.linkedin.com/feed/update/urn:li:ugcPost:7487529252427325440/":{"text":"Stepping into our next innovation: introducing the Nike Air Zoom Hyperslide \ud83d\udd25\n\nThe second innovation from Nike x Hyperice. Targeted heat and vibration across the foot, built into a low-profile Nike Air Zoom sole. Slide on. Feel the \"ahh.\" Instantly.\n\nBuilt to make recovery easier to work into the flow of competition, training, or daily life \u2014 helping reduce tension, relax feet, and support everyday recovery.\n\nDropping September 29th.\n\nLearn more: https://lnkd.in/gCxa7c73 | 96 comments on LinkedIn","author":"","image":"https://dms.licdn.com/playlist/vid/v2/D5605AQFzVOzcu3tOEw/thumbnail-with-play-button-overlay-high/B56Z.kMO9QIoC4-/0/1785166101912?e=2147483647&v=beta&t=GqkMtMn5moenSmxRTo7HLdY7NI2GHIKJ0nRG-DljbPk"},"https://www.linkedin.com/posts/nicholasrudder_9-times-out-of-10-a-good-startup-in-sydney-share-7487537312579641346-_jsA/":{"text":"9 times out of 10 a good startup in Sydney loses to a bad startup in San Francisco. Here's why.\n\nI moved to SF to join Y Combinator. It wasn\u2019t for the weather.\n\nEvery move was a bet to maximize my startup's odds of success. SF buys you:\n\nCapital - SF investors move fast and write bigger first checks. Everywhere else, good ideas wait longer for less.\n\nTalent - in SF you're hiring engineers who've scaled to millions of users before and GTM people who've already sold into your largest account. Density beats scarcity.\n\nSignal - hallway conversations, warm intros, being in the room with the biggest possible customer. You can't manufacture serendipity from 12,000km away.\n\nSpeed - a mediocre SF startup gets faster, sharper feedback. Bad ideas get killed or fixed faster. Good ideas compound at pace. \n\nTo the \"you can build from anywhere now\" crowd - once you have PMF and a repeatable motion, geography might matter less. But not for 0 to 1. \n\nThat's when proximity is unfair leverage and unfair leverage is exactly what an early-stage startup needs.\n\nCome join the SF mafia.  | 31 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQEhI18Sdk0-wg/image-shrink_800/B56Z.kTgg6GUAk-/0/1785168006228?e=2147483647&v=beta&t=YcQbv7XaEcvX8U9ul93Uadjb9y8hwKlDkqob8DJE_Us"},"https://www.linkedin.com/posts/lennyrachitsky_internal-team-principles-from-anthropics-share-7487612214594428928-AOiT/":{"text":"Internal team principles from Anthropic's AI research product team","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQHreHGib-SOMg/feedshare-shrink_800/B56Z.lXodNGoAc-/0/1785185864103?e=2147483647&v=beta&t=fJ8hHBA6HaqE16uKNGAa4AMSP5Rb7aGnBEybFMDPsgI"},"https://www.linkedin.com/posts/jeremyro_you-ever-wonder-whos-behind-y-combinators-activity-7424551753334808577-5gU_":{"text":"You ever wonder who's behind Y Combinator's W25 hottest B2B startups?\n\nThese are the 22 founders building real B2B tech:\n\n\n1. ThirdLayer (YC W25) \u2013 AI coworker that organizes and automates your life.\n\n- Regina Lin can see things three ways (left eye farsighted, right nearsighted) and wore a pirate eyepatch as a kid... Grew up as a classical pianist and performed a 25-min Rachmaninov concerto.\n\n- Kevin Gu studied algorithm textbooks growing up and dropped a quant trading offer to build Dex.\n\n- Abhi Ravipati left investment banking at PJT to come to SF on a whim.\n\n- Nick Tarmossin: Tarmo grew Dex's Instagram to 10k followers in a week, personal to 50k+.\n\n- Charles C. left LA home plans to become Head of Product after showing Drawer.\n\n- Almas Sapar their #2 design engineer.\n\n\n2. Weave \u2013 AI-first engineering analytics serving Reducto, PostHog, 11x, Nooks.\n\n\u2192 Adam Cohen raised $4.2M to solve the \"$1M AI budget with 0% ROI\" problem, teams see 16% higher output.\n\u2192\u00a0Andrew Churchill has 7k LinkedIn followers writing technical content for engineers.\n\n\n3. AfterQuery \u2013 sources hard-to-get datasets for frontier AI labs.\n\n\u2192\u00a0Spencer Mateega generates millions/month, was sole summer analyst at Silver Lake, finishing CS master's + Wharton undergrad while training for half-marathons.\n\u2192\u00a0Danny Tang won a Microsoft AI competition and worked on the largest real-estate IPO of 2024.\n\n\n4. AthenaHQ \u2013 measures brand visibility in ChatGPT, Perplexity, Claude, Gemini.\n\n\u2192\u00a0Andrew Yan is a former Google APM with 100+ paying customers and internal \"GEO Specialist\" certification.\n\u2192\u00a0Alan Yao built on GPT models since 2020 and prefers dark mode over sunlight.\n\n\n5. Ergo (YC W25) \u2013 AI co-pilot that auto-updates Salesforce/HubSpot, saves reps 10+ hours/week.\n\n\u2192\u00a0Yash Dulla worked six years as a golf caddie (reading putts = reading pipeline).\n\u2192\u00a0Ishan Sheth built AI medical tools and live analytics with Snapchat Spectacles.\n\n\n6. Spott \u2013 AI-native ATS/CRM replacing Bullhorn, raised $3.2M.\n\n\u2192\u00a0Lander Degr\u00e8ve was a Bain consultant advising recruitment agencies.\n\u2192\u00a0Samuel Smeys binge-watched YC videos as a teenager before joining W25.\n\n\n7. Cedar \u2013 Superhuman for AEs that follows your playbook.\n\n\u2192\u00a0Jesse Li has 60+ PRs dogfooding Cedar as an OSS contributor.\n\u2192\u00a0Isabelle Ilyia Iliyia is a concert pianist who interned at Figma, Notion, LinkedIn.\n\n\n8. Artificial Societies \u2013 simulates human audiences with AI personas.\n\n\u2192\u00a0James He, son of an illiterate villager from rural Sichuan, raised $5.35M from Point72.\n\u2192\u00a0Patrick Sharpe rebuilt a 2-month experiment in 2 minutes with a simulation.\n\n\n9. ZeroEntropy (YC W25) \u2013 search API with a reranker that beats Cohere and Salesforce.\n\n\u2192\u00a0Ghita Houir Alami's bio reads \"living intensely\"\u2014she raised $4.2M from YC and Initialized.\n\u2192\u00a0Nicholas Pipitone dropped out of CMU and has peer-reviewed IR papers.\n\n\ni'm bullish on this YC W25 group\n\nlet's build :p | 87 comments on LinkedIn","author":"Jeremy Ro","image":"https://media.licdn.com/dms/image/v2/D5622AQG8yfQcM017qA/feedshare-shrink_1280/B56ZwlOehrJYAc-/0/1770151078334?e=2147483647&v=beta&t=s53t9aXQ5OZ4NyC4nqsk7CnB3nsh0Mp1NoUl27967Tk"},"https://www.linkedin.com/posts/chris-pisarski_pax-historia-is-one-of-ycs-most-popular-activity-7423089371639095296-RpBo":{"text":"Pax Historia is one of YC\u2019s most popular in-batch startups this year with 2.7M monthly visitors.\n\nThat figure makes it one of the highest-traffic in-batch companies in recent batches, with ~266 k visitors being the record from the previous YC F25 batch.\n\nPax Historia is a browser-based, AI-powered grand strategy and alternate-history sandbox game which allows players to select any country at any point in history to rewrite events, with AI-driven, realistic reactions to player actions.\n\nFour other startups have also crossed the 100k monthly visitor mark:\n\nDidit, building the AI-native, developer-first identity verification platform; 21st, building tools that let developers remix UI components at speed; ARC Prize, the AGI-benchmark competition used by teams like OpenAI and Pocket, the company building custom hardware coupled with an AI note-taking app that turns conversations into structured action items.\n\nHere are top 10 most popular companies of YC W26:\n\n1. Pax Historia\nFounders :\u00a0Eli Bullock-Papa, Ryan Zhang\n\n2. Didit (YC W26)\nFounders: Alberto Rosas, Alejandro Rosas\n\n3. 21st\nFounders: Sergey Bunas, Serafim Korablev\n\n4. ARC Prize Foundation\nFounder: Gregory Kamradt\n\n5. Pocket (YC W26)\nFounders: Gabriel Dymowski, Akshay Narisetti\n\n6. Bubble Lab (YC W26)\nFounders: Selina Li, Zach Zhong\n\n7. Luel (YC W26)\nFounders: Inigo Lenderking, William Namgyal\n\n8. Chasi (YC W26)\nFounders: Sarman Aulakh, Akash Pavan\n\n9. CodeWisp (YC W26)\nFounders: Elvin Fu\n\n10. Ressl AI (YC W26)\nFounders: Abhishek Eswaran, Arushi Gandhi | 63 comments on LinkedIn","author":"Chris Pisarski","image":"https://media.licdn.com/dms/image/v2/D4E22AQGX99GFbts9CA/feedshare-shrink_1280/B4EZwQcckpHoAc-/0/1769802418764?e=2147483647&v=beta&t=xhoMo-hfUFkbeJfgTSeGjV1K4qNrYUEUhNl5DeVqRkY"},"https://www.linkedin.com/posts/selin-kocalar_delve-is-11-on-a16zs-list-of-the-top-50-activity-7379550643004305408-xGCH":{"text":"Delve is #11 on a16z's list of the top 50 AI apps that startups are spending on. Plus you can read about it in TechCrunch!\n\n\u2014\n\nWe started Delve to make it easier for people to innovate.\n\n(Not because we were obsessed with the SOC 2 control framework :) )\n\nWe didn't want innovation to get blocked by manual compliance work.\n\nAnd here's the thing.\n\nWe're not here to build a security & compliance company.\n\nWe're here to automate busywork for humanity, starting with compliance.\n\n\u2014\n\nIf you want to join companies like Lovable, micro1, Cluely, 11x, and Alma (also on this list) using Delve to get SOC 2, HIPAA, ISO, GDPR, etc. compliant with AI, we're always growing the Delve family.\n\nJust shoot me a DM!\n\nAlso, if you want to read about the full list in TechCrunch, the link to the article is in the comments. | 110 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQHhj6c3LiB6-w/feedshare-shrink_800/B4DZmluMXkG8Ag-/0/1759421977261?e=2147483647&v=beta&t=AIxa-liXwjO4cPiKsliAtBbKWw8Uw2b_kpEDNlmtzN4"},"https://www.linkedin.com/feed/update/urn:li:activity:7409946902818967552":{"text":"The Klarna Mafia has raised over $2.99B in total funding.\n\nKlarna is known for building operators who can handle real complexity. Employees were pushed to think globally early, ship consumer grade products, manage risk at scale, and operate across some of the toughest regulatory environments in the world.\n\nThat culture compounds. Former Klarna employees went on to found and scale some of the most ambitious companies globally.\n\nUsing Crustdata\u2019s People Search API and Funding API, we mapped some of the most funded companies founded or co-founded by former Klarna employees:\n\nAnyfin - $641M - Mikael Hussain, Sven Perkmann, Filip Polhem\nTrueML + Signifyd - $563M - Ohad Samet\nMODIFI - $429M - Sven Brauer\nNelly Solutions - $287M - Niklas Radner, Rasmus Schults, Lukas Eicher\nFinix - $200M - Sean Donovan\nMAJORITY \u2013 $121M - Philip Mikal\nScratch Financial \u2013 $108M - John Keatley\nBrite Payments \u2013 $77.2M - Lena Hackel\u00f6er\nBasis Theory \u2013 $66.3M - Colin Luce, Brian Billingsley\nTorii \u2013 $65M - Uri Nativ\nRiseUp IL \u2013 $48.7M - Yuval Samet\nBits Technology \u2013 $48.4M - Robin Lantz\nIngrid \u26ab\ufe0f - $38.2M - Patric Blixt\nInsurello \u2013 $29.3M - Marcus Janback\niyzico \u2013 $27M - Barbaros Ozbugutu\nTelness \u2013 $21.8M - Martina Klingvall\nSibill \u2013 $21M - Lorenzo Liguori\nLykon \u2013 $20.7M - Tobias Teuber\nDepict \u2013 $19.9M - Oliver Edholm\nBrowsi \u2013 $17M - Lior Fisher\nPocketlaw \u2013 $15.5M - Majid Garmaroudi\nP.F.C. \u2013 $14.5M - Kevin Albrecht\nSelpy \u2013 $13.5M - Michael Arn\u00f6r, Philip Gunnstam\nFlexspace \u2013 $13.1M - Eyal Lasker\nSupernormal \u2013 $12M - Colin Treseler\nPodX \u2013 $10.9M (>$30M) - Fredrik Said\nWingbits \u2013 $9.5M - Alex Lungu, Robin W.\nTeemyco \u2013 $6.92M - Oleg Danylenko\nReCarber \u2013 $5.42M - Kristoffer Labuc\nLesslie \u2013 $5.18M - Oscar Viken\nUnitPlus \u2013 $5.14M - Sebastien Segue\nCheckin \u2013 $4.54M - Kristoffer Cassel\nNeonomics \u2013 $4.52M - Christoffer Andvig\nMarkets EQ - $4.5M - Sean Austin\nZimpler \u2013 >$3.14M - Kristofer Ekman Sinclair\nBriqpay \u2013 $3.03M - Mats Andersson, Bj\u00f6rn Widerstr\u00f6m, Sara Johansson\nLEIA \u2013 $3.03M - Sandra Wirstr\u00f6m\nstoer Technologies \u2013 $2.18M - P\u00e4r Isaksson\nQlarifi \u2013 $1.8M - Alex Naughton\nAynis / Locaboo \u2013 $1.32M - Andreas Michel\nLedyer \u2013 $1.29M - Linus Sandberg\nGamifiera \u2013 $1.28M - Erik Estberg\n\nHuge credit to the culture shaped at Klarna and to Sebastian Siemiatkowski for creating one of Europe\u2019s strongest fintech founder factories.\n\nDid we miss anyone? | 33 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQH64VTTwmxZLg/feedshare-image-high-res/B4DZtVrXNsJkAo-/0/1766669010702?e=2147483647&v=beta&t=66qea6WOHLMb19UUOeNIMZodaafYXqr_10Pw3RMIep8"},"https://www.linkedin.com/posts/jesse-buckingham-79649a26_chattanooga-is-the-beating-heart-of-freight-activity-7401983816355282944-zC8Q":{"text":"Chattanooga is the beating heart of freight.\n\nOutside of Chicago, you won\u2019t find a higher density of brokers, carriers, shippers, and freight-tech talent.\n\nVooma is on the ground this week, visiting brokerages, carriers and freight leaders and hosting an intimate dinner.\n\nThe eco-system is deep. Shout out to all that power The Freight Alley. \n\n(Who did I miss?!)\n\n**Freight brokers headquartered in Chattanooga**\n\nTopo Logistics \u2013 full-service brokerage focused on reliable execution.\nTaimen Transport - Taimen Transport / Taimen Trucklines \u2013 asset + brokerage combo for TL, expedited, and warehousing.\nSteam Logistics \u2013 global 3PL moving ocean, air, and domestic freight\nSOAR Transportation Group \u2013 multi-modal brokerage\nMax Trans Logistics \u2013 national truckload brokerage\nLYNC Logistics, LLC \u2013 full-service truckload brokerage\nTrident \u2013 24/7 truckload brokerage\nLMS Logistics \u2013 multimodal brokerage\nLogistix \u2013 domestic freight brokerage\nLipsey Logistics Worldwide LLC \u2013 3PL moving dry van, temp-controlled, and intermodal freight.\nKCH Transportation \u2013 truckload and drayage brokerage & 3PL\nXpress Global Systems (XGS) \u2013 flatbed and heavy-haul specialist\nAvenger Logistics \u2013 brokerage specializing in TL, LTL, and expedited.\n\n**National brokerages with Chattanooga presence**\n\nTotal Quality Logistics \u2013 top 5 broker with downtown office\nR2 Logistics \u2013 3PL with a regional office in the city\nCoyote Logistics \u2013 Access America heritage\nC.H. Robinson \u2013 global 3PL w/ Chatanooga branch\nAxle Logistics \u2013 Knoxville brokerage with a growing Chattanooga office\nArrive Logistics \u2013 Austin-based brokerage investing in a Chattanooga branch\n\n**Carriers & asset-based logistics**\n\nU.S. Xpress, Inc. \u2013 one of the largest U.S. trucking fleets\nTEL \u2013 truck/trailer leasing partner\nTranco Logistics \u2013 trucking + warehousing provider\nTaimen Transport \u2013 asset fleet paired with brokerage\nKenco Group \u2013 dedicated transportation services\nCovenant \u2013 national truckload and dedicated carrier\n\n**Major shippers & manufacturers**\n\nVolkswagen \u2013 U.S. assembly plant\nSes\u00e9 USA \u2013 automotive supplier\nMcKee Foods Corporation \u2013 national snack manufacturer\nCoca-Cola Bottling Company UNITED, Inc.  \u2013 beverage production + distribution\nChattem Chemicals, Inc. \u2013 consumer health + pharma brands\nChattanooga Bakery, Inc. \u2013 MoonPie producer\nASTEC \u2013 heavy equipment maker\n\n**Freight tech & ecosystem players**\n\nTextLocate \ud83d\udcac\ud83d\udccd \u2013 text-based tracking tools\nREPOWR - trailers on demand\nReliance Partners \u2013 insurance brokerage for trucking\nHighway \u2013 carrier identity + fraud prevention\nFreightWaves \u2013 media, data, and SONAR analytics\nDynamo Ventures \u2013 supply chain & mobility VC\n\nHit us up if we should meet! | 11 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQEVo-ELPqSf0A/image-shrink_800/B56ZrkhDUoLIAc-/0/1764770462528?e=2147483647&v=beta&t=-InIXPyC5Ev5byNj2WBLW8SEEBvt9Ww1jUX7JXXhMpI"},"https://www.linkedin.com/posts/lennyrachitsky_my-biggest-takeaways-from-elena-verna-head-activity-7407893643732316162-v6OE":{"text":"My biggest takeaways from Elena Verna (Head of Growth at Lovable):\n\n1. In AI, you now need to find product-market fit every three months. Product-market fit used to mean: build something people want, then scale it for years. In AI, the underlying technology changes so fast\u2014and customer expectations with it\u2014that you\u2019re constantly re-earning that fit. Even at $200M ARR.\n\n2. The growth playbook has fundamentally changed for AI companies. Elena has led growth at Miro, Dropbox, and Amplitude and advised dozens more companies on growth. At Lovable, she says only 30% to 40% of what she learned in 20 years still applies.\n\n3. At Lovable, growth is driven mostly through new features, not optimizing funnels. At the fastest-growing company in history, optimization drives about 5% of their growth. The other 95% comes from launching new features and products. Small tweaks don\u2019t move the needle when everything is changing.\n\n4. Ship constantly, and talk about it. Lovable\u2019s main growth and retention strategy: ship features fast enough that customers feel the product is always alive. Engineers announce their own updates. The founder tweets progress daily. This keeps users curious\u2014and keeps competitors scrambling.\n\n5. Give your product away like candy. AI products are expensive to run, so most companies gate them behind paywalls. Lovable does the opposite: they fund hackathons, sponsor events, and hand out free credits. They treat this spending as marketing, not cost\u2014and it compounds through word of mouth.\n\n6. Influencer marketing outperforms paid ads by 10x. Lovable found that short videos showing what the product can do spread faster and convert better than traditional paid advertising. Showing beats telling.\n\n7. \u201cMinimum viable product\u201d is dead. Elena describes the new minimum bar as \u201cminimum lovable product.\u201d If the experience doesn\u2019t delight people, they won\u2019t tell anyone. And word of mouth is your primary engine.\n\n8. Community isn\u2019t a nice-to-have. It\u2019s a key lever for growth. Lovable\u2019s Discord has hundreds of thousands of members helping each other. This amplifies word of mouth, drives retention, and makes customers feel like insiders. Building the product alone isn\u2019t enough anymore\u2014you\u2019re building a world.\n\n9. Hire people who create clarity from chaos. Fast-moving AI companies don\u2019t have neat job descriptions or stable roadmaps. Elena looks for high-agency people who thrive in mess, including new graduates who are AI-native and former founders who know how to operate without instructions.\n\n10. You can work at one of the fastest-growing companies in history and still see your kids. Elena wakes at 6 a.m. Stockholm time, protects her gym and family hours, and refuses to treat burnout as a badge of honor. Her point: if you set boundaries, the work will fill the available time\u2014not all the time. | 207 comments on LinkedIn","author":"Lenny Rachitsky","image":""},"https://www.linkedin.com/posts/thinkingslow_in-the-last-3-months-at-ahrefs-we-analyzed-activity-7424382429542486016--OIQ":{"text":"In the last 3 months at Ahrefs, we analyzed over 1 billion data points across 11 studies*. Here's what we learned about AI search optimization:\n\n1. YouTube mentions are the single strongest predictor of AI visibility (correlation: 0.737) \u2013 stronger than Domain Rating, backlinks, or any traditional SEO factor. YouTube is heavily cited in AI responses, and both Google and OpenAI train on YouTube content.\n\n2. For a given query, AI Mode and AI Overviews reach the same conclusions 86% of the time \u2013 but cite almost entirely different sources (only 13.7% citation overlap). AI Mode responses are 4x longer and mention 3x more entities.\n\n3. Content length has essentially zero correlation with AI citations (0.04). 53% of all AI Overview citations go to pages under 1,000 words. Writing ultra-long contentisan't necessary for AI visibility.\n\n4. Google still sends 345x more traffic than ChatGPT, Gemini, and Perplexity combined \u2013 but ChatGPT accounts for 80%+ of all AI-driven website traffic.\n\n5. AI Overviews have a 70% chance of changing from one observation to the next, with content lasting an average of just 2.15 days. But semantic meaning stays remarkably consistent (0.95 cosine similarity).\n\n6. \"Best X\" blog lists make up 43.8% of all page types cited in ChatGPT responses. 35% of those lists come from low-authority domains.\n\n7. 79% of blog lists cited by ChatGPT were updated in 2025, and 76% of top-cited pages were refreshed within the last 30 days. Freshness matters more than ever.\n\n8. When asked questions without valid answers, AI systems choose fabricated content with specific numbers almost every time. ChatGPT resisted best (84% accuracy), but Grok and Copilot were fully manipulated.\n\n9. Domain Rating correlates weakly with AI visibility (just 0.266-0.326 across platforms). Number of site pages is even weaker at 0.194.\n\n10. 67% of ChatGPT's top 1,000 citations are essentially off-limits to marketers \u2013 Wikipedia alone accounts for 29.7%, followed by homepages (23.8%) and educational content (at just 19.4%).\n\n*i'll share all the study links in a comment! | 266 comments on LinkedIn","author":"Ryan Law","image":""},"https://www.linkedin.com/posts/ericlay-virio_after-3-years-of-testing-ive-finally-created-activity-7306317167380054017-QrGc":{"text":"After 3 years of testing, I\u2019ve finally created the most effective GTM playbook ever.\n\nIf you still don\u2019t trust it, here\u2019s more results:\n\u2192 146 meetings booked with decision makers in 60 days\n\u2192 multiple six figure contracts signed\n\u2192 400k impressions and 3,000 followers in 2 months\n\nIt\u2019s because we\u2019ve developed a repeatable process.\n\nIt focuses on 2 key things\u2026\n\nContent and community.\n\nSo I put together a full document with our whole process, laid out:\n\n1) Creating viral content in the B2B space (text and video)\n2) How to build a team to run your content engine\n3) Creating & nurturing a community\n4) How to position your personal and company brand as the #1 authority\n\nAnd much much more\u2026\n\nJust connect with me and comment \u201cGTM\u201d and I\u2019ll send it your way in a few minutes! | 7,910 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFX709GJY1wcA/feedshare-shrink_800/B4EZWVAulHHcAk-/0/1741961755301?e=2147483647&v=beta&t=fYmsFty9cg4fHf-KmUb8hKFx0PKjKOtYwQihGmCYAbI"},"https://www.linkedin.com/posts/retentionadam_i-just-spoke-to-a-group-of-130-ceos-cmos-activity-7396968758415851520-8IUv":{"text":"I just spoke to a group of 130 CEOs, CMOs and CROs about my backwards approach to AI. And despite all the AI guys thinking it's stupid, I seem to be the only guy who has an autonomous business\u2026 and I\u2019m sharing the full playbook\ud83d\udc47\n\n**UPDATE** Get it here: https://lnkd.in/gy5heHrQ\n\nCan AI actually run your startup for a week?\n\nI tested it.\n\nEvery employee went on vacation and revenue went up 28.7%.\n\nLast week I presented the case study in detail to a group of executives who cumulatively do BILLIONS in ARR.\n\nHere's what I covered:\n\n- Why RB2B needs 3 FTEs while Retention.com needs 37 for 4x lower revenue per employee\n- How we hit 80% AI support resolution (and replaced our sales rep)\n- The difference between bending your business TO AI vs bending AI to your business\n- Why writing WITH AI works but AI writing FOR you creates garbage\n\nBONUS: My Claude prompt for LinkedIn hooks and custom GPT we use to create AI support articles.\n\nWant a copy of the deck?\n\n1. Like this post\n2. Comment \"deck\"\n\nMake sure we\u2019re connected and I'll DM you. | 1,492 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQGdREN4BZ8gxA/feedshare-shrink_800/B56ZqaKqBhG4Ag-/0/1763523077541?e=2147483647&v=beta&t=ShIRMQGQzMEUYBXaO9CAKWzDuDhwHtoKi7c9S0ep7fI"},"https://www.linkedin.com/posts/jesse-buckingham-79649a26_freight-is-a-fking-crazy-industry-i-was-activity-7417931389750263808-4BKl":{"text":"Freight is a f**king crazy industry. I was at a dinner with a few brokers the other night and asked them for their best freight stories. Some of the funniest ones I heard:\n\n\u2192 A driver whose company wouldn't let him have pets in the truck. He found a lost kitten on the road and pushed for approval to keep it in the cab. Pulled into the terminal 3 months later with a full-grown mountain lion sitting in his cab. Not a kitten it turns out. He wouldn't give it up.\n\n\u2192 A driver who drove his truck into the middle of a forest, parked it, and texted his dispatcher: \"I quit.\" The broker had to call the local sheriff to find the truck in a rogue forest in the Midwest.\n\n\u2192 A broker who had a load stolen but had tracking on it. They figured out where the truck was parked, broke into it, requisitioned an excavator out the back, and pulled off a full vigilante rescue mission to recover the freight.\n\n\u2192 A tamper-proof trailer with seals on the back to prevent theft. Instead of breaking the seals, someone removed the entire back of the trailer to pull the freight out and load it onto a railcar.\n\nA lot is changing in logistics.\n\nBut it's the frontier of American entrepreneurship and I'm certain it will continue to attract the most interesting people doing the wildest sh*t. | 52 comments on LinkedIn","author":"Jesse Buckingham","image":""},"https://www.linkedin.com/posts/olly-fawcett-668566177_performance-marketing-has-become-full-of-activity-7477632098099597313-Zhzq":{"text":"Performance marketing has become full of jargon.\n\nAnd that's a problem.\n\nI speak to a lot of founders and brand managers at premium and luxury brands who are investing serious budgets into Meta, TikTok and Google, yet they're often being presented with reports full of acronyms that nobody has properly explained.\n\nROAS.\nMER.\nCAC.\nLTV.\nNCROAS.\n\nIf you don't understand what these actually mean, it's incredibly difficult to challenge strategy, ask the right questions, or know whether your agency is genuinely growing the business.\n\nSo I put together this cheat sheet covering 15 performance marketing terms \nevery luxury brand manager should know.\n\nA few of the most important:\n\nMER \u2192 Probably the most overlooked profitability metric in modern marketing.\n\nCAC vs LTV \u2192 The relationship that determines whether your growth is sustainable.\n \nIncrementality \u2192 The difference between ads creating sales and simply claiming credit for them.\n \nCreative Fatigue \u2192 One of the biggest reasons performance drops over time.\n\nCreative as a Growth Lever \u2192 Increasingly, the quality of your creative has more impact than campaign settings.\n\nThe reality is that performance marketing isn't won through platform hacks anymore.\n\nIt's won through: Better creative. Better measurement. Better commercial understanding.\n\nLuxury brands that understand these fundamentals make significantly better marketing decisions.\n\nWhich term do you think marketers misuse or misunderstand the most?\n\n303 | 23 comments on LinkedIn","author":"Olly Fawcett","image":"https://media.licdn.com/dms/image/v2/D4E22AQG5b_6OK7dS0g/feedshare-image-high-res/B4EZ8S1aT9HkAU-/0/1782727419438?e=2147483647&v=beta&t=pUS0l1aEgWX0YXD5DpA4rlbaeOQLPy0jyexpbtXcf3w"},"https://www.linkedin.com/posts/chrisclickup_head-of-marketing-were-ungating-all-of-activity-7423017247788474368-BNDb":{"text":"Head of Marketing: We're ungating all of our content.\nCEO: Have you completely lost your mind? That's 2,000 leads per quarter!\nHead of Marketing: 2,000 fake emails from people who will never buy.\n\nMeanwhile, our actual buyers can't share our content with their team because it's locked behind a form.\n\nCEO: We need leads for Sales.\n\nHead of Marketing: Sales hates these leads. Ask them. Jessica told me yesterday she'd rather have 10 people who actually read our content than 1,000 who used burner emails for a download.\n\nCEO: The board tracks MQLs.\n\nHead of Marketing: The board tracks revenue. Our competitors ungated everything last year. Their traffic 5x'd. Their sales cycles dropped 20%. Why? Because entire buying committees could actually access their content.\n\nCEO: But how do we know who's interested?\n\nHead of Marketing: Intent data. If someone reads 5 articles, watches 2 videos, and visits pricing, they're interested. If someone downloads one PDF and ghosts, they're not.\n\nCEO: This is insane.\n\nHead of Marketing: You know what's insane? Watching our gated content get 500 views while our competitor's free guide gets 50,000 and becomes the industry standard.\n\nCEO: That sounds like a content problem...\n\nHead of Marketing: No. It's a distribution problem because it doesn't have the chance to actually get shared.\n\nCEO: Okay. But marketing will have no metrics.\n\nHead of Marketing: We'll have the only metric that matters: revenue influence. When deals close 2x faster because buyers self-educated, you'll forget about MQLs.\n\nCEO: Three months. That's it.\n\nHead of Marketing: When our content starts showing up in every RFP because it's actually accessible, you'll give me six.\n\nCEO: Don't push it.\n\nPS - The companies obsessed with capturing emails are losing to companies obsessed with capturing attention. Gates keep people out. Value brings them in.\n\nI'm Chris Cunningham - I run social media at ClickUp.\n\nFollow me for more actionable marketing tips & tricks. | 161 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7423009624120823809":{"text":"I\u2019ve spent $100M on ads\n\nThe best Meta ads always fail on AppLovin.\n\nIt\u2019s because of how ads work on AppLovin \n\nFacebook & Instagram\n\u2192 You are interrupting the scroll\n\u2192 The 3s hook is everything\n\nAppLovin (& reward video channels)\n\u2192 The user cannot skip for 15-30 seconds\n\u2192 They watch to get whatever in-game reward they\u2019ve been promised (extra lives, bonuses, in-game currencies)\n\nIf your user cannot skip, the first 3s are irrelevant\u2026\n\u2192 They\u2019re annoyed they had to watch the ad\n\u2192 So tell a story / show a satisfying product demo.\n\u2192 Build a narrative arc that doesn't feel like a hard sell\n\u2192 Entertain them while they wait.\n\nBut what happens in the last 3s before they can play again?\n\u2192 They\u2019re watching your ad\n\u2192 Wait until just before they can close the ad\n\u2192 Hit them with your strongest CTA at exactly the right time\n\u2192 E.g. \"Get 50% Off Now - \"Claim Your One-Time Bundle.\"\n\nI spent the week creating a full guide on how to design ad creatives for AppLovin\n\nIt covers:\u00a0\n\u2192 Creative attention curves\n\u2192 AppLovin ad placements\n\u2192 Creative Strategy Breakdown (by second)\n\u2192 AppLovin demographics\n\u2192 DTC AppLovin case studies\n\u2192 Platform risks\n\u2192 Technical set up & attribution \n\nWant it?\n\nSend me a connect, comment \u2018applovin\u2019 and I\u2019ll DM it over asap!\n | 1,372 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQGUSubkUBMTNg/feedshare-shrink_800/B4DZwO76CBJcAg-/0/1769777111614?e=2147483647&v=beta&t=bTbgbjFgdajm1c5Qvq8YvXn3cARxrLWgOovrUtJmUJM"},"https://www.linkedin.com/posts/zhu-amanda_ive-now-closed-7m-in-enterprise-deals-activity-7413249035068841990-8lCZ":{"text":"I\u2019ve now closed $7M in enterprise deals. Here\u2019s how I personalize the pitch for each stakeholder:\n\n1/ Talk to THEIR customers\n\nBefore the first pitch, I talk to people who already use their product.\n\nInstead of selling features,\nI use their users\u2019 words to diagnose their problem:\n\n\u201cI talked to a few of your customers,\nand they mentioned that X was a pain.\nWhat if there was a way to have [solution]?\u201d\n\n-----\n\n2/ Reframe using analyst positioning\n\nI read reports from Gartner, Forrester, or G2\nto see who the buyer is being lumped in with.\nBecause every enterprise buyer has a comparison they hate. \n\nI\u2019ll often anchor the conversation with:\n\u201cThis gives you a concrete way to separate from X, Y, and Z when those comparisons come up.\u201d\n\nThis gets us talking about positioning, risk, and narrative,\nwhich helps me uncover what the execs actually care about.\n\n-----\n\n3/ 10-K reports are your friend\n\nA 10-K is the company telling you what matters this year.\n\nIn one deal, I kept getting polite interest,\nbut no urgency.\n\nSo before the next meeting, I read their most recent 10-K. \n\nOne thing jumped out:\nthey had explicitly committed to improving reliability as a top company priority.\n\nIn the next call, I honed in on how we can help with that. \nThat was the first time the conversation clicked. \n\nSuddenly, we were tied to something leadership had already promised the market.\n\n-----\n\nThe goal of all this is nuance.\nYou\u2019re trying to speak their language. | 12 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/michaelbfishbein_let-me-show-you-how-to-use-claude-code-for-share-7427338897921318912-06NQ":{"text":"Let me show you how to use Claude Code for gtm. It's like having 10k SDRs working for you.\n\nThe agent system I built runs on 11 APIs and 72 automation scripts. Instead of building rigid workflows that break and miss context, I give agents access to tools and let them decide what to do based on my subject matter expertise in Skills.\n\nHere's how it works:\n\n1. CAMPAIGN STRATEGY\n\n- Claude Code reads my positioning frameworks, targeting strategies, and copywriting guides\n\n- Generates campaigns based on observable buying signals, problem symptoms, and ICP fit\n\n- Writes personalized copy variations for email and LinkedIn and adapts for each campaign context\n\n2. LIST BUILDING AND OUTREACH\n\n- Agent selects the right API tools for each campaign and enrichment\n\n- Finds companies and contacts who need what you sell and gets their emails\n\n- Sends outreach via Sales Engagement Platform I custom built (like Instantly but mine)\n\nIt adapts and builds the workflow based on the context its given, not what I hardcoded six months ago. So it can do a variety of things for a variety of campaigns, not just one workflow. \n\nNext step is migrating this to the Claude Agent SDK to run like a headless Claude Code after I get the system locked in by using Claude Code as a playground. Then I won't have to prompt it, it will just do things.\n\nPS: want to replace $25k in Clay spend? Comment \"CODE\" and I'll send you the plan doc you can give to Claude Code to build this for you. Connect with me so I can send.  | 1,993 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQHsI5U60VgXIQ/feedshare-shrink_1280/B4EZxM1XvCIMAc-/0/1770815585932?e=2147483647&v=beta&t=JBJWaAM1yk90VjUYSvHhbmdX-XcrtyrEkh2RFcwg0bg"},"https://www.linkedin.com/posts/jonathan-peslar_i-used-claude-cowork-for-my-seo-for-30-days-share-7428114528657272832-uUly":{"text":"I used Claude Cowork for my SEO for 30 days.\r\n\r\nThe result: $25k in extra revenue.\r\n\r\nMost local SEO is a total guess.\r\n\r\nYou pay an agency $2k a month to \"optimize\" your profile.\r\nThey post stock photos and generic AI captions.\r\n\r\nYou stay stuck on page 2.\r\nYour competitors print money.\r\n\r\nIt isn't bad luck. It's bad data.\r\n\r\nStop playing SEO Specialist.\r\nStart playing Operator.\r\n\r\nThe \"Old Way\" is a 2021 checklist from a blog post.\r\nThe \"New Way\" uses Claude to find what Google wants right now.\r\n\r\nYou don't need an expert.\r\nYou need the patterns.\r\n\r\nI built a 7-prompt stack to see exactly what my competitors are doing.\r\n\r\nHere is the architecture:\r\n\r\n1. The Recon: Claude crawls your site and competitors to map the field.\r\n\r\n2. The Signal: It finds the exact triggers Google rewards for your keyword.\r\n\r\n3. The Content Spy: It audits competitor posts to build a winning plan.\r\n\r\n4. Pattern Recognition: It finds common categories and review count \"sweet spots.\"\r\n\r\n5. Outlier Detection: It finds competitors ranking high with low reviews. It sees what they hide.\r\n\r\n6. Review DNA: It pulls the specific keywords and star distribution patterns that drive rank.\r\n\r\n7. Photo Strategy: It maps when to post based on the top 3 players.\r\n\r\nThis wasn't magic.\r\n\r\nClaude didn't rank the profile.\r\nClaude didn't add reviews.\r\n\r\nIt found patterns.\r\nIt showed us what Google likes.\r\n\r\nWe did the work.\r\nWe stayed consistent.\r\n\r\nAI gave the map.\r\nExecution did the work.\r\n\r\n\u2192 Stop guessing. Use Claude to see what works.\r\n\u2192 Focus on the \"Definition of Done.\"\r\n\u2192 Consistency beats \"hacks\" every time.\r\n\r\nWant the full guide?\r\n7 copy-paste prompts + the 30-day calendar.\r\n\r\nLike this post.\r\nComment \"STACK\" below.\r\n\r\nI'll send it over. | 911 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQHNmFzVAn7dDg/feedshare-shrink_800/B4DZxX2zS1GkAg-/0/1771000509996?e=2147483647&v=beta&t=jfrB9qRYnClNMOxDMDVyjlf3VIreul7ztbq1g67VLSs"},"https://www.linkedin.com/posts/madhavbhandari_were-spending-33m-on-marketing-in-2026-activity-7430219623037407232-AwZY":{"text":"We're spending $3.3M on marketing in 2026 at Storylane (up 10% from 2025).\n\nI've always believed in being transparent with what we do, so here's the full breakup:\n\n\u2192 $1.2M - Paid Ads\nSame as last year. LinkedIn $500K, Google/Bing $500K, Meta $200K (new). LinkedIn CPMs up 30-40%. Testing B2C channels to reach B2B audiences at lower cost.\n\n\u2192 $250K - Influencer Program\nCut from $500K. Used only $200K last year. Working great but scaling profitably is hard. Maintaining core LinkedIn portfolio, testing B2B creators on TikTok/Instagram for virality.\n\n\u2192 $550K - Conferences & Events\nUp from $400K. Betting big on IRL. Sponsoring, speaking, recording customer content, hosting side events. Good pre/post-event ops. Flywheel is real - brand grows, booth traffic increases, meetings get better.\n\n\u2192 $250K - Community Sponsorships\nDown from $300K. Still supporting CMO, pre-sales, product marketing communities. Investing $350K to build our own community instead. Forward bet on owned community.\n\n\u2192 $200K - SEO\nSame as last year. Most efficient PLG channel. Used 1/4 last year (LLM SEO uncertainty). Clear on plan now. Goal: 2x traffic, 2x PLG revenue.\n\n\u2192 $200K - Brand + Product Marketing\n2x from last year. Highest organic ROI. Product marketing creates content - new use cases, demo automation progress, multi-product future. Brand handles distribution through pattern interrupt experiments, campaigns, AI-led visual campaigns. Building recall, loyalty, education. Building brand for RepX (our newest product).\n\n\u2192 $250K - Outbound\nUp from $200K. Took two years to figure out. Last year break-even, end of year very profitable. 2 full time SDRs focused on expansions + 1 SDR agency for net new. Big quota targets.\n\n\u2192 $50K - Partnerships \u2b50 NEW\nIntegration partners - identifying mutual customers and prospects. Groundwork done, partnerships in place. Getting revenue from channel, possibly hiring if revenue grows.\n\n\u2192 $350K - Customer Marketing \u2b50 NEW\nMy big bet. Building our own community through Finer Demos Club and user conference. Customers learning from customers to drive referrals, move deals faster, expand accounts, reduce churn. Expansion is one of fastest-growing segments.\n\nPlus 10% flexibility buffer.\n\nI'm confident this budget will help us get past $20M+ ARR.\n\nThree big strategic shifts:\n\n1. Investing ~$1M (1/3 of budget) on IRL events. Shows how impactful in-person was last year and why we're bullish on it.\n\n2. Building our own community. We've supported communities for years and will continue, but with our large customer base, there's strong need for our own.\n\n3. Brand has unlimited ceiling - it's also something what we're good at. Our brand is now bigger than the demo automation category itself. We'll continue leading with brand.\n\nFor other CMOs: where are you increasing spend? What are you cutting? What's your biggest bet?\n\nCurious how your budgets compare. | 192 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGHUrcCyaoOJA/feedshare-shrink_1280/B4EZx1WQpeH0Ac-/0/1771495296218?e=2147483647&v=beta&t=DnhPwnfswI20Z4R3SQfBVICvzwH7z_ss1TvdfHqwWwU"},"https://www.linkedin.com/posts/sugju-choi_we-killed-leetcode-at-virio-no-online-assessments-activity-7397686902839013376-BKpD":{"text":"We killed LeetCode at Virio.\n\nNo online assessments. No whiteboard problems. No \"reverse a binary tree\" questions. With AI coding assistants everywhere, technical rounds are borderline meaningless now. Anyone can pass them with the right setup of ChatGPT + Claude + Cluely.\n\nWe're not building algorithms at Virio. We're building a product that actual customers pay for and use every day. \n\nI don't need someone who's solved 500 LeetCode hard problems. I need someone who can ship a feature from idea \u2192 design \u2192 code \u2192 production in a week.\n\nThis is what we do instead to find real builders:\n\n1\ufe0f\u20e3Previous projects: Show us what you've actually built and shipped.\n2\ufe0f\u20e3Reference calls with your past teammates: We want to hear how you actually performed on a team, not how well you prepped for an interview.\n\nThat's it.\n\nIf you can build, iterate fast, and care about the end user experience more than the perfect algorithm - we should talk.\n\nDrop a comment here if you're interested, let's build real products together. | 288 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGMk3q77URyPw/feedshare-shrink_1280/B4EZqndCTOGYAs-/0/1763745998845?e=2147483647&v=beta&t=1OBXL4_tWDRt3EP9OgVSkFGQ_rcvz5g68AeAr2lZGwg"},"https://www.linkedin.com/posts/ericlay-virio_were-hiring-a-head-of-sales-development-activity-7391512082879258626-RMOG":{"text":"We\u2019re hiring a Head of Sales Development at Virio.\n\nAnd we\u2019re spending $250k-$310k TC to find our next killer. \n\nLast month, we had one of the most viral B2B SaaS launches on LinkedIn, with over 2M+ impressions in the first week alone. 2,000 comments, over 100+ demos booked \u2026 now we need someone to turn attention into meetings booked, at scale. \n\nHere\u2019s the job in one line: \nOwn the machine that books meetings with our ICP. That\u2019s the leading metric. If you can do that, you\u2019ll be leading the Virio BDR team on our way to $100M ARR. \n\nWhat you\u2019ll do:\n- Build warm outbound at scale across phone, email, and LinkedIn\n- Stand up the processes, cadences, and dashboards that make a BDR team scale.\u00a0\n- Lead from the front: you\u2019ll coach, but you\u2019ll also dial, write, and DM. \n\nVirio\u2019s Head of Sales Development will be a rare hybrid:\n\n\u2192 Deep B2B SaaS GTM knowledge: you\u2019ve scaled BDR teams in fast-moving GTM orgs, or have ran a killer lead-gen agency. You know how to balance volume, quality, and taste\n\u2192 You\u2019re a true player-coach: someone who can architect systems, but also pick up the phone and dial 500 times a day when needed\n\nWe\u2019re hiring this position as soon as possible.\nAnd we\u2019re putting our money where our mouth is:\n\n\ud83d\udc49 $250K\u2013$310K TC\n\nIf you can build the engine that turns trust into pipeline, comment your email below and apply via the job link. We won\u2019t consider any applicants that don\u2019t apply!\n\nLet\u2019s get you down to SF in the Virio office.\u00a0\n | 112 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQG4LE1ZcWBKrw/feedshare-shrink_800/B4EZpPtENoIoAg-/0/1762273807170?e=2147483647&v=beta&t=PIgHqi0SMBxgCUfjzbgUJ3RYHRybCdx4ZVpZPy_h26g"},"https://www.linkedin.com/posts/zhu-amanda_we-raised-38m-kept-our-cramped-office-activity-7424845464497336320-2D6K":{"text":"We raised $38M. Kept our cramped office. Hit 300% capacity. Now we\u2019re moving in a space we designed.\n\nWhen we closed our Series B, everyone expected us to upgrade immediately.\nWe didn\u2019t.\n\nWe kept adding desks. \nSqueezed in phone booths. \nPut people wherever they fit.\n\nAt one point, we had 30 people and 1 bathroom.\nWe hit 300% over capacity.\n\nNow we\u2019re moving into a space 5x larger.\nEvery detail we couldn\u2019t control before, we designed this time.\n\nWe didn\u2019t stay in the old office just to be scrappy.\n\nIt was about priorities.\nBuild the product.\nHire the team.\nThen build the space.\n\nWe\u2019re ready now. | 64 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQHBh2lZ2o-KEg/image-shrink_800/B56ZwpZmm7KEAg-/0/1770221104736?e=2147483647&v=beta&t=0hmiyY0_Tf6KtUxXUwFFIcbZYhGWuQayFdx0QrrNgaI"},"https://www.linkedin.com/posts/sebastian-jimenez-690149149_we-were-poisoning-our-employees-and-we-didn-activity-7415087428438376448-oX6V":{"text":"We were poisoning our employees,\nand we didn\u2019t even know it.\n\nIndoor air quality is the most overlooked problem in the United States.\nCommercial buildings are sealed shut for energy efficiency.\nBut the tradeoff?\nPeople aren\u2019t breathing clean air.\n\nCO\u2082 levels are usually 400 ppm outdoors.\nOur office had exceeded 1,000 ppm.\n\nOnce you cross that threshold, your cognitive ability drops by 30%.\nThat 3pm haze everyone jokes about?\nIt\u2019s CO\u2082 building up by people just doing their jobs.\n\nInventing the future at Rilla means our team at their cognitive peak.\nSo when we hit our building\u2019s CO\u2082 limits, we acted immediately.\n\nWe brought in Joseph Allen's team at 9 Foundations, Inc. to find the healthiest indoor working space in New York City. \n\nWith help from Cooper Weisman and Ryan Gessin at Newmark, we have officially signed the largest office transaction in Williamsburg in 2025.\n\nRilla is moving into 25 Kent, an office space of 57,000+ square feet. \nWith advanced filtration and ventilation, the air will literally feel like you are working outside.\n\nPeople ask me, \u201cWhy would a startup invest this much in air quality and space?\u201d\nThe answer is simple.\n\nA 30% cognitive gain is worth everything.\nOne new idea could change the future of Rilla.\nSo, we are investing in it. | 44 comments on LinkedIn","author":"Sebastian Jimenez","image":"https://media.licdn.com/dms/image/v2/D4E22AQFGGaXpb919Cg/feedshare-shrink_800/B4EZueutKiKkAg-/0/1767894607207?e=2147483647&v=beta&t=wsgvNiC0D4y3dl-umJ_gC1GTju5Z2NK4jEJ44wId0Cg"},"https://www.linkedin.com/posts/sugju-choi_shove-your-job-up-your-azz-worst-and-best-activity-7407476497453809664-7-DF":{"text":"\"SHOVE YOUR JOB UP YOUR AZZ\"\n\nWorst and best line I heard from a candidate I interviewed. Yes, we do 996 which means working 9am-9pm, 6 days a week.\n\nIt's funny because there are two extremes of how people react when I say that. They either say:\n\n> \"you're a slave, a victim of capitalism and hustle culture, your CEO is exploiting you!!! shove that job up your azz\"\n\nor:\n\n> \"oh man I do that already lol\"\n\nThe reason why we keep it transparent is because we're looking for those people. \n\nPeople who've run their own business or started their own startup get it. Building something from nothing is extremely hard. It demands sacrifice, obsession, and an unreasonable amount of hours.\n\nThat doesn't mean you're literally chained to your desk for 12 hours a day. It means putting in your best effort - 100%, 120%. But saying \"996\" is the best filter.\n\nWe're not trying to convince anyone this lifestyle is for them. If your gut reaction is the first one - respect. Genuinely. That boundary is valid.\nBut if you read 996 and thought \"yeah that's just Tuesday\" - we should talk.\n\nAnd look - we know this isn't sustainable forever. As the team grows, the pace will change. 996 is an early-stage reality, not a long-term culture. The goal is to earn the right to slow down by building something that works first. | 373 comments on LinkedIn","author":"Sugi Choi \ud83c\udf4b","image":"https://media.licdn.com/dms/image/v2/D5622AQF_tcqkRBrl4g/feedshare-shrink_1280/B56ZsyknsyGkAs-/0/1766080019623?e=2147483647&v=beta&t=ff5QftlhFzMWxvXnDnhZsmVAcjcE0hPuiyB70ls4EV0"},"https://www.linkedin.com/posts/james-k-he_we-at-artificial-societies-dont-believe-activity-7378391641730023424-NDkB":{"text":"We at Artificial Societies don't believe in 996 - we only work when we want to work.\n\nWhen I first left home at 14, I thought \"hard work\" meant suffering through things you hate. Then I got to Cambridge, dove into AI research, and discovered something wild: when you're genuinely obsessed with a problem, the work doesn't feel like work anymore.\n\nThat's exactly what happened when we first started Artificial Societies. Patrick and I were staying up late tinkering the simulations, not because we had to, but because we couldn't stop.\n\nFor us, work is self-expression.\n\nNow, our \"office hours\" are whenever inspiration strikes. Tom Whittle ships features on the weekends because he's excited about an idea. Patrick Sharpe watches user sessions at 10pm because he spotted a pattern.\n\nThere's no clocking in or out here, no performative \"hard work.\" Instead, it's about a deep, intrinsic drive that pushes us to create, to innovate, and to solve problems because we're genuinely passionate about it.\n\nSo yes, we don't believe in 996. We only work when we want to work.\n\nAnd we always want to work. | 44 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGi8l5C4n7LSQ/feedshare-shrink_800/B4EZmVQFcgIoAg-/0/1759145650331?e=2147483647&v=beta&t=4OIbgqmKT9D1kWuS0TEx_cAh3ZPQPXsmgjmjw51t3QI"},"https://www.linkedin.com/posts/sugju-choi_gen-z-is-taking-over-linkedin-theyre-ditching-activity-7404577917948866561-uOXa":{"text":"Gen Z is taking over LinkedIn.\n\nThey're ditching the corporate fluff, saying what they actually think, and building in public without the ego. It's refreshing. Where the rest of us learned to play it safe, they're just being real. I've connected with some incredible people recently who are redefining what it means to show up on this platform.\n\nWilman Chan - Started on LinkedIn because his high school banned every other social media except LinkedIn. He came for the games (shoutout to the Moonshots team for making bangers - Rushabh S.!!), stayed for the content, and ended up growing to 18k+ followers and landing a role at a YC startup in SF.\n\nMax Rascher - Started posting at 19 to make money \ud83e\udd11. Now he's at 120k+ followers and puts out some of the best content on how to actually use AI tools. He flew from Madrid to SF 2 months ago to join one of the hottest startups (guess where :p)\n\nMorgan Young - Started posting as a creative outlet. Her tech job was super technical, and LinkedIn became her way to express a different side of herself. Back then, barely anyone was creating content here. Now she's a LinkedIn Top Voice \ud83e\ude75\n\nYanni Pappas - Started posting as a BDR and realized something: having real, human conversations with buyers through his content led to way more demos than cold pitches ever did. Proof that being genuine beats being salesy.\n\nKevin Lee - Came from YouTube and TikTok, saw the opportunity on LinkedIn, and ran with it. (I\u2019m telling you, LinkedIn is the new TikTok) Now he's driving campaigns like Atlassian Answered while building a personal brand that opens doors money can't buy.\n\nTiffany Yan - Started posting earlier this year with Simplify to grow her personal brand. She's been building connections with other creators and quickly making a name for herself in the LinkedIn creator space.\n\nAlso check out Dennis Chen, Soneesh Kothagundla, Pavan Kumar - they're all crushing it in the startup world.\n\nHope this gives you the push to start posting. You don't need a perfect strategy. Just start, be real, and you'll grow like these people did.\n\nTag your favorite Gen Z creator or drop a \ud83d\ude4b if you're one yourself \ud83d\udc47. Let\u2019s connect!! | 194 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQGjwrqTbGs67w/feedshare-shrink_800/B56ZsJYYIkH8Ak-/0/1765388944693?e=2147483647&v=beta&t=Reo-09BvbVH8nLP1pnoH-tkAXa7f4MSzB2M5qfeRxXo"},"https://www.linkedin.com/feed/update/urn:li:activity:7421967518896009216":{"text":"TikTokers are taking over LinkedIn !!!\n\n3 TikTokers hit 15K+ followers on LinkedIn in under 90 days posting the exact same content that works on TikTok.\n\nNatalie (Corporate Natalie): 250K + Top Voice.\nBrooke Monk: 46K + Top Voice.\nAvni Barman: 76K.\n\nSame hooks. Same format. Same posting frequency.\n\nThe LinkedIn algorithm isn't magically different from any other platform. It responds to the same mechanics that work everywhere else.\n\nThe actual difference: fewer creators competing for attention, and an audience with deeper pockets.\n\nMost founders treat LinkedIn like it requires a different playbook. It doesn't. It just requires showing up with the same clarity and consistency that works anywhere else. | 29 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQGW7Ihs9x6VcQ/image-shrink_800/B56ZwAgHEFIcAg-/0/1769534944000?e=2147483647&v=beta&t=qQLvLhuxKicwerD887MTUWUMQCMqW5Pky4ZAtm7fln0"},"https://www.linkedin.com/posts/sahajgarg_dear-tanay-i-dont-talk-about-this-publicly-activity-7429185333646381056-8Wtr":{"text":"Dear Tanay,\n\nI don't talk about this publicly as much as I should: working with you is one of the best parts of building Wispr.\n\nThe foundation of our working relationship is deep trust. When problems arise (and they arise constantly in any startup) there's never a question of whose fault something is. It's always: we both see the issue, now how do we solve it together.\n\nThis might sound unremarkable, but it's rare. Most co-founder relationships fracture under stress because when things break, people start assigning blame or questioning each other's judgment. You and I have never fallen into that pattern.\n\nYou hold yourself to standards that I've never seen anyone else maintain. If we're going to ask extraordinary things from the people we work with, we have to hold ourselves to even higher standards. You do this consistently, and it sets expectations for the entire company.\n\nWhat I value most is that you care about what matters beyond just the company. You\u2019ve been completely supportive of me being present for my family however I need to be, and I appreciate it more than maybe I\u2019ve been vocal about before.\n\nWe're building an intense work environment. We care enormously about results. But we also believe that family and health matter, and that people should be trusted to navigate when those priorities conflict. Finding someone who both maintains extremely high standards and genuinely cares about people's lives outside work - that combination is genuinely unusual.\n\nOur personalities complement each other in useful ways. \n\nYou tend to say yes to new possibilities. \nI tend to say no and stay focused on what we're already doing. \n\nYou generate endless creative ideas. \nI'm more skeptical about what will actually work. \n\nThat tension produces better outcomes than either of us would reach individually.\n\nWe pivoted the company from brain-computer interfaces to voice AI software - a fundamental transformation that destroys most co-founder relationships. Throughout that entire process, even when we disagreed on specific directions, we agreed on something more important: we're both pursuing truth, trying to find the right path forward, committed to staying aligned with our core values.\n\nWe came through it with a stronger relationship than when we started.\n\nI'm grateful every day that I get to do this with someone I trust at this level.\n\nFrom, Sahaj | 28 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQEz8EDq3OvC7Q/image-shrink_800/B4EZxnEsKCHsAk-/0/1771255810062?e=2147483647&v=beta&t=oyxqzPgvU0xtlK6nRMRx9MjMhj1PwocZ_6hkwd5lijc"},"https://www.linkedin.com/posts/kylelacy_lilo4life-share-7454255203848986624-9SWQ":{"text":"Appreciation post. This is one of the best marketing leadership teams on \ud83c\udf0e, and I'm lucky to have worked with 3\u00a0of the 5 before. \n\nIf you're a CMO (or any kind of leader) and you don't have five people you'd run through a wall for, you're not going to make it through. I'm convinced of it now more than ever, especially after this last week at Inspire. \n\nThe best part about this group? Highly proactive\u00a0and productive, with a higher EQ than most people I've met. They are standout humans. \n\nBen Battaglia - gets sh*t done in a way that's both creative and meaningful. He has led content marketing, product & engineering, and an entire company. His gift is the ability to hold 10,000 things in his head at once (without Claude). It's a gift. He also understands our product intimately.\n\nKatie Brunette cares more about the attendee experience than anyone else in the room and understands how to deliver an exceptional experience, no matter the budget. I've known this about Katie since we started working together at ExactTarget, and she has continually delivered time and time again. \n\nBridget Conrad Harvey is the most aggressive get-it-done optimist I've ever worked with. That's quite the tongue twister. She takes pressure and gives back energy. Also, she keeps all of us organized and in line. I don't want to say \"ducks in a row,\" but it's true. :) \n\nSilvia Valencia runs the revenue machine 24/7 and ties up the loose ends I didn't even know were loose. She is always calm and collected, no matter the pressure or the ask. It's also helpful that she brings along one of the cutest dogs on the planet to hang with the team. #lilo4life\n\nJulie Asselin is new to the team through the 365Talents acquisition, but I feel like I've worked with her for years (and that's a good thing). She understands the nuances around creating great experiences better than anyone I know. And she manages to do it while jet-lagged and dealing with American \"sensibilities.\" :)\n\nBehind those five is an amazing marketing team that constantly delivers outstanding results. We've already had quite the year: \n\nLaunched a new brand + new swag store\nProduced & attended Revenue Kickoff\nAnnounced, enabled, and launched 365Talent's acquisition\nShipping countless features to our customers\nProducing & attending Inspire\nAnnouncing, enabling, and launching Zive acquisition\n\nNot to mention all the campaigns we are constantly working on and shipping that have helped us break pipeline records. \n\nYou can't fake this. You can't AI/robot this. It's built slowly through relationships with the right people. So when the hard sh*t hits, you are in it together.\n\nWhat I have is the best marketing team in B2B SaaS. And five leaders who carry the weight with me.\n | 17 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQFyh59NmeHAEg/feedshare-shrink_800/B56Z3LVm4FIUAc-/0/1777232932759?e=2147483647&v=beta&t=LY8Vi87Oyse5Fxhsq4MadJXJD-dBwQET7C_ZLEDVxGk"},"https://www.linkedin.com/posts/andrewwarner_i-havent-posted-much-here-but-thats-about-activity-7343263114718547972-jtxT":{"text":"I haven't posted much here, but that's about to change. Let me reintroduce myself properly.\n\nI'm not really Andrew Warner.\n\nI was born Shuki Khalili. Try cold-calling someone when your name is Shuki \u2013 I learned real quick that \"Andrew Warner\" got calls answered way faster than \"Shuki from... uh, that greeting card company.\"\n\nThat scrappy name-change hack helped me bootstrap Bradford & Reed to $38 million in annual sales. Then I built Grab\u2022com (Warren Buffett's Berkshire Hathaway backed our billion-dollar jackpot \u2013 no big deal). After selling those, I created Mixergy and spent 15 years interviewing 2,000+ entrepreneurs including the founders of Airbnb, Dropbox, and Netflix.\n\nHere's what I'm up to now:\n\n\u2192 CEO of Bootstrapped Giants (partnered with Jesse Pujji)\n\n\u2192 Generated $277k in the first 2 months with our B2B Sales Accelerator\n\n\u2192 Moved from San Francisco to Austin (turns out I love manual labor now. Who knew?)\n\n\u2192 Still hosting Mixergy interviews and learning from founders daily\n\nWhat you can expect from me: Raw stories about building businesses without big funding, lessons from interviewing startup giants, and probably some behind-the-scenes chaos from growing Bootstrapped Giants.\n\nI believe the best business advice comes from stories, not lectures. Dale Carnegie taught me that \u2013 tell the story first, then draw out the point.\n\nYour turn: What's one thing about you that would surprise people here? Drop it in the comments. I'd love to learn about YOU.  | 228 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQHkCoktKE1rAA/feedshare-image-high-res/B56ZeiCsyRHoAw-/0/1750770307499?e=2147483647&v=beta&t=0x_88qum7r3v46DBwpZYO9PryeyQEICRInYs-hbGxcc"},"https://www.linkedin.com/posts/vaanand_we-just-hired-clays-first-head-of-sales-activity-7393654948212928512-f2Vy":{"text":"We just hired Clay's first Head of Sales. Here's an inside look at what the interview process looked like (and the take-home prompts I think other teams might find helpful):\n\nAs you can imagine, I know a lot of sales leaders! In fact, it\u2019s my day job to meet them. So you can believe me when I say I knew Becca Lindquist was special the first time we met. \n\nLet\u2019s start with what I was looking for:\n\n1. Philosophical alignment: We approach sales differently at Clay. We hire GTM engineers to sell Clay in a highly consultative process that prizes product knowledge and customer empathy over traditional sales backgrounds. We have a low-pressure, fit-oriented approach.\n\n2. People leadership and process: Our org is scaling quickly, and we need someone to come in and build a system that can help us scale, not just win based off force of will and charisma.\n\nHere was the interview process:\n\nFirst, I set up multiple behavioral interviews for Becca on sales process and people management with sales leaders at customers we trusted (thank you Dannie Herzberg and Stevie Case!). Then we did a deep dive interview where we went through every role in her career in great detail. We also asked her to complete a take-home with the following instructions:\n\n- Current State: We'll share Gong calls, written docs, closed/won + pipeline data, and would love to see what you come back with in terms of top 5 opportunities and observations. \n\n- Future State: Over the next 1-2 years, we want to go from $XXm a quarter in sales to $XXm a quarter. We\u2019d love your thoughts on how you\u2019d get there. It would be helpful to touch on pieces like hiring plan, how we change the hiring profile, when to layer in outbound and how, compensation, etc. Specifically, we want to understand how you would make the key changes, beyond just the proposed plan and timing. We want to hear what problems you expect to encounter and how you might overcome them.\n\nSix weeks after our first interview, we extended Becca an offer.\n\nGTM leadership searches are hard. They're time consuming and high-stakes decisions. It took a lot of effort and help from generous souls (thank you Geoff Vitt too for all your guidance!) to craft this process for our Head of Sales role. I hope sharing our approach will save you time in your search. | 138 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQHxARMK4X7Hwg/image-shrink_800/B4EZpuJ_w1J0Ag-/0/1762784706562?e=2147483647&v=beta&t=6buECVIh-iRIky80QKdpHEg8Hag3KTspRK2fFXJwfhQ"},"https://www.linkedin.com/posts/antonosika_3-months-ago-anton-m%C3%B6ller-decided-to-leave-activity-7413613735182823424-sIQe":{"text":"3 months ago, Anton M\u00f6ller decided to leave Palantir and join Lovable after he first said \"no\": he had already decided to start his own startup.\n\nThis is what made him want to join:\n\n1. The vision goes far beyond \"chat with AI to build an app\" - We're building something that hasn't been done before, and building apps with AI is just a part of that.\n\n2. Lovable cares a lot about talent - That's how we've built one of the most talent-dense teams I know of. Everyone learns from each other. It's an extremely valuable environment to be in.\n\n3. The world is watching us and the stakes are high - Few companies let individuals make as much impact as you can at Lovable.\n\nI'm super happy to have Anton on the team! He has already shipped 100s of improvements and working on \"the bootstrap\", developing all of lovable using lovable itself.\n\nWe're hiring more engineers like Anton to build the last piece of software. | 52 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQHlnOWU39jxdw/image-shrink_800/B4EZuJyZsJGoAc-/0/1767543251208?e=2147483647&v=beta&t=Fl39JkS0EYR6dDQQxidOxCrXmcmRU3hE8d6RIlFXFRo"},"https://www.linkedin.com/posts/sahajgarg_we-hired-a-berkeley-linguistics-phd-who-studies-activity-7423026712566890497--KwI":{"text":"We hired a Berkeley linguistics PhD who studies dying languages. Within the first month, she made one edit that saves us $100k+ per month. \n\nWispr drives how millions of people communicate.\n\nYou speak. You ramble. You give it your messy thoughts. Most people hit send without reading. They trust the product that much.\n\nFor that to work, we needed someone who understood language. Not theoretical language, how people actually want to communicate.\n\nSo we gave our candidate a research exercise: A dataset of rambles, with relatively incoherent rambles. Her job? Figure out what people were trying to say, then fix it like Flow would.\n\nThis tested everything we cared about: \n\n\u2192 Comfort with real-world messiness \n\u2192 Not getting scared by ambiguity \n\u2192 Understanding communication, not just linguistics theory\n\nOh, and she can do this in 6 languages. Immediate hire.\n\nBut here's where it gets interesting.\n\nWhen she joined, she started labeling data herself. Developed a procedure.\nAt the time, we were paying hundreds of thousands of dollars every single month to Mercor for human labelers.\n\nPeople who opt into sharing data give us really messy stuff. We needed it cleaned up.\n\nOne day, she came to us:\n\n\"I think I can save us these few hundred thousand dollars every year. I found a way to automate all of this while maintaining the same data quality we're getting from humans.\"\n\nShe went from human labels to full AI labels. Same volume of data. Zero people from Mercor.\n\nEverything labeled in-house with our own systems.\n\nAll because we hired someone who cares about ownership and isn't afraid to take on problems they've never solved before.\n | 27 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/benmlang_fastest-growing-teams-hiring-list-new-activity-7416870709332803584-qUuA":{"text":"FASTEST GROWING TEAMS (HIRING LIST)\n\nNew list of 37 startups who've recently hired the most people:\n\n1) Wonderful - enterprise AI agents (Global)\n2) OpenFX - cross-border FX payments (Bangalore / US remote / London)\n3) Genspark - AI workspace (Bay Area / Tokyo)\n4) Willow - AI voic
