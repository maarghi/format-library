6515%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"2024: close to quitting on my business\n2025: huge breakthrough and made it our most successful year\n\n\nBack in 2024, I lost my spark with Because of Marketing. \n\nMy Dad got diagnosed with Lewy Body Dementia and my priorities shifted.\n\nI spent most of my days worrying about him as we adjusted to the diagnosis, and as a result I struggled to get the business wheels in motion. \n\nBut I really didn\u2019t want to quit on my dream and believed in what Because of Marketing could be! \n\n\nOn the 1st of January 2025 at 00:01 I wrote on my notes app:\n\n\u20182025 will be the year Because of Marketing will be financially successful\u2019. \n\nAnd then I locked in.\n\nEvery single month of 2025, I was in complete focus mode: \n\n\u2022\u2060  Got intentional with social media \n\u2060\nI posted less on mine and BoM\u2019s LinkedIn to build out our Instagram and Substack newsletter.\n\nLetting go of control and outsourcing to brilliant freelancers massively reduced my workload.\n\n\n\u2022\u2060  Made sacrifices\n\n\u2060I spent my 29th birthday still living in my mum\u2019s house vs hoping to have had my own house.\n \n\u2060I focused on building my business from my \u00a355 walnut dining table - I had to swap it out with my wardrobe in my bedroom to make space.\n\n\n\u2022\u2060  \u2060I worked across 3 time zones, US, UK and Australia. \n\nI wanted to be connected, not leave money on the table and stay updated as news moves fast (e.g I stayed up between 12-4am to ensure we had Super Bowl ad coverage)\n\n\nBut it all paid off and I genuinely couldn\u2019t be more proud. \n\n1 year of focus.\n1 year of risk.\n1 year of growth.\n\n\nHere\u2019s how 2025 went for the business: \n\n\u2192 Substack: 6,200 \u2192 43,400 subscribers (+590% and #7 bestselling substack in business)\n\n\u2192 Instagram: +270K followers, 22.4M views\n\n\u2192 TikTok: +55K followers, 15M views\n\n\u2192 LinkedIn: 295K \u2192 325K\n\n\n- We gained over 330,000 new followers.\n\n- Hosted an event with SEEN Group in London.\n\n- Partnered with Sipsmith during Wimbledon.\n\n- Launched our premium newsletter subscription\n\n- Took an exciting call with Apple!! \n\n\nBecause of Marketing has transformed from an Instagram page I created in my childhood bedroom into a global community and marketing media brand. \n\nWith the support from our followers and community, my team and I can continue creating what we love, breaking down the campaigns, providing analysis, trends and ideas to inspire the marketing industry. \n\n\nTo think I was SO close to quitting\u2026 when I was just on the brink of a breakthrough. \n\n2026, it\u2019s time to do it all again, but we aim higher!!\n\nHappy New Year everyone - don\u2019t give up on your dreams this year \ud83e\udd0e | 171 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFmeN-IzHADsA/feedshare-shrink_800/B4EZuOIYY2HUAg-/0/1767616135058?e=2147483647&v=beta&t=-KAlesOHbBLGodfUQGDaxJKJWXp6h9ssLkyyJLxXxJ0"},"https://www.linkedin.com/feed/update/urn:li:activity:7430271916046790656?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7430271916046790656%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"2019: I was rejected by YC for the first time\n2021: I was rejected by YC 2 times\n2022: I was rejected by YC 2 times\n2023: I was rejected by YC 2 times\n2024: I was rejected by YC 2 times\n2025: I raised $3M+ led by a16z speedrun\n\nThe gap between rejection \u21169 and acceptance wasn't luck. It was 6 years of compounding effort that finally broke through.\n\nTo every founder collecting rejection emails right now:\nRejections \u2260 the end. Just keep building! | 196 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQHuSZUCgDTPFw/feedshare-shrink_800/B56Zx2g7vvJAAk-/0/1771514871204?e=2147483647&v=beta&t=gVQ2WWcjsc_4p1hKrQGsUIPhVyoui3x3X3GMrcbrlJ0"},"https://www.linkedin.com/feed/update/urn:li:activity:7391512082879258626?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7391512082879258626%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We\u2019re hiring a Head of Sales Development at Virio.\n\nAnd we\u2019re spending $250k-$310k TC to find our next killer. \n\nLast month, we had one of the most viral B2B SaaS launches on LinkedIn, with over 2M+ impressions in the first week alone. 2,000 comments, over 100+ demos booked \u2026 now we need someone to turn attention into meetings booked, at scale. \n\nHere\u2019s the job in one line: \nOwn the machine that books meetings with our ICP. That\u2019s the leading metric. If you can do that, you\u2019ll be leading the Virio BDR team on our way to $100M ARR. \n\nWhat you\u2019ll do:\n- Build warm outbound at scale across phone, email, and LinkedIn\n- Stand up the processes, cadences, and dashboards that make a BDR team scale.\u00a0\n- Lead from the front: you\u2019ll coach, but you\u2019ll also dial, write, and DM. \n\nVirio\u2019s Head of Sales Development will be a rare hybrid:\n\n\u2192 Deep B2B SaaS GTM knowledge: you\u2019ve scaled BDR teams in fast-moving GTM orgs, or have ran a killer lead-gen agency. You know how to balance volume, quality, and taste\n\u2192 You\u2019re a true player-coach: someone who can architect systems, but also pick up the phone and dial 500 times a day when needed\n\nWe\u2019re hiring this position as soon as possible.\nAnd we\u2019re putting our money where our mouth is:\n\n\ud83d\udc49 $250K\u2013$310K TC\n\nIf you can build the engine that turns trust into pipeline, comment your email below and apply via the job link. We won\u2019t consider any applicants that don\u2019t apply!\n\nLet\u2019s get you down to SF in the Virio office.\u00a0\n | 112 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQG4LE1ZcWBKrw/feedshare-shrink_800/B4EZpPtENoIoAg-/0/1762273807170?e=2147483647&v=beta&t=PIgHqi0SMBxgCUfjzbgUJ3RYHRybCdx4ZVpZPy_h26g"},"https://www.linkedin.com/feed/update/urn:li:activity:7397686902839013376?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7397686902839013376%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We killed LeetCode at Virio.\n\nNo online assessments. No whiteboard problems. No \"reverse a binary tree\" questions. With AI coding assistants everywhere, technical rounds are borderline meaningless now. Anyone can pass them with the right setup of ChatGPT + Claude + Cluely.\n\nWe're not building algorithms at Virio. We're building a product that actual customers pay for and use every day. \n\nI don't need someone who's solved 500 LeetCode hard problems. I need someone who can ship a feature from idea \u2192 design \u2192 code \u2192 production in a week.\n\nThis is what we do instead to find real builders:\n\n1\ufe0f\u20e3Previous projects: Show us what you've actually built and shipped.\n2\ufe0f\u20e3Reference calls with your past teammates: We want to hear how you actually performed on a team, not how well you prepped for an interview.\n\nThat's it.\n\nIf you can build, iterate fast, and care about the end user experience more than the perfect algorithm - we should talk.\n\nDrop a comment here if you're interested, let's build real products together. | 288 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGMk3q77URyPw/feedshare-shrink_1280/B4EZqndCTOGYAs-/0/1763745998845?e=2147483647&v=beta&t=1OBXL4_tWDRt3EP9OgVSkFGQ_rcvz5g68AeAr2lZGwg"},"https://www.linkedin.com/feed/update/urn:li:activity:7468687518373277696?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7468687518373277696%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I changed my LinkedIn profile pic for 4 hours. \nMy entire company roasted me.\n\nSome called it a \"jump scare.\" Others said I looked like a kid asking his parents if he could go to a friend's house. Many said it was horrifying.\n\nMy team doesn\u2019t hesitate to tell me when something is bad.\n\nIf something is bad, you say it's bad.\nIf someone is falling short, you tell them exactly how.\n\nYou just tell them the truth. That's not being harsh. \nThat's respecting someone enough to be honest with them.\n\nIf you're at Rilla and you think something is wrong, whether its a strategy, a decision, or even a headshot, you say it.\n\nThat's how real problems actually get surfaced. \nIt's how people feel like they have a voice.\n\nSo when my team collectively told me my AI-generated, ChatGPT-yellow-background headshot looked horrifying, I listened.\n\nGiving negative feedback at Rilla is expected.\n\nSo yes, the yellow headshot is gone. \nBut I have now become a meme internally within our slack. | 24 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQG6vYqwK1xROA/feedshare-shrink_1280/B4EZ6YbuHlI0AM-/0/1780673864416?e=2147483647&v=beta&t=e0LI4_SjxDb5M74v3xRXpjMBYYGbbDjvZxhtaOOnSnk"},"https://www.linkedin.com/feed/update/urn:li:activity:7470140598981701632?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7470140598981701632%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I turned 30 this past weekend. \nMy team says I'm officially part of the \"unc\" club.\n\nHere are a few things I tell everyone who joined Rilla this past year:\n\n1) The best way to learn is by doing.\n2) You get better by trying, failing, and iterating.\n3) What you track, you can improve.\n4) Effort compounds when it\u2019s consistent.\n5) Ownership is the most valuable.\n6) Hard things are worth doing even if it hurts in the moment.\n7) The people you surround yourself with shape your growth.\n8) Adaptability is a competitive advantage.\n9) Big goals require real sacrifice.\n10) Understanding people is essential to winning.\n\nI've never been more fired up than now. \nThe team shows up every day and raises the bar. \nEvery single person is pulling serious weight.\n\nEntering my 30s surrounded by people like this? \nThat's the win. The best is still ahead.\nAnd we're just getting started. | 44 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFWEh-kmFs3yA/feedshare-shrink_800/B4EZ6tFSl4KUAk-/0/1781020306519?e=2147483647&v=beta&t=ePfe1besDRpkkhjjVjgOcLOmE0Ttt6Y2VBjHZiyhF1Q"},"https://www.linkedin.com/feed/update/urn:li:activity:7471224149709930496?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7471224149709930496%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I spent 4 years bombing jokes at comedy bars on the LES.\nBest business school I ever attended. \n\nSkipped my 8ams. Stayed out til 4am doing comedy sets. \nNothing teaches you to fail and learn fast like a room full of people not laughing. \n\nJunior year, a Forbes author hired me to make his tech founder interviews funny. That's when I realized building products and doing comedy are basically the same thing. Keep iterating until something lands. \n\nLast night, Rilla co-hosted a Tech comedy show with Avoca. \nFellow comedians like Varun Rana, Neal Patel, and 2 of Rilla\u2019s own took the stage. \n\nBobby Verhey and Patrick J. Johnson turned years of standup comedy into a pretty useful career skill. Both are unbelievably good at what they do, and I think the stage had something to do with it. \n\nThere's something about bombing in front of a crowd that rewires you. \nYou stop fearing failure. You start moving faster. \n\nTurns out the best salespeople and engineers in tech are just comedians who pivoted. \n\nP.S We're hiring. Standup experience not required. But it helps. \ud83d\ude09 | 33 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQEnx1ZkXhDNJA/feedshare-shrink_800/B4EZ68exJ8JEAc-/0/1781278644239?e=2147483647&v=beta&t=eh7T33lAXwtFv6SGL6PVs4kLn1jIYIOO9WokQiTRFkw"},"https://www.linkedin.com/feed/update/urn:li:activity:7473403828504137728?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7473403828504137728%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Hire ex-college baseball players.\nOwen Webb is one of the best engineers I've ever worked with.\n\nIn the last 2 years, he has been a part of every team in this company. \nMarketing. Sales. Customer Success. Events. Design. \nThe best example: The Rilla Ridealong Royale.\n\nThe biggest tech demo we've ever done in front of 1000s of people. \nRilla coaches facing against their own AI clones , on stage, hosted by Bruce Buffer. The product had to be flawless under pressure. \n\nThe only way to pull that off was to make Rilla genuinely faster.\n\nOwen built improvements for one 25-minute moment that ended up making the real product better for every single customer. Months of work. One shot. And it went perfectly.\n\nWhat drives him to build experiences like this isn't just shipping. \nIt's what happens on the other end. \nManagers who fall back in love with coaching.\n\nHe's now leading a team of engineers at Rilla. The thing he pushes them on the most? Expand into areas that aren't your core strengths. \n\nIt pushes you to iterate fast. Fail. \nMake the changes you need to. And keep moving up. \nKeep doing that, and you'll grow faster than you ever thought possible.  | 25 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQHga5srPV04nA/feedshare-shrink_800/B4EZ7bdLIDHwAg-/0/1781798320493?e=2147483647&v=beta&t=GdMq4iXI9eYk3_0RKDhkcHzM8kPzCA0K27AFGc9Em68"},"https://www.linkedin.com/feed/update/urn:li:activity:7480954071965741056?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7480954071965741056%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"2023: I became obsessed with Clay and knew it was going to change the game.\n\n2026: I got that same feeling for Claude Code.\n\nThe GTM SaaS of the future will largely be operated through AI platforms instead of traditional UIs.\n\nMany tools have already opened up that toolkit.\n\nThese are my 32 favorite MCPs to plug into Claude Code (for GTM):\n\n- Apollo.io: 275M+ contact DB & GTM workflows.\n- AI Ark: Prospecting DB with 70M+ companies.\n- Findymail: Contact enrichment + validation.\n- Google Workspace: Gmail + Drive + Docs.\n- Notion: Company knowledge hub + PJM.\n- Instantly.ai: Automated email campaigns.\n- Supabase: Backend DB for internal tools.\n- Ordinal: Content scheduling + analytics.\n- RB2B: Website visitor deanonymization.\n- HeyReach: Automated DM campaigns.\n- Clay: Call Clay functions from Claude.\n- Browserbase: AI browser automation.\n- Customer.io: Marketing automation.\n- Pinecone: Vector database for RAG.\n- Firecrawl: Web scraping + crawling.\n- HubSpot: Sales + marketing CRM.\n- Warmly,: Website visitor waterfall.\n- DiscoLike: Niche TAM mapping.\n- Ocean.io: Lookalike list building.\n- Apify: Store of custom scrapers.\n- GitHub: Storing company OS.\n- n8n: Workflow/agent builder.\n- Airtable: DB for automations.\n- Slack: Team + client comms.\n- Salesforce: Enterprise CRM.\n- TheirStack: Job openings.\n- Serper: Google scraping.\n- Sumble: Technographics.\n- Figma: AIO design tool.\n- Miro: Workflow mapping.\n- Vercel: App hosting.\n- Exa: AI web search.\n\n\n(Bonus) 2 CLIs I\u2019ve been loving:\n\n- Landbase: AI list building + enrichment.\n- Freckle.io: GTM orchestration.\n\nAny tools that I missed? \ud83d\udc47 | 121 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGzAgrANS7wcg/feedshare-image-high-res/B4EZ9GobfdK4AU-/0/1783596440709?e=2147483647&v=beta&t=TciWU1AfVgDExk7AnkTv32rku-7lIege1HAa6BNyMIc"},"https://www.linkedin.com/feed/update/urn:li:activity:7476174976518160384?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7476174976518160384%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I spent 4 years in Dubai then moved back to Europe\n\nHere's 3 things I forgot I needed:\n\n1. Sitting at bistro tables with decent coffee\n2. Walking everywhere\n3. Being so close to friends & family\n\nYour environment shapes what you crave without you realising.\n\nDubai I missed seasons and being able to walk places.\n\nEurope I'm remembering the sunshine and energy I loved about the Middle East.\n\nBoth incredible for totally different reasons.\n\nRight now though I'm very content with my coffee, my walks and the love from all my friends & family.\n\nWhat's the one thing you missed when you changed countries? <3 | 44 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQHtHa9HqJ1Esg/feedshare-image-high-res/B4DZ7AP4LTGUAY-/0/1781341848840?e=2147483647&v=beta&t=kOTU0uHcARvIK__QhXGrMeE3dI0sk-wRcUPOMdmQbSQ"},"https://www.linkedin.com/feed/update/urn:li:activity:7476289437421879296?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7476289437421879296%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Half our marketing team has never done marketing. Including their new manager. It\u2019s been the highest-ROI hiring decision I\u2019ve made.\n\nMaggie just got promoted to Content Lead. With zero marketing background.\n\nThree things I check before making a bet like this:\n\n1/ what does the business need? \n2/ is this what the person actually wants? stretch only works if the person is reaching.\n3/ what\u2019s the slope? will they get there fast enough?\n\nA year in, Maggie isn\u2019t working from a playbook.\nShe\u2019s training the next people I\u2019ll take this bet on. | 10 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D10AQEdkrSZeknhWA/image-shrink_800/B4DZ8EdoArK8Ag-/0/1782486303517?e=2147483647&v=beta&t=bBKZ1Mwu8eXZaq9WC92YtXFlVSxaFBV0b0wPPeIvmUA"},"https://www.linkedin.com/feed/update/urn:li:activity:7420519764067872769?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7420519764067872769%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Varun Anand is laying down the playbook of how a founder of $100M ARR company should think about distribution in 2026.\n\nEach episode is a casual, low-cost, minimal setup video series.\n\nWhich covers aspects of GTM and distribution, and how they're scaling Clay\n\nSome of the best ones so far:\n\n> \"How we're building Clay's first ever SDR (ClayDR!) team.\"\n> \"Analysis of Clay's 10,000 monthly support tickets.\"\n> \"GTM bets that got us here.\n\nBut it's not just the insights!!!\n\nWhat makes these videos so well-received on LinkedIn is the raw POV.\n\nHis videos feel relatable. \n\nSo if you're a tech founder building distribution in 2026, there are a lot of notes to take here. And no, you don't need to break the bank for your content.\n\nYou need a format that's scalable.","author":"Abheet Nigam","image":"https://media.licdn.com/dms/image/v2/D4E22AQGzE9725ymFKA/feedshare-shrink_1280/B4EZvr7Z2MHwAc-/0/1769189777166?e=2147483647&v=beta&t=5BOs0DvQkMogcrvsB04c-ojQQqBDnxDdsimG37SwXc8"},"https://www.linkedin.com/feed/update/urn:li:activity:7473785042943733760?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7473785042943733760%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I might regret posting this cuz it's one of our best growth hacks and anyone can do it, BUT here's how to get 250k-5m+ views on your launch video\n\nits OP cuz if you crack the formula, you can ship a new vid each month and drive insane inbound. \n\nWe make 1/month and clear 200k+ views every time\n\n1. make a launch video. either record it yourself with a screen-capture tool like Borumi or Screen Studio\n\n2. open your post with a hook that kills the scroll. think \"the first ever ___\" or \"today we're replacing ___.\" \n\n3. personally, I do a search for viral Linkedin/X launches in the last 60 days on Origami\nand try to use the same formats (bc these formats are already proven by the algo, so you\u2019re not guessing)\n\n4. After finding these super viral launches (10m+ views)  try to replicate the post opening line, video format, quote posts that worked best, etc. when you launch\n\n5. ping your network (investors, friends, people you used to work with). give them the exact date and time you're going live.\n\n6. once you're live, blast an email to everyone who agreed to help. drop in your launch tweet plus clear directions on what you want from them.\n\n7. in those directions, spell out your core message and show sample quote-tweets you'd love them to mirror. (follow platform rules on disclosed posts)\n\n8. push everyone to interact with the post inside the first hour if they can.\n\n9. You can also run paid ads on the video after the first day or so to boost engagement\n\n10. launch every time you make a big new feature that could be framed as a standalone product\n------\nThe best part is that if you flop, it means no one saw it anyway.  \n\nSo swap the hook and relaunch the next week. Founders will literally \u2018launch\u2019 3-5x/month and it works\n\nHoping to see more great launch vids on here\n\nWill be posting more playbooks to go viral every week on here | 18 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQF4gJCK4fveDQ/feedshare-shrink_800/B4DZ7g34dpI8Ag-/0/1781889206504?e=2147483647&v=beta&t=KARmj1oFVUiI5igi2COBr_cyBnC-Ofzhc3DbFXSZsUk"},"https://www.linkedin.com/feed/update/urn:li:activity:7463491360948535296?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7463491360948535296%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Do you also find yourself in the two quadrants on the right side? \n\nThen you might be the \ud835\udc05\ud835\udc28\ud835\udc2e\ud835\udc27\ud835\udc1d\ud835\udc22\ud835\udc27\ud835\udc20 \ud835\udc03\ud835\udc1e\ud835\udc2c\ud835\udc22\ud835\udc20\ud835\udc27\ud835\udc1e\ud835\udc2b we are looking for.\n\nFrom my experience the best product designers are artists. \n\nThey have a very strong opinion on what great design is. Not just in pixels but also in the real world. \n\nThey gravitate towards timeless design. Something that can stand the test of time.\n\nThat is what you will help us build at Hale as we shape the future of preventive health.\n\nWe're a small, low ego, high ambition team, building a company making a real difference in peoples life's. \n\nBacked by amazing investors and growing faster than we ever imagined.\n\nYou should reach out if:\n\n\ud83d\ude4c You are someone people love building with\n\ud83d\udc99 You genuinely care about helping people live longer, healthier lives\n\u2699\ufe0f You have taken products from zero to shipped (not just Figma)\n\ud83d\udea2 You move fast and take pride in getting things right\n\ud83e\udd16 You love contributing code directly with AI when needed\n\ud83d\ude0d You pay attention to details and care about delivering world-class UX\n\ud83e\udd84 Your past teammates and managers say great things about you\n\ud83e\udd0d You have experience building category-defining consumer products\n\nIf this sounds like you, DM me or email palle@joinhale.com \ud83d\ude80\n\nLocation: ideally UK, open to EU and US East Coast.\n\nNo agencies or recruiters.\n\n\n\ud835\ude08\ud835\ude2f\ud835\ude25 \ud835\ude3a\ud835\ude26\ud835\ude34, \ud835\ude35\ud835\ude29\ud835\ude22\ud835\ude35 \ud835\ude2a\ud835\ude34 \ud835\ude0c\ud835\ude17\ud835\ude10\ud835\ude0a \ud835\ude2a\ud835\ude2f \ud835\ude35\ud835\ude29\ud835\ude26 \ud835\ude2d\ud835\ude30\ud835\ude38\ud835\ude26\ud835\ude33 \ud835\ude33\ud835\ude2a\ud835\ude28\ud835\ude29\ud835\ude35 \ud835\ude29\ud835\ude22\ud835\ude2f\ud835\ude25 \ud835\ude24\ud835\ude30\ud835\ude33\ud835\ude2f\ud835\ude26\ud835\ude33 - \ud835\ude30\ud835\ude36\ud835\ude33 design \ud835\ude22\ud835\ude2f\ud835\ude35\ud835\ude2a\ud835\ude35\ud835\ude29\ud835\ude26\ud835\ude34\ud835\ude2a\ud835\ude34. | 20 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQHCdIswfxqr3Q/feedshare-shrink_1280/B4EZ5OdN4SHcAM-/0/1779432742675?e=2147483647&v=beta&t=075gzTUHYaLSA9VsfdmSwhvBRjwa_q7J_x16NHZhfuw"},"https://www.linkedin.com/posts/pallebroe_i-have-sent-thousands-of-linkedin-outreach-share-7473330076697382912-oIp3/?utm_source=share&utm_medium=member_desktop&rcm=ACoAACdGZLcBJuzZl4xNAUt8mhSOpOCaWu2zsCA":{"text":"I have sent thousands of LinkedIn outreach messages. One message outperforms all the others by a wide margin:\n\n\"Hey [Insert First Name]\"\n\nNothing else.\n\nNo pitch.\nNo calendar link.\nNo paragraph about your company.\n\nJust:\n\n\"Hey John\"\n\nThen wait. \n\nIf you have an interesting profile, curiosity does the heavy lifting.\n\nOnly follow up once they respond.\n\nPeople naturally want to know why you're reaching out. The more you explain upfront, the less reason they have to reply. | 114 comments on LinkedIn","author":"Palle Broe","image":"https://media.licdn.com/dms/image/v2/D4E22AQGsXBsvZJMF0Q/feedshare-shrink_1280/B4EZ7aaGqgJIAM-/0/1781780736955?e=2147483647&v=beta&t=JJk6JIjL79jA6eCaJF8W7qj8tvis9skqiwCyY_ulY5Q"},"https://www.linkedin.com/feed/update/urn:li:activity:7470857923670245377?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7470857923670245377%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"ABM used to be the most expensive way to go to market.\n\u00a0\nAI just made it the most accessible.\n\u00a0\nCheap data, AI research and signal tracking changed the math.\nNow any team with the right system can run it.\n\u00a0\nAnd in two scenarios, I think it's the strongest GTM play you can run in 2026 \ud83d\udc47\n\u00a0\n\ud83d\udc49 A constrained TAM (under 20k companies) with an ACV of $50k+\n\ud83d\udc49 A high-ACV product that needs an enterprise, high-touch motion\n\u00a0\nThe reason it works: ABM is channel-agnostic.\n\u00a0\nIt's not a campaign. It's a GTM system that works backwards from a list of target accounts and decides the right move for every single one.\n\u00a0\nSo we built our 10-step ABM engine \ud83d\udc47\n\u00a0\nStep 1: ICP model\n\ud83d\udc49 Score accounts from your CRM and TAM using Claude, then backtest the model\n\u00a0\nStep 2: TAM map\n\ud83d\udc49 Pull from Apollo.io, Ocean.io, AI Ark and Prospeo.io, then aggregate, dedupe and normalize in Claude Code\n\u00a0\nStep 3: Qualification\n\ud83d\udc49 AI agents qualify on website fit using Claude, then Clay enriches every point you used to research by hand\n\u00a0\nStep 4: CRM sync + tiering\n\ud83d\udc49 Push it all to HubSpot or Attio and auto-assign Tier 1, 2, 3\n\u00a0\nStep 5: Contact sourcing\n\ud83d\udc49 Decision makers, champions and influencers, verified emails and phones via Findymail and BetterContact\n\u00a0\nStep 6: Signal tracking\n\ud83d\udc49 Capture 1st, 2nd and 3rd party signals via Trigify.io, RB2B and LeadMagic, route to reps in Slack\n\u00a0\nStep 7: Awareness scoring\n\ud83d\udc49 Roll signals into 5 stages: Identified \u2192 Aware \u2192 Interested \u2192 Considering \u2192 Selecting\n\u00a0\nStep 8: Demand generation\n\ud83d\udc49 1:1 plays for Tier 1 and high intent: gifting, microsites, manual outreach\n\ud83d\udc49 1:many for everyone else: Smartlead, HeyReach and Kixie at scale\n\u00a0\nStep 9: Sales enablement\n\ud83d\udc49 Playbooks, AI-drafted emails and call scripts, account digests in Notion\n\u00a0\nStep 10: Reporting\n\ud83d\udc49 One north star for sales and marketing: ICP pipeline created and closed\n\u00a0\nHere's what makes the whole thing work \ud83d\udc47\n\u00a0\nBy the time you reach the plays, the system already knows the answer.\n\u00a0\nThe tier you assign in step 4 is what decides the play in step 8. Tier 1 earns the white-glove 1:1 treatment. Tier 2 and 3 run 1:many at scale.\n\u00a0\nThat's the difference between doing ABM and running it as a system.\n\u00a0\nClaude orchestrates the whole engine.\nClay does the heavy enrichment.\n\u00a0\nThe full stack is in the workflow below. | 51 comments on LinkedIn","author":"Matteo Fois","image":"https://media.licdn.com/dms/image/v2/D4E22AQEII2FQC0rGRA/feedshare-image-high-res/B4EZ63Rr8xIcAU-/0/1781191328927?e=2147483647&v=beta&t=yMgp3U0fgD3hb7MnRML9mrZqr0J858D0nGeBNmJsB6I"},"https://www.linkedin.com/feed/update/urn:li:activity:7472638547150290944?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7472638547150290944%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"What used to take 10 SDRs now runs on 2 people.\n\n1 GTM Engineer. 1 Content Engineer.\n\nThey don't work in parallel.\n\nThey feed each other.\n\nThe Content Engineer warms the accounts the GTM Engineer converts.\n\nEvery outbound touch lands on a familiar name.\n\nThat's what changes the math.\n\nHere's how the work splits \ud83d\udc47\n\n1. GTM ENGINEER\nOwns signal to pipeline.\n\n\ud83d\udc49 Ingests from RB2B, Bombora, Trigify.io, G2, Apollo.io, and HubSpot\n\ud83d\udc49 Enriches through Clay, ZoomInfo, Ocean.io, and n8n\n\ud83d\udc49 Scores fit and intent inside the RevOps Brain with Clay and Claude. Notion stores the output. n8n fires the next play.\n\ud83d\udc49 Runs sequences through Smartlead, HeyReach, and Instantly.ai. Runs paid across LinkedIn, Google, and Meta.\n\ud83d\udc49 Captures outcomes weekly in HubSpot, Slack, Notion, and Gong\n\n2. CONTENT ENGINEER\nOwns the engine that pre-warms every account before outbound activates.\n\n\ud83d\udc49 Creates assets with Claude. Figma for designs and manages the calendar in Notion\n\ud83d\udc49 Analyzes competitors content through n8n (LinkedIn, blogs, newsletters)\n\ud83d\udc49 Engages the audience daily through Extrovert and leadshark\n\ud83d\udc49 Routes post engagers back to the GTM Engineer as warm signals\n\nEvery account the GTM Engineer contacts has already seen the brand.\n\nThat's why reply rates go up and meeting rates follow.\n\nFollow for more systems like this! | 32 comments on LinkedIn","author":"Matteo Fois","image":"https://media.licdn.com/dms/image/v2/D4E22AQEG9mQsh1ePtA/feedshare-image-high-res/B4EZ7QlJ8mKUAU-/0/1781615863132?e=2147483647&v=beta&t=uuaQFIaiLh-sq1L8MqxNERAneyBJrN3xzkSO4-zvW44"},"https://www.linkedin.com/feed/update/urn:li:activity:7473366506618195968?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7473366506618195968%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"What level GTM Engineer did you actually hire?\n\u00a0\nOver the last 6 months, we've placed and worked alongside GTM engineers at every level.\n\u00a0\nThe mistake is never the person.\n\u00a0\nIt's asking someone to architect a revenue engine before they've had the reps to think like an architect.\n\u00a0\nThat takes time. There's no shortcut.\n\u00a0\nHere's how the levels actually break down \ud83d\udc47\n\u00a0\nLEVEL 1: WORKFLOW BUILDER\n\u00a0\nMindset: \"How do I automate this one task?\"\n\u00a0\n\ud83d\udc49 Builds single, isolated workflows from a clear brief\n\ud83d\udc49 Lives inside one tool at a time\n\ud83d\udc49 Can follow a recipe, can't write one\n\u00a0\nTools: Clay, Apollo.io, LinkedIn SalesNav, Smartlead, HeyReach, Make / Zapier\n\u00a0\nLEVEL 2: SYSTEMS INTEGRATOR\n\u00a0\nMindset: \"How does data move from signal to sequence?\"\n\u00a0\n\ud83d\udc49 Connects workflows into a functioning funnel\n\ud83d\udc49 Thinks in data flow, not just individual tasks\n\ud83d\udc49 Strong executor, not yet an architect\n\u00a0\nTools: Clay (advanced), n8n, Supabase, Findymail, LeadMagic, HubSpot/ Attio, RB2B, Trigify.io\n\u00a0\nLEVEL 3: REVENUE ARCHITECT\n\u00a0\nMindset: \"How do I build something that keeps working as conditions change?\"\n\u00a0\n\ud83d\udc49 Designs the full engine with AI in the decision layer\n\ud83d\udc49 Systems that score, route, research, and adapt\n\ud83d\udc49 This level is earned through reps, not a job description\n\u00a0\nTools: Claude (orchestration layer), Claude Code, n8n, Supabase, Exa, BlitzAPI, Smartlead + HeyReach + Kixie in sync, HubSpot / Attio\n\u00a0\nThe hire is rarely the problem.\n\u00a0\nThe expectations always are.\n\u00a0\nWhich level is your team currently running on? | 54 comments on LinkedIn","author":"Matteo Fois","image":"https://media.licdn.com/dms/image/v2/D4E22AQGX5Em0v1moGg/feedshare-shrink_800/B4EZ7a7O1LHsAc-/0/1781789422591?e=2147483647&v=beta&t=0pySCeltBrckH583Coj_Uuj8kNIi6LOmj7PveNqgRwY"},"https://www.linkedin.com/feed/update/urn:li:activity:7473706257674285056?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7473706257674285056%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I went through my last 10 posts that surpassed 50k impressions\n\n\nHere are some recurring themes\ud83d\udc47:\n\n\n- 9 out of 10 posts had a photo\n\n- 6 of 10 posts show actual work. Call transcripts , prospecting CROs, AI assistant interactions, booking meetings in the DMs. \n\n- The average word count for all of them is 90. The longest being 147. And the shortest being 21.\n\n- I told a story in 8 of the posts\n\n- each post had 100+ comments\n\n\nI'm sure there's a lot more I could dig deeper into, but this is surface level insights I've picked up on. And based on these, I definitely need to start using photos more. Cause 9/10 having a photo is a massive eye opener!\n\nI suppose people are visual learners + they like to see proof, as I'm mostly posting about my outbound wins and failures which ties into that 2nd observation. \n\nSecond thing I picked up on is not all posts have to be the same, with the shortest being 21 and the longest being 147 words. There's no one-size fits all! \n\nThirdly, storytelling is imperative. This is a no brainer. I mean who doesn't love a good story?!\n\nLastly, every post had a solid amount of comments. This doesn't come from asking a generic question at the end of the post. It comes from asking for help, asking for opinions (people love giving these, especially in sales\ud83d\ude06), and posting interesting / funny / relatable content to where it makes people comfortable to chime in with their own experiences. \n\nHope this helps some folks out + I'm very curious what y'all find working in your best posts? It may be different than my experience with LinkedIn\n\n\nPS. for the sake of using photos, here's a photo of my impressions over the last 365 days! 6 million is crazy crazy | 38 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQFWvN6VAZ_EMA/feedshare-shrink_1280/B4DZ7d1BFVKYAM-/0/1781838123783?e=2147483647&v=beta&t=JJBUrx5iG1FnLuqImgoss7o1I1qUE2Q9FqS1KgJFbVs"},"https://www.linkedin.com/feed/update/urn:li:activity:7472707124100321280?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7472707124100321280%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"in Y Combinator they have a playbook on how to get customers ASAP for your startup. if you do this, you\u2019ll brute force your way to 100 customers, almost no matter what your product is.\n\nHere it is:\n\n1/ launch-max.\n\nproduct hunt, hackerNews, devhunt, betalist, peerlist, indie hackers, etc. YC tells you to launch 3 times MINIMUM\n\n2/ pull your competitor\u2019s strongest backlinks and get yourself listed in the same places.\n\nwhatever article they have listed, you make a better version and ask the site to replace it (or supplement) with yours.\n\n3/ WARM OUTBOUND.\n\nEveryone knows about building in public. but you still need to capitalize on the 99% of leads who see your content but don\u2019t come inbound\n\nscrape everyone who engages with your posts each week, check if they fit your customer profile, and message them.\n\nyou can set this up to fire automatically with one prompt in Origami\n(just paste this section in as a prompt)\n\n4/ find 20 to 30 ugc creators on tiktok / instagram in your niche. ask them to create content about your product, ideally from a fresh account.\n\npay them a fixed fee ($15\u2013$30 per video) plus performance incentives ($1k for 1 million views, etc).\n\n5/ when building in public, a video is 10x better than an image/text - spam use cases of ur product on X/Linkedin\n\n6/ figure out where your customers actually spend time.\n\nwhich slack/discord groups are they in? what newsletters do they open? which podcasts and accounts do they follow? pay those people for shoutouts\n\n7/ there's a fresh trend on x basically every week. jump on the relevant ones and fold your product in (like i\u2019m doing right now).\n\nTo find trends i just use Origami & search \u201cLead Gen/GTM posts that are viral on X\u201d to find the best posts every week in my niche\n\nThen, I will reply to those, quote tweet them, and use the formats that work myself \n\n---------\n\nif you are doing all this every single week and DO NOT GIVE UP (launching, posting demos, contacting new customers) \n\nI guarantee you will hit your customer goals. Then the game becomes retention.\n\nwill be posting 2-3 more growth hacks every single week | 52 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQGwVVYoTVRfYA/feedshare-shrink_800/B4DZ7RjiAJI0Ak-/0/1781632213251?e=2147483647&v=beta&t=BHD5EO25dmd37fU4qulD3i7lj4DxOsfBt5kHgfk46Vc"},"https://www.linkedin.com/feed/update/urn:li:activity:7473083311016333312?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7473083311016333312%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I just hit 8k followers.\n\nso here's 8 lessons from the last 6 months:\n\n1. Post before you are ready. My app broke in front of a YC founder with 30 minutes left in a hackathon. I posted about it instead of hiding it. That post did 350k impressions in 3 days.\n\n2. The failure is usually the content. People do not remember the perfect launch recap. They remember the moment the demo broke, the decision felt risky, or the founder had to make the call anyway.\n\n3. Speed beats polish. The post you ship while the lesson is still fresh will almost always beat the version you over-edit for a week. Momentum has a shelf life.\n\n4. Specific receipts beat big claims. 350k impressions. 7,000 users. Dropping out. Moving to SF. People trust the story more when they can see the trail.\n\n5. Storytelling is a growth lever. I meet people who already know the hackathon, the app, the dropout decision, or the flight to SF before they know my resume. That changes every conversation.\n\n6. The right 1,000 beats the loud 100,000. Reach feels good, but the only attention that compounds is attention from buyers, builders, investors, teammates, and people who can actually open doors.\n\n7. Friction kills conversion. In product, every extra step delays the aha moment. In content, every vague line does the same thing. Make the point impossible to miss.\n\n8. Do it for yourself first. People mocked me when I started posting. Now some of them ask how I grew. Neither reaction can be the reason you keep going.\n\nYour next opportunity probably will not come from one more application.\n\nIt will come from making your work visible before you feel ready.\n\nStop building in silence. | 38 comments on LinkedIn","author":"Aidan Nguyen-Tran","image":"https://media.licdn.com/dms/image/v2/D5610AQF5bcDfha1hAg/image-shrink_800/B56Z7W5q1PIoAk-/0/1781721902645?e=2147483647&v=beta&t=VD94_I37BrpUfxl1HkEt0MEBFx_IezCf5TBEsgp2r6c"},"https://www.linkedin.com/posts/linasbeliunas_cant-believe-a16z-just-told-exactly-how-activity-7480971658191765504-BXsX?utm_source=share&utm_medium=member_desktop&rcm=ACoAACdGZLcBJuzZl4xNAUt8mhSOpOCaWu2zsCA":{"text":"Can\u2019t believe a16z just told exactly how to turn attention into startup infrastructure. Here\u2019s the complete founder playbook for winning customers, hires, and capital in the AI age \ud83d\udd25\n\nFor 20 years, the startup playbook was simple:\n\nBuild a great product.\nFind product-market fit.\nThen add distribution.\n\nThat model is now breaking.\n\nWhen AI lets anyone build faster, copy faster, and bundle faster, product alone is no longer enough.\n\nThe new moat is getting the right people to understand the right thing before the market catches up.\n\nCustomers.\nTalent.\nInvestors.\nDesign partners.\nEarly believers.\n\nThat is why Erik Torenberg\u2019s a16z \u201cNew Media\u201d thesis matters.\n\nHe calls it \u201cgo-direct as a service.\u201d\n\nBut the real idea is way bigger: Attention is no longer a marketing function.\n\nIt is a founder operating system.\n\nThe best founders won\u2019t just post more.\nThey\u2019ll turn narrative into demand, trust, recruiting leverage, investor conviction, and category ownership.\n\nSo I mapped the full playbook.\n\nInside:\n\n\u21b3 The a16z \u201cgo-direct\u201d model\n\u21b3 The 8 founder moves to win attention\n\u21b3 The 5 shifts reshaping startup distribution\n\u21b3 The minimum-viable attention system\n\u21b3 How attention becomes customers, hires, and capital\n\nIn the AI age, building is getting cheaper. Being understood is getting harder.\n\nComment \u201cAttention\u201d, and I\u2019ll send you the link \ud83e\udd84\n\nP.S. also check out How Anthropic Just Told AI Founders Exactly What to Build in 2026 (Full founder playbook + where Anthropic's own products will & won't compete)\ud83e\udd84: https://lnkd.in/d_9Wnxns | 1,552 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQH_PSpTxxHqZw/feedshare-shrink_800/B4DZ9HAFKCKYAg-/0/1783602631957?e=2147483647&v=beta&t=WqbZhJmteK3RXVlcw_k0mXk_Oxz4WDIAuB6JdiMsiqw"},"https://www.linkedin.com/posts/adamrbroda_i-recently-worked-with-someone-who-wanted-share-7487133573586644992-v3bJ/":{"text":"I recently worked with someone who wanted to find a new job in NYC. They were living in suburban Florida. When asked about their salary expectations...\n\nThey said, and I quote:\n\n\"I'm flexible on salary, as long as the TC stays the same, I should be good; my top priority is to relocate\"\n\nMy next question:\n\n\"Would you be able to handle a 15-30% pay cut?\"\n\nSome job seekers forget that moving or relocating to a place with a totally different cost of living is a HUGE part of determining salary expectations. \n\nAnd of course, this could work for you, or against you, depending on where you're going.\n\nIf relocation is something you\u2019re considering,\n\nHere are a few resources for Cost of Living (COL) research you should check out:\n\n1. Numbeo: crowdsourced, city-to-city comparisons on housing, groceries, transit. It's good directional data, but limited source-of-truth precision.\n\n2. BLS Consumer Price Index by region: more credible than Numbeo if the client wants to cite something authoritative in a conversation with HR.\n\n3. MIT Living Wage Calculator: useful for a floor number (bare minimum to maintain standard of living), not necessarily your specific target range. \n\n4. Salary(.)com or Payscale COL calculators: translate a current salary into \"equivalent\" pay in the new city. This is the number most clients start with, but it's going to give a floor, not a ceiling. \n\nTo anyone who's considering a change of scenery, I fully recommend doing some 'cost of living research' before jumping into interviews or salary discussions. \n\nIt'll be worth your time.\n\nPS - What other COL tools would you recommend? | 194 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFXtb_yD3z81Q/feedshare-shrink_800/B4EZ.ekT6sH4Ac-/0/1785071747055?e=2147483647&v=beta&t=xVRztB8sZedIkdI3UqGePqFIhFy0Po36sixcn9cmYDo"},"https://www.linkedin.com/posts/tyler-denk_i-will-never-understand-why-companies-are-ugcPost-7487303837473542144-kZCY/":{"text":"I will never understand why companies are replacing customer support with AI.\n\nWe\u2019ve taken the complete opposite approach at beehiiv & every day we see posts from users raving about our support team.\n\nHere\u2019s our logic:\u00a0\n\n> There's so much mediocrity that we encounter in our day-to-day lives. AI has given us an unlimited supply of stuff that is \u201cpretty good\u201d.\n\n> It's rare to have an experience that genuinely delights you.\n\n> So there's a real premium for excellence. Whether physical or digital\u2026 when everything around you is \"pretty good,\" the thing that's actually exceptional stands out.\n\nFor customer support, that means hiring true product experts who are fast, kind, and remarkable at what they do.\nThe game is to build a product people genuinely love to use.\n\nAnd we're going to win because no one cares about their users as much as we do. | 57 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGXghgN05msfA/feedshare-shrink_1280/B4EZ.g_KgcHkAQ-/0/1785112341003?e=2147483647&v=beta&t=DltnENcXUtWWy7ZLRo7vpPpFxizecbaSrKr98MQSkpc"},"https://www.linkedin.com/posts/ivelina-dineva-nft_y-combinators-fall-2026-requests-for-startups-share-7485989487395635201-jYL9/":{"text":"Y Combinator's Fall 2026 Requests for Startups is out and the focus is on one theme: \n\nThe next wave of billion dollar companies will be built around AI operating in the real world.\n\nThe opportunities span education, defense, healthcare, infrastructure, robotics, compliance, crypto, and enterprise software.\n\nThis batch's requests come from YC partners and founders building on the frontier, and include, for the first time, one from the sitting U.S. Secretary of the Army.\n\n13 categories YC wants founders to be building in: \n\n\u2192 AI Education\n\u2192 Defense Technology\n\u2192 Small Software Cloud\n\u2192 Multiplayer AI\n\u2192 Offshore Compute\n\u2192 AI Consumer Products\n\u2192 AI for Aging\n\u2192 Operating Systems for Physical Work\n\u2192 Crypto Infrastructure\n\u2192 Physical World Data\n\u2192 Human Verification\n\u2192 AI Native Compliance\n\u2192 Self Maintaining APIs\n\nFull breakdown in the graphic below. \n\nWhich one are you building in or would like to build in? \n\nPS: Check out the EverythingStartups newsletter and these useful resources I have put together \ud83d\udc47\n\nNew VC funds database:\nhttps://lnkd.in/d7X8up9h\n\n45+ startup accelerators\nhttps://lnkd.in/egQJgetD\n\n60+ active Pre-seed to Series A investors:\nhttps://lnkd.in/eTKS-apX\n\nVC scout programs:\nhttps://lnkd.in/dwrTNziZ\n | 50 comments on LinkedIn","author":"Ivelina Dineva","image":"https://media.licdn.com/dms/image/v2/D5622AQGt4LnA0dPauA/feedshare-image-high-res/B56Z.OTxgyGcAU-/0/1784798976359?e=2147483647&v=beta&t=JiLfcsxMXSh9ksPHrW3seIj5n-I0PqpKDetStfuw0EE"},"https://www.linkedin.com/feed/update/urn:li:activity:7486441909066838016/":{"text":"Revolut is now \ud83c\uddf5\ud83c\uddf9 Portugal's 3rd largest bank by customer count.\n\n49% user growth in 2025 pushed market penetration past 20%. One in five people in the country has the app.\n\nDomestic transactions are now 57% of all spending, driven by domestic card payments up 84% in a year. The travel card became the everyday account.\n\nSavings balances grew 218%.\n\nWhat flipped it was plumbing. Revolut spent years in Portugal on a Lithuanian IBAN, and plenty of employers and billers quietly refuse foreign IBANs (illegal under SEPA rules, happens anyway). The local branch launched a year ago with Portuguese IBANs, MB WAY, Multibanco and Via Verde, and 12 months later the usage pattern inverted.\n\nThe next fight is salary deposits. Revolut says that's the 2026 priority. Win those, and 3rd largest by customer count starts to mean 3rd largest by deposits.\n\nThat's a completely different bank.\n\nH/T Max Karpis for the news  | 15 comments on LinkedIn","author":"Simon Taylor","image":"https://media.licdn.com/dms/image/v2/D5622AQEqgHy6HTkY3Q/feedshare-image-high-res/B56Z.UvPcrG0AU-/0/1784906840086?e=2147483647&v=beta&t=e8VYzMe2mGviS1i9aHTBvzfs_4j_SlVfW_c9Pf1BNt4"},"https://www.linkedin.com/posts/danielpriestley_i-just-hit-145000-followers-but-it-doesn-share-7487227484120268800-T53q/":{"text":"I just hit 145,000 followers\u2026 but it doesn\u2019t mean much anymore. \n\nI\u2019m March this year LinkedIn changed the algorithm massively and follower count doesn\u2019t matter like it did. \n\nIn the early days LinkedIn showed you what was happening withing your network of professional contacts. \n\nThen it gave weighting to what was happening all over LinkedIn based on the engagement - likes, shares, comments, dwell-time etc. \n\nThe engagement algorithm didn\u2019t really know what you were saying, it just knew that it was popular. \n\nWhat changed in March? A new semantic algorithm powered by AI understands what you\u2019re saying and who would find it interesting. \n\nImagine the difference between a dating app that shows your profile to random people and a professional matchmaker who gets to know you and makes a thoughtful introduction. \n\nThere are many implications to this change: \n\n- follower count doesn\u2019t dictate reach like it once did. A fresh new account could get 100,000 views per week if it\u2019s great content. \n- gaming the system with engagement groups is unlikely to work going forward. \n- most people will get fewer views but a higher quality audience who are right for what you\u2019re talking about. \n- longer posts will be more likely to be read. Shorter, pithy posts will be unlike to be amplified. \n\nSo while it\u2019s fun to have hit 145,000 followers, it doesn\u2019t give me any major advantages if I\u2019m not sharing something of value. | 64 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/posts/amitbendov_this-is-a-welcome-development-i-was-excited-share-7485931396104921088-7JOP/":{"text":"This is a welcome development.\nI was excited to read that Jack Dorsey just launched Buzz \u2014 a Slack alternative where people and AI agents share the same chat.\n\nThe agents are cool. But the more exciting part is what's missing: walls.\n\nBuzz is *open source and self-sovereign*. Your team's conversations belong to your team, and to whatever tools and agents you decide to point at them. This is a natural response to Slack tightening terms, restricting what third-party apps can do with conversations their own customers created. Your data, their terms.\n\nThat never lasts. In the agent era, a workspace your AI can't read is a workspace that falls behind. Lock up the data and the value simply flows somewhere else. \n\nBuzz is early. Maybe it wins, maybe it doesn't. But something built like it will. Or maybe Slack reopens its gates and none of this matters? Either way, users win.\n\nWater always finds its way.\n\nP.S. Also, great name. To infinity and beyond \ud83d\ude80\ud83d\ude0e  | 48 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQH6nfblZ5Wg7A/feedshare-shrink_800/B56Z.Ne8A.IMAc-/0/1784785125689?e=2147483647&v=beta&t=MYDSkUyIn9UrzA98cEhMK66Xw9q8dF46twUQa9e7AIc"},"https://www.linkedin.com/feed/update/urn:li:activity:7484940206526304256/":{"text":"Honestly, I struggle with this sometimes.\n\nAs humans, we're hardwired to focus on what we lack. Our brains have literally evolved to notice problems.\n\nThis means gratitude doesn't always come easy.\n\nAnd it doesn't help that the news, the feeds, and the algorithms are all designed to make us feel like we're behind.\n\nIt's a real uphill battle most days.\n\nSomething that's been helping me lately is a simple mental trick I call the \"Rocking Chair\" exercise:\n\nI close my eyes and picture myself at 80, sitting in a rocking chair somewhere.\n\nI look back on my 30s and list everything I miss about it.\n\nWaking up pain-free (most days).\nBeing able to travel every year.\nLiving across the street from my favorite cafe.\nHaving parents I can still call on a Tuesday afternoon.\n\nAll the small luxuries I take for granted right now.\n\nNext time you find yourself struggling to feel grateful, I recommend you give it a try.\n\nImage credit: world of statistics on IG | 678 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQHvRbVLFWwWAw/feedshare-shrink_1280/B56Z999_hUGgAM-/0/1784524831053?e=2147483647&v=beta&t=4HM_nI2XhVk31hUPttsR907O82INBqqobzrf5Iwivrg"},"https://www.linkedin.com/posts/zhu-amanda_manual-outbound-brought-41m-this-year-and-share-7487523456834740225-rnqR/":{"text":"Manual outbound brought $4.1M this year and counting. Last week a prospect asked if I was a real person.\n\nMy inbox is flooded with AI-generated outbound.\nIt all sounds the same because the tactics are cheap to copy.\n\nReference my recent post.\nSent at a weird time.\nInclude an aside.\n\nNone of that matters.\nAI can do all of it.\n\nWhat AI can\u2019t do is sound like you.\n\nWhat I\u2019ve found to work and get responses:\n\n1/ only compliment when it\u2019s real. \u201cLove your recent post\u201d reads like a bot because a bot could send it. \u201cThe way you handled the pricing pushback in that thread was the clearest thing I\u2019ve read this year\u201d reads like a human with an opinion. If you can\u2019t compliment something specifically, don\u2019t compliment at all.\n\n2/ the email has 1 job. be honest about it. \u201dI want to sell you our product. Here\u2019s why I think it\u2019s worth your time.\u201d \nNot \u201cwould love to explore.\u201d \u201cworth 15 mins?\u201d\nDirectness reads human.\n\n3/ write like you talk. If you\u2019d say \u201cI think you\u2019re leaving money on the table\u201d in a conversation, write that. \u201cI noticed some potential optimization opportunities in your pricing approach\u201d sounds like corporate-smoothing. Your actual voice breaks every template AI defaults to.\n\nNone of these are things you can prompt for because they all require you to actually mean what you\u2019re writing.\n\n-----\nHere\u2019s an email I sent earlier this year that led to a $120K deal:\n\nHey [name] - I saw you\u2019re launching an AI notetaker and starting with Zoom. \n\nThe question your team is going to hit in 3 months is whether it makes sense to continue building integrations for Microsoft Teams and Google Meet or use ours. I\u2019d rather have that conversation now than after you\u2019ve burned a quarter on it. \n\nAre you free next Tuesday at 1pm PT? | 25 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQGpEM3OMZVXpQ/image-shrink_800/B56Z.kG6GmHYAg-/0/1785164702397?e=2147483647&v=beta&t=INiU1nEtD4UyGsHoCFB_o7P1jXlLP9fiovyHrCP34ks"},"https://www.linkedin.com/feed/update/urn:li:activity:7487477088552259584/":{"text":"Employee-Led Content is the most powerful GTM motion in 2026.\n\nThe average B2B buying decision now involves 13 internal stakeholders and 9 outside influencers (Forrester, 2026).\n\nNo single LinkedIn account covers that room.\n\nI have 47k followers, but the Workflows.io team has 150k+.\n\nAnd we consistently book 80+ meetings/mo from LinkedIn.\n\nI attribute that to the entire team\u2019s efforts, since our content collectively covers the ENTIRE stakeholder map we sell into.\n\nHere's how our employee-led content strategy works:\n\n1\ufe0f\u20e3 Company Content Strategy\n\nWe each have our own content strategy, but they\u2019re modifications of our shared company strategy:\n\n- Positioning: We help GTM professionals understand the most advanced state of what\u2019s possible in the field.\n- ICP: B2B tech, Series A and later\n- Company Pillars: GTM workflows, AI GTM education, build in public, growth strategies\n\nEveryone picks their own lane inside of this.\n\n\n2\ufe0f\u20e3 Personal Brand Strategy\n\nWe sell into 4+ departments and work directly with our end-users, champions and decision makers.\n\nThe content that appeals to each vastly differs.\n\nSo everyone owns their own 3-4 content pillars:\n\n- Fivos and I take GTM, AI, technical breakdowns, and building in public.\n- People like Marios + Jan make it even more practical.\n- Pari is a developer and puts an even more technical spin on everything.\n- Angelee Carandang is our Content Lead and writes for other content teams.\n\nAs a team, we cover all the ground in our industry.\n\n\n3\ufe0f\u20e3 Company Page\n\nPersonal pages get 5-8x more engagement than companies.\n\nSo until we hit 50k company followers, we're just using the company page for:\n\n- Hiring\n- Reposting the team\u2019s posts\n- Engaging with the team + people mentioning us\n\nMany personal brands = company brand.\n\n\n4\ufe0f\u20e3 Content Creation\n\nNobody starts from a blank page.\n\nWe make it as easy as possible for everyone to create:\n\n- Evergreen templates in Notion\n- Every call transcript is stored in one repo\n- Company OS in GitHub with content creation skills\n- Unlimited access to designers for every team member\n- Every company post and 2,000+ curated viral posts stored in Pinecone for RAG\n\nWe also host a quarterly LinkedIn competition with cash prizes.\n\n\n5\ufe0f\u20e3 Content Conversion\n\nEveryone\u2019s efforts feed into the same funnel:\n\n- Capture: connections, engagement (Jungler.ai), website visits (RB2B + Apollo.io), lead magnets (Tally)\n- Enrich and qualify in Clay\n- Cross-check HubSpot to exclude clients and closed-lost\n- Retarget: Instantly.ai for email, HeyReach for DMs, Nooks for calls, and LinkedIn ads\n- Meeting booked in Cal.com\n\n---\n\nWe\u2019re not the only team doing this.\n\nClay, HubSpot and Apollo.io have been doing this for a while.\n\nFreckle.io, Landbase and Twin are growing fast with the same strat.\n\nWhen people book calls with us, they often say:\n\n\u201cI see your content everywhere\u201d.\n\nThat\u2019s impossible with one profile.\n\nA whole team posting is a distribution network.\n\nFull breakdown below \ud83d\udc47 | 49 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQEsHp-xv5tXGA/feedshare-image-high-res/B4EZ.jQ6eCK8AU-/0/1785150548386?e=2147483647&v=beta&t=6q_Y2-aITuUqYShiFS7OWJ7p4TwL9TD8sanYHnT29u4"},"https://www.linkedin.com/posts/vincent-angelo-coach_the-cost-to-live-comfortably-in-the-top-50-share-7487341512796590080-li4m/":{"text":"The cost to live comfortably in the top 50 US metros:\n\n1. Boston, Massachusetts: $347,000\n2. Burlington, Vermont: $325,000\n3. Urban Honolulu, Hawaii: $321,000\n4. Seattle, Washington: $310,000\n5. New York City, New York: $309,000\n6. Portland, Oregon: $299,000\n7. D
