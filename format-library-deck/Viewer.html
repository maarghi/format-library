<style>
  *{box-sizing:border-box}
  :root, :root[data-theme="light"], :root[data-theme="dark"]{
    --bg:#FFFFFF; --rail:#FAFAF9; --card:#FFFFFF;
    --ink:#111110; --ink-2:#606058; --ink-3:#9A9A92; --line:#ECEAE4; --line-2:#DFDDD5;
    --tofu:#476D73; --mofu:#7D7730; --bofu:#CF5E32; --abm:#2C4347; --accent:#C3A981;
    --deep:#123A36; --deep-2:#0E2E2B;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --serif:"Times New Roman",Georgia,serif;
  }
  [data-stage]{--stage:var(--ink)}   /* color-coding removed — clean mono; the post images are the color */
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
  a{color:inherit} button{font-family:inherit;cursor:pointer} .mono{font-family:var(--mono)}

  .app{display:grid;grid-template-columns:212px 1fr;height:100vh;transition:grid-template-columns .28s ease}
  .app.railhidden{grid-template-columns:0 1fr}
  .app.railhidden .rail{opacity:0;pointer-events:none;overflow:hidden;padding:0;border:0}

  /* ---------- side rail: minimal filters ---------- */
  .rail{background:var(--rail);border-right:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:26px;overflow-y:auto;transition:opacity .2s}
  .brand{display:flex;align-items:center;gap:9px}
  .froglogo{width:26px;height:26px;display:block;flex:none}
  .brand h1{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}

  .grp{display:flex;flex-direction:column;gap:2px}
  .grp .gt{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .fi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 0;
    font-size:12.5px;color:var(--ink-2);letter-spacing:.01em;transition:color .12s}
  .fi:hover{color:var(--ink)}
  .fi .dot{display:none}   /* funnel color dots removed for a cleaner menu */
  .fi .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .fi[aria-pressed="true"]{color:var(--ink);font-weight:700}
  .fi[aria-pressed="true"] .nm{box-shadow:inset 0 -2px 0 var(--stage,var(--ink))}
  .labels-scroll{max-height:220px;overflow-y:auto;margin:-2px -4px;padding:2px 4px}
  .lblowner{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin:10px 0 3px;padding-top:8px;border-top:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
  .lblowner:first-child{margin-top:0;padding-top:0;border-top:0}
  .lblowner:hover{color:var(--ink)}
  .lblcaret{font-size:7px;transition:transform .15s;color:var(--ink-3)}
  .lblowner.collapsed .lblcaret{transform:rotate(-90deg)}
  .railfoot{margin-top:auto;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);line-height:1.7}
  .hidtog{color:var(--ink-2);cursor:pointer;text-decoration:underline;text-underline-offset:2px} .hidtog:hover{color:var(--ink)}
  .searchwrap{position:relative}
  .searchwrap input{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:0;font-size:12px;padding:8px 10px 8px 26px;font-family:inherit;color:var(--ink)}
  .searchwrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

  /* ---------- stage: floating coverflow ---------- */
  .stage{position:relative;overflow:hidden;perspective:2400px;background:#FFFFFF}
  .track{position:absolute;inset:0;transform-style:preserve-3d}
  .slide{position:absolute;top:50%;left:50%;width:452px;transform-origin:center center;
    transition:transform .55s cubic-bezier(.22,.68,.16,1),opacity .5s;cursor:pointer}
  .slide.active{cursor:zoom-in}
  /* hover-bump: any non-active card lifts toward you */
  .slide .float{transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s ease}
  .slide:not(.active):hover{z-index:260!important}
  .slide:not(.active):hover .float{transform:translateY(-16px) scale(1.045);box-shadow:0 26px 54px rgba(17,17,16,.20)!important}
  @media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.active .float,.slide:not(.active):hover .float{animation:none;transform:none}}

  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

  /* rail toggle */
  .railtoggle{position:absolute;top:18px;left:18px;z-index:65;width:34px;height:34px;border:1px solid var(--line-2);border-radius:0;
    background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.05);transition:background .12s}
  .railtoggle:hover{background:var(--rail)}
  .app:not(.railhidden) .corner.tl{display:none}

  /* floating funnel + labels underneath the post */
  .underrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:13px;padding:0 4px}
  .underrow > span{background:rgba(255,255,255,.82);backdrop-filter:blur(5px);box-shadow:0 4px 14px rgba(17,17,16,.07);font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;line-height:1.3}
  .ufunnel{color:var(--stage);font-weight:700;border:1px solid color-mix(in srgb,var(--stage) 55%,transparent)}
  .uname{color:var(--ink-2);font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ulabel{color:var(--ink);font-weight:600;border:1px solid var(--line-2)}

  /* queue widget */
  .queuewrap{position:absolute;top:16px;right:20px;z-index:66;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none}
  .queuewrap .queuebtn{pointer-events:auto}   /* only the button catches clicks — posts behind stay clickable */
  .queuebtn{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border:0;border-radius:0;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px;box-shadow:0 6px 18px rgba(17,17,16,.14)}
  .queuebtn b{font-size:12px} .queuebtn:hover{opacity:.92}
  /* ICP field in composer */
  .composer .icp{display:flex;flex-direction:column;gap:5px}
  textarea.promptbox{width:100%;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink);background:var(--rail);border:1px solid var(--line-2);border-radius:0;padding:12px;min-height:150px;max-height:320px;resize:vertical}

  /* nav chevrons */
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:60;width:46px;height:46px;border-radius:0;
    background:var(--card);border:1px solid var(--line-2);color:var(--ink);font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.06);transition:transform .1s,background .12s}
  .nav:hover{background:#fff} .nav:active{transform:translateY(-50%) scale(.94)}
  .nav.prev{left:22px} .nav.next{right:22px}

  /* on-screen arrow indicators (also clickable) */
  .keypad{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:66}
  .kbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:0;
    padding:7px 11px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);box-shadow:0 4px 14px rgba(17,17,16,.05)}
  .kbtn .ar{font-size:11px;color:var(--ink)} .kbtn:hover{background:var(--rail);color:var(--ink)} .kbtn b{color:var(--ink);font-weight:800}
  #kQueue{margin-left:6px;border-left-width:1px}
  #kQueue.on{background:var(--ink);color:#fff;border-color:var(--ink)} #kQueue.on b{color:#fff}
  .app.queuemode .rail{opacity:.35;pointer-events:none}
  @media (max-width:760px){.keypad{display:none}}

  .back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--card);border-radius:0;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink)}
  .back:hover{background:var(--rail)}

  /* corner micro-labels */
  .corner{position:absolute;z-index:55;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);pointer-events:none;line-height:1.7}
  .corner.tl{top:20px;left:24px} .corner.tr{top:20px;right:24px;text-align:right}
  .corner.bl{bottom:20px;left:24px}
  .corner b{color:var(--ink)}

  /* ---------- the card (sharp, floating) ---------- */
  .li-post{--li-bg:#fff;--li-text:#15100c;--li-muted:#5e6670;--li-line:#efe7d6;
    background:var(--li-bg);color:var(--li-text);border:2.5px solid #E7E3DA;border-radius:14px;position:relative;overflow:hidden;
    padding:17px 19px 6px;box-shadow:0 6px 22px rgba(30,20,8,.08);font-family:var(--sans)}
  .slide.active .li-post{box-shadow:0 44px 96px rgba(17,17,16,.18),0 10px 26px rgba(17,17,16,.09);
    max-height:calc(100vh - 220px);overflow-y:auto;overscroll-behavior:contain}   /* leave room for the funnel label + fixed keypad */
  .slide.active .li-post::-webkit-scrollbar{width:0}   /* clean, still scrollable */
  /* side cards share one uniform height (no more ragged deck); content fades at the bottom */
  .slide:not(.active) .li-post{height:440px;overflow:hidden}
  .slide:not(.active) .li-post::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);pointer-events:none}
  .li-open{position:absolute;top:12px;right:12px;z-index:3;width:31px;height:31px;border:1px solid #e5e7ea;background:#fff;

<script>
  /* FAILSAFE — a separate script so even a fatal error in the main app can never leave the
     welcome screen stuck forever. Dismisses it after 5s no matter what. */
  setTimeout(function(){ var w=document.getElementById('welcome'); if(w) w.classList.add('gone'); }, 5000);
  /* DIAGNOSTIC — paint any error onto the screen so it's visible in a screenshot
     (the Apps-Script sandbox hides the console cross-origin). Used for both uncaught
     errors AND the ones the app's own try/catch blocks swallow. */
  window.__showErr = function(msg, where){
    try{
      var w=document.getElementById('welcome'); if(w) w.classList.add('gone');
      var b=document.getElementById('__err');
      if(!b){ b=document.createElement('div'); b.id='__err';
        b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:600 13px/1.5 ui-monospace,monospace;padding:12px 16px;white-space:pre-wrap;max-height:45vh;overflow:auto';
        document.body.appendChild(b); }
      b.textContent += '⚠ ['+(where||'')+'] '+msg+'\n';
      clearTimeout(window.__errT); window.__errT=setTimeout(function(){ if(b&&b.parentNode) b.parentNode.removeChild(b); }, 10000);   // auto-dismiss 10s after the last error
    }catch(_){}
  };
  window.addEventListener('error', function(e){
    window.__showErr((e.message||'error')+'  @'+((e.filename||'').split('/').pop())+':'+(e.lineno||'?'), 'uncaught');
  });
</script>

<script>
const BUNDLED = [{"name":"Anti-process hiring manifesto","library":"millies","lane":"TOFU","archetype":"\"we killed {sacred hiring ritual}\" + what we do instead, doubling as a job ad","hook":"We killed {ritual} at {company}. No {artifact}. No {artifact}. No \\\"{clich\u00e9 test}\\\" questions.\" \u2014 or comp-forward variant: \"We're hiring a {role}. And we're paying ${range} to find our next killer.","skeleton":["The kill statement + staccato list of banished rituals","Why the ritual is now meaningless (a real shift \u2014 e.g., AI assistants break assessments)","What we actually select for, stated as identity (\"we're building products, not algorithms\")","The replacement process, numbered and concrete (projects shown, reference calls)","\"That's it.\" beat \u2014 the brevity is the point","Self-selection close: \"if you can {bar}, we should talk\" + comment prompt"],"examples":[{"url":"https://www.linkedin.com/posts/sugju-choi_we-killed-leetcode-at-virio-no-online-assessments-activity-7397686902839013376-BKpD","meta":"Sugi Choi (Virio), 1,995 reactions / 292 comments, 2025-12-04"},{"url":"https://www.linkedin.com/posts/ericlay-virio_were-hiring-a-head-of-sales-development-activity-7391512082879258626-RMOG","meta":"Eric Lay (Virio), 426 reactions / 112 comments, 2025-11-04 (comp-forward role-post variant: \"$250k\u2013$310k TC\" in line two)"}],"example_text":"We killed LeetCode at Virio.\n\nNo online assessments. No whiteboard problems. No \"reverse a binary tree\" questions. With AI coding assistants everywhere, technical rounds are borderline meaningless now. Anyone can pass them with the right setup of ChatGPT + Claude + Cluely.\n\nWe're not building algorithms at Virio. We're building a product that actual customers pay for and use every day.\n\nI don't need someone who's solved 500 LeetCode hard problems. I need someone who can ship a feature from idea \u2192 design \u2192 code \u2192 production in a week.\n\nThis is what we do instead to find real builders:\n\n1\ufe0f\u20e3 Previous projects: Show us what you've actually built and shipped.\n2\ufe0f\u20e3 Reference calls with your past teammates: We want to hear how you actually performed on a team, not how well you prepped for an interview.\n\nThat's it.\n\nIf you can build, iterate fast, and care about the end user experience more than the perfect algorithm - we should talk.\n\nDrop a comment here if you're interested, let's build real products together.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGMk3q77URyPw/feedshare-shrink_1280/B4EZqndCTOGYAs-/0/1763745998845?e=2147483647&v=beta&t=1OBXL4_tWDRt3EP9OgVSkFGQ_rcvz5g68AeAr2lZGwg"},{"name":"Counterintuitive-investment story","library":"millies","lane":"TOFU","archetype":"\"we spent big on the thing nobody spends on\" reveal with the reasoning receipts","hook":"Confession or contradiction in 1\u20132 stacked lines: \"We were poisoning our employees, and we didn't even know it.\" / \"We raised $38M. Kept our cramped office. Hit 300% capacity.","skeleton":["Shock/contradiction hook","The overlooked problem or expectation everyone holds, with one hard number (CO\u2082 ppm, capacity %)","The mechanism: why the conventional choice is wrong (short, factual lines)","The decision + named specifics (the building, the expert, the sq ft, the desk math)","The anticipated objection voiced (\"people ask me, why would a startup invest in this?\")","Values close: the one-line ROI logic (\"A 30% cognitive gain is worth everything.\") \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/zhu-amanda_we-raised-38m-kept-our-cramped-office-activity-7424845464497336320-2D6K","meta":"Amanda Zhu, 889 reactions / 64 comments, 2026-02-04"},{"url":"https://www.linkedin.com/posts/sebastian-jimenez-690149149_we-were-poisoning-our-employees-and-we-didn-activity-7415087428438376448-oX6V","meta":"Sebastian Jimenez (Rilla), 441 reactions / 44 comments, 2026-01-08"}],"example_text":"We raised $38M. Kept our cramped office. Hit 300% capacity. Now we're moving in a space we designed.\n\nWhen we closed our Series B, everyone expected us to upgrade immediately.\nWe didn't.\n\nWe kept adding desks.\nSqueezed in phone booths.\nPut people wherever they fit.\n\nAt one point, we had 30 people and 1 bathroom.\nWe hit 300% over capacity.\n\nNow we're moving into a space 5x larger.\nEvery detail we couldn't control before, we designed this time.\n\nWe didn't stay in the old office just to be scrappy.\n\nIt was about priorities.\nBuild the product.\nHire the team.\nThen build the space.\n\nWe're ready now.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5610AQHBh2lZ2o-KEg/image-shrink_800/B56ZwpZmm7KEAg-/0/1770221104736?e=2147483647&v=beta&t=0hmiyY0_Tf6KtUxXUwFFIcbZYhGWuQayFdx0QrrNgaI"},{"name":"Culture line-in-the-sand","library":"millies","lane":"TOFU","archetype":"polarizing culture manifesto that deliberately filters the audience","hook":"Quoted outrage or inverted clich\u00e9: \"\\\"SHOVE YOUR JOB UP YOUR AZZ\\\" \u2014 worst and best line I heard from a candidate.\" / \"We at {company} don't believe in 996 \u2014 we only work when we want to work.","skeleton":["Polarizing hook (a quote, a heresy, or a both-sides paradox)","Name the practice plainly, no euphemism (\"yes, we do 996, 9am-9pm, 6 days\")","Stage the two reactions the post will get (pre-empting the comments)","The filter logic: who this is for, who it isn't, and why that's the point","Honest concession beat (the cost, the caveat \u2014 \"we know this isn't sustainable forever\")","Self-selection close (\"if you read this and thought X \u2014 we should talk\") \u2014 follow-level CTA max"],"examples":[{"url":"https://www.linkedin.com/posts/sugju-choi_shove-your-job-up-your-azz-worst-and-best-activity-7407476497453809664-7-DF","meta":"Sugi Choi (Virio), 591 reactions / 372 comments, 2025-12-18"},{"url":"https://www.linkedin.com/posts/james-k-he_we-at-artificial-societies-dont-believe-activity-7378391641730023424-NDkB","meta":"James He (Artificial Societies), 291 reactions / 44 comments, 2025-10-08"}],"example_text":"\"SHOVE YOUR JOB UP YOUR AZZ\"\n\nWorst and best line I heard from a candidate I interviewed. Yes, we do 996 which means working 9am-9pm, 6 days a week.\n\nIt's funny because there are two extremes of how people react when I say that. They either say:\n\n> \"you're a slave, a victim of capitalism and hustle culture, your CEO is exploiting you!!! shove that job up your azz\"\n\nor:\n\n> \"oh man I do that already lol\"\n\nThe reason why we keep it transparent is because we're looking for those people.\n\nPeople who've run their own business or started their own startup get it. Building something from nothing is extremely hard. It demands sacrifice, obsession, and an unreasonable amount of hours.\n\nThat doesn't mean you're literally chained to your desk for 12 hours a day. It means putting in your best effort - 100%, 120%. But saying \"996\" is the best filter.\n\nWe're not trying to convince anyone this lifestyle is for them. If your gut reaction is the first one - respect. Genuinely. That boundary is valid.\nBut if you read 996 and thought \"yeah that's just Tuesday\" - we should talk.\n\nAnd look - we know this isn't sustainable forever. As the team grows, the pace will change. 996 is an early-stage reality, not a long-term culture. The goal is to earn the right to slow down by building something that works first.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQF_tcqkRBrl4g/feedshare-shrink_1280/B56ZsyknsyGkAs-/0/1766080019623?e=2147483647&v=beta&t=ff5QftlhFzMWxvXnDnhZsmVAcjcE0hPuiyB70ls4EV0"},{"name":"Curated people roundup","library":"millies","lane":"TOFU","archetype":"trend claim proven by a roll call of named people, each with their mini-story and stats","hook":"{Group} is taking over {platform}.\" + one-line why (\"They're ditching the corporate fluff, saying what they actually think\").","skeleton":["Trend claim hook + the behavioral why","(Optional) self-aware bridge (\"where the rest of us learned to play it safe, they're just being real\")","The roster: 3\u20136 people, each \"Name - origin story, what they did, current stat\" (followers, role, outcome)","Mechanism take (compressed variant): why the platform actually rewards this","Implication close: what this means for everyone else \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/sugju-choi_gen-z-is-taking-over-linkedin-theyre-ditching-activity-7404577917948866561-uOXa","meta":"Sugi Choi (Virio), 773 reactions / 194 comments, 2026-01-10"},{"url":"https://www.linkedin.com/feed/update/urn:li:activity:7421967518896009216","meta":"Anjali Dhaliwal (\"TikTokers are taking over LinkedIn\"), 128 reactions / 29 comments, 2026-02-01 (compressed variant: 3 creators + mechanism take. Millie's bank files this post under \"List ABM\"; it's specced here because it's a generic creator roundup with no named-account target \u2014 it passes the TOFU admission test, not the abm one.)"}],"example_text":"Gen Z is taking over LinkedIn.\n\nThey're ditching the corporate fluff, saying what they actually think, and building in public without the ego. It's refreshing. Where the rest of us learned to play it safe, they're just being real. I've connected with some incredible people recently who are redefining what it means to show up on this platform.\n\nWilman Chan - Started on LinkedIn because his high school banned every other social media except LinkedIn. He came for the games (shoutout to the Moonshots team for making bangers - Rushabh S.!!), stayed for the content, and ended up growing to 18k+ followers and landing a role at a YC startup in SF.\n\nMax Rascher - Started posting at 19 to make money \ud83e\udd11. Now he's at 120k+ followers and puts out some of the best content on how to actually use AI tools. He flew from Madrid to SF 2 months ago to join one of the hottest startups (guess where :p)\n\nMorgan Young - Started posting as a creative outlet. Her tech job was super technical, and LinkedIn became her way to express a different side of herself. Back then, barely anyone was creating content here. Now she's a LinkedIn Top Voice \ud83e\ude75\n\nYanni Pappas - Started posting as a BDR and realized something: having real, human conversations with buyers through his content led to way more demos than cold pitches ever did. Proof that being genuine beats being salesy.\n\nKevin Lee - Came from YouTube and TikTok [...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQGjwrqTbGs67w/feedshare-shrink_800/B56ZsJYYIkH8Ak-/0/1765388944693?e=2147483647&v=beta&t=Reo-09BvbVH8nLP1pnoH-tkAXa7f4MSzB2M5qfeRxXo"},{"name":"Dear-teammate letter","library":"millies","lane":"TOFU","archetype":"public open letter to your own co-founder or teammate, epistolary format","hook":"Dear {first name}, / I don't talk about this publicly as much as I should: {the tribute thesis}.","skeleton":["\"Dear {name},\" salutation + confession-of-underexpression hook","The core quality, named concretely (trust, standards) with one behavioral proof","\"This might sound unremarkable, but it's rare\" \u2014 contrast with the failure mode others have","2\u20133 short tribute beats, each a paired-opposites observation (\"You say yes / I say no\")","The hardest-thing-we-survived beat (pivot, crisis) as ultimate proof","Gratitude close + signed \"From, {name}\" \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/sahajgarg_dear-tanay-i-dont-talk-about-this-publicly-activity-7429185333646381056-8Wtr","meta":"Sahaj Garg (Wispr), 454 reactions / 28 comments, 2026-02-16"},{"url":"https://www.linkedin.com/posts/kylelacy_lilo4life-share-7454255203848986624-9SWQ","meta":"Kyle Lacy, \"best marketing leadership teams\" tribute"}],"example_text":"Dear Tanay,\n\nI don't talk about this publicly as much as I should: working with you is one of the best parts of building Wispr.\n\nThe foundation of our working relationship is deep trust. When problems arise (and they arise constantly in any startup) there's never a question of whose fault something is. It's always: we both see the issue, now how do we solve it together.\n\nThis might sound unremarkable, but it's rare. Most co-founder relationships fracture under stress because when things break, people start assigning blame or questioning each other's judgment. You and I have never fallen into that pattern.\n\nYou hold yourself to standards that I've never seen anyone else maintain. If we're going to ask extraordinary things from the people we work with, we have to hold ourselves to even higher standards. You do this consistently, and it sets expectations for the entire company.\n\nWhat I value most is that you care about what matters beyond just the company. You've been completely supportive of me being present for my family however I need to be, and I appreciate it more than maybe I've been vocal about before. [...]\n\nI'm grateful every day that I get to do this with someone I trust at this level.\n\nFrom, Sahaj","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E10AQEz8EDq3OvC7Q/image-shrink_800/B4EZxnEsKCHsAk-/0/1771255810062?e=2147483647&v=beta&t=oyxqzPgvU0xtlK6nRMRx9MjMhj1PwocZ_6hkwd5lijc"},{"name":"Founder reintroduction","library":"millies","lane":"TOFU","archetype":"milestone-triggered \"let me reintroduce myself\" life story","hook":"After being head-down for {n} years building {company} and {credibility stat}, I think it's time to reintroduce myself.\" / \"I haven't posted much here, but that's about to change. Let me reintroduce myself.","skeleton":["Milestone hook + \"reintroduce myself\" declaration","\"Hi, my name is {name}\" beat (disarmingly plain)","3\u20135 origin-story chapters, each with one hyper-specific detail (a number, a place, a failure)","The turn: the lesson that led to the current company","Present-day proof block (what we've built, one stat)","Forward-looking close (\"here's what you can expect from me\") \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/sahajgarg_after-being-head-down-for-the-last-4-years-activity-7422300948653539329-IQd-","meta":"Sahaj Garg (Wispr), 968 reactions / 43 comments, 2026-01-28"},{"url":"https://www.linkedin.com/posts/andrewwarner_i-havent-posted-much-here-but-thats-about-activity-7343263114718547972-jtxT","meta":"Andrew Warner (Bootstrapped Giants), 893 reactions / 227 comments, 2025-06-24"}],"example_text":"After being head-down for the last 4 years building Wispr and raising over $81M in funding, I think it's time to reintroduce myself.\n\nHi, my name is Sahaj.\n\nBefore building Wispr, I spent my sophomore year of undergrad at Stanford treating research like a mini-PhD. 50 hours a week in the lab while neglecting most of my actual coursework.\n\nWhat was I spending these 50 hours a week on? Researching and writing one of the earliest papers at Stanford on diffusion-based generative models.\n\nBack then, we had this bet: if you could represent image data in a more intuitive way, the model would be way easier to train and work better.\n\nIt barely worked when we were building it. Now it's the foundation of every major image generation model.\n\nFrom Jersey kid doing math competitions and neuroscience research on rhesus macaques, to quant trading (hated it - people coin-flipped $20 bills for fun because it nets zero), to Google ML fairness work that's now deployed in YouTube.\n\nBetween undergrad quarters, I walked the Camino de Santiago, 500 miles across northern Spain. Did a 10-day silent Vipassana retreat.\n\nThe big takeaway: learning via experience, wisdom not just knowledge, is the only way to actually understand anything.\n\nThat pushed me to join my first startup.\n\nOptical computing company, $100M raised, eventually shut down. Learned a critical lesson: I could see the product was off track but wasn't senior enough to make the case for pivoting.\n\nComing out of that, I knew what mattered: solving a problem I actually care about, with someone I love working with. [...]\n\nLooking forward to the next 4 years with our amazing team","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E10AQFQpkNBRHtc6g/image-shrink_800/B4EZwFPYX.IkAg-/0/1769614444815?e=2147483647&v=beta&t=P0e6KzT2kaEGa7reKEfIWRz0grPW46f_MTSUMRO6xXo"},{"name":"Hire-as-proof story","library":"millies","lane":"TOFU","archetype":"one specific hire narrated as evidence of how the company thinks","hook":"We just hired {company}'s first {role}. Here's an inside look at {the process/what happened}.\" / \"We hired a {unexpected credential} who {unexpected specialty}. Within {timeframe}, {concrete result}.","skeleton":["The hire, stated with its surprising element + a concrete payoff number if available","Why this hire was hard/unusual (what they turned down, what you tested for)","The process or test, in real detail (the exercise, the interviews, the criteria)","\"But here's where it gets interesting\" turn \u2014 what the hire did after joining","The principle: what this says about how you hire/build \u2014 no CTA (the post recruits by itself)"],"examples":[{"url":"https://www.linkedin.com/posts/vaanand_we-just-hired-clays-first-head-of-sales-activity-7393654948212928512-f2Vy","meta":"Varun Anand (Clay), 1,787 reactions / 138 comments, 2025-11-10"},{"url":"https://www.linkedin.com/posts/antonosika_3-months-ago-anton-m%C3%B6ller-decided-to-leave-activity-7413613735182823424-sIQe","meta":"Anton Osika (Lovable), 1,064 reactions / 52 comments, 2026-01-04"},{"url":"https://www.linkedin.com/posts/sahajgarg_we-hired-a-berkeley-linguistics-phd-who-studies-activity-7423026712566890497--KwI","meta":"Sahaj Garg (Wispr), 622 reactions, 2026-01-30"}],"example_text":"We just hired Clay's first Head of Sales. Here's an inside look at what the interview process looked like (and the take-home prompts I think other teams might find helpful):\n\nAs you can imagine, I know a lot of sales leaders! In fact, it's my day job to meet them. So you can believe me when I say I knew Becca Lindquist was special the first time we met.\n\nLet's start with what I was looking for:\n\n1. Philosophical alignment: We approach sales differently at Clay. We hire GTM engineers to sell Clay in a highly consultative process that prizes product knowledge and customer empathy over traditional sales backgrounds. We have a low-pressure, fit-oriented approach.\n\n2. People leadership and process: Our org is scaling quickly, and we need someone to come in and build a system that can help us scale, not just win based off force of will and charisma.\n\nHere was the interview process:\n\nFirst, I set up multiple behavioral interviews for Becca on sales process and people management with sales leaders at customers we trusted (thank you Dannie Herzberg and Stevie Case!). Then we did a deep dive interview where we went through every role in her career in great detail. We also asked her to complete a take-home with the following instructions:\n\n- Current State: We'll share Gong calls, written docs, closed/won + pipeline data, and would love to see what you come back with in terms of top 5 opp[ortunities...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E10AQHxARMK4X7Hwg/image-shrink_800/B4EZpuJ_w1J0Ag-/0/1762784706562?e=2147483647&v=beta&t=6buECVIh-iRIky80QKdpHEg8Hag3KTspRK2fFXJwfhQ"},{"name":"Hiring-list roundup","library":"millies","lane":"TOFU","archetype":"ALL-CAPS utility list of companies matching one screenable trait (just raised / fastest growing / new unicorns), each with a one-line descriptor","hook":"{TRAIT} ({HIRING LIST}) \u2014 all caps. Second line: 'All {n} of these companies are {trait} and actively hiring:'","skeleton":["ALL-CAPS trait + \"(HIRING LIST)\" hook","One-line scope statement with the count","The list: numbered, each entry \"Name - what they do (location)\" \u2014 20\u201340 entries","(Optional) how-to-use or follow prompt at the tail"],"examples":[{"url":"https://www.linkedin.com/posts/benmlang_fastest-growing-teams-hiring-list-new-activity-7416870709332803584-qUuA","meta":"Ben Lang, 469 reactions / 41 comments, 2026-02-01"},{"url":"https://www.linkedin.com/posts/benmlang_companies-that-just-raised-10-50m-hiring-activity-7413979426264186880-eXTf","meta":"Ben Lang, 454 reactions / 44 comments, 2026-02-01"}],"example_text":"FASTEST GROWING TEAMS (HIRING LIST)\n\nNew list of 37 startups who've recently hired the most people:\n\n1) Wonderful - enterprise AI agents (Global)\n2) OpenFX - cross-border FX payments (Bangalore / US remote / London)\n3) Genspark - AI workspace (Bay Area / Tokyo)\n4) Willow - AI voice dictation app (Bay Area)\n5) Lucis (YC X25) - biomarker-based preventive health guidance (Paris)\n6) Generation Lab - biological age testing (Bay Area / Remote)\n7) Tempo - payments-first blockchain (Bay Area / NYC / US remote)\n8) CoreStory - AI codebase intelligence (US remote)\n9) Provision - AI plan review for construction (Toronto)\n10) TwinMind - AI meeting assistant (Bay Area)\n11) Perle - AI training data platform (Global remote)\n12) Lyceum - GPU orchestration tool (Zurich / Berlin / Munich)\n13) Bespoke Labs - data curation for AI agents (Bay Area)\n14) Terranova - robotic land-lifting (Bay Area)\n15) Social Agent - on-demand certified content creators (LA / NYC / Miami)\n16) Earthful.me - plant-based nutrition supplements (Mumbai / Hyderabad)\n17) Fermi America - private power grids (Amarillo / Dallas)\n18) YO - cross chain DeFi yield optimizer (US timezone remote)\n19) 1mind - AI for revenue teams (Bay Area / US remote)\n20) Arbio - AI vacation rental management (Berlin)\n[... continues through 37]","linkOnly":false,"note":"","labels":[]},{"name":"Milestone momentum announcement","library":"millies","lane":"TOFU","archetype":"raise/quarter/ARR announcement structured as gratitude + momentum receipts, closing on a movement line","hook":"{Company} just raised ${n} at a ${n} valuation.\" / \"We just raised another ${n} after {growth stat}. The crazy part is this almost never happened.","skeleton":["The milestone, stated flat with the numbers","(Optional origin detour \u2014 Tanay variant: the 17-years-ago story that makes the milestone a payoff)","Gratitude ledger: users \u2192 team \u2192 investors, each with a concrete stat or name","Proof-of-momentum block (retention, Fortune 500 count, visits \u2014 3\u20135 stats)","Movement close: one line that makes it about the era, not the company \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/antonosika_lovable-just-raised-330m-at-a-66b-valuation-activity-7407404663626649600-cQAZ","meta":"Anton Osika (Lovable), 11,995 reactions / 581 comments, 2025-12-18"},{"url":"https://www.linkedin.com/posts/tankots_we-just-raised-another-25m-after-10xing-activity-7397302293429268480-Yf3H","meta":"Tanay Kothari (Wispr), 3,291 reactions / 562 comments, 2025-11-20"},{"url":"https://www.linkedin.com/posts/carlesreina_q2-was-unique-at-elevenlabs-we-had-share-7480216645743972352-uOvi","meta":"Carles Reina (ElevenLabs) quarterly-roundup variant, 445 reactions, 2026-07-07"}],"example_text":"Lovable just raised $330M at a $6.6B valuation.\n\nIt's been an iconic, insane, wonderful journey so far.\n\nThank you to everyone who made this possible:\n\nThe millions of people who build with Lovable. It started with individuals building tools. Now some of the world's largest enterprises trust Lovable \u2013 and apps built with Lovable \u2013 with their data. Apps built with Lovable have gotten over half a billion visits combined in the last 6 months.\n\nThe Lovable team: 120 of the most talented people I've ever met. Including people who moved across the world to help us build a generational company from Europe. They're the reason Lovable has become a product trusted by millions.\n\nThe investors backing Lovable. Lovable's $330M fundraise was led by CapitalG and Menlo Ventures' Anthology fund. Additional investors include the venture arms of leading companies building the future of work: NVentures (Nvidia), Salesforce Ventures, Databricks Ventures, T. Capital (Deutsche Telekom), Atlassian Ventures, and HubSpot Ventures. They're joined by Khosla Ventures, DST Global, EQT Growth, Kinship Ventures, and returning investors Accel, Creandum, and Evantic.\n\nNow with Lovable, anyone can build million-dollar companies and products trusted by the world's largest enterprises.\n\nThis is the age of the builder.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E10AQFdmUCCeNMpOA/image-shrink_800/B4EZsxjSKgIUAg-/0/1766062892979?e=2147483647&v=beta&t=cZCTQW0z9RJuXld_pJ6YdIIT2UPWWqQQTVKUTbMFG3Y"},{"name":"New-joiner announcement","library":"millies","lane":"TOFU","archetype":"\"I've joined {company}\" told as a personal path story, closing on gratitude + an open door","hook":"Excited to share that I've joined {company}.\" then immediately: \"My path into {field} wasn't planned at all.","skeleton":["The announcement, one plain line","The unplanned-path story: 2\u20133 chapters of how they got here (jobs, pivots, moves)","The conviction beat: the moment this company/city/scene felt right","Named gratitude (founders, people who made it happen)","Open-door close: \"if you're working in {space}, would love to connect\" \u2014 connection-level CTA"],"examples":[{"url":"https://www.linkedin.com/posts/gracelee5332_excited-to-share-that-ive-joined-virio-as-activity-7383202064786579458-Ke_6","meta":"Grace Lee (Virio), 309 reactions / 85 comments, 2025-10-12"},{"url":"https://www.linkedin.com/posts/jeremyro_im-excited-to-share-that-ive-joined-virio-ugcPost-7381417662683328513-xLuy","meta":"Jeremy Ro (Virio)"}],"example_text":"Excited to share that I've joined Virio.\n\nMy path into startups wasn't planned at all.\n\nI started doing marketing work for a real estate firm, which evolved into partnering with the CEO to build internal tools and eventually, products for the broader proptech industry. I entered the game without knowing what I'm getting myself into.\n\nBut those years taught me invaluable lessons. And that's exactly why I moved from Seattle to LA. I wanted to be in the thick of it, learning by doing.\n\nIt wasn't until I came to SF that it felt like this is where I need to be.\n\nI thought building my own startups was the ultimate challenge, but being here has shown me there are always new limits to push. Every day brings a new lesson and it's been more exciting than ever.\n\nI'm excited to be working with the Virio team, and special shoutout to co-founders Eric Lay and Emmett Chen-Ran for believing in me and making this opportunity possible.\n\nI am more than thrilled to start this new chapter and to connect with more builders in the city.\n\nIf you're working in the GTM space in SF, would love to connect!","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQFBsGCfTiv4iw/feedshare-shrink_1280/B56ZnZnJlAHUAs-/0/1760292544133?e=2147483647&v=beta&t=uk3s3D9Ktw0KirZIG2tl_a6_CmudTHiQgZvagyAgYgs"},{"name":"News clapback take","library":"millies","lane":"TOFU","archetype":"fresh industry news + a sharpened contrarian or ironic read the coverage missed","hook":"The news compressed into one ironic sentence: \"Anthropic just bought a Super Bowl ad to say they'll never run ads.\" / \"Claude just posted a $320k/year ghostwriter position.","skeleton":["One-line ironic news compression (the whole take is latent in the hook)","The concrete details of the news (the ad's plot, the job listing's terms) \u2014 prove you actually looked","The pivot: \"here's what makes it really smart / hilarious\" \u2014 the layer others missed","The underlying principle, argued in 2\u20133 beats (why this matters beyond the news)","Implication-for-you close or a quoted line that lands the theme \u2014 soft comment prompt at most"],"examples":[{"url":"https://www.linkedin.com/posts/bjhguerin_anthropic-just-bought-a-super-bowl-ad-to-ugcPost-7424874098679304193-AT25","meta":"Ben Guerin, 1,011 reactions / 57 comments, 2026-02-10"},{"url":"https://www.linkedin.com/posts/ericlay-virio_claude-just-posted-a-320kyear-ghostwriter-activity-7395151060652433408-58Vl","meta":"Eric Lay (Virio), 563 reactions / 132 comments, 2025-11-14"}],"example_text":"Anthropic just bought a Super Bowl ad to say they'll never run ads.\n\nThere are four spots in the campaign. This one's my favourite.\n\nA guy doing pull-ups asks how to get a six-pack. Good advice at first, then it pivots into a pitch for insoles so \"short kings can stand tall.\"\n\nPunchline: \"Ads are coming to AI. But not to Claude.\"\n\nThree weeks ago OpenAI announced ads in ChatGPT. Anthropic's response? Spend millions on the biggest ad slot in the world to say they'll never do the same.\n\nMother absolutely nailed the creative. Too many tech brands default to bland purpose-driven nonsense, or worse: a laundry list of features.\n\nThis differentiates on something real, highlighting a product decision that actually matters to users.\n\nBut here's what makes it really smart.\n\nAnthropic's argument isn't just \"ads are annoying.\" It's that AI conversations are fundamentally different to search or social. People share more with a chatbot than they ever would with Google. Ads in that context don't just interrupt, they erode trust.\n\nAnd this line from their blog stuck with me: \"The most useful AI inte[rface...]","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D5605AQEOSHBfH8BNrw/thumbnail-with-play-button-overlay-high/B56ZwpzpyIKEDU-/0/1770227933889?e=2147483647&v=beta&t=3rMq52qSiZxyPolJEOgN1x0HT6038QrxsPY6h7Eaf4o"},{"name":"Open feedback bounty","library":"millies","lane":"TOFU","archetype":"insider asks the audience for unfiltered criticism of their own platform/product, with a bounty for the best answer","hook":"Hey {audience}! I'm {insider credential} \u2014 and I want your UNFILTERED feedback. What do you HATE the most about {thing}?","skeleton":["Direct-address hook with insider credential + the blunt question","Persona roll-call (\"whether you're a: recruiter / founder / job seeker / creator...\") \u2014 everyone finds their line","Permission beat (\"doesn't matter why you're here \u2014 I wanna know what frustrates you\")","Commitment beat (\"I'll read every single one - even the spicy ones\")","Bounty close: a concrete prize for the best answer"],"examples":[{"url":"https://www.linkedin.com/posts/sugju-choi_hey-linkedin-im-linkedins-one-of-the-first-activity-7419070510862319616-tSUL","meta":"Sugi Choi (Virio; the post role-plays a LinkedIn insider \u2014 the bank titles it \"Joined LinkedIn\"), 1,627 reactions / 960 comments, 2026-01-19"}],"example_text":"Hey LinkedIn! I'm LinkedIn's one of the first ever Product Builder - and I want your UNFILTERED feedback.\n\nWhat do you HATE the most about LinkedIn?\n\nWhether you're a:\n> recruiter or a founder looking for the right talent\n> job seeker hunting for opportunities\n> creator building your personal brand\n> developer sharing your work\n> or just here to network\n\nDoesn't matter WHY you're here, but I wanna know WHAT frustrates you the most.\n\nLeave a comment below, I'll read every single one - even the spicy ones.\n\nBonus - I will give 6 month of FREE LinkedIn premium ($180 worth) to the best suggestion! \ud83d\udc97","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQFK9bz6nxNQUQ/feedshare-shrink_800/B56ZvXVUIPIcAg-/0/1768844248372?e=2147483647&v=beta&t=CVEHReg_C4eQp5KbR4uNbFzOaYorLutqdQF_Lrnh4X4"},{"name":"Setback-to-breakthrough timeline","library":"millies","lane":"TOFU","archetype":"staccato year-by-year rejection ledger that flips to a win, then universalizes","hook":"{year}: {rejection/low point}\" repeated as a ledger, ending \"{year}: {the win, with a number}\". Two-line variant: \"2024: close to quitting on my business / 2025: huge breakthrough and made it our most successful year","skeleton":["The ledger hook (3\u20136 dated lines, worst first, win last)","One-line reframe: what the gap actually was (\"wasn't luck... 6 years of compounding effort\")","(Long variant) the behind-the-scenes chapters: what changed, with sacrifices itemized","Direct address to the reader living the ledger's early years","Aphoristic-but-earned close (\"Rejections \u2260 the end. Just keep building!\") \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/daniel-dhawan_2019-i-was-rejected-by-yc-for-the-first-activity-7430271916046790656-c8Ao","meta":"Daniel Dhawan (Rork), 1,699 reactions / 196 comments, 2026-02-19"},{"url":"https://www.linkedin.com/posts/rachael-higgins-becauseofmarketing_2024-close-to-quitting-on-my-business-2025-activity-7413919456810176515-f_Ya","meta":"Rachael Higgins (Because of Marketing), 415 reactions / 171 comments, 2026-01-05"}],"example_text":"2019: I was rejected by YC for the first time\n2021: I was rejected by YC 2 times\n2022: I was rejected by YC 2 times\n2023: I was rejected by YC 2 times\n2024: I was rejected by YC 2 times\n2025: I raised $3M+ led by a16z speedrun\n\nThe gap between rejection \u21169 and acceptance wasn't luck. It was 6 years of compounding effort that finally broke through.\n\nTo every founder collecting rejection emails right now:\nRejections \u2260 the end. Just keep building!","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQHuSZUCgDTPFw/feedshare-shrink_800/B56Zx2g7vvJAAk-/0/1771514871204?e=2147483647&v=beta&t=gVQ2WWcjsc_4p1hKrQGsUIPhVyoui3x3X3GMrcbrlJ0"},{"name":"Aphorism flip","library":"virio","lane":"TOFU","archetype":"Contrarian two-beat aphorism + arrow-list of consequences","hook":"Don't choose {the obvious thing}. Choose {the overlooked thing}.","skeleton":["Two-beat flip hook","One line deflating the obvious thing (\"A job is a paycheck and a salary.\")","\"But {the overlooked thing} determines:\" + arrow list (\u21b3) of 4\u20136 stakes","One-line dark consequence of choosing wrong","Aphoristic restatement closer tying to received wisdom (\"People don't leave companies\u2026 they leave managers\")"],"examples":[{"url":"https://www.linkedin.com/posts/lindale20_dont-choose-a-job-choose-a-manager-a-activity-7263235531411501056-_JV6","meta":"Linda Le, 62,028 reactions / 2,253 comments, 2024-11-15"},{"url":"https://www.linkedin.com/posts/jgirdhar_stop-chasing-a-dream-job-start-demanding-activity-7350019958627524609-VXSf","meta":"Jitender Girdhar, 15,339 reactions / 387 comments, 2025-07-12"}],"example_text":"Don't choose a job. Choose a manager.\n\nA job is a paycheck and a salary.\n\nBut a manager determines :\n\n\u21b3 Your mental health\n\u21b3 Your promotions\n\u21b3 Your career growth\n\u21b3Your work-life balance\n\u21b3 Your best interest\n\nA toxic manager will demote not only your career, but your physical, emotional, and mental health.\n\nPeople don't leave companies, jobs, or cultures, they leave their managers because a manager determines everything from day 1 \u2764\ufe0f","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQEj_S6QJGpHcw/feedshare-image-high-res/feedshare-image-high-res/0/1731690294370?e=2147483647&v=beta&t=hv-6W-OP8MIQF9oMkU-vktdGJdYicXiwku-9FLSmpTA"},{"name":"Award humility origin","library":"virio","lane":"TOFU","archetype":"Public honor accepted, then immediately converted into the messy origin story","hook":"Thank you {institution} for {honor}!!! I am deeply honored!\" \u2192 immediate reframe (\"As a {unexpected identity}, I am also proud to be {the outlier angle}\")","skeleton":["Gratitude + the honor, named","The outlier reframe (oldest on the list, \"not in spite of my age but because of it\")","The thesis it proves (\"it's never too late\")","Origin flashback: the unglamorous why (\"just trying to pay our bills\")","The messy middle, in painful specifics (pep talks, deleting posts, hundreds of drafts)","Direct address turn: \"So here's my message to you:\"","The takeaway line (\"There is no secret formula. It's you against you.\")"],"examples":[{"url":"https://www.linkedin.com/posts/melrobbins_time100creators-activity-7349156993175101442-wWA1","meta":"Mel Robbins (TIME100), 31,811 reactions / 1,644 comments, 2025-07-10"},{"url":"https://www.linkedin.com/posts/mo-abudu_this-post-isnt-about-boasting-its-about-activity-7332703295074938880-xS7Y","meta":"Mo Abudu (EbonyLife Group), 13,330 reactions / 1,465 comments, 2025-05-26"}],"example_text":"Thank you TIME for naming me as  one of the \u201cTitans\u201d on your first-ever TIME100 Creator List!!! I am deeply honored!\n\nAs a 56-year-old woman, I am also proud to be one of the oldest people on the list, not in spite of my age but because of it.\n\nIt proves what I say to you every week on The Mel Robbins Podcast: it\u2019s never too late and you\u2019re never too old to start creating the life you\u2019ve always wanted.\n\nWhen I started posting online back in 2012,  I wasn\u2019t \u201ctrying\u201d to go viral. I was just trying to book a few speaking gigs so I could pay our bills and get out of debt. That\u2019s it. Just me, a married mother of 3, hoping someone would take me seriously and hire me.\n\nIn the beginning, every post felt cringey.\n\nEvery. Single. Post.\n\nI\u2019d spend hours crafting the \u201cperfect\u201d thing. I\u2019d have to give myself a 10-minute pep talk before hitting \u201cpost,\u201d and when I finally did it, I\u2019d then check it obsessively. Five minutes would pass, and if the likes or comments weren\u2019t what I was hoping for, my insecurity would kick in and I\u2019d delete it.\n\nI created hundreds of draft posts...and they would just sit there, staring back at me for years.\n\nSo here\u2019s my message to you:\n\nThere is no secret formula.\n\nIt\u2019s you against you. The only difference between you and most of us on the #TIME100Creators list is that, despite how cringey it felt in the beginning, we got started and kept going. Day after day. Year after year. And in my case, 13 years later, here I am\u2026  And that\u2019s how you\u2019re going to change your life, too.\n\nSo start now. Even if you\u2019re afraid of what people might think. \n\nIn fact, just use The Let Them Theory.\n\nIf they roll their eyes? Let Them. \nIf they judge you? Let Them.\n\nYou\u2019re not creating for them...\nYou\u2019re building something for YOU.\n\nYou don\u2019t need to be perfect. You need to begin.\n\nYour future self will thank you, and so will I.\n\nAnd in case no one else tells you, as your friend, I want to tell you that I love you and I believe in you and your ability to create a better life. Forcing yourself to do the things that you don\u2019t feel like doing is exactly how you do it. Xo Mel\n\nAnd a huge shoutout to everyone on the list and who is inspired to be creating \ud83d\udc9a","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQEA4YjI6TxSEw/feedshare-image-high-res/B56Zf1zVdvHYA0-/0/1752175565490?e=2147483647&v=beta&t=Xv35FPG_04nLajtq6o6n8QjJ_uEnLWPG5Bqt_sqJXSw"},{"name":"Cinematic values story","library":"virio","lane":"TOFU","archetype":"Micro-story of ordinary people under pressure \u2192 values takeaway","hook":"In the middle of {crisis}, {ordinary people} chose not to {expected self-preserving act}.","skeleton":["One-line scene: crisis + the surprising choice","Staccato escalation (\"They chose to stay. / To protect. / To do the job\u2026\")","Reframe line: \"That's not just {profession-word}. That's {value} in its rawest form.\"","Zoom-out reflection (2 lines, no applause/no spotlight framing)","\"Bottomline:\" aphorism closer","Hashtags (3\u20135, values-flavored)"],"examples":[{"url":"https://www.linkedin.com/posts/sohailzindani_integrityinaction-leadership-everydayheroes-ugcPost-7312093941728735232-pjLd","meta":"Sohail Zindani, 269,920 reactions / 7,523 comments, 2025-03-31"},{"url":"https://www.linkedin.com/posts/zen-sammich_the-kings-guard-guides-his-horse-closer-activity-7227143221699616769-6SKX","meta":"Mark Reid, 67,227 reactions / 1,554 comments, 2024-08-08"}],"example_text":"In the middle of a violent earthquake, nurses in a childcare room chose not to run.\n\nThey chose to stay.\nTo protect.\nTo do the job they promised to do\u2014even when death felt closer than safety.\nThat's not just professionalism.\nThat's integrity in its rawest form.\n\nA reminder that real commitment shows itself when the stakes are highest.\nNo applause. No spotlight. Just courage.\n\nThey didn't just save lives. They showed us how to live.\n\nBottomline: When the ground trembles, character stands still.\n\n#IntegrityInAction #Leadership #EverydayHeroes #UnshakableFaith","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4D05AQHJnipt9ejMPA/thumbnail-with-play-button-overlay-high/B4DZXnGsnJHIDI-/0/1743339060767?e=2147483647&v=beta&t=hCBhF-kuvSFEtq5awjbmH_JS79PAaMAmbFq6GnbUdo0"},{"name":"Cost-breakdown satire","library":"virio","lane":"TOFU","archetype":"Provocative first-person number breakdown with a straight face","hook":"I {enviable status stat} and it's utterly {complaint}. Let's break it down.","skeleton":["Enviable-status hook + deadpan complaint","\"Let's break it down.\"","Itemized line-item list, each with a real-looking number; one or two absurd items buried in the middle (the tell)","Total line","Deadpan conclusion restating the complaint with the numbers","One-line rhetorical closer (\"What is wrong with this city?\")"],"examples":[{"url":"https://www.linkedin.com/posts/austinnasso_i-make-340000-per-year-in-san-francisco-activity-7286518738101698560-r7F1","meta":"Austin Nasso, 95,033 reactions / 26,316 comments, 2025-01-18"},{"url":"https://www.linkedin.com/posts/hoogvliets_i-make-250000-per-year-in-amsterdam-as-activity-7312787123248484352-6Dut","meta":"Rapha\u00ebl Hoogvliets (Amsterdam \u20ac250k variant, h/t Nasso), 1,890 reactions / 412 comments, 2025-04-01"}],"example_text":"I make $340,000 per year in San Francisco as a software engineer and it's utterly unlivable.\n\nLet's break it down.\n\nAfter taxes, my take home is approximately $220,000 or $18,400/mo\n\nRent for 2 bd/2ba apartment in Pacific Heights: $9,500\n\nCybertruck lease: $1368\n\nPack and fold laundry service: $200.\n\nDoordash salads: $1680\n\nDinner and Drinks for Hinge Dates: $2380 (excluding 2-michelin star+)\n\nSkiing: $2650 (average per mo)\n\nNew shirt: $20.\n\nEntertainment/Fun Budget: $1802\n\ntotal: $19,400\n\nDespite working my butt off for 30 hours per week remotely and making $340,000 per year, I am somehow in the position where I'm losing $1,000 per month.\n\nWhat is wrong with this city?","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQEE7Nm6kU1asg/feedshare-image-high-res/B4EZR7qLYxHgA0-/0/1737241443078?e=2147483647&v=beta&t=C_ECvolTTR2IYksEOSBtLiaR-m-g2GUc1I1n9xU4qV4"},{"name":"Craft appreciation","library":"virio","lane":"TOFU","archetype":"Practitioner publicly admires someone else's excellent work and names why it's good","hook":"Totally loved {work}! {First specific reason it works}.","skeleton":["Unguarded enthusiasm + the work, named","The connoisseur's list: 2\u20134 specific craft choices and why each lands (pace, casting, structure \u2014 domain-specific)","Credit to the makers by name","(Optional follow-up hook: \"have you wondered what happened before this?\" \u2014 an imaginative extension that extends the post's life)"],"examples":[{"url":"https://www.linkedin.com/posts/karts_advertising-marketing-creativity-ugcPost-6988740103095406592--1o8","meta":"Karthik Srinivasan (Sabhyata Diwali ad), 33,561 reactions / 1,431 comments, 2022-10-21"},{"url":"https://www.linkedin.com/posts/shelleyzalis_olympics-paris2024-ugcPost-7214151092132098048-8522","meta":"Shelley Zalis (2020 Nike ad), 13,214 reactions / 387 comments, 2024-07-13"}],"example_text":"Update: Assuming you have, by now, seen this ad, have you wondered what would have happened before this *interview*? Why would the CEO do what she is doing in this ad? Here's a prequel to this ad, from my imagination, using only the information presented in the ad.\n\n---\n\nTotally loved Sabhyata's 2022 Diwali ad film! The unhurried pace that makes us care for the story's characters, the choice of actors (Sheeba Chaddha, who is always exceptional; and Ayesha Kaduskar, who really sells us the narrative!), the thought... all prop the somewhat unrelated inclusion of the brand.\n\nLovely work by the agency 'P se Picture'.\n\n#advertising #marketing #creativity #creative #storytelling","linkOnly":false,"note":"","labels":[]},{"name":"Escalation timeline","library":"virio","lane":"TOFU","archetype":"Stat hook + year-by-year escalation list + zoom-out implication","hook":"{Company/industry} has {jaw-drop current number} {things} deployed to {goal}.","skeleton":["Jaw-drop stat hook (the endpoint of the timeline)","One-line promise: \"Here's a snapshot of the journey\"","Then-vs-now contrast (a decade ago it seemed impossible / today it's live)","The timeline: dash-list, one year per line, number climbing","Highlight line pulling out the steepest jump (\"the last two years alone\u2026\")","Zoom-out: what the trend means for work/industry","Closing challenge or open question about what's next"],"examples":[{"url":"https://www.linkedin.com/posts/stevenouri_artificialintelligence-technology-innovation-ugcPost-7155841105475854336-8SYt","meta":"Steve Nouri, 27,186 reactions / 730 comments, 2024-01-26"},{"url":"https://www.linkedin.com/posts/harbech_amazon-just-revealed-they-now-have-more-than-activity-7121124632673300480-OfsQ","meta":"Martin Harbech (Meta), 10,036 reactions / 462 comments, 2023-10-20"}],"example_text":"Amazon has more than 750.000+ robots deployed to unlock AI opportunities.\n\nHere's a snapshot of their journey into humanoid robotics and AI integration:\n\nA decade ago, the idea of human-like robots in Amazon's warehouses seemed like a distant dream. \n\nFast forward to today, and they're testing advanced robotics like \"Digit,\" a two-legged robot adept at handling repetitive tasks. \n\nThis move isn't just about efficiency; it's about reshaping how humans and machines collaborate.\n\nAmazon's robot army has grown exponentially:\n\n-In 2013, they had just 1,000 robots.\n-By 2014, the number climbed to 15,000.\n-A big leap in 2017, hitting 100,000.\n-Doubling to 200,000 in 2019.\n-Skyrocketing to 350,000 in 2021.\n-A massive jump to 520,000 in 2022.\n-And now, in 2023, they've deployed an astonishing 750,000 robots.\n\n\u2714The last two years alone saw an addition of 400,000 robotic units. \n\nThat's thousands of new robots coming into play every single week \ud83d\ude80\n\nThis rapid expansion signifies more than just robot deployment. It's a transformation in the workforce, creating a pressing need for high-skilled jobs and redefining industry safety. \n\nWe're not just witnessing technological advancement; we're stepping into an era where AI, robotics, and computer vision merge, dramatically changing the landscape of human labor.\n\n\nThe challenge ahead? Preparing the workforce for this new age with extensive reskilling and upskilling. \n\nAmazon is at the forefront, leading us into the Era of Robotics and the Age of Intelligence.\nhttps://lnkd.in/gS6y-KY9\n#artificialintelligence #technology #innovation","linkOnly":false,"note":"","labels":[]},{"name":"Evergreen skill checklist","library":"virio","lane":"TOFU","archetype":"Universally useful numbered how-to, taught in one post","hook":"Do you know how to {skill everyone should have but most don't}?","skeleton":["Question hook naming the skill","Numbered steps (6\u20138), each with a bolded action phrase then plain-language detail","Conditional branches inline where needed (\"if trained\u2026\")","Hashtags (3\u20135)"],"examples":[{"url":"https://www.linkedin.com/posts/sanjivberi_cpr-emergencyresponse-lifesavingskills-activity-7155894257382301696-USSK","meta":"Sanjiv Beri, 26,207 reactions / 614 comments, 2024-01-24"},{"url":"https://www.linkedin.com/posts/colby-kultgen_how-to-stop-overthinking-everything-5-techniques-activity-7328026026716860417-ALvq","meta":"Colby Kultgen, 14,076 reactions / 822 comments, 2025-05-13"}],"example_text":"Do you know how to perform CPR (Cardiopulmonary Resuscitation)?\n\n1) Safety First: Ensure the scene is safe for both you and the victim. Look out for any potential hazards.\n2) Check Responsiveness: Gently tap the person's shoulder and shout, \"Are you okay?\" If there's no response, it's time to act.\n3) Call for Help: Dial emergency services or direct someone else to do so. Quick professional intervention is crucial.\n4) Begin CPR: Position Your Hands: Place the heel of one hand on the center of the person's chest. Place your other hand on top and interlock your fingers.\n5) Give Compressions: Press down hard and fast, at least 2 inches deep, and at a rate of 100-120 compressions per minute. Allow the chest to rise fully between compressions.\n6) Open the Airway: Tilt the head back slightly and lift the chin.\n7) Provide Rescue Breaths (if trained): Pinch the nose shut, place your mouth fully over the person's mouth, and blow to make the chest rise. Give 2 breaths, each lasting about 1 second.\n8) Continue CPR: Keep performing cycles of chest compressions and rescue breaths until medical professionals arrive or the person begins to show signs of life.\n\n#CPR #EmergencyResponse #LifeSavingSkills #FirstAid #sanjivberi","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D5605AQGZ1sPP4U67DA/thumbnail-with-play-button-overlay-high/B56ZZLmQ_gGsBI-/0/1745025044651?e=2147483647&v=beta&t=JK2KlaWkDPLDFwCsiegcx36HUbWukYrL-WBMTea_wuM"},{"name":"Expert witness declaration","library":"virio","lane":"TOFU","archetype":"Credentialed expert declares what a stunning artifact means, in oracle cadence","hook":"These are not {the dismissal everyone reaches for}. {The real explanation} is so back.","skeleton":["Preemptive debunk hook (\"These are not CGI\")","The unifying insight, stated with total confidence (one mechanism explaining two domains)","The epigram (\"Give me a reward function, and I shall move the world.\")","The periodization couplet (\"2024 is the year of X. 2025 is the year of Y.\")"],"examples":[{"url":"https://www.linkedin.com/posts/drjimfan_these-are-not-cgi-reinforcement-learning-activity-7277013250565709826-uqyV","meta":"Jim Fan, 16,032 reactions / 522 comments, 2024-12-23"},{"url":"https://www.linkedin.com/posts/yann-lecun_to-people-who-see-the-performance-of-deepseek-activity-7288591087751884800-I3sN","meta":"Yann LeCun, 45,229 reactions / 1,066 comments, 2025-01-25"}],"example_text":"These are not CGI. Reinforcement learning is so back. When operating on strings, it gives us o3. When operating on physical motors, it gives us a robot creature that out-maneuvers almost every animal on earth. RL is one of the very few learning algorithms that can master both the world of bits and the world of atoms.\n\nGive me a reward function, and I shall move the world.\n\n2024 is the year of prompt engineering.\n2025 is the year of reward engineering.","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D5605AQEMH6Zzkj4HgQ/thumbnail-with-play-button-overlay-high/B56ZVi6UENHEAA-/0/1741121208853?e=2147483647&v=beta&t=piLcZXPUBGXd2rhDmLHMYQH234We9csc-aEc_G3N-eU"},{"name":"Future-wonder demo","library":"virio","lane":"TOFU","archetype":"\"What if?\" reveal of an emerging technology, explained with everyday stakes","hook":"{Evocative rename of the tech}: {three-adjective promise}. What if {everyday object} could {magic behavior} at the touch of a button?","skeleton":["Coined-name title line + what-if question","\"Meet {the tech}\" \u2014 plain-language mechanism in 2 sentences","Practical payoff list woven into prose (retrofit, fewer parts, better aesthetics)","Zoom-out line: which industries this rewires","The \"perfect example of {two fields} merging\" frame","Practitioner question CTA (\"Have you seen this in action or worked with it?\")"],"examples":[{"url":"https://www.linkedin.com/posts/philipp-kozin_smartglass-futureofliving-interiordesign-activity-7325600040566013953-wkKA","meta":"Philipp Kozin (smart glass), 4,778 reactions / 294 comments, 2025-05-06"},{"url":"https://www.linkedin.com/posts/harbech_disney-just-released-this-demo-they-activity-7154755444320743424-a2bi","meta":"Martin Harbech (Disney HoloTile), 17,178 reactions / 558 comments, 2024-01-21"}],"example_text":"Smart Curtains of the Future: Transparent, Flexible, and Electric\n\nWhat if your window blinds could disappear at the touch of a button?\n\nMeet the next generation of \"modern curtains\" \u2014 ultra-thin, electrically conductive films that can be applied directly to glass surfaces. With a small voltage, they switch from transparent to opaque, offering instant privacy, glare control, and energy efficiency.\n\nThese smart films can be retrofitted onto existing windows, making them a game-changer for architecture, automotive, and interior design. Think fewer mechanical parts, better aesthetics, and smarter control.\n\nA perfect example of how materials science and design are merging to redefine the spaces we live and work in.\n\nHave you seen this technology in action or worked with it?\n\n#SmartGlass #FutureOfLiving #InteriorDesign #MaterialInnovation","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQFmA8cmpH45Zw/thumbnail-with-play-button-overlay-high/B4EZanCYgWHIDA-/0/1746559149360?e=2147483647&v=beta&t=LuSFHZ2qFW0a3PefSLClHU9LF17WLiuOP9ztdiEoSBM"},{"name":"Generational campfire question","library":"virio","lane":"TOFU","archetype":"Shared-identity observation ending in an \"are we the only ones?\" question","hook":"When I was young I {did X for the older generation}. Now I {do X for the younger one}. Are we the only generation that {skill/trait}?","skeleton":["Two-beat sandwich observation (young \u2192 old, same role)","The question that names the tribe","Honest evidence paragraph (tried and failed to pass it on)","The thesis, softened with \"maybe\"","In-group wink tied to an attached artifact/image"],"examples":[{"url":"https://www.linkedin.com/posts/max-penk_when-i-was-young-i-fixed-my-parents-computers-activity-7253701040980602880-1D_5","meta":"Max Penk, 170,147 reactions / 12,077 comments, 2024-10-20"},{"url":"https://www.linkedin.com/posts/annaclaiborne_when-i-was-young-i-fixed-computers-for-everyone-activity-7298084695185965056-w2w5","meta":"Anna Claiborne, 641 reactions / 147 comments, 2025-02-19"}],"example_text":"When I was young I fixed my parents computers. Now that I'm older I fix computers for my son & his friends. Are we the only generation that knows how computers work?\n\nYes, I tried to teach the young generation as well, but their interest didn't really spark when we installed a new GPU or took a look at BIOS settings.\nMaybe we are the only practitioners of tech. The previous generation missed it, and the newer generation is just consumers of tech.\n\n...and if you can make sense of the attached picture, you are one of my people \ud83e\udd1d","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQHNxFLoXM4p0A/feedshare-shrink_800/feedshare-shrink_800/0/1729417094051?e=2147483647&v=beta&t=JZYuJPNOcP_DCKqrPHxK9mWDZ7HsR35jxyGmAZYwWuM"},{"name":"Hero tribute","library":"virio","lane":"TOFU","archetype":"Personal tribute to a widely admired figure, anchored in one vivid, unexpected detail","hook":"My hero {name} was {expected identity}, {expected identity} \u2014 and {the surprising specific}.","skeleton":["Identity-list hook ending on the surprise","Personal angle: how the author knew them / their work","The proof paragraph: one quantified before/after of their impact (3.5M cases \u2192 single digits)","Character close-up: a habit or belief that explains the numbers","Borrowed-wisdom close (a teaching or quote) + what honoring them means"],"examples":[{"url":"https://www.linkedin.com/posts/melindagates_my-hero-jimmy-carter-was-a-peacemaker-a-activity-7279253531738484736-Abk_","meta":"Melinda French Gates (Jimmy Carter), 18,175 reactions / 605 comments, 2024-12-29"},{"url":"https://www.linkedin.com/posts/barackobama_for-decades-you-could-walk-into-maranatha-activity-7279265196987019264-UR0U","meta":"Barack Obama (Jimmy Carter), 33,236 reactions / 1,461 comments, 2024-12-29"}],"example_text":"My hero Jimmy Carter was a peacemaker, a public servant,  a man of faith,  a devoted partner to Rosalynn\u2014and a Guinea worm\u2019s worst nightmare. I knew him best as a global health advocate and deeply admired his dedication to taking on diseases that impact the world\u2019s poorest people, like Guinea worm disease. \n \nWhen President Carter left office, there were more than 3.5 million cases of this painful, debilitating disease around the world each year. This year, thanks in no small part to the work of the Carter Center, that number was down to single digits. He dreamed of outliving the last Guinea worm\u2014and came incredibly close.\n \nAs he traveled around the world meeting with heads of state, monitoring elections, visiting clinics, and building homes, he took time to connect to the people he met. He believed in removing the barriers that separated a man like him\u2014a former President and Nobel Prize winner\u2014from people living with the realities of poverty and disease. \n \nOne of my favorite teachings says: \u201cTo know that even one life has breathed easier because you lived, this is to have succeeded.\u201d We honor President Carter by remembering that because of him, life is healthier, better, and safer not just for one life, but for millions.","linkOnly":false,"note":"","labels":[]},{"name":"Identity contrast anthem","library":"virio","lane":"TOFU","archetype":"Two-column identity contrast (boss vs leader) built as a cadenced anthem","hook":"{X} doesn't make you {Y}. (What you do with it does.)","skeleton":["Two-beat hook with parenthetical twist","One-line each definition of the two identities","Bad column: \"{Bad identity}:\" + 5 arrow lines (\u279f)","Good column: \"{Good identity}:\" + 5 mirrored arrow lines","Cadenced couplets (\"Not about being first in line, but making sure no one's left behind\") \u00d7 3","Imperative closer (\"Choose wisely. Be the leader you'd want to follow.\")","Distribution block: \u267b\ufe0f repost ask + follow line + P.S. question"],"examples":[{"url":"https://www.linkedin.com/posts/jwmba_power-doesnt-make-you-a-leader-what-you-activity-7362456863872806912-v4RS","meta":"Justin Wright, 13,067 reactions / 1,031 comments, 2025-08-16"},{"url":"https://www.linkedin.com/posts/jasonaosborn_when-you-leave-the-room-do-they-breathe-activity-7328735977760264192-2Mdz","meta":"Jason Osborn, 11,333 reactions / 561 comments, 2025-05-15"}],"example_text":"Power doesn\u2019t make you a leader.\n(What you do with it does.)\n\nThe truth hits hard:\n\nA boss takes what they need.\nA leader creates what everyone needs.\n\nLook closely at any thriving team.\nYou\u2019ll spot the difference instantly.\n\nBosses:\n\u279f Command through position\n\u279f Guard resources like secrets\n\u279f Take credit for others' wins\n\u279f Stand above the team\n\u279f Demand loyalty\n\nTrue leaders:\n\u279f Inspire through action\n\u279f Share openly and freely\n\u279f Give credit where it's due\n\u279f Stand alongside their team\n\u279f Earn trust through words & actions\n\nIt\u2019s never about power.\nIt\u2019s about empowerment.\n\nNot about being first in line, \nbut making sure no one\u2019s left behind.\n\nNot about drinking alone,\nbut making the well bigger for everyone.\n\nBecause when you lead with service,\npeople follow with passion.\n\nWhen you clear the path for others,\nthey\u2019ll give their best for you.\n\nYour example doesn\u2019t just influence.\nIt multiplies.\n\nChoose wisely.\n\nBe the leader you'd want to follow.\n\n\u267b\ufe0f Repost if you believe in true leadership.\nFollow Justin Wright for more leadership insights.\n\nP.S. Have you seen the difference between a boss and a leader in your workplace?\n\nVideo credit: Millionaire Mentor","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQF4u_tbFThR_Q/thumbnail-with-play-button-overlay-high/B4EZixUppmHIDw-/0/1755321639877?e=2147483647&v=beta&t=Nl4GSiMHLYOs9bNiBvQvIlRIiQ-wI2pynOIHMS_AMGM"},{"name":"Market-shock explainer","library":"virio","lane":"TOFU","archetype":"Breaking-news stat bomb + rapid-fire numbers thread explaining why it matters","hook":"{Actor} has now {jaw-drop consequence with $ figure}. {Second escalating figure}!","skeleton":["Double stat-bomb hook (the damage, then the bigger damage)","The David-vs-Goliath one-liner (\"All because a $6M startup did what X claimed was impossible\")","\"Here's why \ud83e\uddf5:\" promise","Stark number pairs, side by side (them: $600M / challenger: $6M \u2014 repeated across 2\u20133 dimensions)","\"This isn't just X \u2014 it's a paradigm shift\" escalation","Bullet recap of the challenger's edge","Borrowed-authority quote (a named expert's framing)","Open question CTA (\"What's your take? \ud83d\udc47\")"],"examples":[{"url":"https://www.linkedin.com/posts/stevenouri_ai-deepseek-innovation-activity-7289710857322708992-Y8iV","meta":"Steve Nouri (DeepSeek crash), 57,988 reactions / 3,720 comments, 2025-01-27"},{"url":"https://www.linkedin.com/posts/eddie-donmez-538b55b5_growth-markets-finance-share-7061643142193664001-dwe0","meta":"Eddie Donmez (Saudi Aramco profits), 13,570 reactions / 700 comments, 2023-05-09"}],"example_text":"DeepSeek has now erased $2 trillion worth of market cap in US stocks. NVIDIA just lost $500B+ in market cap!\n\nUpdate: https://lnkd.in/gZuyrXyH \n\nAll because a $6M Chinese AI startup just achieved what Silicon Valley claimed was impossible.\ud83d\ude0e\n\nHere\u2019s why DeepSeek is rewriting the rules of AI \ud83e\uddf5:\n\nChina\u2019s DeepSeek just built a reasoning AI model that rivals OpenAI\u2019s best\u2014and did it for 1/1000th of the cost.\n\nOpenAI\u2019s GPT-4: $600M+ training cost\nDeepSeek: $6M total\n\nAnd DeepSeek R1 is open source.\n\nDeepSeek is not just cheaper to build\u2014it\u2019s also cheaper to run.\n\nOpenAI: $100+ per million tokens\nDeepSeek: <$4 per million tokens\n\nThis isn\u2019t just a cost difference\u2014it\u2019s a paradigm shift.\nSilicon Valley\u2019s AI advantage? It\u2019s evaporating.\n\nTech investors in panic mode\nGlobal attention shifts to China\u2019s AI dominance. What if we dont need that many GPUs or even electricity to build better Models!\ud83d\udd25\n\nDeepSeek R1 is:\n27x cheaper than OpenAI\u2019s models\nOpen source and permissively licensed\nA model that fully discloses reasoning steps\nThis isn\u2019t just competition. As Marc Andreesen said It\u2019s Sputnik for AI.\n\n\nThe game is changing\u2014and fast.\nWhat\u2019s your take on this AI revolution? Let\u2019s discuss. \ud83d\udc47\n\n\n\"This image is a conceptual representation created for illustration\"\n\n#AI #DeepSeek #Innovation","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQEvMh00W0581g/feedshare-shrink_800/B56ZSpBYYZHEAo-/0/1738002503211?e=2147483647&v=beta&t=iobDo5mBWVtqbcHsOzKFbn1SxAozKG9pQMFhr56o9qY"},{"name":"Obsession teardown drop","library":"virio","lane":"TOFU","archetype":"Obsessive deep-dive teardown of a beloved brand, given away","hook":"Yo. We spent the last {obsessive hours} breaking down {beloved brand's} {system}.","skeleton":["Casual-obsessive hook (the hours + the subject)","The subject's gravity stats ($0 \u2192 $210B, 285M visitors/month)","\"How'd they do it?\" + checklist (\u2705) of the system's pillars","What's inside the file: arrow list of components","The completist flex (\"EVERY historical homepage over 17 years\")","Value flip (\"People say I should charge for these. Nah - I'm giving it away.\")","Gate: comment \"{keyword}\" (+ must-be-connected)"],"examples":[{"url":"https://www.linkedin.com/posts/joshlowman_yo-we-spent-the-last-19-hours-breaking-down-activity-7239273746467823616-e6T4","meta":"Josh Lowman (iPhone 16 funnel), 2,784 reactions / 8,505 comments, 2024-09-10"},{"url":"https://www.linkedin.com/posts/nielsklement_i-spent-5-hours-reverse-engineering-how-alex-activity-7297165553851404289-F4kv","meta":"Niels Klement (Perspective; Hormozi Skool Games funnel, open-link variant), 1,234 reactions / 1,309 comments, 2025-02-17"}],"example_text":"Yo. We spent the last 19 hours breaking down\nthe new iPhone 16 marketing funnel.\n\nApple's iPhone went from $0 to $210,000,000,000 in revenue in just 17 years.\n\nAnd their website gets 285M visitors/month.\n\nHow'd they do it?\n\nThe Apple way:\n\n\u2705 Smart strategy\n\u2705 A beautiful product & brand\n\u2705 A well-crafted customer journey\n\u2705 The best website design & copy\n\u2705 Inspired advertising\n\nIt's almost the perfect system.\n\nIn this file, I break down iPhone's entire marketing funnel and provide expert analysis on strategy, copy, and design including,\n\n\u2192 Website tech stack\n\u2192 Digital ads\n\u2192 OOH ads\n\u2192 Homepage & website\n\u2192 Event marketing\n\u2192 Video\n\u2192 Branded content\n\u2192 iOS\n\u2192 Apple Intelligence\n\nAnd much more. This thing goes deep.\n\nI'm even including EVERY HISTORICAL iPhone homepage over the last 17 years.\n\nPeople say I should to charge for these. Nah - I'm giving it away.\n\nWant it?\n\nComment \"Apple\" and I'll send it right over.\n\n(Must be connected.)\n\nAll killer no filler.","linkOnly":false,"note":"","labels":[]},{"name":"Soft-skill framework","library":"virio","lane":"TOFU","archetype":"A values claim (\"X = real strength\") backed by a numbered why + a named how","hook":"{Emphatic agreement} \ud83d\udd25 This one's for the {audience} who {do the undervalued thing} \u2014 not as a tactic, but as a way of being.","skeleton":["Emphatic hook + dedication to the audience segment","Credit line to the creator being riffed on","The reframe sentence (what the world gets wrong about this trait)","\"Why {trait} = {strength}\": numbered list of 3, each with one explaining line","\"How to {practice it}\": 3 named moves with one-line instructions","\"The ripple effect\": the payoff paragraph"],"examples":[{"url":"https://www.linkedin.com/posts/elfriedsamba_absolute-facts-this-ones-for-the-leaders-activity-7321161689452732416-WYS4","meta":"Elfried Samba, 19,134 reactions / 432 comments, 2025-04-24"},{"url":"https://www.linkedin.com/posts/drmirobada_27m-employees-prove-one-act-skyrockets-your-activity-7330272188601630720-XIeQ","meta":"Dr. Miro Bada, 12,252 reactions / 620 comments, 2025-05-19"}],"example_text":"ABSOLUTE FACTS \ud83d\udd25\n\n\nThis one\u2019s for the leaders who don\u2019t use kindness as a tactic - but embody it as a way of being. \n The ones who know leadership isn\u2019t about showing off strength - it\u2019s about lending it. \n Saw Eric Partaker drop his POV and had to share mine too. \n In a world obsessed with outcomes, it\u2019s easy to forget: people do their best work when they feel supported, not scrutinised. \n Real leaders don\u2019t highlight weakness to prove a point - they use their influence to uplift, empower, and energise.\n\n\nWhy Kindness = Real Strength: \n 1. It Builds Confidence  Leaders who loan their strength say, \u201cI\u2019ve got you\u201d - not \u201cYou\u2019re not there yet.\u201d \n 2. It Creates Safe Spaces  Kind leaders make it okay to fail, learn, and grow. That\u2019s how innovation takes ro
