ward to moving quickly to provide them with the resources needed for their success.","linkOnly":false,"note":"","labels":[]},{"name":"Turnaround case study","library":"virio","lane":"BOFU","archetype":"Leader narrates a product's fall and comeback, credits the team","hook":"Every once in a while in my job, you get to witness {products past their prime / a turnaround nobody expected}.","skeleton":["Reflective hook about decline as a category-wide phenomenon","The honest admission: \"These are moments where we fail our customers\"","The turn: resurgence framing \u2014 skeptical market, loyal customers, a team taking the challenge","The named case: which product, what was wrong (quality, innovation), who decided to fix it","The comeback: what the team delivered, \"one of the most remarkable turnarounds I have witnessed\"","Team credit + honest \"still much more to innovate\" caveat","Present-state proof: what the product does now"],"examples":[{"url":"https://www.linkedin.com/posts/jeetupatel_every-once-in-a-while-in-my-job-you-get-activity-7249291360359350272-zSTv","meta":"Jeetu Patel (Cisco), 4,260 reactions / 180 comments, 2024-10-08"},{"url":"https://www.linkedin.com/posts/pfranceschi_early-this-year-we-made-tough-changes-at-activity-7270500506093973504-0ycd","meta":"Pedro Franceschi (Brex), 1,259 reactions / 47 comments, 2024-12-05"}],"example_text":"Every once in a while in my job, you get to witness products that feel like they are past their prime. At one point, they were the talk of the town and then innovation gradually slowed down and competition took the lead. These are moments where we fail our customers. \n\nBut then, a resurgence of innovation occurs, and the team does the impossible to innovate and bring the product back to its glory days. This is when the market is skeptical at first, but loyal customers give the team another chance to prove themselves. And the team takes on the challenge. \n\nOne such example at Cisco was our Firewall business. For the longest time, we had let the product be ignored. Quality had dropped and so had innovation. But a few years ago, credit to one of our Board members and a highly motivated team, we decided that the Firewall is the core foundation of our Security offering. The team knew this wouldn\u2019t be easy. Not only did the quality of the product need massive improvement but we would have to innovate non-linearly. The team not only delivered but did so in a way that made it one of the most remarkable turnarounds I have witnessed. There was no longer the pressing issue from customers about quality, but the team also decided to innovate in a way that leapfrogged the market.\n\nI am so proud to recognize a team of absolute rock stars that took Cisco\u2018s firewall business back to a state where we are extremely proud of the product. There is still much more to innovate, but the momentum and tail-wind are certainly behind us. \n\nPacked with AI capabilities, solving problems that the industry has not been able to solve for the past 30 years, while still maintaining the ability to serve the current use cases elegantly. After several years of hard work, they have gotten this product back as a leader in the market. \n\nThanks to the entire Security leadership team at Cisco as well as the firewall team for innovating fearlessly and not only delivering a world-class market-leading Firewall but reimagining the category for the market. \n\nFurthermore, the Microsegmentation team performed a similar feat innovating and solving unsolved problems for decades. \n\nForrester recently announced the results of the Firewall Wave and the Microsegmentation Wave where Cisco was the only company named a prominent leader in both categories. \n\nIt\u2019s a privilege to have watched this team in action. Thanks for your leadership Tom Gillis, Rajneesh C., Shailaja K. Shankar, Rick Miles, Craig Connors, Anil Nair, Nicholas Carrieri, Pramod C., Jana Radhakrishnan, Andrew Ossipov, Murali Rathinasamy, Brijesh Kumar, Amandeep Singh, Namit Kumar Agarwal, Ted Bedwell and so many more. What you have accomplished is truly extraordinary. You thought boldly, sweated the details, and got us to the top. What you all have done has made the company proud and the world more secure.\n\nAnd the best part is that this team is just getting started and the best innovations are yet to come.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQGgHCvd7y_aDA/feedshare-shrink_800/feedshare-shrink_800/0/1728365745060?e=2147483647&v=beta&t=YBbu_9evGEIlg_Zflm3aIsm173k_nL486Gx7o-sHqt8"},{"name":"VIP visit recap","library":"virio","lane":"BOFU","archetype":"High-status visitors at the company's stand/site, converted into a momentum statement","hook":"Truly honored to welcome {highest-status visitor}, {next}, and {next} at {our venue} during {event} yesterday.","skeleton":["Honor hook, every visitor named with full title, venue and occasion anchored","What the visit underscores (the bigger program/momentum it validates)","The pivot to the client's own story: \"It was a privilege to introduce {our thing}, which is redefining {category}\"","Event + program hashtags"],"examples":[{"url":"https://www.linkedin.com/posts/john-pagano_theredsea-amaala-saudiusforum2025-activity-7328359375956267008-N4mZ","meta":"John Pagano (Red Sea Global), 16,844 reactions / 449 comments, 2025-05-14"},{"url":"https://www.linkedin.com/posts/franck-greverie_gtcparis-agenticai-sovereignai-activity-7339301414952660992-suM6","meta":"Franck Greverie (Capgemini, hosting NVIDIA's Jensen Huang), 2,255 reactions / 36 comments, 2025-06-13"}],"example_text":"Truly honored to welcome President Donald Trump, His Royal Highness Prince Mohammed bin Salman, His Excellency PIF Governor Yasir Al-Rumayyan, and His Excellency Minister of Investment Khalid Al-Falih at the Red Sea Global stand during the Saudi\u2013US Investment Forum in Riyadh yesterday.\n\nTheir visit underscored the momentum behind Vision 2030 \u2013 a bold plan that is already turning ambition into reality. From delivering new global destinations to unlocking opportunities for long-term Saudi\u2013US collaboration, the future is being delivered today.\n\nIt was a privilege to introduce our regenerative tourism destinations, #TheRedSea and #AMAALA, which are redefining what's possible \u2013 not just in tourism, but in sustainability, innovation, and global partnership.\n\n#SaudiUSForum2025\n#SaudiVision2030","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4D05AQERgLSAKCp3tQ/thumbnail-with-play-button-overlay-high/B4DZbOP67SHADo-/0/1747217018928?e=2147483647&v=beta&t=swBS9l0ycqoo9Qe-cUpj02OwYhBg_tEqR_qfJ-FDuCA"},{"name":"Batch hotlist teardown","library":"millies","lane":"ABM","archetype":"ranked spotlight of a cohort's hottest companies, with insider color on the founders behind each","hook":"You ever wonder who's behind {cohort}'s hottest {segment} startups?\" / \"{Company} is one of {cohort}'s most popular startups this year with {traffic/metric}.","skeleton":["Curiosity hook naming the cohort + a scale metric","Scope line (\"These are the {n} founders building real {segment} tech\")","Numbered company entries: what it does in one line, then 2\u20134 founder bullets mixing the impressive with the human (quant offer dropped, Reddit-sourced co-founder, eyepatch)","(Metric variant) the traffic/record numbers that justify the ranking","Runs long; ends mid-roster energy \u2014 the list is the close"],"examples":[{"url":"https://www.linkedin.com/posts/jeremyro_you-ever-wonder-whos-behind-y-combinators-activity-7424551753334808577-5gU_","meta":"Jeremy Ro (Virio), 447 reactions / 87 comments, 2026-02-03"},{"url":"https://www.linkedin.com/posts/chris-pisarski_pax-historia-is-one-of-ycs-most-popular-activity-7423089371639095296-RpBo","meta":"Chris Pisarski (Crustdata), 437 reactions / 56 comments, 2026-02-05"}],"example_text":"You ever wonder who's behind Y Combinator's W25 hottest B2B startups?\n\nThese are the 22 founders building real B2B tech:\n\n1. ThirdLayer (YC W25) \u2013 AI coworker that organizes and automates your life.\n\n- Regina Lin can see things three ways (left eye farsighted, right nearsighted) and wore a pirate eyepatch as a kid... Grew up as a classical pianist and performed a 25-min Rachmaninov concerto.\n\n- Kevin Gu studied algorithm textbooks growing up and dropped a quant trading offer to build Dex.\n\n- Abhi Ravipati left investment banking at PJT to come to SF on a whim.\n\n- Nick Tarmossin: Tarmo grew Dex's Instagram to 10k followers in a week, personal to 50k+.\n\n- Charles C. left LA home plans to become Head of Product after showing Drawer.\n\n- Almas Sapar their #2 design engineer.\n\n2. Weave \u2013 AI-first engineering analytics serving Reducto, PostHog, 11x, Nooks.\n\n\u2192 Adam Cohen raised $4.2M to solve the \"$1M AI budget with 0% ROI\" problem, teams see 16% higher output.\n\u2192 Andrew Churchill has 7k LinkedIn followers writing technical content for engineers.\n\n3. AfterQuery \u2013 sources hard-to-get datase[ts...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQG8yfQcM017qA/feedshare-shrink_1280/B56ZwlOehrJYAc-/0/1770151078334?e=2147483647&v=beta&t=s53t9aXQ5OZ4NyC4nqsk7CnB3nsh0Mp1NoUl27967Tk"},{"name":"Borrowed list status","library":"millies","lane":"ABM","archetype":"\"we're #{n} on {authority}'s list\" \u2014 placement announcement that credits the list-maker and tags the co-listed companies","hook":"{Company} is #{n} on {authority}'s list of the top {n} {category}. Plus {secondary press}!","skeleton":["The placement, stated with the exact rank and the authority's name","Divider, then the origin reframe: \"We started {company} to {mission}\" \u2014 the badge becomes evidence of the mission","The anti-positioning beat (\"we're not here to build a {category} company... we're here to {bigger thing}\")","Peer roll-call: \"companies like {co-listed names} (also on this list)\" \u2014 the ABM tags","Warm close: hiring/DM invitation + where to find the full list"],"examples":[{"url":"https://www.linkedin.com/posts/selin-kocalar_delve-is-11-on-a16zs-list-of-the-top-50-activity-7379550643004305408-xGCH","meta":"Selin Kocalar (Delve), 1,635 reactions / 110 comments, 2025-10-16"}],"example_text":"Delve is #11 on a16z's list of the top 50 AI apps that startups are spending on. Plus you can read about it in TechCrunch!\n\n\u2014\n\nWe started Delve to make it easier for people to innovate.\n\n(Not because we were obsessed with the SOC 2 control framework :) )\n\nWe didn't want innovation to get blocked by manual compliance work.\n\nAnd here's the thing.\n\nWe're not here to build a security & compliance company.\n\nWe're here to automate busywork for humanity, starting with compliance.\n\n\u2014\n\nIf you want to join companies like Lovable, micro1, Cluely, 11x, and Alma (also on this list) using Delve to get SOC 2, HIPAA, ISO, GDPR, etc. compliant with AI, we're always growing the Delve family.\n\nJust shoot me a DM!\n\nAlso, if you want to read about the full list in TechCrunch, the link to the article is in the comments.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQHhj6c3LiB6-w/feedshare-shrink_800/B4DZmluMXkG8Ag-/0/1759421977261?e=2147483647&v=beta&t=AIxa-liXwjO4cPiKsliAtBbKWw8Uw2b_kpEDNlmtzN4"},{"name":"Mafia map","library":"millies","lane":"ABM","archetype":"alumni-network funding map \u2014 \"the {company} Mafia has raised ${total}\" with the full founder-by-founder ledger","hook":"The {Company} Mafia has raised over ${total} in total funding.","skeleton":["Mafia hook with the aggregate number","The culture thesis: what the anchor company trained its people to do (2\u20133 lines, specific capabilities)","\"That culture compounds.\" \u2014 the one-line bridge","Methodology flex: how the map was built (names the client's own product as the instrument \u2014 the quiet BOFU sell)","The ledger: \"Company - $raised - Founder names\", sorted by raise, 15\u201330 entries"],"examples":[{"url":"https://www.linkedin.com/feed/update/urn:li:activity:7409946902818967552","meta":"Chris Pisarski (Crustdata), 986 reactions / 33 comments, 2025-12-29"}],"example_text":"The Klarna Mafia has raised over $2.99B in total funding.\n\nKlarna is known for building operators who can handle real complexity. Employees were pushed to think globally early, ship consumer grade products, manage risk at scale, and operate across some of the toughest regulatory environments in the world.\n\nThat culture compounds. Former Klarna employees went on to found and scale some of the most ambitious companies globally.\n\nUsing Crustdata's People Search API and Funding API, we mapped some of the most funded companies founded or co-founded by former Klarna employees:\n\nAnyfin - $641M - Mikael Hussain, Sven Perkmann, Filip Polhem\nTrueML + Signifyd - $563M - Ohad Samet\nMODIFI - $429M - Sven Brauer\nNelly Solutions - $287M - Niklas Radner, Rasmus Schults, Lukas Eicher\nFinix - $200M - Sean Donovan\nMAJORITY \u2013 $121M - Philip Mikal\nScratch Financial \u2013 $108M - John Keatley\nBrite Payments \u2013 $77.2M - Lena Hackel\u00f6er\nBasis Theory \u2013 $66.3M - Colin Luce, Brian Billingsley\nTorii \u2013 $65M - Uri Nativ\nRiseUp IL \u2013 $48.7M - Yuval Samet\nBits Technology \u2013 $48.4M - Robin Lantz\nIngrid \u2013 $38.2M - Patric Blixt\nInsurello \u2013 $29.3M - Marcus Janback\niyzico \u2013 $27M - Barbaros Ozbugutu\nTelness \u2013 $21.8M - Martina Klingvall\nSibill \u2013 $21M - Lorenzo Liguori\nLykon \u2013 $20.7M - Tobias Teuber\nDepict \u2013 $19.9M - Oliver Edholm\nBrowsi \u2013 $17M - Lior Fisher\nPocketlaw \u2013 $15.5M - Majid Garmaroudi\nP.F.C. \u2013 $14.5M - Kevin Al[...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQH64VTTwmxZLg/feedshare-image-high-res/B4DZtVrXNsJkAo-/0/1766669010702?e=2147483647&v=beta&t=66qea6WOHLMb19UUOeNIMZodaafYXqr_10Pw3RMIep8"},{"name":"Scene heart tribute","library":"millies","lane":"ABM","archetype":"love letter to a city/scene that name-checks every company in it (\"List ABM\")","hook":"{Place} is the beating heart of {industry}.\" / \"{Region} is becoming the {category} capital of the world.","skeleton":["The crowning hook (place + industry superlative)","The evidence line: density claim with a comparison (\"outside of Chicago, you won't find a higher density of...\")","The why-now: the author's presence or event in the scene this week (the ABM tell \u2014 meetings are the goal)","The roster: companies grouped by category, each with name + one-line identity \u2014 10\u201325 entries","\"(Who did I miss?!)\" comment farm"],"examples":[{"url":"https://www.linkedin.com/posts/jesse-buckingham-79649a26_chattanooga-is-the-beating-heart-of-freight-activity-7401983816355282944-zC8Q","meta":"Jesse Buckingham (Vooma), 180 reactions / 11 comments, 2025-12-03"}],"example_text":"Chattanooga is the beating heart of freight.\n\nOutside of Chicago, you won't find a higher density of brokers, carriers, shippers, and freight-tech talent.\n\nVooma is on the ground this week, visiting brokerages, carriers and freight leaders and hosting an intimate dinner.\n\nThe eco-system is deep. Shout out to all that power The Freight Alley.\n\n(Who did I miss?!)\n\n**Freight brokers headquartered in Chattanooga**\n\nTopo Logistics \u2013 full-service brokerage focused on reliable execution.\nTaimen Transport - Taimen Transport / Taimen Trucklines \u2013 asset + brokerage combo for TL, expedited, and warehousing.\nSteam Logistics \u2013 global 3PL moving ocean, air, and domestic freight\nSOAR Transportation Group \u2013 multi-modal brokerage\nMax Trans Logistics \u2013 national truckload brokerage\nLYNC Logistics, LLC \u2013 full-service truckload brokerage\nTrident \u2013 24/7 truckload brokerage\nLMS Logistics \u2013 multimodal brokerage\nLogistix \u2013 domestic freight brokerage\nLipsey Logistics Worldwide LLC \u2013 3PL moving dry van, temp-controlled, and intermodal freight.\nKCH Transportation \u2013 truckload and drayage brokerage & 3PL\nXpress Global Systems (XGS) \u2013 flatbed and heavy-haul specialist\nAvenger Logistics \u2013 brokerage specializing in TL, LTL, and expedited.\n\n**National brokerages with Chattanooga presence**\n\nTotal Quality Logistics \u2013 top 5 broker with downtown office\nR2 Logistics \u2013 3PL with a regional office in the city\nCoyote [...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5610AQEVo-ELPqSf0A/image-shrink_800/B56ZrkhDUoLIAc-/0/1764770462528?e=2147483647&v=beta&t=-InIXPyC5Ev5byNj2WBLW8SEEBvt9Ww1jUX7JXXhMpI"},{"name":"Takeaways tribute","library":"millies","lane":"ABM","archetype":"\"my biggest takeaways from {person}\" \u2014 numbered wisdom post that credits one named expert throughout","hook":"My biggest takeaways from {person} ({role} at {company}):","skeleton":["Direct hook naming the person, role, company","5\u20138 numbered takeaways; each: bold claim line \u2192 2\u20134 lines of explanation with the person's specific numbers (\"only 30% to 40% of what she learned in 20 years still applies\", \"optimization drives about 5% of their growth\")","Takeaways ordered most-paradigm-breaking first","(Optional) link to the full conversation \u2014 soft CTA"],"examples":[{"url":"https://www.linkedin.com/posts/lennyrachitsky_my-biggest-takeaways-from-elena-verna-head-activity-7407893643732316162-v6OE","meta":"Lenny Rachitsky (on Elena Verna, Lovable), 3,902 reactions / 207 comments, 2025-12-19"}],"example_text":"My biggest takeaways from Elena Verna (Head of Growth at Lovable):\n\n1. In AI, you now need to find product-market fit every three months. Product-market fit used to mean: build something people want, then scale it for years. In AI, the underlying technology changes so fast\u2014and customer expectations with it\u2014that you're constantly re-earning that fit. Even at $200M ARR.\n\n2. The growth playbook has fundamentally changed for AI companies. Elena has led growth at Miro, Dropbox, and Amplitude and advised dozens more companies on growth. At Lovable, she says only 30% to 40% of what she learned in 20 years still applies.\n\n3. At Lovable, growth is driven mostly through new features, not optimizing funnels. At the fastest-growing company in history, optimization drives about 5% of their growth. The other 95% comes from launching new features and products. Small tweaks don't move the needle when everything is changing.\n\n4. Ship constantly, and talk about it. Lovable's main growth and retention strategy: ship features fast enough that customers feel the product is always alive. Engineers announce their own updates. The founder tweets progress daily. This keeps users curious\u2014and keeps competitors scrambling.\n\n5. Give your product away like candy. AI products are expensive to run, so most companies gate them behind paywalls. Lovable does the opposite: they fund hackathons, sponsor events, an[...]","linkOnly":false,"note":"","labels":[]},{"name":"Blueprint repackage","library":"virio","lane":"ABM","archetype":"repackage a named org's framework/architecture into a layered breakdown the reader can act on","hook":"{prestige org}'s blueprint for how {audience} can actually {outcome}:\" (bold the operative words)","skeleton":["Hook naming the org and the promised outcome","One-line credibility frame (what the blueprint is built on)","Numbered layers/tenets (3\u20135): each = bolded name + what it means + 2\u20133 arrow sub-points","A hard number per layer where available (productivity gains, adoption stats)","Synthesis close: what the whole stack means for the reader's org"],"examples":[{"url":"https://www.linkedin.com/posts/andreashorn1_mckinsey-company-%F0%9D%97%AF%F0%9D%97%B9%F0%9D%98%82%F0%9D%97%B2%F0%9D%97%BD%F0%9D%97%BF%F0%9D%97%B6%F0%9D%97%BB%F0%9D%98%81-%F0%9D%97%B3%F0%9D%97%BC%F0%9D%97%BF-activity-7346163584348884994-5XOS","meta":"Andreas Horn, 5,828 reactions / 208 comments, Jul 2025 (McKinsey AI-bank blueprint)"},{"url":"https://www.linkedin.com/posts/lilyzheng308_diversity-equity-inclusion-activity-7288250288480694272-Ask7","meta":"Lily Zheng, 2,962 reactions, Jan 2025 (FAIR framework launched via HBR)"}],"example_text":"McKinsey & Company blueprint for how banks can actually extract real value from AI: \u2b07\ufe0f\n\nThis is a full-stack, enterprise-grade architecture \u2014 built on agents, orchestration, and rewired workflows. The AI bank stack consists out of 4 key layers: \u2b07\ufe0f\n\n1. Engagement Layer\nThis is the user layer \u2014 customers and employees. McKinsey calls for fully reimagined, intelligent, personalized experiences across all channels.\n\n\u2192 Multimodal chat (text, voice, image)\n\u2192 Omnichannel UX across mobile, contact center, branch\n\u2192 Digital twins for customer simulation and workforce training\n\nIt's all about a UI refresh and UX overhaul grounded in real AI.\n\n2. AI-Powered Decision Making\nThis is the brain of the AI-first bank. And it's not just predictive models anymore \u2014 it's orchestrated agent ecosystems.\n\n\u2192 AI Orchestrators: Plan, reason, delegate across workflows\n\u2192 Domain Agents: Specialize in credit policy, fraud, risk, legal\n\u2192 Copilots: Embedded in workflows to guide users and automate decisions\n\nMcKinsey reports 20\u201360% productivity gains in decision-making with this approach.\n\n3. Core Tech & Data\nThe foundation layer most banks underestimate \u2014 until GenAI models stall in production.\n\n\u2192 Vector databases\n\u2192 LLM orchestration and FinOps\n\u2192 Search and retrieval engines\n\u2192 ML pipelines\n\u2192 Secure data architecture\n\u2192 API infrastructure\n\nThe goal: make data accessible, tools reusable, and infra invisible to the business. Without this, nothing scales.\n\n4. Operating Model\nThis is where the transformation wins or fails. Without rewiring the org, the tech doesn't matter.\n\n\u2192 AI control towers to track value and set guardrails\n\u2192 Cross-functional teams across business, tech, and AI\n\u2192 Platform operating model for speed and alignment\n\u2192 Enterprise-wide reuse of AI capabilities\n\nIf you're building isolated projects without shared assets or central coordination, you're not transforming \u2014 you're experimenting.\n\nWhat this all adds up to?\nThe banks that win won't be the ones with the most pilots. They'll be the ones that industrialize agents, orchestration, and rewired workflows, with full-stack coordination.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQGA5fPUM75sZA/feedshare-shrink_800/B4DZfLQ2O1HAAg-/0/1751461882883?e=2147483647&v=beta&t=ue1UpKTgz7zzl5RNdA6oek-WBBAbIYCFxpgL-4yk8as"},{"name":"Campaign anatomy + credit roll","library":"virio","lane":"ABM","archetype":"breakdown of a hot campaign or company run, ending in a name-by-name credit roll of the team behind it","hook":"{agency/team} just pulled off the hottest campaign in {brand}'s {n}-year history.\" + news peg (\"{exec} JUST announced {IPO/launch}; so here is a dive into their {result}.\")","skeleton":["Hook naming the maker + the brand + a superlative, tied to a live news peg","Dated timeline of the brand's run (year-by-year lines: founding \u2192 funding \u2192 product gens \u2192 valuation \u2192 the news peg)","Campaign elements as arrow bullets (films, placements, partnerships, OOH, experiential \u2014 concrete names and cities)","Credit roll: \"The {agency} team behind this:\" \u2014 each person with role + one-line r\u00e9sum\u00e9 line (\"ex-Goodby Silverstein\", \"Rated number one strategist in North America\")","Counterpart credit roll for the brand-side team","Congrats closer + personal action (\"running to get my ring\")","P.S. \u2014 links in comments"],"examples":[{"url":"https://www.linkedin.com/posts/parkerjared_nicefrank-just-pulled-off-the-hottest-campaign-activity-7479912158856749056-WnTN","meta":"Jared Parker, 26 reactions / 5 comments (video, captured 2 days after posting), Jul 2026 (nice&frank \u00d7 \u014cURA \"Subtle Power\") (pinned \u2014 included on format merit)"},{"url":"https://www.linkedin.com/posts/david-heinemeier-hansson-374b18221_our-s3-exit-is-slated-for-this-summer-thats-activity-7308840098773577728-G7pC","meta":"DHH, 7,465 reactions / 628 comments, Mar 2025 (37signals' $1.2M AWS S3 exit, behind_the_scenes on a named vendor run)"}],"example_text":"Our S3 exit is slated for this summer. That's when our 4-year contract expires. That contract is worth $1.2 million per year. So just about five million over the duration. It was a little more than a third of our combined cloud bill, before we pulled out compute, databases, and the rest, as part of our cloud exit. Real Money\u2122!\n\nIn anticipation, we've been building out a 18 petabyte storage cluster using flash-drive hardware from Pure Storage. The hardware build-out is about $1.5 million. Just slightly more than we were paying for 1 year's rent of about half the capacity on S3!\n\nThe Pure setup is super compact, so we could fit it inside our existing data center racks. It also sips power compared to hard drive-based storage. So we didn't even need to bump our power commits. That turned out to make all the difference when comparing bids from other providers using hard drives. And nobody could get close to the NVMe prices that Pure were able to offer (most came in at 2x or higher!!).\n\nBut that's all just numbers. What really gives me a geeky tingle is seeing the hardware racked up and ready to rock. In the cloud, you never see what's actually yours. It's all opaque. Not so with your own gear.\n\nWhat a glorious sight!","linkOnly":false,"note":"","labels":[]},{"name":"Category obituary","library":"virio","lane":"ABM","archetype":"declares a named category/industry dying on a deadline, evidenced by named companies' moves, then prescribes survival plays","hook":"The {category} world has {n} months left. Maybe less.\" + a named company's fresh number as the canary","skeleton":["Deadline hook","The canary: a named company's just-reported number, date-stamped","\"It's not just {obvious cause}\" \u2014 the real cause, with 2\u20133 named companies as receipts","Bullet reality-check (what the replacement already does)","The incumbent's counter-argument, steelmanned in one line","Numbered survival plays (3\u20134, each with a one-line how)"],"examples":[{"url":"https://www.linkedin.com/posts/tom-head-ai_the-agency-world-has-18-months-left-maybe-activity-7327656328481447936-pAET","meta":"Tom Head, 3,244 reactions / 646 comments, May 2025 (agencies vs AI; S4 Capital, Duolingo, Shopify, Klarna)"},{"url":"https://www.linkedin.com/posts/anniedeanzaitzeff_this-past-weekend-nikes-ceo-shared-that-activity-7186039378182295553-cXaS","meta":"Annie Dean, 8,063 reactions, Apr 2024 (office-first work, vs Nike claim)"}],"example_text":"The agency world has 18 months left.\n\nMaybe less.\n\nSir Martin Sorrell's S4 Capital just reported an 11.4% drop in Q1 sales - a canary in the digital coal mine.\n\nIt's not just economic headwinds. It's not just Trump's tariffs.\nIt's that your clients are quietly bringing work in-house.\n\nWith AI tools.\n\nWe've seen this very publicly over the past few weeks with Dualingo, Shopify and Klarna all taking an AI first approach.\n\nThe reality today is:\n\u2022 A junior with Midjourney can replace multiple \u00a350-\u00a370K designers\n\u2022 AI can draft campaigns faster than your team (who's reinventing the wheel every time anyway)\n\u2022 AI analytics outperform your insights department\n\nSorrell, ever the optimist at 80, promises things will turn around in H2.\nBut the trend is clear: brands don't need agencies for tasks they can do themselves with AI.\n\nSo what's an agency to do?\n\n1. Be brutally honest about what clients can now do in-house\nDon't sell services they can easily replicate with AI.\n\n2. Double down on strategic thinking\nAI can't replace genuine business understanding.\n\n3. Use AI in an advanced way\nCreate demand by using AI tools to deliver more value.\n\nWe've been teaching teams how to use AI effectively for 18 months.\n\nThe results? They still need agencies - just for different things.\n\nThe old model is dying:\nCreative concept \u2192 Design \u2192 Media plan \u2192 Traffic \u2192 Report\n\nThe new model is emerging:\nStrategic insight \u2192 AI workflow design \u2192 Internal capability building \u2192 Outcomes\n\nAgencies need to go from fighting this shift to leading it.\n\nFollow me for more on navigating the changes in the agency and job market created by AI.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGxfCZ_V38uZw/feedshare-shrink_800/B4EZbDkjDPHcAo-/0/1747037860944?e=2147483647&v=beta&t=VdBnp8D7UkWDBxiLTESvo6qsJ_bp7k85IF0PS3ujcUA"},{"name":"Collab appreciation","library":"virio","lane":"ABM","archetype":"delighted reaction to a surprising partnership between named brands, zoomed out into a market observation","hook":"Taking a moment to appreciate this {adjective} collab between {brand A} & {brand B}\" / \"{who} would have expected a crossover between {category A} and {category B}","skeleton":["Appreciation hook naming both brands","One-line surprise framing (why nobody saw this pairing coming)","Zoom out: what this pairing says about how the market is shifting (2\u20133 short paragraphs)","Principle takeaway (brands as conversation starters, co-creation, etc.)","Forward-looking close tied to the trend"],"examples":[{"url":"https://www.linkedin.com/posts/anupammittal007_taking-a-moment-to-appreciate-this-cute-collab-activity-7267056882744258560-iyUM","meta":"Anupam Mittal, 41,913 reactions / 1,063 comments, Nov 2024 (Zepto \u00d7 Shaadi.com)"},{"url":"https://www.linkedin.com/posts/mohammed-h-al-qahtani-603a36a4_xai-elonmusk-humain-activity-7351776032108032001-t_AJ","meta":"Mohammed H. Al Qahtani, 2,889 reactions, Jul 2025 (xAI \u00d7 Humain/PIF)"}],"example_text":"Taking a moment to appreciate this cute collab between Zepto & Shaadi.com \ud83d\ude0e\n\nWho would have expected a crossover between love and 10-minute delivery \ud83d\ude09\n\nFor decades, brands operated in isolation, fiercely protective of their lanes and any collaboration meant approaching the partnership with suspicion, a win-lose approach and months of planning.\n\nToday, they're co-creating more than ever \ud83e\udd1d Social Media with the immediacy it lends, shorter content life-spans, topical orientation and a need to engage audiences is driving brands to be more creative than ever and with AI I expect this trend to further accelerate.\n\nBrands are no longer just products or services, they are conversation starters.  Used to be that your Brand was what you told your customer about it i.e. the primary job was communicating.\n\nToday, brands are what your customers are saying about you which shifts the role to entertaining, engaging, and then educating.\n\nMarketers who embrace this new role, show the courage to give up complete control & co-own their brands with their customers will be the new stars by the end of this decade.\n\nWhat do you think?","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQF3jaGaqMgO5A/feedshare-image-high-res/feedshare-image-high-res/0/1732601375227?e=2147483647&v=beta&t=NcE2QKPII-bSFWz2ntnwgHbUqtOuHG5ULxyJPGYFF4I"},{"name":"Executive rise deep-dive","library":"virio","lane":"ABM","archetype":"rise story \u2014 how one person went from humble role to impressive role, told as a studied playbook","hook":"How did {person} go from {humble role} to {impressive role} at {company} in just {n} years?\" + \"I spent time studying his story, and the playbook is nothing short of insane.\" (Variant: \"Burning question: \u2026\")","skeleton":["Question hook naming person + before/after roles + timeframe","Stat arrows (\"\u2192 0 \u2192 $1B+ annualized revenue\" / career-stop arrows)","\"Here are 7 plays that made it work:\" \u2014 numbered plays, each = bolded principle + 2\u20134 sentence insider story with concrete numbers and quotes","Direct quote from the subject (advice or philosophy)","Respect closer (\"Respect to {names} for building something rare.\")","P.S. \u2014 hiring note, link, or personal aside"],"examples":[{"url":"https://www.linkedin.com/posts/nishitasnani_how-did-max-freeman-go-from-ramps-first-activity-7473030471388532736-l67F","meta":"Nishit Asnani, 1,126 reactions / 65 comments, Jun 2026 (Max Freeman, Ramp) (pinned)"},{"url":"https://www.linkedin.com/posts/shaanpuri_ok-heres-a-short-story-that-will-make-activity-7245847700531748865-3Ia_","meta":"Shaan Puri, 4,132 reactions / 206 comments, Sep 2024 (single-person story arc)"}],"example_text":"OK - here's a short story that will make you a better leader/CEO.\n\nI just hired a new CEO for one of my companies.\n\nOn Day 1 - he started doing what most CEO's would do:\n\n- Meet & greet the team\n- Get access/permission to our tools\n- Start coming up with a Big Picture plan/vision to present to the team.\n\nI pulled him aside and told him about a different way that I learned from Nat Friedman. Nat was named CEO of Github, and what he did on Day 1 was amazing.\n\n[8 am: everyone in the company gets on a call].\n\nInstead of sharing the vision & multi-year plan. Nat screen-shared and displayed a giant list of 100+ issues & complaints from customers.\n\nHe says: \"today, we're going to find one item on here, and fix it\"\n\n\"And tomorrow, we're going to pick another one, and fix that\"\n\n\"And the next day.. And the next.. Until we've nailed 20+ of these\"\n\nThis did 3 big things:\n\n1) Shock Therapy. The team used to \"think in quarters and years\". Suddenly the timeline shrinks to \"ship something today\".\n\n2) It let him learn the business bottoms up. Where are the problems? Where's the tech debt? Which teams are good at getting shit done?\n\n3) Action Speaks Louder. Customers were worried when Microsoft bought GitHub. Will they ruin it? Should we leave? But immediately seeing the product improve built faith that things will be OK.\n\nI call this the 'Broken Shelf Approach'. Every home has broken shelves. The people living in the house have learned to ignore it, and just live with it.\n\nIf you want to make an impression when you move in. Find the broken shelves, and fix them first.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGI4rAu3Viqgw/feedshare-shrink_800/B4EZ7WJndYHwAc-/0/1781709306003?e=2147483647&v=beta&t=qPW74FhunHF-w9QuegToYGUVEf2DbYvWmQwCGe4dans"},{"name":"Innovation roster","library":"virio","lane":"ABM","archetype":"a jaw-drop artifact (product, demo, practice) plus a roster of named companies doing it, ending in a market take","hook":"This {artifact} is insane.\" / \"Many of the best {category} did {surprising practice} for a curiously long time \u2014 {example}.","skeleton":["Jaw-drop hook on the artifact or practice","What it actually is, in plain terms (2\u20133 arrow lines)","Roster: named companies doing it, one per line","Personal proximity beat (I saw it / I was there / I used it)","Zoom-out take on what the roster proves","Question or soft close inviting takes"],"examples":[{"url":"https://www.linkedin.com/posts/arnold-ma_china-innovation-technology-activity-7346479954806665217-Lqpg","meta":"Arnold Ma, 8,841 reactions / 398 comments, Jul 2025 (exoskeleton + named robotics companies)"},{"url":"https://www.linkedin.com/posts/jaredfriedman_many-of-the-best-startups-ran-their-company-activity-7177811875538087936-OTwj","meta":"Jared Friedman, 2,762 reactions, Mar 2024 (Replit, Instacart, Twitch founders'-house era)"}],"example_text":"This wheelchair is insane! \ud83d\ude31\n\nIf only China had better branding... \ud83d\ude02\n\nThis is a hybrid exoskeleton mobility system.\n\n--> Designed to help people with paralysis/lower-limb disabilities stand, walk, and sit independently.\n\nThese kinds of devices combine robotic exoskeletons with powered wheelchair functions.\n\n--> Allowing for both movement and rehabilitation. \ud83d\udc4d\n\nChinese companies that are pushing the boundaries of medical robotics:\n\n- \u5085\u5229\u53f6\u667a\u80fd Fourier Intelligence\n- \u4f18\u798f\u673a\u5668\u4eba UFO Robotics\n- \u4e2d\u79d1\u5eb7\u590d SinoRehab\n\nChina's R&D in this space is impressive! \u267f\ufe0f\n\nDevelopment like this could be applied to many situations:\n\n- Designed for spinal cord injury and stroke recovery\n- Enables upright posture and gait re-training\n- Likely integrates AI-assisted motion control or remote operation\n- Ideal for hospitals, care homes, and potentially home use\n\nMobility technology like this restores autonomy + confidence + quality of life. \ud83d\ude4f\n\nChina might not have the strongest storytelling around its innovations yet.\n\nBut it's growing FAST!\n\nWhat's your thoughts on this innovation?\n\nArnold Ma #China #Innovation #Technology","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQH6MjrcTsVSXQ/thumbnail-with-play-button-overlay-high/B4EZfPwkQdHwD4-/0/1751537307093?e=2147483647&v=beta&t=Asp8TtOUFI14LcXYApCnteOxINLVWUeAJBx_-85U2d8"},{"name":"Insider defense","library":"virio","lane":"ABM","archetype":"credentialed first-person defense or breakdown of a named company's criticized/misunderstood move, in numbered points","hook":"As a {credential}, {credential}, and {credential}, I care deeply about {topic} and what this actually represented.\" / \"{topic} is a different beast. You're thinking about it all wrong.","skeleton":["Credentials-stacked hook establishing the right to speak","Acknowledge the criticism/misconception in one line","Numbered breakdown (3\u20135 points): each = what actually happened + the detail critics missed, with names and specifics","Personal stake beat (my role in it / my scar tissue)","Close that reframes the story without demanding agreement"],"examples":[{"url":"https://www.linkedin.com/posts/aishabowe_space-opinion-blueorigin-activity-7318276712113319937-B68U","meta":"Aisha Bowe, 7,444 reactions / 549 comments, Apr 2025 (Blue Origin mission defense)"},{"url":"https://www.linkedin.com/posts/galaga_enterprise-sales-is-a-different-beast-you-activity-7309599261292204033-_6_7","meta":"Gal Aga, 7,270 reactions / 446 comments, Mar 2025 (enterprise-deal lessons from 100s of 6\u20137 fig deals)"}],"example_text":"As an aerospace engineer, former NASA rocket scientist, and the first Bahamian to fly to space, I care deeply about science, sustainability, and what this mission actually represented.\n\nFor ya'll who think it was short, traveling at 2,300 MPH makes you feel a way \ud83d\ude09 So let's break it down:\n\n1. Purpose of the mission:\n\nYes, Blue Origin's New Shepard is suborbital\u2014but this mission made history in more ways than one. I served as the science payload operator for the first-ever HBCU-led research project to fly aboard New Shepard, developed in partnership with Winston-Salem State University (WSSU). The mission also marked a first for BioServe Space Technologies, whose Fluid Processing Apparatus (FPA) hardware was flown to qualify it for future use in orbit.\n\nIn addition to advancing plant biology research by examining how crops like chickpeas and sweet potatoes grow in microgravity to support future food security. I also wore a BioButton as part of a NASA-funded study led by TRISH (Translational Research Institute for Space Health) to better understand how women's bodies respond to spaceflight. This work is essential for future deep space exploration, where gender-specific data is still significantly lacking. Not tourism. Research.\n\n2. Climate impact:\n\nRockets do have an environmental cost just like cargo ships, long-haul flights, and even your average data center. But this wasn't just about one flight. The long game is reusability. New Shepard is fully reusable, and part of developing cleaner, more sustainable launch vehicles something we need if we want to monitor climate, deliver satellites, or support Earth-observation missions. And by the way, many climate-monitoring tools rely on space infrastructure.\n\n3. The role of private people:\n\nI left NASA to found two companies focused on education and equity. Through LINGO, we've brought STEM access to over 10,000 students worldwide, including in The Bahamas. The goal isn't just to go to space it's to bring what we learn back home.\n\n4. Private vs. public investment:\n\nLet's not pretend private sector innovation doesn't play a role in societal advancement. Commercial spaceflight delivers satellites for disaster tracking, global internet, GPS and agriculture monitoring to name a few benefits. It's space for the benefit of Earth.\n\n5. Marketing and representation:\n\nRepresentation isn't just about optics it's about access. As a Black woman and first-generation Bahamian-American, I didn't grow up thinking space was for me. This mission sent a powerful message: that science isn't reserved for the elite few. It belongs to all of us. And if one young girl saw me and thought maybe I could study engineering, I consider that a mission success.\n\nYes, be critical. Always. But don't dismiss the science, the significance, or the opportunity to inspire and inform \ud83d\ude4f\ud83c\udffd\ud83d\ude80\ud83d\udc99\n\n#space #opinion #blueorigin","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFksP0bx0fzIQ/feedshare-image-high-res/B4EZY.94IuHMA0-/0/1744813132376?e=2147483647&v=beta&t=fQJLPn2VlZ03ZXGvAemyDWbpUrTji0oPOvalaWAHrA4"},{"name":"Interview dialogue","library":"virio","lane":"ABM","archetype":"a staged interview exchange at a named company, used to teach a technical/domain concept through back-and-forth","hook":"The interview is for a {role} at {company}.\" \u2014 then straight into dialogue","skeleton":["One-line scene set naming the role and company","Interviewer question (the naive framing)","Candidate answer (crisp, correct, quotable)","Escalating follow-ups (3\u20134 rounds), each punching a common misconception","The synthesis answer \u2014 the mental model, stated plainly","Optional resource block or takeaway line"],"examples":[{"url":"https://www.linkedin.com/posts/srgrace_ai-genai-llms-activity-7390394713264021505-YrId","meta":"Sourav Verma, 1,143 reactions / 33 comments, Nov 2025 (GenAI engineer interview at Cohere)"},{"url":"https://www.linkedin.com/posts/pawel-huryn_agents-are-the-most-valuable-skill-in-ai-activity-7339343474720178176-EiiQ","meta":"Pawe\u0142 Huryn, 4,175 reactions, Jun 2025 (step-by-step agent build, resource-dense variant)"}],"example_text":"The interview is for a Generative AI Engineer role at Cohere.\n\nInterviewer: \"Your client complains that the LLM keeps losing track of earlier details in a long chat. What's happening?\"\n\nYou: \"That's a classic context window problem.\n Every LLM has a fixed memory limit - say 8k, 32k, or 200k tokens.\n Once that's exceeded, earlier tokens get dropped or compressed, and the model literally forgets.\"\n\nInterviewer: \"So you just buy a bigger model?\"\n\nYou: \"You can, but that's like using a megaphone when you need a microphone.\nA larger context window costs more, runs slower, and doesn't always reason better.\"\n\nInterviewer: \"Then how do you manage long-term memory?\"\n\nYou:\n  1. Summarization memory - periodically condense earlier chat segments into concise summaries.\n  2. Vector memory - store older context as embeddings; retrieve only the relevant pieces later.\n  3. Hybrid memory - combine summaries for continuity and retrieval for precision.\n\nInterviewer: \"So you're basically simulating memory?\"\n\nYou: \"Yep.\nLLMs are stateless by design.\nYou build memory on top of them - a retrieval layer that acts like long-term memory.\nOtherwise, your chatbot becomes a goldfish.\"\n\nInterviewer: \"And how do you know if the memory strategy works?\"\n\nYou: \"When the system recalls context correctly without bloating cost or latency.\n If a user says, 'Remind me what I told you last week,' and it answers from stored embeddings - that's memory done right.\"\n\nInterviewer: \"So context management isn't a model issue - it's an architecture issue?\"\n\nYou: \"Exactly.\n Most think 'context length' equals intelligence.\n But true intelligence is recall with relevance - not recall with redundancy.\"\n\n#ai #genai #llms #rag #memory","linkOnly":false,"note":"","labels":[]},{"name":"Magic demo","library":"virio","lane":"ABM","archetype":"teach a principle by showing how a named company made something \"boring\" spectacular","hook":"Your \\\"boring\\\" {thing}? It's pure magic. [watch/look at this {unexpected analog}]","skeleton":["Reframe hook (boring \u2192 magic) + an unexpected analog (a physics teacher, a street vendor)","The analog's trick in two lines (show, don't explain)","Bridge: \"Your {ICP's thing}? Same story.\"","Numbered how-to (3 steps, each with 2\u20133 sub-bullets)","The named-company proof: \"Look at {company}:\" \u2014 what they did, concrete numbers, and the outcome (\"biggest software IPO in history\")","Challenge close: tell the reader to try it on their most boring feature"],"examples":[{"url":"https://www.linkedin.com/posts/moshe-pesach_wow-your-audeince-activity-7334232770568671233-xKer","meta":"Moshe Pesach, 7,861 reactions / 135 comments, May 2025 (Snowflake made data warehousing exciting)"},{"url":"https://www.linkedin.com/posts/srgrace_ai-genai-llms-activity-7390394713264021505-YrId","meta":"Sourav Verma, 1,143 reactions, Nov 2025 (Cohere interview dialogue as a teaching device)"}],"example_text":"Your \"boring\" solution? It's pure magic.\n[Watch this Physics teacher]\n\nThat physics teacher just made basic principles fascinating.\n\nHow?\n\nNot by explaining the theory.\nBy showing how it works.\n\nYour B2B solution?\nIt's the same story.\n\nYou think: \"It's too technical.\".\nThey think: \"Show me the magic.\"\n\nHere's how to WOW your audience:\n\n1. Break It Down\n- Show the process\n- Reveal the mechanics\n- Demonstrate each step\n\n2. Make It Real\n- Live demonstrations\n- Behind-the-scenes\n- Real results\n\n3. Show the Magic\n- Highlight unique approaches\n- Share insider tricks\n- Reveal the \"how\"\n\nLook at Snowflake:\nMade data warehousing exciting\n(yes, data warehousing!)\n\nInstead of: \"Enterprise data solution\"\n\nThey showed:\n- How they process queries 200x faster\n- Live data sharing between companies\n- Zero maintenance required\n\nResult?\nTech leaders got obsessed with a \"boring\" database.\n\nBiggest software IPO in history.\n\nYour challenge:\nPick your most \"boring\" feature.\nBreak down how it works.\nMake someone say, \"Wow.\"\n\nRemember:\nTo the right audience, HOW you do it is magic.","linkOnly":false,"note":"","labels":[]},{"name":"Milestone announcement + team credit","library":"virio","lane":"ABM","archetype":"proud first-person announcement of a company milestone (research published, launch, record) with findings/details and named team credit","hook":"NEW {company} {thing} ON {topic}\" caps hook / \"I am proud to share that {company} {milestone}.","skeleton":["Caps or pride hook naming the company and milestone","Scale line (4.3M nights, 15K members \u2014 the numbers that make it real)","The substance: findings/features as dash bullets (3\u20134, each specific)","\"So what?\" \u2014 one-line practical implication for the reader","Why only this company could do it (the moat line)","Named congratulations to the people behind it, titles included"],"examples":[{"url":"https://www.linkedin.com/posts/willahmed_new-whoop-research-on-exercise-sleep-i-activity-7318035991280181248-pmw7","meta":"Will Ahmed, 4,430 reactions / 191 comments, Apr 2025 (WHOOP study in Nature Communications; SVP credited by name)"},{"url":"https://www.linkedin.com/posts/avi-chawla_a-graph-powered-all-in-one-rag-system-activity-7360270683198640128-AJTj","meta":"Avi Chawla, 2,996 reactions, Aug 2025 (\"built by the team behind LightRAG\")"}],"example_text":"NEW WHOOP RESEARCH ON EXERCISE & SLEEP\n\nI am proud to share that WHOOP research has just been published in Nature Portfolio's Nature Communications. Our study analyzed 4.3 million nights of sleep across nearly 15,000 WHOOP members to answer a simple but important question: does working out at night hurt your sleep?\n\nHere's what we found:\n-Strenuous evening workouts can delay sleep onset, shorten sleep duration, and reduce sleep quality.\n-Elevated nocturnal heart rate and decreased heart rate variability were observed post high-strain evening exercise.\n-Importantly, workouts concluding at least 4 hours before bedtime showed no negative impact on sleep.\n\nSo what? If you're training hard but not sleeping well, *when* you work out may matter just as much as how you work out.\n\nThis is one of the largest studies ever published on exercise and sleep - and it's only possible because of continuous WHOOP data and our commitment to research that improves human performance.\n\nCongratulations to Emily Capodilupo, our SVP of Research, Algorithms, and Data, and her team, as well as our collaborators at Monash and Harvard.\n\nFull article in Nature: https://lnkd.in/e6MXE85u","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGeC2K6NK8jWA/feedshare-image-high-res/B4EZY7i8bkHcAw-/0/1744755740765?e=2147483647&v=beta&t=gHcabAxftEa-lP3WNfzaQonxrC8t7rZFmEdDYutEJiM"},{"name":"Named-rival rebuttal","library":"virio","lane":"ABM","archetype":"a named exec/company makes a public claim; the author counters it with their own company's data","hook":"This past weekend {company}'s CEO shared that {claim}.\" / \"{policy} isn't the solution to the real problem: {reframe}.","skeleton":["Hook restating the named claim neutrally (date-stamped)","\"At {our company} we're seeing the opposite:\" \u2014 the counter-signal","The data: study scope, n, what was measured, what it found (2\u20134 lines)","Reframe: what the claim gets wrong about the underlying problem","Principle close (\"this moment demands more\") \u2014 no gloating"],"examples":[{"url":"https://www.linkedin.com/posts/anniedeanzaitzeff_this-past-weekend-nikes-ceo-shared-that-activity-7186039378182295553-cXaS","meta":"Annie Dean, 8,063 reactions / 281 comments, Apr 2024 (Atlassian data vs Nike CEO)"},{"url":"https://www.linkedin.com/posts/anniedeanzaitzeff_return-to-office-mandates-arent-the-solution-activity-7241859008456716288-jyYP","meta":"Annie Dean, 11,875 reactions / 592 comments, Sep 2024 (vs Amazon RTO memo, citing Airbnb's Chesky)"}],"example_text":"This past weekend Nike's CEO shared that remote work was hurting innovation.\n\nAt Atlassian we're seeing signals that distributed teams are * more * innovative.\n\nWe analyzed data from 4,000 shipit teams \u2014 shipit is our 2x annual internal hackathon \u2014 across 8 different shipit hackathons since 2021. We found that distributed (vs local) shipit teams were more diverse (range of skills, members spread across more crafts, more levels) and that they were more likely to produce a demo and receive a higher rank by voters.\n\nWhen we commit to doing it well, organizing our work online-first (vs office-first) is often * better *. \"We're struggling to innovate\" is an admission that a company isn't evolving how work gets done, not evidence that the office drives innovation.","linkOnly":false,"note":"","labels":[]},{"name":"News clapback","library":"virio","lane":"ABM","archetype":"a named company responds publicly to bad news about itself (regulator letter, security incident, viral criticism) \u2014 or the author breaks down such news","hook":"The {authority} just sent {company} a warning letter about {thing}. Here's why that's misguided, and why we're not backing down.\" / \"\ud83d\udea8 At {event}, {company}'s {product} got absolutely wrecked.","skeleton":["The news, stated flat and dated, with the company named","What the thing actually is/does (the context critics skip)","The rebuttal or teardown: point-by-point with citations (regulations, tests, receipts)","The stakes beyond this company (industry precedent, user harm, innovation)","Firm close: the position, stated once (\"we're not backing down\" / \"here's the memo\")"],"examples":[{"url":"https://www.linkedin.com/posts/willahmed_wellness-innovation-regulation-activity-7351264571933745156-IJw4","meta":"Will Ahmed, 5,260 reactions / 408 comments, Jul 2025 (WHOOP vs FDA warning letter)"},{"url":"https://www.linkedin.com/posts/eordax_ai-agents-security-activity-7362475870004928512-A_FX","meta":"Eduardo Ordax, 4,766 reactions / 282 comments, Aug 2025 (Copilot Studio agents wrecked at DEFCON)"}],"example_text":"The FDA just sent WHOOP a warning letter about our Blood Pressure Insights feature. Here's why that's misguided, why it undermines innovation in the United States, and why we're not backing down.\n\nBlood Pressure Insights by Whoop is a wellness feature. It gives members a daily estimate of their blood pressure range, based on passive, overnight data, to help optimize sleep, recovery, and performance. It's accurate and non-invasive.\n\nIt does not diagnose any condition. It's clearly labeled not for medical use. In fact, anyone accessing the app is required to go through an in-depth onboarding where they acknowledge that they know the device should not be used for medical purposes.\n\nHere's what's frustrating: the FDA claims any display of blood pressure \u2014 regardless of disclaimers \u2014 requires medical clearance. That's like saying your wearable shouldn't show your heart rate because someone might think they have tachycardia if it's too high.\n\nHeart rate and respiratory monitors are regulated under 21 C.F.R. \u00a7\u00a7 870.2300 and 868.2375, yet wearables can show that data for wellness. Blood pressure is no different. Peer-reviewed research confirms its relevance for wellness. There's no reason to treat it differently.\n\nIntended use is what matters - and the law agrees. The 21st Century Cures Act makes clear: Tools that support healthy lifestyles and don't diagnose or treat disease aren't medical devices. Blood Pressure Insights meets that standard.\n\nWe've gone above and beyond to design this feature responsibly:\n-We tell members: this is not a medical device\n-It does not diagnose hypertension or any other condition\n-It accurately estimates your blood pressure range every day as measured\n-We require members to proactively acknowledge that this device is not a medical feature\n-It's based on passive overnight trends - not clinical readings\n\nWe even invited the FDA to review the feature, the science, and the disclaimers. They declined to review all the details. Now they just want us to remove it. We are going to fight for our members' access to their data.\n\nTo be clear, Whoop supports the FDA's right to regulate medical devices. We spent years getting FDA clearance for our ECG feature that detects AFib. That's a medical device. We follow the rules. Blood Pressure Insights, however, isn't a medical device. And we won't let regulatory overreach dictate how people access their own health data.\n\nWorth noting, this is a US specific disagreement. Blood Pressure Insights by Whoop has been received favorably in 50+ markets around the world.\n\nThis isn't just about Whoop. It's about your right to understand your body and your health. It's about giving Americans access to health and wellness data. We'll fight this. Because the data can be measured accurately, and it belongs to you.","linkOnly":false,"note":"","labels":[]},{"name":"Rivalry flip story","library":"virio","lane":"ABM","archetype":"a named rival/copycat moment turned into an unexpected collab or win, told as a beat-by-beat story","hook":"In {year}, {company} infamously {provocation}.\" \u2014 then the beats","skeleton":["Date-stamped provocation hook naming the rival","The provocation's audacity in 2\u20133 staccato lines (\"Same branding. Same description. No shame.\")","\"The normal response would be {lawyers/war}. Instead, we {unexpected move}:\"","Beat-by-beat escalation (the tweet, the reply, the counter) \u2014 real quotes","The flip: the resolution that made both sides winners","Principle close (\"partners are always more valuable than rivals\")"],"examples":[{"url":"https://www.linkedin.com/posts/jameswatt-investor-entrepreuner-punk_in-2020-aldi-infamously-copied-our-flagship-activity-7299734312311025664-XmXn","meta":"James Watt, 6,303 reactions / 450 comments, Feb 2025 (BrewDog \u00d7 ALDI \"YALDI IPA\")"},{"url":"https://www.linkedin.com/posts/alex-tachalova_tell-me-youre-a-marketer-without-telling-activity-7323686235124752384-hNlh","meta":"Alexandra Tachalova, 6,933 reactions, May 2025 (Semrush 12-person era origin story)"}],"example_text":"In 2020, ALDI infamously copied our flagship beer.\n\nALDI - famous for its \"inspired by\" products - launched \"Anti-Establishment IPA\", a blatant copy of Punk IPA.\n\nSame branding.\nSame product description.\nNo shame \ud83d\ude05.\n\nThe normal response here would be to enter a legal battle, spending millions on fees to try and win a war.\n\nInstead, we sent a tweet:\n\n\ud83d\udc49 \"I wonder what ALDI would call Elvis Juice?\"\n\nThen, we took it a step further\u2014announcing a new BrewDog beer called YALDI IPA.\n\nOur message? Let's have some fun.\n\nALDI fired back: \"We would have gone with ALD IPA. Send us a crate and we'll talk?\"\n\nSo we did. We even redesigned the label to match their suggestion.\n\nWithin days, what could have been a corporate war turned into the most unexpected beer collab of 2020.\n\nALD IPA hit ALDI shelves across the UK and Germany.\n\nWhen competition gets messy, don't default to lawsuits. Default to creativity.\n\nBecause sometimes, the best way to beat the game\u2014is to play along.\n\nAnd partners are always a lot more valuable than rivals.","linkOnly":false,"note":"","labels":[]},{"name":"Study teardown","library":"virio","lane":"ABM","archetype":"breakdown of a named org's research/report into a \"here's what almost nobody realizes\" insight","hook":"There's something almost nobody is talking about in {space}\" / \"{org} studied {n} {things}, and surfaced one key pattern:","skeleton":["Curiosity-gap hook (the overlooked finding)","Name the study and its scale (n, scope \u2014 the credibility line)","The result in one or two crisp lines","\"Why does this matter?\" \u2014 one concrete scenario played out (a real company situation, step by step)","Contrast case showing where the default breaks","Implication close for the reader's org"],"examples":[{"url":"https://www.linkedin.com/posts/teybannerman_theres-something-almost-nobody-is-talking-activity-7358405153139367937-4GVf","meta":"Tey Bannerman, 9,882 reactions / 1,006 comments, Aug 2025 (107-country AI values study)"},{"url":"https://www.linkedin.com/posts/alexwang2911_mckinsey-company-studied-150-genai-initiatives-activity-7347249782169485312-weCt","meta":"Alex Wang, 3,463 reactions, Jul 2025 (McKinsey 150+ GenAI initiatives)"}],"example_text":"There's something almost nobody is talking about in AI - but it affects everything from asking ChatGPT for advice to companies deploying AI globally.\n\nA fascinating study tested major AI Models - the foundations powering tools millions use daily - against cultural values from 107 countries worldwide.\n\nThe result? Each one reflected the same assumptions - those of English-speaking, Western European societies. None aligned with how people in Africa, Latin America, or the Middle East actually build trust, show respect, or resolve conflicts.\n\nWhy does this matter? Imagine you're a global company rolling out AI customer service. Your system learns \"best practice\": when customers complain about late orders, \"apologise briefly, offer a discount, and focus on quick resolution\".\n\nIn Germany, the direct, efficient approach works perfectly. Customer satisfied.\n\nBut in Japan, that brief apology violates meiwaku - the cultural need to deeply acknowledge when you've caused someone inconvenience. Your \"efficient\" response feels dismissive and damages customer relationships.\n\nAnd in the UAE, the discount offer backfires completely. It feels like charity rather than respect.\n\nOne AI system, similar contexts, completely different cultural outcomes.\n\nThis isn't intentional though - it's inevitable. LLMs absorb embedded patterns about communication from their training data, and most of that data comes from billions of English web pages and content. The result? AI systems that, unless thoughtfully shaped, are blind to the diversity of human interaction.\n\nKlarna, the global payments company, made headlines in 2024 when they introduced an AI system that \"did the work of 700 customer service reps\", handled 2.5 million conversations in 35 languages, and cut response time by 82%. Technical triumph.\n\n14 months later: \"Klarna reverses AI strategy and is hiring humans again\". Their CEO admitted it had led to \"lower quality\". Some reports said they'd seen a 20%+ decrease in customer satisfaction.\n\nWhat I think really happened: Klarna optimised for 35 languages while completely missing 35 different ways humans expect to be treated.\n\nThe challenge? Most companies are focusing on technical integration and completely missing cultural intelligence. We measure response time and cost savings, but never ask, \"which human complexities are we overlooking?\"\n\nThe goal isn't neutrality though - that's impossible and undesirable. It's conscious awareness. Understanding that the output from AI models is filtered through a specific cultural lens.\n\nFor companies building AI strategies, key questions worth asking:\n\n* Which cultural assumptions are embedded in our AI systems?\n* How do we test cultural intelligence alongside technical performance?\n* Who provides this expertise in our AI teams?\n\nThe individuals and organisations that develop this conscious awareness will make better decisions, while others unknowingly apply one-size-fits-all approaches to beautifully diverse human contexts.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFJAaF1qPU-zA/feedshare-shrink_800/B4EZh3PvYeHoAk-/0/1754347272835?e=2147483647&v=beta&t=okGWC7ndkzENa17NmHE4XCsLmhzsYoLg3U1ehD_K64Q"},{"name":"Tenure reflection","library":"virio","lane":"ABM","archetype":"work-anniversary reflection at a named company, packaged as advice to the people trying to get in","hook":"{n} years at {company}. Almost an eternity in {industry} terms.\" / \"I've {surprising contrarian act} over the last {period}.","skeleton":["Milestone or contrarian-act hook with the company named","Who this is for (\"the hopefuls trying to carve out your path\")","Arrow-blocked advice sections (2\u20134): each = a hard truth + the inside view that justifies it","One personal story beat with specifics (the meeting, the investor, the failure)","Warm close to the aspirants \u2014 invitation, not lecture"],"examples":[{"url":"https://www.linkedin.com/posts/neilhoyne_google-lifeatgoogle-careers-activity-7321153672011214848-t5_Y","meta":"Neil Hoyne, 6,398 reactions / 365 comments, Apr 2025 (14 years at Google)"},{"url":"https://www.linkedin.com/posts/oduntan_ive-turned-down-a-few-acquisition-offers-activity-7292192060013432833-GHHu","meta":"Odun O., 908 reactions, Feb 2025 (turning down acquirers; customer-funded lessons)"}],"example_text":"14 years at Google \ud83c\udf82 Almost an eternity in Silicon Valley terms. \u23f3 Looking back, I'm thinking about many of you who have reached out on LinkedIn, the hopefuls trying to carve out your career paths in this world. So, here's a moment to reflect and share some of my best advice for this next year... \ud83d\ude42\n\n\u27a1\ufe0f The truth about AI: It feels like too many people - especially younger professionals - might be missing the point. While they're getting amazing with the actual tools, I see people becoming too reductive in the potential paths. Worried about replacement when they should be planning for acceleration in their careers. AI isn't coming for your economist job, your data science career or that UX gig. It's coming for the crushing grunt work that keeps you from the brilliant things that only humans can do: having an original thought, following a wild hypothesis, or connecting impossible dots into new innovations. In other words, please...please...don't be the one to limit yourself.\n\n\u27a1\ufe0f As for career-switchers: this might be a golden age. When AI-powered machines take over the repetitive, tedious parts of a role, like writing long emails, making slides and trudging through countless pages of research, suddenly the doors to creativity really open. I've watched people who would've sworn off ever working with a single line of syntax now diving in headfirst into vibe coding, expressing their unique view of the world through programming for the very first time. You still need the guts to cross that threshold, to think of your role more expansively.\n\n\u27a1\ufe0f Human connections matter more than ever. When every resume looks perfect and everyone interviews with GPT tools backing them up, people are going back to the oldest currency: who vouches for you. Did you know that half of Google's hires came from referrals at one point. Not because it's a magic ticket or something, but because great people know other great people. That's why every referral submission asks employees \"How do you know this person?\" As the process gets more competitive, get out there: conferences, hackathons, industry events - wherever your tribe gathers. Help others answer that question of how much they really know you. Human connection in an AI world. Isn't that a beautiful irony?\n\nIn other words, keep pushing. The road ahead will be awesome. \ud83d\udee3\ufe0f","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQGNw4odYYMOtQ/feedshare-shrink_1280/B4DZZn2eEPH4Ao-/0/1745499054806?e=2147483647&v=beta&t=TcAVByKugsDc0pkQ768YBpw8uEiokUTZ0-WK5AKoqzw"}];

iZxyPolJEOgN1x0HT6038QrxsPY6h7Eaf4o","https://www.linkedin.com/posts/ericlay-virio_claude-just-posted-a-320kyear-ghostwriter-activity-7395151060652433408-58Vl":"https://media.licdn.com/dms/image/v2/D4E22AQEE4FcrLDTfpQ/feedshare-shrink_800/B4EZqDas1ZHEAg-/0/1763141406792?e=2147483647&v=beta&t=C05PJmaL7Q8f4mcsb5bPih1HUSNSluYBKyeJeQj3O-c","https://www.linkedin.com/posts/sugju-choi_hey-linkedin-im-linkedins-one-of-the-first-activity-7419070510862319616-tSUL":"https://media.licdn.com/dms/image/v2/D5622AQFK9bz6nxNQUQ/feedshare-shrink_800/B56ZvXVUIPIcAg-/0/1768844248372?e=2147483647&v=beta&t=CVEHReg_C4eQp5KbR4uNbFzOaYorLutqdQF_Lrnh4X4","https://www.linkedin.com/posts/daniel-dhawan_2019-i-was-rejected-by-yc-for-the-first-activity-7430271916046790656-c8Ao":"https://media.licdn.com/dms/image/v2/D5622AQHuSZUCgDTPFw/feedshare-shrink_800/B56Zx2g7vvJAAk-/0/1771514871204?e=2147483647&v=beta&t=gVQ2WWcjsc_4p1hKrQGsUIPhVyoui3x3X3GMrcbrlJ0","https://www.linkedin.com/posts/rachael-higgins-becauseofmarketing_2024-close-to-quitting-on-my-business-2025-activity-7413919456810176515-f_Ya":"https://media.licdn.com/dms/image/v2/D4E22AQFmeN-IzHADsA/feedshare-shrink_800/B4EZuOIYY2HUAg-/0/1767616135058?e=2147483647&v=beta&t=-KAlesOHbBLGodfUQGDaxJKJWXp6h9ssLkyyJLxXxJ0"};   // {postLink: imageURL} resolved at build time (LinkedIn blocks Google's servers)
const POST_META = {"https://www.linkedin.com/posts/adamschoenfeld_seam-ai-was-the-latest-6sense-killer-5m-activity-7486431269765992448-rkV3?utm_source=share&utm_medium=member_desktop&rcm=ACoAACdGZLcBJuzZl4xNAUt8mhSOpOCaWu2zsCA":{"text":"Seam AI was the latest \"6sense killer.\" $5M funding, good logos, founded 2023. But Tuesday they got acquired by Clarify.\n\nThe list is growing fast.\n\nWarmly, Common Room, Pocus, Keyplay, Persana AI. And that doesn't even cover the pivots and shutdowns -- Swan AI pivoted to agentic workflow, Endgame pivoted to AI context, Koala shut down. It's a big graveyard.\n\nI'm on that list (Keyplay founder). Great customers, crossed $1M ARR early, grinded hard, but couldn't see how to scale independent.\n\nSome good founders and products in this space. But the category, oof.\n\nIf you run a GTM tech stack, be ready for more.\n\nSignal-based sales & ABM is a bloodbath. Bootstrapped players might last (if you believe Adam Robinson). Maybe UserGems has broadened enough. Maybe the API-first, usage-based tools are ok. Ads side (e.g. Vector \ud83d\udc7b) is probably different, probably ok. So there are exceptions. But the main storyline is clear.\n\nMy next question: \n\nIs this the Build vs Buy tipping point?\n\ni.e. Do we need these kind of vendors, or does \"Build it\" become the default? Claude Code and Codex harnesses are good at this kind of system. Clay and ZoomInfo have launched CLIs. The CRMs are going headless. Databricks and Snowflake are more deployed. There are dozens of API-first GTM Developer Tools that agents can call (Apify, Firecrawl, Browserbase, etc). New players like Deepline to help aggregate. For the right team, it feels like a place you can get very far building. \n\nMaybe I'm drinking the \"builders are the future\" kool aid too much.\n\nCurious what others think.\n\nI track this space closely --> adamgtm.com | 56 comments on LinkedIn","author":"Adam Schoenfeld","image":"https://media.licdn.com/dms/image/v2/D5622AQH0LX_tV425kw/feedshare-image-high-res/B56Z.RLuQZG8AY-/0/1784847198197?e=2147483647&v=beta&t=bhSLchxLJo0KTilk-8BovBBEoqJX7dfP2x75cPu0YH8"},"https://www.linkedin.com/feed/update/urn:li:activity:7483762420365111296?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483762420365111296%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I spent 45 min talking to this CEO who has grown his LinkedIn to 45K followers and is scaling toward 10 million ARR per employee. Plot Twist: In his content, he NEVER talks about his product. Here's the genius playbook he broke down for me on the call:\n\n2 months ago, I had a call with Amos Bar-Joseph, CEO of Swan AI. His company automates go-to-market with AI agents.\n\nHis content never mentions the product. Instead, he posts:\n\n\u2022 Contrarian takes on the future of work\n\u2022 Industry trends around AI agents and automation\n\u2022 Personal stories of building toward 10 million ARR per employee\n\nPeople don't come to LinkedIn to get pitch slapped. They come to learn, tap into the knowledge of their network, and engage in conversations about topics that are relevant to them. \n\nTwo things stood out from our call.\n\nFirst, how intentional he is about storytelling. He has two narratives that he bounces between:\n\n1. The meta narrative\n\nBuilding a fully autonomous business where every employee carries $10M in revenue. \n\nIt's audacious and stands out from the sea of GTM-related content that's flooded LinkedIn recently.\n\n2. The bottleneck narrative\n\nGTM engineering has become the bottleneck to business growth. \n\nThere are endless gurus who promise AI playbooks, and products that magically do everything. \n\nAmos is one of the only people I see who talks about the hidden engineering tax to build and maintain it. \n\nHis stories land because he runs his own GTM using Swan. He's his own customer showing what worked instead of telling people what they should do.\n\nSecond, the 2 phases of his LinkedIn motion:\n\nPhase 1: Grow his founder brand \n\nToday, Amos is just shy of 45K followers and averages 1M+ impressions per month.\n\nHe told me that he got to a point where his content alone drove more inbound pipeline than his team could handle.\n\nPhase 2: Activate the team\n\nAmos doesn't believe any channel stays effective forever, so instead of leaning on his brand alone, two more voices joined him on LinkedIn:\n\n- Jeremy Hurst, his VP of autonomous GTM\n- Ariel Cohen, his Founding Growth Engineer\n\nBoth left traditional jobs to manage AI agents at Swan, and now they're telling that story in their own voice and sharing what they're figuring out along the way.\n\nAmos, it was great talking to you. \n\nLooking forward to seeing how far you take Swan. | 19 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQH5qlGN5jEfkQ/feedshare-shrink_800/B4EZ9ihGTsKoAc-/0/1784064272070?e=2147483647&v=beta&t=M561YmFNDkV9rwOwgeGiNwrIM-uxVl3yNlVy7zUXGog"},"https://www.linkedin.com/feed/update/urn:li:activity:7445830761234087936?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7445830761234087936%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Quick and practical examples to stand out when applying to startups.\n\nThe key is to make it a lot easier for hiring managers to understand that you can add value to a company.\n\nLink to the full Next Play post in the comments.","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQF_9I9eYEIy_A/feedshare-shrink_800/B4DZ1S.9omIoAc-/0/1775213731125?e=2147483647&v=beta&t=bUpBOr-KLiM8ZqBCQ41qs9bKBSGhIiS7HAY5YURHzRQ"},"https://www.linkedin.com/feed/update/urn:li:activity:7478792063870926850?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7478792063870926850%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"This is Horst Schulze. \n\nThe man behind the Ritz Carlton and Capella. \n\nHe'd spent 18 years building one of the most respected luxury hotel brands in the world, and his theory was simple:\n\n \"the room doesn't matter as much as the person standing in it\"\n\n So he gave every employee, from housekeeping to senior management, the authority to solve guest problems without asking permission first.\n\nThe Ritz-Carlton Hotel Company, L.L.C. became what it became partly because of that.\n\nThen he walked away to prove the philosophy could work at a different scale.\n\nCapella Hotels and Resorts is what came next. Smaller. \n\nNo race for market share. No giant portfolio. Around a dozen properties, each built around the idea that service culture, not brand size, is what makes guests come back.\n\nCapella Bangkok ranked # 1 on The World\u2019s 50 Best Hotels in 2024. \n\nTravel + Leisure Co. + Leisure named Capella the best hotel brand in the world three years running, from 2023 to 2025. \n\nSix properties hold Forbes Five-Star ratings in 2026.\n\nWhat Horst understood, and most operators still resist, is that you can train people to follow a checklist or you can train them to care about the outcome. \n\nBoth create consistency. Only one creates loyalty.\n\nWhich other brands managed to replicate this?  | 134 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQE8LChPscqFMg/feedshare-shrink_1280/B4EZ8oBv_rJIAQ-/0/1783082975485?e=2147483647&v=beta&t=1wzmDml1bSYg5khJW9Sn6Po2wmiw6oT7IzeGFTrIWsQ"},"https://www.linkedin.com/feed/update/urn:li:activity:7482827007051882497?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7482827007051882497%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"A few months ago, I started hosting dinners at my home to bring together people from different parts of Decagon, and this week we took them on the road for the first time with our New York team! Although we had to trade my place for a restaurant\u2026\n\nThese dinners have quickly become one of my favorite traditions. It's been a great way to get to know people beyond the projects they're working on and hear perspectives from teams that don't always get to interact.\n\nExcited to host many more :)\n | 15 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQFrT_DfwxlSjA/feedshare-shrink_800/B56Z9hXggcGgAc-/0/1784044982061?e=2147483647&v=beta&t=VRU66vCprvp3NtCn4eXN7TpVCps_T30EscujPzH7sFs"},"https://www.linkedin.com/feed/update/urn:li:activity:7473630675984781312?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7473630675984781312%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"28 climate-tech startups to keep under your radar \ud83d\udd25\n\n(curated by Next Impact Europe) \n\n1) atmo: Turning farmland into a climate solution\n2) autarkize: Biochar and energy from waste\n3) BioFluff: Ditching animal fur for plants\n4) Bloomineral: Buildings that absorb carbon\n5) Carbon Cell: Carbon-negative foam \n6) Cooled Motors: EV motors without the rare earth\n7) Digiclean Solutions AB: No chemicals industrial cleaning\n8) DREV: Keeping EV batteries clean and safe\n9) Faircado: AI that makes secondhand your first choice\n10) Freshflow: AI that cuts supermarket food waste\n11) Grale (formerly PlasticFri\u00ae): Plant-based plastic \n12) Humara: AI that designs better waste facilities\n13) ilion Water Technologies: Cleaner desalination\n14) Infyos: Decoding the battery supply chain\n15) Kestrix: Google Maps of heat loss\n16) Level Nine: AI accelerating clean chemistry\n17) NANOPLUME: Insulation grown, not drilled\n18) Nyxium: AI optimising how energy flows\n19) Pollen: Swap your battery, skip the wait\n20) Poppins: Borrow local, consume less\n21) PulpaTronics: RFID tracking without the plastic\n22) Pureva: Clean water without the chemicals\n23) Recupere Metals: Copper from scrap, not mines\n24) Recycllux: Pulling plastic from the ocean, at scale\n25) Saveggy: Coating produce to cut food waste\n26) Shit2Power: Turning sewage into clean energy\n27) Tellia Ag: Voice AI bringing data to every farmer\n28) Treelyon: Making every tree count\n\n---\n\n\ud83d\udccd Want Europe\u2019s most important climate-tech & deeptech moves in your feed? Follow me @Hugo Rauch. | 29 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7477616567912996864?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7477616567912996864%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Meet Clara Ricard, Partner at Transition Ventures, backing founders rewiring the physical world. \u2699\ufe0f\n\nClara learned the craft of venture at Balderton. \n\nHaving seen both traditional venture and deep tech investing, she was the perfect person to ask why deep tech requires a fundamentally different playbook from software VC.\n\nIn this conversation, we discussed:\n\n\u2192 conviction over consensus\n\u2192 why SpaceX and Tesla move fast\n\u2192 what makes an exceptional founder\n\u2192 learnings from Fund I and raising Fund II\n\u2192 early bets in OLIX, Upway, Watershed, Reel and more! \n\nListen on your favorite platform\ud83d\udc47\n\nSpotify: https://lnkd.in/eQhThZfZ\nApple Podcast: https://lnkd.in/evB-AbXR\n\nIf you're building in hardware deep tech, \nYou'll want to meet Clara Ricard.\n\n---\n\nThank you to Hexa Sprint, Maxime and their climate acceleration program for hosting us in their studio. \ud83d\udd25 | 12 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQHUkTZ7Gmlb-A/feedshare-shrink_1280/B4EZ8TP0fVJgAM-/0/1782734342358?e=2147483647&v=beta&t=MjZ0URYXzd1Ouq7SHuvB8LkoLKM9kQC-V2CMBEAGhTo"},"https://www.linkedin.com/feed/update/urn:li:activity:7480889454321201153?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7480889454321201153%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"EU climate startups that just raised (now hiring) \ud83c\udf3f\n\nAll 19 of these companies are actively hiring across the board:\n\n1) Focused Energy (DE) - Laser fusion clean energy\n2) Sopht I B Corp certified (FR) -
