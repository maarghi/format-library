 Green computing\n3) Nelson (FR) - Fleet electrification software\n4) Isometric (UK) - Carbon removal certification\n5) Lithosquare (FR) - AI mineral exploration\n6) Rivan Industries (UK) - Synthetic natural gas\n7) CorPower Ocean (SE) - Wave energy converters\n8) Mantle8 (FR) - Natural hydrogen exploration\n9) Eclipse (FR) - Battery energy trading\n10) D-CRBN (BE) - CO\u2082 plasma conversion\n11) CMBLU Energy (DE) - Long-duration energy storage\n12) Barocal (UK) - Zero-emission cooling tech\n13) Reel (DK) - Renewable energy procurement\n14) Humara (ES) - Waste management software\n15) Digiclean Solutions AB (SE) - Chemical control\n16) Porelio (DE) - Water & air purification\n17) Exergy3 Limited (UK) - Thermal energy storage\n18) SOLAR MATERIALS (DE) - Solar panel recycling\n19) encosa energy (DE) - Battery storage solutions\n\nDid I miss one? \nTag them in the comments \ud83d\udc47\n\nBig thanks to Harmonic for the data \ud83d\ude4c\n\n---\n\n\ud83d\udccd Want Europe's climate-tech and VC moves in your feed? Follow me @Hugo Rauch or subscribe to my newsletter at the link below my name. | 20 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7483415140915138560?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483415140915138560%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"JUST IN: Syntetica raises a $30M Series A to scale its nylon recycling technology for textiles. \u267b\ufe0f\n\nI sat down with co-founder and CEO Marco Bertone for an exclusive interview on the technology, the fundraise and Syntetica\u2019s journey towards industrial production.\n\nListen on your favorite platform \ud83d\udc47\n\nSpotify: https://lnkd.in/gCJ9phmQ\nApple Podcasts: https://lnkd.in/gxyJctVy\n\nAnd if you\u2019re short on time, \n\nHere are the key details:\n\n\ud83d\udd25 $30M round led by Bpifrance Green Venture, with participation from SWEN Capital Partners, lululemon, MAS Holdings, EQT Ventures & Growth and several family offices.\n\n\ud83d\udd25 Syntetica\u2019s patented process can recover both major forms of nylon from mixed textile waste in a single process, opening access to a much larger pool of post-consumer waste.\n\n\ud83d\udd25 The company will use the funding to build its first commercial demonstration facility in France, in partnership with Michelin, targeting hundreds of tonnes of textile waste annually.\n\nCongrats to Marco, Louis and the entire team! \ud83d\udc4f\n\nLet\u2019s go!\n\n---\n\nThank you to Hexa Sprint, Maxime Brousse and their climate acceleration program for hosting us in their studio. \ud83d\udd25","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQEagMbM5MnyiQ/feedshare-shrink_800/B4EZ9nyw.NJ0Ac-/0/1784152789133?e=2147483647&v=beta&t=JIjQLi8z3GerU-Iszhh6UgZlah0MvLMZTjSqX5V6eOk"},"https://www.linkedin.com/feed/update/urn:li:activity:7468208635010056192?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7468208635010056192%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Paris has produced unicorns like Mistral, Qonto, Alan, ... \ud83c\uddeb\ud83c\uddf7\n\nBut people don't know the next wave is already being built. \n\nHere are the ones that still have startup energy: \n\nLucis (YC P25), Qobra, Pivot, Spore.Bio, Slite, Photoroom, Gladia, AMI - Advanced Machine Intelligence, Finary, Apiday, Formance, Plume (YC S24), Quivr (YC W24), Rayon.design, Alpic, Pasqal, Orus Energy, H Company, ...\n\n500+ open roles across the city. All free to explore on StartupMap.\n\n\u2192\u00a0link in first comment \ud83d\udc47\n\n\ud83d\udcac Which Paris startup is missing from this list?\n\n#paris #startups #paristech #europeanstartups #startupjobs | 68 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQEtzZfe2qQF-A/feedshare-shrink_800/B4DZ6RoLViIMAc-/0/1780559689977?e=2147483647&v=beta&t=DJkc_80FUDKW5ElHwgmjFtbVckUCQIlUDXLX0A9xau8"},"https://www.linkedin.com/feed/update/urn:li:activity:7480168229487841280?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7480168229487841280%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"13 years ago, four guys in Milan bought a keyboard app for $10,000. \ud83c\uddee\ud83c\uddf9\n\nLast week, their company got listed on the Nasdaq.\n\nBending Spoons takes old, forgotten software (Evernote, Vimeo, AOL, WeTransfer) and rebuilds it.\n\nIts four founders are now billionaires.\n\nHere's their story:\nIn 2013, four founders in Milan start with about $40,000 and buy their first app for $10,000. \n\nThe bet they took: \"don't build the next big thing. Buy software people already love but that's been left to rot, and make it great again.\"\n\nIt ends up working.\n\nThey buy WeTransfer. Then Vimeo, Evernote, Meetup, Eventbrite.\n\nRevenue goes from $387M (2023) to $1.31B (2025).\n\nOver 500 million people now use something they own.\n\nThen, July 2026, Bending Spoons lists on the Nasdaq, raising $1.68 billion.\n\nOne $10B+ company, from a city everyone books for fashion week.\n\nHere's the next wave, built in the same city:\nRatel, Sibill, Vibiz, JustSolve, Waveful, Tundr, Omney, Cosmico, Subbyx, Lexroom, Serenis, compri, Perpethua, Wiseair, Ephos, Cassandra, identifAI Labs\n\n100+ open roles across the city. All free to explore on StartupMap.\n\n\u2192 link in first comment \ud83d\udc47\n\n\ud83d\udcac Which Milan startup is missing from this list?\n#milan #italy #startups #europeanstartups #startupjobs | 74 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQH-YQr4lL82MA/feedshare-shrink_800/B4EZ87lWN_JgAo-/0/1783411074965?e=2147483647&v=beta&t=PHd-ND5V5QgCK3-NfmvrZgNVnB0e6T_va2TmRospQ6s"},"https://www.linkedin.com/feed/update/urn:li:activity:7447328492783972352?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7447328492783972352%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"The 2026 VC Tech Stack\n\nVC firms in 2026 are running on a very different stack than they were just a few years ago.\n\nHere are 16 categories and 48 tools shaping the modern VC workflow:\n\n\u21b3 Deal Sourcing\nEvertrace\nSynaptic\nHarmonic\n\n\u21b3 CRM / Deal Flow\nAffinity.co\nAttio\nAirtable\n\n\u21b3 Investment Data\nPitchBook\nDealroom.co\nCrunchbase\n\n\u21b3 Portfolio Mgmt\nVESTBERRY\nVisible.vc\nStandard Metrics\n\n\u21b3 Cap Table\nCarta\nPulley\nAngelList\n\n\u21b3 Deep Dives\nClaude\nPerplexity\nChatGPT\n\n\u21b3 Scheduling\nFyxer\nCalendly\nCal.com\n\n\u21b3 Inbound\nDeckmatch\nTally\nTypeform\n\n\u21b3 Fund Admin\nCarta\nAngelList\nAumni\n\n\u21b3 Legal / Docs\nPandaDoc\nDocusign\nScrive\n\n\u21b3 Fund Infra\nbunch\nCarta\nAngelList\n\n\u21b3 Outreach\nHeyReach\nPhantomBuster\nDripify\n\n\u21b3 Automation\nZapier\nClaude\nn8n\n\n\u21b3 Co-Invest / SPVs\nAngelList\nOdin\nSidecar\n\n\u21b3 Communication\nWhatsApp\nSlack\nSuperhuman\n\n\u21b3 AI / Research\nEvertrace\nAlphaLens\nHarmonic\n\nWhat\u2019s missing from the modern VC stack? | 126 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQHIgovh-TmSyg/feedshare-shrink_800/B4EZ1o5zJTHYAg-/0/1775581476492?e=2147483647&v=beta&t=Si6hrwUBLq8Jli3K_eDrkK3PslVcsVhG14HstSlamaE"},"https://www.linkedin.com/feed/update/urn:li:activity:7449352415872581632?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7449352415872581632%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We just launched a new data source in Evertrace: hackathons.\n\nWhy does that matter?\n\nBecause hackathons can reveal exceptional founders long before they show up in the usual places.\n\nThey show who is building early, who keeps shipping, who collaborates well under pressure, and who is already close to the problems they want to solve.\n\nAt Evertrace, we are always looking for datasets that help investors spot high-potential founders earlier and with more context.\n\nHackathons are one of those underrated signals.\n\nThis is now part of the Evertrace engine.\n\nMore hidden sources coming soon.","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQE5vVSo1XgY4g/feedshare-shrink_800/B4EZ2FqjBMIMAc-/0/1776064017150?e=2147483647&v=beta&t=b7Za1lSrm5IaGRqA90Ubp1xkJyGHLf0EVRihsalNFt0"},"https://www.linkedin.com/feed/update/urn:li:activity:7465123254798761984?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7465123254798761984%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"\ud835\udde7\ud835\uddf5\ud835\uddf2 \ud835\udde2\ud835\uddfd\ud835\uddf2\ud835\uddfb\ud835\uddd4\ud835\udddc \ud835\uddfa\ud835\uddee\ud835\uddf3\ud835\uddf6\ud835\uddee \ud835\uddf6\ud835\ude00 \ud835\uddfa\ud835\uddfc\ud835\ude03\ud835\uddf6\ud835\uddfb\ud835\uddf4 \ud835\uddf3\ud835\uddee\ud835\ude00\ud835\ude01 \ud83d\udd25 \n\nA new wave of ex-OpenAI talent is quietly starting companies and the speed at which these teams can build is unlike anything we\u2019ve seen before.\n\nWhen you spend years at the frontier of AI research and infrastructure, you compress an insane amount of experience into a very short period of time. That compounds.\n\nSome names worth paying attention to:\n\u2022\u2060\u00a0\u2060Eddie Zhang - Stealth\n\u2022\u2060\u00a0\u2060Kyle Kosic - Stealth\n\u2022\u2060\u00a0\u2060Jason Zhang - Stealth\n\u2022\u2060\u00a0\u2060Ian Goodfellow - Stealth\n\u2022\u2060\u00a0\u2060Mi Yang - Celvion Therapeutics\n\u2022\u2060\u00a0\u2060Giulio Starace - Paradigma\n\u2022\u2060\u00a0\u2060Phil C.  - Stealth (https://lnkd.in/d2prADWF)\n\u2022\u2060\u00a0\u2060@Nathan H. - Syntony = https://lnkd.in/dcW7hxQP\n\nMost of these companies are still under the radar. Probably not for long.\n\nHow did we find them? Thanks to Evertrace\n\nThey\u2019re building one of the most interesting datasets for tracking emerging founders before they show up everywhere else.\n\nSave this so you can reach out to these founders later and follow me for the best AI Mafia founders \ud83d\udd25  | 34 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQEg0pf1_RMlQA/feedshare-shrink_800/B4DZ5lyCmTGcAg-/0/1779824077575?e=2147483647&v=beta&t=UpJ9MuCHEPwD3rknW4GVeYenWPBp2aZkGeNiBHNeOJw"},"https://www.linkedin.com/feed/update/urn:li:activity:7467833141081165824?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7467833141081165824%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Siemens might be Europe's best climate-tech incubator. \ud83d\udd25\n\nHere are 15 ex-Siemens now building in climate: \n\n1. Flix (Daniel Krauss): Sustainable long-distance bus & train travel.\n\n2. Atlas Agro (Dan Holmes): Zero-carbon nitrogen fertilizers.\n\n3. osapiens (Matthias Jungblut): Corporate sustainability platform. \n\n4. cylib (Gideon Schwich): EV battery recycling. \n\n5. trawa (Max L\u00fcddemann): AI-driven energy procurement. \n\n6. EcoG\u00a0(Joerg Heuer &  Johannes Hund): Universal EV charger control. \n\n7. Rabot Energy (Maximilian Both): Dynamic electricity tariffs. \n\n8. carbmee (Robin Spickers): Scope 3 carbon management. \n\n9. ocell\u00a0(Christian Decher): AI-powered forest management. \n\n10. Optiml (Nico Dehnert): Real estate decision intelligence for asset value, yield increase, and sustainable transition pathways.\n\n11. Aistech Space (Guillermo): Satellite imagery for environmental monitoring. \n\n12. Lumenaza GmbH (Christian Chudoba): Connecting green energy producers with consumers. \n\n13. Dunia (Alexander Hammer): AI for electrochemical materials discovery. \n\n14. Factor2 Energy (Felix B\u00f6hmer): CO\u2082-based geothermal power generation. \n\n15. silana (Anton Wohlgemuth): Robots reducing carbon in garment production. \n\nI found the data on Evertrace. \n\n---\n\n\ud83d\udccd Want more EU Climate Tech insights? Follow me @Hugo Rauch for daily updates.","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7470748744464986112?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7470748744464986112%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Denmark has produced unicorns like Trustpilot, Pleo & Zendesk ... \ud83c\udde9\ud83c\uddf0\n\nBut the next wave is already being built.\n\nHere are the ones that still have startup energy:\nkapa.ai, KIME, Evertrace, Performativ, Subsets, Teton.ai, Complir, Go Autonomous, Interhuman AI, Januar, Kiku, Light, Neumirna Therapeutics, Muna Therapeutics, Nordic Salt Cycle, Rock Flour Company, Propane, Reshape Biotech, Sumary, Zoios\n\n350+ open roles across the city. All free to explore on StartupMap.\n\n\u2192 link in first comment \ud83d\udc47\n\n\ud83d\udcac Which Copenhagen startup is missing from this list? Submit them here: https://lnkd.in/d-8TymYW\n\n#copenhagen #startups #denmarktech #europeanstartups #startupjobs | 79 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQGF_5ffctAZCw/feedshare-shrink_800/B4DZ61uZP7JAAk-/0/1781165299607?e=2147483647&v=beta&t=OFogMqIdvtpaDK8FiUdGGoBRT8D3IUtQ4rsBnTeDt3U"},"https://www.linkedin.com/feed/update/urn:li:activity:7477780424728068097?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7477780424728068097%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"\ud835\udde6\ud835\ude01\ud835\uddfc\ud835\uddf0\ud835\uddf8\ud835\uddf5\ud835\uddfc\ud835\uddf9\ud835\uddfa \ud835\udde0\ud835\uddee\ud835\uddf3\ud835\uddf6\ud835\uddee \ud83c\uddf8\ud83c\uddea\n\nSome of the most interesting AI startups are now coming out of Stockholm.\n\nOver the past decade, the city has produced operators from companies like Lovable, Spotify, Legora and Klarna, teams that have built products used by millions of people.\n\nNow, many of them are leaving to build their own companies.\n\nA few founders worth watching:\n\n\u2022 Oscar Antonio Borlund O. (Stealth)\n\u2022 Pauline Astier (Stealth)\n\u2022 Ryan Kim (Stealth)\n\u2022 Joakim Olovsson (Poneva)\n\u2022 Jonas Rosengren (Tandela)\n\u2022 Alexander Wikstr\u00f6m (Blaise)\n\nMost of these companies are still under the radar. Probably not for long.\n\nHow did we find them?\n\nThanks to Evertrace.\n\nThey\u2019re building one of the most interesting datasets for tracking emerging founders before they show up everywhere else.\n\nWould definitely recommend checking it out! | 35 comments on LinkedIn","author":"Guillermo Flor","image":"https://media.licdn.com/dms/image/v2/D4D22AQHfalnrpTljBw/feedshare-shrink_800/B4DZ8ZprCNI0Ac-/0/1782841782860?e=2147483647&v=beta&t=zp_opVbV46dSZhoxvnPAjwr-me82DAu8hEcwyyr5IPE"},"https://www.linkedin.com/feed/update/urn:li:activity:7480595363813576704?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7480595363813576704%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Revolut is now the UK's biggest producer of new founders \ud83c\uddec\ud83c\udde7 \n\nAnd it isn't close.\n\nJacob Graubaek Houlberg co-founder of Evertrace looked at which universities produce the most founders in Europe.\n\nThe answer turned out to be almost entirely British. So they asked the obvious next question: which British companies produce the most founders?\n\nThey mapped where newly detected British founders worked before they started up.\n\nThe top 5:\n\n1. Revolut\n2. Deliveroo\n3. Wise\n4. Monzo\n5.\u00a0Checkout.com\n\nMost people expected Revolut to lead. Almost nobody expected this much of a gap.\n\n~130 ex-Revolut people founded a company or went into stealth in the last 12 months \ud83e\udd2f\n\nThat's more than Wise (#3) and Monzo (#4) combined.\n\nAnd the pattern holds all the way down. 4 of the top 5 are FinTech that didn't exist 15 years ago.\n\nBut on sheer numbers, Revolut is far ahead of everyone.\n\nSubscribe to my newsletter for more insights: https://lnkd.in/dzj26JSZ\n\n\nFind this helpful? [ \ud835\uddff\ud835\uddf2\ud835\uddfd\ud835\uddfc\ud835\ude00\ud835\ude01 ]\nAnything to add about this subject? [ \ud835\uddf6\ud835\uddfb\ud835\ude03\ud835\uddf6\ud835\ude01\ud835\uddf2\ud835\uddf1 \ud835\ude01\ud835\uddfc \ud835\uddf0\ud835\uddfc\ud835\uddfa\ud835\uddfa\ud835\uddf2\ud835\uddfb\ud835\ude01 ]\nNice story, Marcel. Next! [ \ud835\uddf9\ud835\uddf6\ud835\uddf8\ud835\uddf2 ] | 10 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQGnYvHEVvDA0Q/feedshare-shrink_800/B4DZ9Bp2I4K0Ac-/0/1783512916798?e=2147483647&v=beta&t=E6yphMo0UVuCi51OGMfYlxOW1dbQyJXl8e9_9Rcq91g"},"https://www.linkedin.com/feed/update/urn:li:activity:7482829466428366848?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7482829466428366848%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"\ud835\udde7\ud835\uddf5\ud835\uddf2 \ud835\udde3\ud835\uddee\ud835\uddf9\ud835\uddee\ud835\uddfb\ud835\ude01\ud835\uddf6\ud835\uddff \ud835\udde0\ud835\uddee\ud835\uddf3\ud835\uddf6\ud835\uddee \ud83d\udd25 \n\nSome of the most interesting AI startups are now being built by former Palantir operators.\n\nOver the past two decades, the company has produced operators who have built some of the most complex and mission-critical software systems in the world.\n\nNow, many of them are leaving to build their own companies.\n\nA few founders worth watching:\n\u2022\u2060\u00a0\u2060James Neale (Stealth)\n\u2022\u2060\u00a0\u2060Luis Salinas (Stealth)\n\u2022\u2060\u00a0\u2060Oscar S\u00e1nchez (Stealth)\n\u2022\u2060\u00a0\u2060Natacha Gabbamonte (Stealth)\n\u2022\u2060\u00a0\u2060Nick Weatherburn (Stealth)\n\u2022\u2060\u00a0\u2060Murad Awad (Stealth)\n\nMost of these companies are still under the radar. Probably not for long.\n\nHow did we find them?\n\nThanks to Evertrace.\n\nThey\u2019re building one of the most interesting datasets for tracking emerging founders before they show up everywhere else.\n\nWould definitely recommend checking it out! | 17 comments on LinkedIn","author":"Guillermo Flor","image":"https://media.licdn.com/dms/image/v2/D4D22AQFYVChWFRmiFQ/feedshare-shrink_1280/B4DZ9hZvybK0AM-/0/1784045567704?e=2147483647&v=beta&t=eCq6I8q83mBFyII_tM-HxoEiqTWVyJXsmDbDYCugeoE"},"https://www.linkedin.com/feed/update/urn:li:activity:7462525853562990592?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7462525853562990592%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I'm assembling a team at Clay that I've been affectionately calling the \"Clayvengers\".\n\nHere's why.\n\nAt most companies, education, community, learning, and enablement are second-class citizens. They get a senior leader (*maybe* two), a junior team to \"check the box,\" and are rarely included in first order business priorities. \n\nThe investment is proportional to how seriously the company takes it \u2014 which is to say, not very.\n\nClay has always thought about community and learning differently. From day one.\n\nIt started with reverse demos \u2014 instead of showing people what Clay could do, we had them follow along and do it themselves. We wanted people to *feel* the power of the tool, not just watch someone else use it.\n\nThat philosophy grew into Clay University. Into cohorts. Into a deeply invested Slack community. Into in-person workshops around the world. Into a credentialing ecosystem that we're building from scratch to set a new standard in a rapidly evolving AI native world.\n\nAnd now we're doing something I have yet to see another company do: we're hiring a team of *absolute rock stars* \u2014 each one best-in-class at their craft \u2014 to build community, learning programs, talent certifications, and enablement at a scale that matches our ambition.\n\nNo check-the-box hires. No \"one amazing person and a bunch of junior support.\" Every person on this team is a founder in their own right, and could be doing a *variety* of other things - but is *choosing* to be a part of something special, together, with us.\n\nSo for the next couple of days, I'm going to highlight each of the amazing people on our team, and the unique superpowers that make them special. \n\nToday, we're introducing our Captain America: Natalie Sportelli .\n\nNatalie's career is ... not what you'd expect for someone leading a startup ecosystem. She started at Forbes, where she helped build the 30 Under 30 franchise. Then she led brand and content for Lerer Hippeau, one of NYC's most active early-stage VC firms. She was employee #4 at Thingtesting (later acquired by ShopMy). Then she was a Director at Bullish, an early-stage consumer VC firm and creative agency, where she was both an investor and led marketing.\n\nJournalist \u2192 VC \u2192 startup operator \u2192 investor \u2192 ecosystem builder.\n\nThat path doesn't exist in a playbook. She created it.\n\nAnd then she created her own role at Clay. She came to us with a vision for what the startup ecosystem could look like, pitched it, and knocked it out of the park. \n\nHere's all the open roles we're hiring for right now: \n\nHere's what we're looking for:\n\n- GTME Talent Lead - https://lnkd.in/e5ZRek9H \n\n- Community Strategy & Ops - https://lnkd.in/egH5Gfrh\n\n- Ecosystem Programs Lead - https://lnkd.in/ecVajYHS\n\n- Startup Programs Lead - https://lnkd.in/enuu5FAs\n\n- GTME University Lead - https://lnkd.in/ekCJjYAF\n\n- GTME & AI Teacher - https://lnkd.in/eM57gsu9 \n\n- Create Your Own Role - https://lnkd.in/eTzv9RNY | 45 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQHFRKxE4a0PPw/image-shrink_1280/B4EZ5A3t5WI0Ac-/0/1779204808727?e=2147483647&v=beta&t=XGl4ZXTH1VYfuew4yb8ZO7eRd7IqkIvLFneIgBzO7q0"},"https://www.linkedin.com/feed/update/urn:li:activity:7447309369983160320?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7447309369983160320%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"From the moment WHOOP became worth $10B to the moment I first finished the Whoop\u00a0business plan. Close to 14 years apart. I remember taking a picture of this business plan in a delirious state having stayed up all night writing it. \u201cYou\u2019re going to want to remember this.\u201d\n\nI really didn\u2019t know what I was doing when I started Whoop. I was 22 yo, naive and inexperienced, and somehow all of that turned out to be helpful. If you want to start something and you look at any success I\u2019ve had and you say \u201cwell I can\u2019t do that,\u201d just know that I couldn\u2019t do it either when I first started. The entrepreneur\u2019s journey is a lonely and hard one, you\u2019ll face more rejection than you have ever had in your life. But you get better as it gets harder. And IT IS WORTH IT. \n\nYou can solve a problem in the world that needs to be solved and you can build your dream job. It\u2019s possible. That\u2019s the amazing thing. Go for it \ud83d\udc4a\ud83c\udffc\n\n#entrepreneurship #startup #whoop  | 263 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFZ1n-jzqhGCg/feedshare-shrink_800/B4EZ1ooZuQJ4Ac-/0/1775576916660?e=2147483647&v=beta&t=k4IG6mxcbK6Rmh2jxLORjSuE88OLYQmTJKRsZtQaXGA"},"https://www.linkedin.com/feed/update/urn:li:activity:7454884992494546944?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7454884992494546944%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"INTRODUCING NAVIGATOR \ud83e\udded\ud83c\udfd4\ufe0fOur most rugged and secure band ever. \n\nSince founding WHOOP in 2012, we\u2019ve held an incredibly high bar for introducing new band architectures. Our SuperKnit band is iconic for a reason, and we don\u2019t move beyond it lightly.\n\nNavigator began as an idea years ago from member feedback: \u201cI want a band that no matter what, under any circumstances, will not come off.\u201d In the early stages, we weren\u2019t even sure if we could develop something that addressed this issue while meeting our brand standards. But as the designs evolved, something became clear: this was a band that captured the spirit of adventure that defines so many WHOOP members.\n\nNavigator is built for the outdoors - with an ultra-secure fit, a no-slip adjustable closure, and abrasion-resistant materials designed to perform in any environment. It\u2019s a band that emphasizes utility without compromising comfort. It reflects how our members actually live, train, and explore. And it definitely won\u2019t come off.\n\nNavigator is available starting today. Can\u2019t wait for you to put it to the test in your next adventure \ud83d\udc4a\ud83c\udffc\n\nLearn more here: https://tr.ee/QUClj5\n\n#whoop #product #accesories #launch | 70 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGzZc8vCTnUDQ/feedshare-shrink_800/B4EZ3USY_ZJkAk-/0/1777383084852?e=2147483647&v=beta&t=tm7Z4lMCDPdwwFZ_Z6fHZvXTQ8Cu8_s5SaN5qMJm2iU"},"https://www.linkedin.com/feed/update/urn:li:activity:7483243616484667392?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483243616484667392%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Welcome to WHOOP!\n\nEvery month, I have the opportunity to welcome our newest team members to the company. It's a tradition we've kept for more than a decade. \n\nAt the start of the year, we announced our plan to hire over 600 people. This month, we added more than 100 alone. Our largest Welcome session ever.\n\nIt doesn't feel that long ago that I was personally interviewing each person we hired.\u00a0I no longer have the chance to do that. But it\u2019s important to me to meet every new member of our team and share what success looks like at Whoop.\n\n#hiring #newhires #whoop #boston | 191 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQEdRlH1LkmuUg/feedshare-image-high-res/B4EZ9nSaegIcAU-/0/1784144309111?e=2147483647&v=beta&t=xGaM_imyt9hh4hoJbjASxhWMfbGjtEfOjsPhPfBzMpM"},"https://www.linkedin.com/feed/update/urn:li:activity:7477375343746547712?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7477375343746547712%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Just crossed 10k followers. Let me reintroduce myself.\n\nHey:) I'm Tim, 22, in between sf and Switzerland, building my GTM SaaS.\n\nI used to be a Swiss karate national team athlete (competing at junior Europeans and world championships, winning bronze at the youth Europeans), so I've always been driven by goals.\n\nAt 18 I knew I wanted to become an entrepreneur in the tech industry, so I took a massive risk to not go the conventional route and get a degree.\n\nI started my career as a freelance automation engineer. Felt like being kicked down a staircase trying to learn how to walk.\n\nAs a 19 year old I closed multinational enterprise clients and managed projects where +40 people and teams relied on the systems I built for them, and I trained their teams. \n\nSo this was the time I learned responsibility, and as a teenager it was very overwhelming.\n\nI then specialised in GTM Engineering. I built a small agency and had the pleasure of helping +20 B2B tech companies with their GTM motion as a consultant and freelancer.\n\nIn 2025 I decided to build a LinkedIn AI SDR and thought I was ready to scale that company. Led a team of 4 people and essentially burned through $20k of my savings in that year. ouch. \n\nThat venture failed, but taught me a lot about what it takes to build a SaaS company. So now I'm taking this experience and the previous 3 years in GTM engineering to build OXYGEN.\n\nA big thank you to everyone who supported me and followed along the journey. I continue to try to document the journey as authentically as possible.  | 35 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGRhdOI_T3OmQ/feedshare-shrink_1280/B4EZ8PwKdbHMAM-/0/1782675712158?e=2147483647&v=beta&t=CYOqO3dWjoffAkZZu2znm1kZBkdZHmlCMCaT_KrYBGU"},"https://www.linkedin.com/feed/update/urn:li:activity:7480274536182054912?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7480274536182054912%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"booked +120 demo calls for our saas in the past 90 days on LinkedIn.\n\nI sat down for 6h and open-sourced our whole setup.\n\nIt takes me one Sunday afternoon to write all 5 posts for the week.\n\nOn top of that we run a tracking system that captures everything the content pulls in: \n\n1) post engagers\n2) profile viewers\n3) new followers \n4) new connections\n\nIt scores them against our ICP, then runs outbound to actually convert that traffic. Most people just let it evaporate.\n\nIn the guide I walk you through all of it:\n\n\u2192 How we drive the top-of-funnel traffic (669,000 impressions in 90 days)\n\u2192 The workflow template that captures all these signals\n\u2192 How we use AI to score them against our ICP\n\u2192 How we convert them in the DMs, with our exact script\n\nI also threw in 2 training videos and a bunch of bonuses. Our cold email setup, a few other things. If you want it: \n\n[1] Connect with Tim Scheuer (gotta do that, so that I can send it)\n[2] Comment \"system\"\n\nand I'll send it over :) | 147 comments on LinkedIn","author":"","image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQEugpAtZ5XLkA/thumbnail-with-play-button-overlay-high/B4EZ8xG.4tIAC0-/0/1783235345054?e=2147483647&v=beta&t=blE33_LcwgcglFp10x_gj8EZ3p_JZ3Abi4PwRsAwRyE"},"https://www.linkedin.com/feed/update/urn:li:activity:7483493643912163331?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483493643912163331%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"6.5M people just watched a designer nudge text boxes for two minutes. Hundreds of iterations, all but one ending up in the (virtual) bin: \n\nThis is Susanna Hayward, Art Director at New York Magazine, designing a Jimmy Kimmel feature. \n\nHundreds of iterations. Type resized, recoloured, killed, resurrected. \n\nAI would label that inefficient, would land on the first plausible answer and accept it as final. As \"good enough\" / satisfying the prompt. \n\nBut taste, character, human experience doesn't live in a prompt - it's built through trial, error, and very human inefficiency. \n\nThe willingness to throw away \"OK\" in the search of better. \n\nThe creative process is a moat. And increasingly, it's the content too. \n\nVia @dsgnevrywhr (X) | 161 comments on LinkedIn","author":"","image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQEhraA3aymVgg/thumbnail-with-play-button-overlay-high/B4EZ9q1xhPIsC4-/0/1784203910820?e=2147483647&v=beta&t=ihZ5a96ecUdpTCGqJVIejiPprX7Eg79fwFVEWPqvAuY"},"https://www.linkedin.com/feed/update/urn:li:activity:7483516229710786562?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483516229710786562%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Lionel Messi bathed a random 5-month-old baby in 2007.\n\nOn Sunday, they're facing each other in the World Cup final.\n\nIf this happened in a movie, people would call it unrealistic.\n\nBack in 2007, Barcelona and UNICEF held a charity raffle.\n\nFamilies who won got a professional photoshoot with a Barcelona first-team player.\n\nOne family was randomly paired with a 20-year-old Lionel Messi.\n\nThe baby was Lamine Yamal.\n\nMessi was still wearing Barcelona's No. 19 shirt.\n\nNearly two decades later, Yamal became Barcelona's next teenage superstar.\n\nHe wore the same No.19 shirt.\n\nAnd now, at just 19 years old, he'll be standing across from Messi in the biggest game in football.\n\nHe\u2019s also posted this same picture in the past\u2026calling it the \u201cGolden Touch\u201d\n\nWe spend so much time trying to predict the future.\n\nThe truth is, some of the moments that shape our lives don't look important when they happen.\n\nThis is really insane! | 43 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQH6vlX4xvRekQ/feedshare-shrink_800/B56Z9rKWv.G8Ac-/0/1784209304943?e=2147483647&v=beta&t=1vOu8AG8sLFtzoOoaWgWRuu8rj6Av5WiQf1Qyui5VZs"},"https://www.linkedin.com/feed/update/urn:li:activity:7482403555383947264?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7482403555383947264%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I\u2019ve been posting on LinkedIn for 1 year now (12 months). \n\nHere\u2019s 12 things I do when it comes to creating content:\n\n1 - content > everything else. I don\u2019t care what time of day I post. If the content is good then the post will do good. \n\n2 - I don\u2019t post \u201cjust to post\u201d. It\u2019s relaxing when you don\u2019t have the pressure to post every day. \n\n3- I try to ask for opinions, input, help, etc\u2026people love helping other people. They also love their opinions. You want to spark convos in your comment section. You don\u2019t want to be the person with 200 likes on a post and only 4 comments. \n\n4- once you start posting, it\u2019s like a snowball effect. You\u2019ll keep getting more ideas from your old posts / comments on your posts as you go. You will NOT \u201crun out of things to post\u201d.\n\n5- engage with people outside your circle that you\u2019re not connected with. You don\u2019t want to get caught in a bubble of only people you know. You won\u2019t reach new audiences if you do it this way. \n\n6- I try to optimize for saves, sends, comments, and how many conversations in the DMs I get from my posts. Everyone\u2019s goals here are different. But I believe everyone should strive for meeting new peeps in the DMs. \n\n7- you don\u2019t have to \u201cprovide value\u201d in every post. Sometimes the value people need is seeing someone else struggle, or seeing someone else post about their normal day, etc. \n\n8- there are more people watching you than you think. Countless times I\u2019ve had people say they \u201clove my content\u201d. Yet I\u2019ve never seen them like / comment / view my profile. \n\n9- I do NOT do engagement pods. This absolutely kills your reach\u2026and come on y\u2019all. Why do this? Let your posts grow organically. Focus on creating good content that people will want to react to without you sending them the post link or tagging them in your post. \n\n10- don\u2019t take things too seriously. I try to have fun and not care about my reach. Just wanna meet new folks. \n\n11- in my experience, your most liked posts will come to you on a whim and take you 30 seconds to write. But your posts that get the most saves will be the ones you spend the most time on. \n\n12- I ran out of things to say. \n\n\nThis is all stuff that works for me. Everybodys goals are much different. So don\u2019t take this and fully apply it to your situation. \n\nHopefully I shared some helpful stuff. I\u2019m sure I missed lots, but it\u2019ll come to me when people drop comments. Then that\u2019ll give me new ideas for future posts. And that\u2019s the snowball effect. \n\nIf you\u2019re on the fence about posting\u2026listen to nike and just do it\u2714\ufe0f\n\n\nP.S. Here\u2019s a note tab I made last July.  Cool to see this compound over time. Consistency is key. My Goal is to have 40k followers by next July! | 87 comments on LinkedIn","author":"Kade Hinkle","image":"https://media.licdn.com/dms/image/v2/D4E22AQHHgxy8fc3EuQ/feedshare-image-high-res/B4EZ9ZkoQ8KIAU-/0/1783914202606?e=2147483647&v=beta&t=10y9LE0GNccF3oGLMnuhFvXWawg9CKlQuIMZSyu8pv8"},"https://www.linkedin.com/feed/update/urn:li:activity:7483188900488945664?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483188900488945664%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Here's exactly what 9-5 looks like as a founder/CTO in SF:\n\n- Back to back meetings\n- Interviews\n- Deal review\n- Customer calls\n- Strategy sessions with Aaron Cannon \n- Engineering leadership syncs\n\nAnd if you're thinking \"well when does he do any kind of deep work?\"\n\nNights and weekends. Not sexy, but true. \n\nA year ago I was writing code every day. Now I spend my time making sure information flows from team to team. \n\nThe role of a founder shifts drastically as the team scales and Outset is growing at a rapid rate. \n\nMy output between 9a-5p is no longer the work itself but making sure everyone else has what they need to do their best work. \n\nSome founders resent this shift. I've stopped fighting it. \n\nCode I use to write would ship one feature. The machine I'm building inside this team ships everything.\n\nRole looks a bit different but the goal is the same: Build a winning product, team and culture. \n\nTime to scale. \n | 16 comments on LinkedIn","author":"Michael Hess","image":"https://media.licdn.com/dms/image/v2/D4E10AQHN3-nCR6zt7g/image-shrink_800/B4EZ9mgpopIkAg-/0/1784131263829?e=2147483647&v=beta&t=uF31XNbVBFWt32GPftUX0b6riy47PgREt-htAO2CAA0"},"https://www.linkedin.com/feed/update/urn:li:activity:7467960371958398976?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7467960371958398976%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Most companies spend 1 week onboarding summer interns.\nWe hand them the keys on their first day. \n\nAndrew edited his 1st video before he knew where the bathroom was. \nHanz was redesigning part of our product on day 2. \nChloe and Noelle were on customer calls after 1 day of onboarding. \nTilak was running growth experiments after his first meeting. \n\nWe didn't ease them in. We just trusted them. \nIt's a belief we've held since we started Rilla. \n\nEvery single one of them had that look during their interview with me. \nLike they'd been waiting for someone to finally let them run. \nSo we let them run. \n\nWatching what they've built, shipped, and figured out in just a few weeks has reminded me why we hire the way we do. \n\nShip fast, break things, figure it out. That's the curriculum. \nHigh agency from day one. It\u2019s how you actually learn. \n\nThink you have that fire in you too?\nMessage me. We'll see where you fit in.  | 27 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQFDKSe04uNmYQ/feedshare-shrink_800/B4EZ6OGYUiIwAc-/0/1780500499496?e=2147483647&v=beta&t=bHPAy__n1W6hflnjnE-siG75Flfeu3uOJq6msrhYXk0"},"https://www.linkedin.com/feed/update/urn:li:activity:7469434891924017153?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7469434891924017153%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Two co-working buddies under two","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQGqocyrheDomA/feedshare-shrink_800/B4DZ6jDc9RGcAc-/0/1780852052443?e=2147483647&v=beta&t=FLj9gAd6AoIAbELkhSChD4i129PBgV93jsuR-ngv9tw"},"https://www.linkedin.com/feed/update/urn:li:activity:7475591193049935872?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7475591193049935872%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"This Twitter thread is a goldmine for anyone looking to join a startup\n\n60+ startups actively hiring in this thread\n\nBest move is to pick 2-3 and send a thoughtful DM\n\nA few of the companies that chimed in the thread:\n\u05bb\u2022\u00a0RevenueCat - remote\n\u2022\u00a0PostHog - remote\n\u2022\u00a0ElevenLabs - Most roles remote\n\u2022\u00a0VeryAI - US Remote\n\u2022\u00a0Raindrop - SF\n\u2022\u00a0Artie - SF \n\u2022\u00a0Together AI - Mostly in SF\n\u2022\u00a0Descript - SF & Remote\n\u2022\u00a0FirstQA - Remote\n\u2022\u00a0Sapiom\n\u2022\u00a0Corgi\n\u2022\u00a0Magic Patterns - SF\n\u2022\u00a0Baseten - SF & NYC\n\u2022\u00a0KleePay\n\u2022\u00a0Mintlify - SF & NYC\n\u2022\u00a0Slash - SF\n\u2022\u00a0Nozomio - SF\n\u2022\u00a0Engine - Remote or NYC\n\u2022\u00a0169Pi - Mumbai & SF\n\u2022\u00a0Yolando - Toronto (office) + Canada (remote)\n\u2022\u00a0PumaAi (Puma Browser + Puma.tech) - SF, remote\n\u2022\u00a0Reducto - SF\n\u2022\u00a0Extend - NYC\n\u2022\u00a0Profound - NYC, San Francisco, London\n\u2022\u00a0fal - SF\n\u2022\u00a0Distyl - SF/NYC\n\u2022\u00a0Parallel Web Systems - SF/Palo Alto\n\u2022\u00a0Granola - London + SF\n\u2022\u00a0Glean - Globally\n\u2022\u00a0Lucis (YC P25) - Paris\n\u2022\u00a0Cursor - SF / NYC / global\n\u2022\u00a0Lindy - San Francisco (onsite/hybrid)\n\u2022\u00a0Basedash - Remote US/Canada\n\u2022\u00a0Type - NYC/SF\n\u2022\u00a0Supabase - Globally remote\n\u2022\u00a0Rho - NYC | 36 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGOoqbuW8AqFA/feedshare-shrink_1280/B4EZ76ik4eHwAQ-/0/1782319828865?e=2147483647&v=beta&t=AZPZSxH4FKrDFv4iAYkLB66yjn-OwtZVtinNtl29a1w"},"https://www.linkedin.com/feed/update/urn:li:activity:7483236938150207489?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483236938150207489%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Anthropic engineer nailed it:\n\n\u201cYou\u2019re not supposed to prompt Claude. You\u2019re supposed to build a system that prompts itself.\u201d\n\nOne of the clearest breakdowns of real agent systems I\u2019ve seen.\n\nIn just 30 minutes, Anthropic\u2019s Member of Technical Staff breaks down how to build agents that actually improve:\n\n\u2192 The evolution from basic CLAUDE .md files to agents writing their own memory\n\u2192 Why in-band memory hits hard limits, and splits focus at scale\n\u2192 How \u201cdreaming\u201d lets agents review sessions, learn from mistakes, and get smarter between runs\n\u2192 The production guardrails (versioning, concurrency) that make self-improving systems work\n\nCoupled with this Loop Engineering Guide, you will never prompt Claude the same again: https://lnkd.in/dVW6TGiB\n\nInstead of watching another Netflix show tonight, watch this talk. | 243 comments on LinkedIn","author":"","image":"https://dms.licdn.com/playlist/vid/v2/D4D05AQGxzFjnCh3uGg/thumbnail-with-play-button-overlay-high/B4DZ9nMF0pJ4C0-/0/1784142658741?e=2147483647&v=beta&t=GRg0grgvWBlg-bo-lJFskai_0mBypY8Pfgq_OLqk-xk"},"https://www.linkedin.com/feed/update/urn:li:activity:7483224187294384128?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7483224187294384128%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Does your city make the startup top 10?\n\nOkay, maybe not overall (this is based on dollars raised, so that's pretty tough to break into for smaller ecosystems). But how about in a specific vertical? \n\nPlaces that are not the Bay Area appearing in these rankings include:\n\n\u2022 Salt Lake/Provo\n\u2022 San Diego\n\u2022 Research Triangle\n\u2022 Baltimore\n\u2022 Minneapolis\n\u2022 Cleveland\n\u2022 Philly\n\u2022 Phoenix\n\n\ud835\udddc\ud835\uddfb\ud835\ude01\ud835\uddf2\ud835\uddff\ud835\uddf2\ud835\ude00\ud835\ude01\ud835\uddf6\ud835\uddfb\ud835\uddf4 \ud835\udddc\ud835\ude01\ud835\uddf2\ud835\uddfa\ud835\ude00\n\n\u2022 Bay Area takes 40 cents of every venture dollar overall and 51 cents of every dollar invested in AI.\n\u00a0\u00a0\n\u2022 NYC is a strong second, expanding the lead over Boston in 3rd.\n\u00a0\u00a0\n\u2022 Medical Devices has the most varied and unique ranking, with different cities involved. Perhaps a quirk of history but cool!\n\u00a0\u00a0\n\u2022 Austin showing up strong again in Hardware and AI.\n\u00a0\u00a0\n\u2022 Miami Fintech probably includes a little crypto at the margins but is real.\n\u00a0\u00a0\n\u2022 Houston shows up in the overall top 10 but not in the sector-specific ones because of a few very large Energy rounds.\n\nHow'd your city do?  | 158 comments on LinkedIn","author":"Peter Walker","image":"https://media.licdn.com/dms/image/v2/D5622AQHwIAVLpyjBpw/feedshare-shrink_800/B56Z9nAvajH4Ac-/0/1784139676857?e=2147483647&v=beta&t=OP-hh4P699FPkdLRyQ7U0s_VHmyGtkt4T1Q0WlUPh98"},"https://www.linkedin.com/feed/update/urn:li:activity:7474780661728387072?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7474780661728387072%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"British Prime Minister Keir Starmer resigned 90 minutes ago. We simulated who UK MPs want to lead The Labour Party next, and who they think the public want.\n\nWe built an Artificial Society of current members of the UK Parliament, made of lookalikes that mimic their belief systems and influence systems, all built from their anonymised public footprints.\n\nWe asked the simulated MPs two survey questions their physical counterparts can't answer in real life:\n\n1. Who would you personally most want to become the next leader of the Labour Party?\n\n2. Who do you think the British public would most want to become the next leader of the Labour Party?\n\nAnd here are the results. Comment below what questions you want to ask the Artificial Parliament as the situation unfolds. | 17 comments on LinkedIn","author":"","image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQHqDyskBUl6Iw/thumbnail-with-play-button-overlay-high/B4EZ7vBW7pHkC0-/0/1782126573923?e=2147483647&v=beta&t=V0NWzn5-pNSfmdsRAbo2x7Wc-9PpXAXvbzHqWmMd8aU"},"https://www.linkedin.com/feed/update/urn:li:activity:7482782480534544385?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7482782480534544385%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I'm the Head of AI at Clay. For the past 2 years, I've had a front-row seat to what the top 1% of GTM teams are doing at brands like Ramp, Cursor, and Anthropic. There's one thing they do that sets them apart from the rest.\n\nThey launch completely new GTM plays every 4\u20136 weeks. \n\nIn 2026, that's about how long a winning GTM play lasts before it stops working.\n\nNo matter how great their current GTM motion might be, the best GTM teams know a cliff is coming. So they've changed the way their teams work, and now they operate more like engineers. \n\nIt makes sense when you think about it.\n\nEngineering has had best practices around 0 to 1 building for a long time. it looks like:\n\n-Having a central task board and running quick, time-bounded sprints\n-Running tight cycles to iterate faster\n-Using ongoing feedback to foster continuous improvement\n\nThe faster you move, the faster you get better. For example: During the YC batch, our partners encouraged us to set weekly growth goals and meet them. It's hard not to win when your iteration cycle is that short!\n\nThat's way different from the status quo in GTM, where teams traditionally think in quarters, not weeks \ud83d\ude35\u200d\ud83d\udcab\n\nEngineers would never run sprints this way! \n\nWhy plan GTM plays 1 or 2 quarters in advance? If something isn't working, you need to cut ties and move on.\n\nToday's GTM teams need to understand that the goalposts are always moving. \n\nCreative advantages disappear almost as quickly as they're created. You need a constant flow of new ideas to stay on top.\n\nAnd the best way to keep those ideas coming is to work like an engineer. | 77 comments on LinkedIn","author":"Jeff Barg","image":"https://media.licdn.com/dms/image/v2/D5610AQEd2qlrizl-hw/image-shrink_1280/B56Z9gvA4xHIAg-/0/1784034365360?e=2147483647&v=beta&t=L-IyDwfM7OIx1cMOj5Q7Tcn9ljCOTYACDRr_4krGOEE"},"https://www.linkedin.com/feed/update/urn:li:activity:7424845464497336320?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7424845464497336320%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We raised $38M. Kept our cramped office. Hit 300% capacity. Now we\u2019re moving in a space we designed.\n\nWhen we closed our Series B, everyone expected us to upgrade immediately.\nWe didn\u2019t.\n\nWe kept adding desks. \nSqueezed in phone booths. \nPut people wherever they fit.\n\nAt one point, we had 30 people and 1 bathroom.\nWe hit 300% over capacity.\n\nNow we\u2019re moving into a space 5x larger.\nEvery detail we couldn\u2019t control before, we designed this time.\n\nWe didn\u2019t stay in the old office just to be scrappy.\n\nIt was about priorities.\nBuild the product.\nHire the team.\nThen build the space.\n\nWe\u2019re ready now. | 64 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQHBh2lZ2o-KEg/image-shrink_800/B56ZwpZmm7KEAg-/0/1770221104736?e=2147483647&v=beta&t=0hmiyY0_Tf6KtUxXUwFFIcbZYhGWuQayFdx0QrrNgaI"},"https://www.linkedin.com/feed/update/urn:li:activity:7378391641730023424?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7378391641730023424%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We at Artificial Societies don't believe in 996 - we only work when we want to work.\n\nWhen I first left home at 14, I thought \"hard work\" meant suffering through things you hate. Then I got to Cambridge, dove into AI research, and discovered something wild: when you're genuinely obsessed with a problem, the work doesn't feel like work anymore.\n\nThat's exactly what happened when we first started Artificial Societies. Patrick and I were staying up late tinkering the simulations, not because we had to, but because we couldn't stop.\n\nFor us, work is self-expression.\n\nNow, our \"office hours\" are whenever inspiration strikes. Tom Whittle ships features on the weekends because he's excited about an idea. Patrick Sharpe watches user sessions at 10pm because he spotted a pattern.\n\nThere's no clocking in or out here, no performative \"hard work.\" Instead, it's about a deep, intrinsic drive that pushes us to create, to innovate, and to solve problems because we're genuinely passionate about it.\n\nSo yes, we don't believe in 996. We only work when we want to work.\n\nAnd we always want to work. | 44 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQGi8l5C4n7LSQ/feedshare-shrink_800/B4EZmVQFcgIoAg-/0/1759145650331?e=2147483647&v=beta&t=4OIbgqmKT9D1kWuS0TEx_cAh3ZPQPXsmgjmjw51t3QI"},"https://www.linkedin.com/feed/update/urn:li:activity:7407476497453809664?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7407476497453809664%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"\"SHOVE YOUR JOB UP YOUR AZZ\"\n\nWorst and best line I heard from a candidate I interviewed. Yes, we do 996 which means working 9am-9pm, 6 days a week.\n\nIt's funny because there are two extremes of how people react when I say that. They either say:\n\n> \"you're a slave, a victim of capitalism and hustle culture, your CEO is exploiting you!!! shove that job up your azz\"\n\nor:\n\n> \"oh man I do that already lol\"\n\nThe reason why we keep it transparent is because we're looking for those people. \n\nPeople who've run their own business or started their own startup get it. Building something from nothing is extremely hard. It demands sacrifice, obsession, and an unreasonable amount of hours.\n\nThat doesn't mean you're literally chained to your desk for 12 hours a day. It means putting in your best effort - 100%, 120%. But saying \"996\" is the best filter.\n\nWe're not trying to convince anyone this lifestyle is for them. If your gut reaction is the first one - respect. Genuinely. That boundary is valid.\nBut if you read 996 and thought \"yeah that's just Tuesday\" - we should talk.\n\nAnd look - we know this isn't sustainable forever. As the team grows, the pace will change. 996 is an early-stage reality, not a long-term culture. The goal is to earn the right to slow down by building something that works first. | 373 comments on LinkedIn","author":"Sugi Choi \ud83c\udf4b","image":"https://media.licdn.com/dms/image/v2/D5622AQF_tcqkRBrl4g/feedshare-shrink_1280/B56ZsyknsyGkAs-/0/1766080019623?e=2147483647&v=beta&t=ff5QftlhFzMWxvXnDnhZsmVAcjcE0hPuiyB70ls4EV0"},"https://www.linkedin.com/feed/update/urn:li:activity:7421967518896009216?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7421967518896009216%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"TikTokers are taking over LinkedIn !!!\n\n3 TikTokers hit 15K+ followers on LinkedIn in under 90 days posting the exact same content that works on TikTok.\n\nNatalie (Corporate Natalie): 250K + Top Voice.\nBrooke Monk: 46K + Top Voice.\nAvni Barman: 76K.\n\nSame hooks. Same format. Same posting frequency.\n\nThe LinkedIn algorithm isn't magically different from any other platform. It responds to the same mechanics that work everywhere else.\n\nThe actual difference: fewer creators competing for attention, and an audience with deeper pockets.\n\nMost founders treat LinkedIn like it requires a different playbook. It doesn't. It just requires showing up with the same clarity and consistency that works anywhere else. | 29 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5610AQGW7Ihs9x6VcQ/image-shrink_800/B56ZwAgHEFIcAg-/0/1769534944000?e=2147483647&v=beta&t=qQLvLhuxKicwerD887MTUWUMQCMqW5Pky4ZAtm7fln0"},"https://www.linkedin.com/feed/update/urn:li:activity:7404577917948866561?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7404577917948866561%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Gen Z is taking over LinkedIn.\n\nThey're ditching the corporate fluff, saying what they actually think, and building in public without the ego. It's refreshing. Where the rest of us learned to play it safe, they're just being real. I've connected with some incredible people recently who are redefining what it means to show up on this platform.\n\nWilman Chan - Started on LinkedIn because his high school banned every other social media except LinkedIn. He came for the games (shoutout to the Moonshots team for making bangers - Rushabh S.!!), stayed for the content, and ended up growing to 18k+ followers and landing a role at a YC startup in SF.\n\nMax Rascher - Started posting at 19 to make money \ud83e\udd11. Now he's at 120k+ followers and puts out some of the best content on how to actually use AI tools. He flew from Madrid to SF 2 months ago to join one of the hottest startups (guess where :p)\n\nMorgan Young - Started posting as a creative outlet. Her tech job was super technical, and LinkedIn became her way to express a different side of herself. Back then, barely anyone was creating content here. Now she's a LinkedIn Top Voice \ud83e\ude75\n\nYanni Pappas - Started posting as a BDR and realized something: having real, human conversations with buyers through his content led to way more demos than cold pitches ever did. Proof that being genuine beats being salesy.\n\nKevin Lee - Came from YouTube and TikTok, saw the opportunity on LinkedIn, and ran with it. (I\u2019m telling you, LinkedIn is the new TikTok) Now he's driving campaigns like Atlassian Answered while building a personal brand that opens doors money can't buy.\n\nTiffany Yan - Started posting earlier this year with Simplify to grow her personal brand. She's been building connections with other creators and quickly making a name for herself in the LinkedIn creator space.\n\nAlso check out Dennis Chen, Soneesh Kothagundla, Pavan Kumar - they're all crushing it in the startup world.\n\nHope this gives you the push to start posting. You don't need a perfect strategy. Just start, be real, and you'll grow like these people did.\n\nTag your favorite Gen Z creator or drop a \ud83d\ude4b if you're one yourself \ud83d\udc47. Let\u2019s connect!! | 194 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D5622AQGjwrqTbGs67w/feedshare-shrink_800/B56ZsJYYIkH8Ak-/0/1765388944693?e=2147483647&v=beta&t=Reo-09BvbVH8nLP1pnoH-tkAXa7f4MSzB2M5qfeRxXo"},"https://www.linkedin.com/feed/update/urn:li:activity:7429185333646381056?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7429185333646381056%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Dear Tanay,\n\nI don't talk about this publicly as much as I should: working with you is one of the best parts of building Wispr.\n\nThe foundation of our working relationship is deep trust. When problems arise (and they arise constantly in any startup) there's never a question of whose fault something is. It's always: we both see the issue, now how do we solve it together.\n\nThis might sound unremarkable, but it's rare. Most co-founder relationships fracture under stress because when things break, people start assigning blame or questioning each other's judgment. You and I have never fallen into that pattern.\n\nYou hold yourself to standards that I've never seen anyone else maintain. If we're going to ask extraordinary things from the people we work with, we have to hold ourselves to even higher standards. You do this consistently, and it sets expectations for the entire company.\n\nWhat I value most is that you care about what matters beyond just the company. You\u2019ve been completely supportive of me being present for my family however I need to be, and I appreciate it more than maybe I\u2019ve been vocal about before.\n\nWe're building an intense work environment. We care enormously about results. But we also believe that family and health matter, and that people should be trusted to navigate when those priorities conflict. Finding someone who both maintains extremely high standards and genuinely cares about people's lives outside work - that combination is genuinely unusual.\n\nOur personalities complement each other in useful ways. \n\nYou tend to say yes to new possibilities. \nI tend to say no and stay focused on what we're already doing. \n\nYou generate endless creative ideas. \nI'm more skeptical about what will actually work. \n\nThat tension produces better outcomes than either of us would reach individually.\n\nWe pivoted the company from brain-computer interfaces to voice AI software - a fundamental transformation that destroys most co-founder relationships. Throughout that entire process, even when we disagreed on specific directions, we agreed on something more important: we're both pursuing truth, trying to find the right path forward, committed to staying aligned with our core values.\n\nWe came through it with a stronger relationship than when we started.\n\nI'm grateful every day that I get to do this with someone I trust at this level.\n\nFrom, Sahaj | 28 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQEz8EDq3OvC7Q/image-shrink_800/B4EZxnEsKCHsAk-/0/1771255810062?e=2147483647&v=beta&t=oyxqzPgvU0xtlK6nRMRx9MjMhj1PwocZ_6hkwd5lijc"},"https://www.linkedin.com/feed/update/urn:li:activity:7482811252294172672?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7482811252294172672%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"It is no secret that we got into YC S24 after 2 attempts.\n\nPeople often talk about \"overnight success\" in startups, but it\u2019s usually a lot more complicated than that - it can take a decade. I started wondering about the actual timeline from a YC batch to making it to the public markets.\n\n1. Drew Houston (Dropbox): \ud835\uddec\ud835\uddd6 \ud835\udde6\ud835\udfec\ud835\udff3 \ud835\ude01\ud835\uddfc \ud835\udddc\ud835\udde3\ud835\udde2 \ud835\udfee\ud835\udfec\ud835\udfed\ud835\udff4, \ud835\udfed\ud835\udfed \ud835\ude06\ud835\uddf2\ud835\uddee\ud835\uddff\ud835\ude00. Founded a file storage company that many thought of as a commodity. IPO'd at $8.2B with $1.1B in revenue + 500m+ users - This was YC's first IPO ever!\n\n2. Alex Solomon (PagerDuty): \ud835\uddec\ud835\uddd6 \ud835\udde6\ud835\udfed\ud835\udfec \ud835\ude01\ud835\uddfc \ud835\udddc\ud835\udde3\ud835\udde2 \ud835\udfee\ud835\udfec\ud835\udfed\ud835\udff5, \ud835\udff5 \ud835\ude06\ud835\uddf2\ud835\uddee\ud835\uddff\ud835\ude00. Turned on-call paging into a $1.8B public company - it was a little over 9 years from Demo Day to the NYSE\n\n3. Brian Chesky (Airbnb): \ud835\uddec\ud835\uddd6 \ud835\uddea\ud835\udfec\ud835\udff5 \ud835\ude01\ud835\uddfc \ud835\udddc\ud835\udde3\ud835\udde2 \ud835\udfee\ud835\udfec\ud835\udfee\ud835\udfec, \ud835\udfed\ud835\udfed \ud835\ude06\ud835\uddf2\ud835\uddee\ud835\uddff\ud835\ude00. Nearly faced bankruptcy when bookings dropped drastically during COVID. Yet he went ahead with the IPO, and debuted at over $100B boasting 4M+ hosts around the world.\n\n4. Brian Armstrong (Coinbase): \ud835\uddec\ud835\uddd6 \ud835\udde6\ud835\udfed\ud835\udfee \ud835\ude01\ud835\uddfc \ud835\uddf1\ud835\uddf6\ud835\uddff\ud835\uddf2\ud835\uddf0\ud835\ude01 \ud835\uddf9\ud835\uddf6\ud835\ude00\ud835\ude01\ud835\uddf6\ud835\uddfb\ud835\uddf4 \ud835\udfee\ud835\udfec\ud835\udfee\ud835\udfed, \ud835\udff5 \ud835\ude06\ud835\uddf2\ud835\uddee\ud835\uddff\ud835\ude00. YC S12 to go for direct listing in 2021 after 9 years in the making - he created the gateway to crypto. On the first day it was valued at $85.8B with over 56M users.\n\n5. Spenser Skates ( Amplitude  ): \ud835\uddec\ud835\uddd6 \ud835\uddea\ud835\udfed\ud835\udfee \ud835\ude01\ud835\uddfc \ud835\uddf1\ud835\uddf6\ud835\uddff\ud835\uddf2\ud835\uddf0\ud835\ude01 \ud835\uddf9\ud835\uddf6\ud835\ude00\ud835\ude01\ud835\uddf6\ud835\uddfb\ud835\uddf4 \ud835\udfee\ud835\udfec\ud835\udfee\ud835\udfed, \ud835\udff5 \ud835\ude06\ud835\uddf2\ud835\uddee\ud835\uddff\ud835\ude00. Created a new category for product analytics, and took 9 years from YC to Nasdaq.\n\n6. Apoorva Mehta (Instacart): \ud835\uddec\ud835\uddd6 \ud835\udde6\ud835\udfed\ud835\udfee \ud835\ude01\ud835\uddfc \ud835\udddc\ud835\udde3\ud835\udde2 \ud835\udfee\ud835\udfec\ud835\udfee\ud835\udfef, \ud835\udfed\ud835\udfed \ud835\ude06\ud835\uddf2\ud835\uddee\ud835\uddff\ud835\ude00. Rode the pandemic grocery wave, made it through the slump, and went public at about $10B. CNBC dubbed it \"the 11 year old company.\"\n\nAll of the above companies took 9 - 11 years to IPO.\n\nFounders, how many years in are you?","author":"Rafi Sands","image":"https://media.licdn.com/dms/image/v2/D4E22AQEYgpK63wSkBA/feedshare-shrink_1280/B4EZ9hJL6xJkAM-/0/1784041271810?e=2147483647&v=beta&t=1eVPTT-RgzL2CiALFGNNGoL-wgPJWPAkRpYtBqn36T4"},"https://www.linkedin.com/feed/update/urn:li:activity:7423026712566890497?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7423026712566890497%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We hired a Berkeley linguistics PhD who studies dying languages. Within the first month, she made one edit that saves us $100k+ per month. \n\nWispr drives how millions of people communicate.\n\nYou speak. You ramble. You give it your messy thoughts. Most people hit send without reading. They trust the product that much.\n\nFor that to work, we needed someone who understood language. Not theoretical language, how people actually want to communicate.\n\nSo we gave our candidate a research exercise: A dataset of rambles, with relatively incoherent rambles. Her job? Figure out what people were trying to say, then fix it like Flow would.\n\nThis tested everything we cared about: \n\n\u2192 Comfort with real-world messiness \n\u2192 Not getting scared by ambiguity \n\u2192 Understanding communication, not just linguistics theory\n\nOh, and she can do this in 6 languages. Immediate hire.\n\nBut here's where it gets interesting.\n\nWhen she joined, she started labeling data herself. Developed a procedure.\nAt the time, we were paying hundreds of thousands of dollars every single month to Mercor for human labelers.\n\nPeople who opt into sharing data give us really messy stuff. We needed it cleaned up.\n\nOne day, she came to us:\n\n\"I think I can save us these few hundred thousand dollars every year. I found a way to automate all of this while maintaining the same data quality we're getting from humans.\"\n\nShe went from human labels to full AI labels. Same volume of data. Zero people from Mercor.\n\nEverything labeled in-house with our own systems.\n\nAll because we hired someone who cares about ownership and isn't afraid to take on problems they've never solved before.\n | 27 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7393654948212928512?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7393654948212928512%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We just hired Clay's first Head of Sales. Here's an inside look at what the interview process looked like (and the take-home prompts I think other teams might find helpful):\n\nAs you can imagine, I know a lot of sales leaders! In fact, it\u2019s my day job to meet them. So you can believe me when I say I knew Becca Lindquist was special the first time we met. \n\nLet\u2019s start with what I was looking for:\n\n1. Philosophical alignment: We approach sales differently at Clay. We hire GTM engineers to sell Clay in a highly consultative process that prizes product knowledge and customer empathy over traditional sales backgrounds. We have a low-pressure, fit-oriented approach.\n\n2. People leadership and process: Our org is scaling quickly, and we need someone to come in and build a system that can help us scale, not just win based off force of will and charisma.\n\nHere was the interview process:\n\nFirst, I set up multiple behavioral interviews for Becca on sales process and people management with sales leaders at customers we trusted (thank you Dannie Herzberg and Stevie Case!). Then we did a deep dive interview where we went through every role in her career in great detail. We also asked her to complete a take-home with the following instructions:\n\n- Current State: We'll share Gong calls, written docs, closed/won + pipeline data, and would love to see what you come back with in terms of top 5 opportunities and observations. \n\n- Future State: Over the next 1-2 years, we want to go from $XXm a quarter in sales to $XXm a quarter. We\u2019d love your thoughts on how you\u2019d get there. It would be helpful to touch on pieces like hiring plan, how we change the hiring profile, when to layer in outbound and how, compensation, etc. Specifically, we want to understand how you would make the key changes, beyond just the proposed plan and timing. We want to hear what problems you expect to encounter and how you might overcome them.\n\nSix weeks after our first interview, we extended Becca an offer.\n\nGTM leadership searches are hard. They're time consuming and high-stakes decisions. It took a lot of effort and help from generous souls (thank you Geoff Vitt too for all your guidance!) to craft this process for our Head of Sales role. I hope sharing our approach will save you time in your search. | 138 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQHxARMK4X7Hwg/image-shrink_800/B4EZpuJ_w1J0Ag-/0/1762784706562?e=2147483647&v=beta&t=6buECVIh-iRIky80QKdpHEg8Hag3KTspRK2fFXJwfhQ"},"https://www.linkedin.com/feed/update/urn:li:activity:7472313342745862144?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7472313342745862144%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"The Cursor office library in San Francisco\n\nHands down my favorite spot to work from","author":"","image":"https://media.licdn.com/dms/image/v2/D4D22AQGq78C2snoRBA/feedshare-image-high-res/B4DZ7L9Y7YI8AU-/0/1781538328829?e=2147483647&v=beta&t=MElFJa7rYL1p5LOrqZZPZaR0vw5Y02KSusF5enUd1K8"},"https://www.linkedin.com/feed/update/urn:li:activity:7471466140586840064?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7471466140586840064%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"SpaceX minted +4,400 millionaires and 10s of billionaires in their IPO yesterday. These are cafeteria workers, welders, leaders or engineers, amongst a large variety of roles. Anthropic and OpenAI will also create thousands of new millionaires in the next 3-6 months.\n\nAdd all of the startups offering secondaries and we are witnessing the quickest and largest wealth creation period in history. VCs, founders and normal people getting well-earned big paydays - this is THE moment to be building\u203c\ufe0f\n\nIn Spain there is saying: \"you only become rich either stealing or being corrupt\". Startups are showing a different path.\n\nLet's gooo! | 19 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7477340598992084992?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7477340598992084992%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I've been asked a lot how I negotiated my ElevenLabs compensation as the 4th employee and the person to build GTM from the ground-up. It was simple:\n\n\u25aa\ufe0fI established my priority: a specific equity % above anything else\n\n\u25aa\ufe0fTold Mati what my target ownership was. I felt it was fair and the founders felt it was too high (the standard response)\n\n\u25aa\ufe0fI then proposed a milestone-driven approach to unlock my target ownership, with a twist of creativity\n\n\u25aa\ufe0fA portion of the equity would start from joining with the standard equity plan (4y plan, 1y cliff, monthly vesting). A second tranche would only be released if we hit a specific ARR threshold within 24 months. As soon as reached, it would be released with a backdate to my original start date (again, 4y plan, 1y cliff, monthly vesting)\n\n\u25aa\ufe0fThe second tranche threshold was very ambitious. Only a handful of companies had done it but we all felt it was fair. It aligned everyone's incentives for company revenue & valuation growth\n\n\u25aa\ufe0fNo $ commission on sales. I never got a single $ for deals I've sold in 3.5 years. Not even the multi-$m deals I brought. This is & was fair\n\n\u25aa\ufe0fFor the first 9 months, it was mostly me selling. 60-80 meetings per week. Insane. But I was motivated to hit the tranche 2 milestone\n\n\u25aa\ufe0fWe hit the revenue milestone within 12 months of launching our first ever product\n\nThe reason I tell this story now is because there is no higher motivation than equity. Outside the US, we don't give enough equity to employees and employees haven't understood & cared enough about equity. This has a direct impact in success. \n\nI invest through my fund, Baobab Ventures, and I always recommend founders a milestones-driven compensation plan in GTM. It is the perfect way to align incentives.  | 213 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7478768004411891712?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7478768004411891712%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Over the past 3.5 years at ElevenLabs, I've done unconventional things in GTM. Let me tell you why:\n\n- I hate hiring people that come with playbooks. In interviews, when someone tells me about their \"playbook\", I reject them immediately\n\n- Each company is different. Entering a market selling support agents is different from selling legal tech or ERP replacers. \n\n- Each market & product requires a unique thesis and approach. If you don't understand the market, you can't craft a narrative that will be sticky\n\n- AI has changed all dynamics. Experimenting is the only path forward\n\n- Thinking big and placing bets yearly delivers outsized returns. I only need 1 bet to work to smash the target for the year\n\n- Aligning the team in a Vision is the glue. Not many companies have a crazy Revenue Vision each year; mostly because leaders fear getting fired if something doesn't pan out. I can't be bothered\n\n- You build a startup to do impossible things. Unconventional leads to making possible the impossible\n\nDoing things unconventionally isn't easy - you face rejection internally & externally. But, hey, \"this is the way\". \n\nAn example: I came up with the \"Global hyper-local\" concept in 2024. Let me tell you that most people didn't want to open markets, have teams on the ground, adapt product (incl translations) or stop being US-first, amongst many things.\n\nToday, we are global, +$500m in ARR, 50% of revenues come from outside the US, Enterprise is larger than Self-service, I have teams in +25 countries and have cracked the most difficult markets.\n\nBeing unconventional works. Just be creative, driven, hands-on, pushy and jump through obstacles. But don't be silly; if a company doesn't value it, find a new challenge. We are lucky to live the best period in history to build companies. | 109 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7397302293429268480?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7397302293429268480%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"We just raised another $25M after 10x'ing our ARR in 5 months. The crazy part is this almost never happened.\n\n17 years ago, I watched Iron Man as a 10-year-old kid in Delhi. That night, I pulled my first all-nighter teaching myself to code. Not because I wanted to build apps or make money.\n\nBecause I wanted to build Jarvis.\n\nMy parents gave me 1 hour of screen time per day. So I coded in secret, sleeping every alternate night through middle school and high school. Built 50+ apps. Got a cease and desist from Google at age 12.\n\nAll for this one obsession: making computers understand us like humans do.\n\nFast forward to today:\n- We've raised $81M total to build the voice operating system\n- Growing revenue 40% month-over-month this year\n- 70% user retention after one year (unheard of in consumer)\n- Teams at 270 of the Fortune 500 use Wispr Flow daily\n\nOur Series A2 was led by Hans Tung at Notable Capital (who was an early investor in five companies that made it to $100B valuation like Slack, Tiktok, and Airbnb). Steven Bartlett also joined as an investor and partner. \n\nBut here's what matters more than the money:\n\nWe cracked voice input. Not transcription - actual understanding. Our users hit \"send\" in under 0.5 seconds without checking. They trust it blindly. That's never existed before.\n\nIn a recent benchmark, Wispr came out as 3-4x more accurate than OpenAI, ElevenLabs, and Siri. \n\nAnd we're just getting started. Voice input was step one. Now we're building the assistant that actually does things for you.\n\nTo my co-founder Sahaj Garg - there's no one else I'd rather build Jarvis with than my college roommate and closest friend.\n\nTo our team pulling all-nighters and shipping magic - you're the reason that 10-year-old kid's dream is becoming real.\n\nWe're hiring cracked engineers and growth marketers who want to build the future of human-computer interaction.\n\nThe keyboard had a good 150-year run.\n\nTime to build what comes next.\n\nPS: like, repost, and comment \"Wispr\" to get Wispr Flow for free for 3 months \u2764\ufe0f\n\n\u2014 Written with Wispr Flow | 562 comments on LinkedIn","author":"Tanay Kothari","image":"https://dms.licdn.com/playlist/vid/v2/D5605AQGFogNf3FPTWg/thumbnail-with-play-button-overlay-high/B56Zqh_KjpKADM-/0/1763654287915?e=2147483647&v=beta&t=MCt1vpPw4eG3QygaSLaJbwecPWQN6KTTmAqLg7rMOak"},"https://www.linkedin.com/feed/update/urn:li:activity:7407404663626649600?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7407404663626649600%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Lovable just raised $330M at a $6.6B valuation.\n\nIt's been an iconic, insane, wonderful journey so far.\n\nThank you to everyone who made this possible:\n\nThe millions of people who build with Lovable. It started with individuals building tools. Now some of the world's largest enterprises trust Lovable \u2013 and apps built with Lovable \u2013 with their data. Apps built with Lovable have gotten over half a billion visits combined in the last 6 months.\n\nThe Lovable team: 120 of the most talented people I've ever met. Including people who moved across the world to help us build a generational company from Europe. They're the reason Lovable has become a product trusted by millions.\n\nThe investors backing Lovable. Lovable's $330M fundraise was led by CapitalG and Menlo Ventures' Anthology fund. Additional investors include the venture arms of leading companies building the future of work: NVentures (Nvidia), Salesforce Ventures, Databricks Ventures, T. Capital (Deutsche Telekom), Atlassian Ventures, and HubSpot Ventures. They're joined by Khosla Ventures, DST Global, EQT Growth, Kinship Ventures, and returning investors Accel, Creandum, and Evantic.\n\nNow with Lovable, anyone can build million-dollar companies and products trusted by the world's largest enterprises.\n\nThis is the age of the builder.\t\n\nhttps://lnkd.in/eKqu96n6 | 582 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E10AQFdmUCCeNMpOA/image-shrink_800/B4EZsxjSKgIUAg-/0/1766062892979?e=2147483647&v=beta&t=cZCTQW0z9RJuXld_pJ6YdIIT2UPWWqQQTVKUTbMFG3Y"},"https://www.linkedin.com/feed/update/urn:li:activity:7381417663626973185?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7381417663626973185%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"I\u2019m excited to share that I\u2019ve joined Virio as Founding GTM.\n\nIf you told me I\u2019d be building a startup 180 days ago, I wouldn\u2019t believe it.\n\n5 months ago I dmed Eric Lay to be his personal videographer - funny enough he originally ghosted me for a full month before getting back to me.\n\nI didn\u2019t have any startup experience, but we talked and he took a bold bet: \u201cLet\u2019s see where you fit.\u201d\n\nSoon enough, I found myself running around putting out fires I didn\u2019t even know could exist.\n- pulling off humiliating growth stunts\n- butchering cold calls to Fortune 500 execs\n- doing damage control on deals that could\u2019ve brought in 6-figures\n- reading hundreds of hateful comments on a post that hit 300K impressions\n\nThere was a long period of time where i was on the brink of being fired because I wasn\u2019t hitting my KPIs.\n\nand honestly\u2026 that continues to be a risk.\n\nThe bar rises as we grow. Every single day is a new, seemingly impossible standard to hurdle.\n\nYet somehow, we continue to rise up to the challenge.\n\nI've poured everything I have into this company.\n\nI have no desire stronger than to produce my greatest work, in the greatest city in the world. San Francisco.\n\ni have 3 chips on each shoulder and an insatiable desire to win. So that\u2019s what i\u2019ll continue to do. | 112 comments on LinkedIn","author":"","image":""},"https://www.linkedin.com/feed/update/urn:li:activity:7395151060652433408?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A7395151060652433408%2CFEED_DETAIL%2CEMPTY%2CDEFAULT%2Cfalse%29":{"text":"Claude just posted a $320k/year ghostwriter position. Anthropic\u2019s Claude, the supposed \u201cbest\u201d AI writing LLM available. Hiring a human writer. For $320k. \n\nIf you\u2019ve been active in the AI space over the last 18-24 months, you\u2019ll understand exactly why this is hilarious:\n\nThe premiere AI writing tool (the one everyone is claiming \u201cwrites the most human-like content\u201d) recognizes they need a human tastemaker, what does that tell you?\n\nIf THEY aren\u2019t even using their own tools, you shouldn't either.\n\nIt means even the best model can\u2019t replace human taste. If you ask me? AI generated content is starting to really turn people off. Train your models on billions of words, fine-tune it to match someone\u2019s tone of voice to try to make it sound human \u2026 you can\u2019t teach it taste. \n\nApparently, the price for good taste is $320k right now.\n\nIf you\u2019ve been paying attention, you\u2019d see that we just paid 2x+ that. Why? Because we believe great content is going to be the forefront of what drives pipeline in 2026. \n\nSo yea, comment \u201cGTM strategy\u201d for your 892+ flow N8N strategy, subscribe $9/mo for your AI UGC creator, or pay influencers $4000 a post to shill for your product. \n\nWe\u2019re going all in on our humans. \n\nIf you're a successful LinkedIn creator, a ghostwriting agency owner, a head of marketing/content, or anyone in GTM with a proven track record of building an audience, we're hiring.\n | 132 comments on LinkedIn","author":"","image":"https://media.licdn.com/dms/image/v2/D4E22AQEE4FcrLDTfpQ/feedshare-shrink_800/B4EZqDas1ZHEAg-/0/1763141406792?e=2147483647&v=beta&t=C05PJmaL7Q8f4mcsb5bPih1HUSNSluYBKyeJeQj3O-c"},"https://www.linkedin.com/feed/update/urn:li:activity:7413919456810176515?updateEntityUrn=urn%3Ali%3Afs_updateV2%3A%28urn%3Ali%3Aactivity%3A741391945681017
