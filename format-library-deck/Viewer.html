ot. \n 3. It\u2019s Contagious Kindness at the top sets the tone for the culture. Respect flows, collaboration thrives.  \nHow to Loan Your Strength:\n\n\n- Lead with Encouragement  Ask, \u201cWhat\u2019s working?\u201d before \u201cWhat went wrong?\u201d\n\n\n- Model Grace Under Pressure  Show your team how to face challenges\u2014with poise, patience, and purpose.\n\n\n- Celebrate Progress Loudly  Don\u2019t just fixate on mistakes\u2014amplify the wins, big or small.\n\n\n\n\nThe Ripple Effect: Kindness isn\u2019t soft - it\u2019s transformative. It builds trust, sparks momentum, and raises the bar for what your team believes is possible.\n\n\nThe best leaders aren\u2019t chasing credit. They\u2019re building people. That\u2019s the real legacy. \n So here\u2019s to the ones who lift others not to feel strong - but to make others strong. \n You\u2019re not just leading a team - you\u2019re shaping lives. \n That\u2019s the kind of leadership that changes everything.\n\n\n\ud83d\udd25Dora Vanourek","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFJgbKOdRkzkQ/feedshare-shrink_800/B4EZZn9wZeHMAg-/0/1745500965753?e=2147483647&v=beta&t=OLc9SKG9AWdAl9i64xNDfv5Cj3B3_fhvxfQ0neV82t4"},{"name":"Data-study takeaways","library":"millies","lane":"MOFU","archetype":"\"we analyzed {huge n}\" proprietary-research drop with numbered, stat-dense findings","hook":"In the last {timeframe} at {company}, we analyzed {enormous n} across {n} studies. Here's what we learned about {topic}:","skeleton":["Scale hook (timeframe + company + the giant number)","5\u20137 numbered findings, each: claim + exact stat + one-line implication (\"correlation: 0.737 \u2014 stronger than Domain Rating\")","Findings ordered surprise-first, and at least one that debunks common practice","(Optional) methodology footnote or link \u2014 soft CTA at most"],"examples":[{"url":"https://www.linkedin.com/posts/thinkingslow_in-the-last-3-months-at-ahrefs-we-analyzed-activity-7424382429542486016--OIQ","meta":"Ryan Law (Ahrefs), 2,817 reactions / 265 comments, 2026-02-03"}],"example_text":"In the last 3 months at Ahrefs, we analyzed over 1 billion data points across 11 studies*. Here's what we learned about AI search optimization:\n\n1. YouTube mentions are the single strongest predictor of AI visibility (correlation: 0.737) \u2013 stronger than Domain Rating, backlinks, or any traditional SEO factor. YouTube is heavily cited in AI responses, and both Google and OpenAI train on YouTube content.\n\n2. For a given query, AI Mode and AI Overviews reach the same conclusions 86% of the time \u2013 but cite almost entirely different sources (only 13.7% citation overlap). AI Mode responses are 4x longer and mention 3x more entities.\n\n3. Content length has essentially zero correlation with AI citations (0.04). 53% of all AI Overview citations go to pages under 1,000 words. Writing ultra-long content isn't necessary for AI visibility.\n\n4. Google still sends 345x more traffic than ChatGPT, Gemini, and Perplexity combined \u2013 but ChatGPT accounts for 80%+ of all AI-driven website traffic.\n\n5. AI Overviews have a 70% chance of changing from one observation to the next, with content lasting an average of just 2.15 days. But semantic meaning stays remarkably consistent (0.95 cosine similarity).\n\n6. \"Best X\" blog lists make up 43.8% of all page types cited in ChatGPT responses. 35% of those lists come from low-authority domains.\n\n7. 79% of blog lists cited by ChatGPT were updated in 2025 [...]","linkOnly":false,"note":"","labels":[]},{"name":"Gated playbook drop","library":"millies","lane":"MOFU","archetype":"\"I finally created the {superlative asset}\" + proof stack + comment-to-receive gate","hook":"After {n} years of testing, I've finally created the most effective {asset} ever.\" / \"I just spoke to {impressive audience} about {contrarian approach}... and I'm sharing the full playbook \ud83d\udc47","skeleton":["Superlative-asset hook (time invested + the artifact)","Skeptic's proof stack: \"If you still don't trust it\" + arrow-bulleted results with numbers","What's inside: numbered contents of the asset (4\u20136 items)","(Robinson variant) the intrigue story: what happened when the approach was tested","The gate: \"connect + comment '{keyword}' and I'll send it\" \u2014 soft CTA, MOFU-legal"],"examples":[{"url":"https://www.linkedin.com/posts/ericlay-virio_after-3-years-of-testing-ive-finally-created-activity-7306317167380054017-QrGc","meta":"Eric Lay (Virio), 3,238 reactions / 7,919 comments, 2025-03-14"},{"url":"https://www.linkedin.com/posts/retentionadam_i-just-spoke-to-a-group-of-130-ceos-cmos-activity-7396968758415851520-8IUv","meta":"Adam Robinson (RB2B), 1,350 reactions / 1,499 comments, 2025-12-03"}],"example_text":"After 3 years of testing, I've finally created the most effective GTM playbook ever.\n\nIf you still don't trust it, here's more results:\n\u2192 146 meetings booked with decision makers in 60 days\n\u2192 multiple six figure contracts signed\n\u2192 400k impressions and 3,000 followers in 2 months\n\nIt's because we've developed a repeatable process.\n\nIt focuses on 2 key things\u2026\n\nContent and community.\n\nSo I put together a full document with our whole process, laid out:\n\n1) Creating viral content in the B2B space (text and video)\n2) How to build a team to run your content engine\n3) Creating & nurturing a community\n4) How to position your personal and company brand as the #1 authority\n\nAnd much much more\u2026\n\nJust connect with me and comment \"GTM\" and I'll send it your way in a few minutes!","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFX709GJY1wcA/feedshare-shrink_800/B4EZWVAulHHcAk-/0/1741961755301?e=2147483647&v=beta&t=fYmsFty9cg4fHf-KmUb8hKFx0PKjKOtYwQihGmCYAbI"},{"name":"Industry war stories","library":"millies","lane":"MOFU","archetype":"profane love letter to an industry via a curated list of unbelievable-but-true anecdotes","hook":"{Industry} is a f**king crazy industry. I was at {insider setting} and asked for their best {industry} stories.","skeleton":["Profanity-softened hook + the insider setting that sourced the stories","3\u20135 arrow-bulleted anecdotes, each a complete miniature story with an escalating absurdity (kitten \u2192 mountain lion)","Anecdotes ordered for rhythm: funny \u2192 funnier \u2192 operatic","The turn: \"A lot is changing in {industry}.\" \u2014 one line","Affection close: why this frontier attracts \"the most interesting people doing the wildest sh*t\" \u2014 no CTA"],"examples":[{"url":"https://www.linkedin.com/posts/jesse-buckingham-79649a26_freight-is-a-fking-crazy-industry-i-was-activity-7417931389750263808-4BKl","meta":"Jesse Buckingham (Vooma), 232 reactions / 52 comments (44 \"funny\"), 2026-01-16"}],"example_text":"Freight is a f**king crazy industry. I was at a dinner with a few brokers the other night and asked them for their best freight stories. Some of the funniest ones I heard:\n\n\u2192 A driver whose company wouldn't let him have pets in the truck. He found a lost kitten on the road and pushed for approval to keep it in the cab. Pulled into the terminal 3 months later with a full-grown mountain lion sitting in his cab. Not a kitten it turns out. He wouldn't give it up.\n\n\u2192 A driver who drove his truck into the middle of a forest, parked it, and texted his dispatcher: \"I quit.\" The broker had to call the local sheriff to find the truck in a rogue forest in the Midwest.\n\n\u2192 A broker who had a load stolen but had tracking on it. They figured out where the truck was parked, broke into it, requisitioned an excavator out the back, and pulled off a full vigilante rescue mission to recover the freight.\n\n\u2192 A tamper-proof trailer with seals on the back to prevent theft. Instead of breaking the seals, someone removed the entire back of the trailer to pull the freight out and load it onto a railcar.\n\nA lot is changing in logistics.\n\nBut it's the frontier of American entrepreneurship and I'm certain it will continue to attract the most interesting people doing the wildest sh*t.","linkOnly":false,"note":"","labels":[]},{"name":"Jargon cheat sheet","library":"millies","lane":"MOFU","archetype":"\"the jargon is the problem\" + a decoder cheat sheet for the terms gatekeeping your ICP","hook":"{Field} has become full of jargon. And that's a problem.","skeleton":["Jargon-is-the-problem hook, two short lines","The victim: who's being kept in the dark (the ICP, sympathetically drawn), and the villain: who benefits (vendors, agencies)","The acronym wall, rendered literally (ROAS. MER. CAC. LTV.) \u2014 one per line","The stakes: what not-understanding costs (\"difficult to challenge strategy, ask the right questions\")","The asset: \"I put together this cheat sheet covering {n} terms\" + 3\u20135 sample definitions with real teeth","Comment-question close (\"which term do you think marketers misuse most?\") \u2014 soft CTA"],"examples":[{"url":"https://www.linkedin.com/posts/olly-fawcett-668566177_performance-marketing-has-become-full-of-activity-7477632098099597313-Zhzq","meta":"Olly Fawcett (303), 206 reactions / 23 comments / 47 shares, 2026-07-06"}],"example_text":"Performance marketing has become full of jargon.\n\nAnd that's a problem.\n\nI speak to a lot of founders and brand managers at premium and luxury brands who are investing serious budgets into Meta, TikTok and Google, yet they're often being presented with reports full of acronyms that nobody has properly explained.\n\nROAS.\nMER.\nCAC.\nLTV.\nNCROAS.\n\nIf you don't understand what these actually mean, it's incredibly difficult to challenge strategy, ask the right questions, or know whether your agency is genuinely growing the business.\n\nSo I put together this cheat sheet covering 15 performance marketing terms every luxury brand manager should know.\n\nA few of the most important:\n\nMER \u2192 Probably the most overlooked profitability metric in modern marketing.\n\nCAC vs LTV \u2192 The relationship that determines whether your growth is sustainable.\n\nIncrementality \u2192 The difference between ads creating sales and simply claiming credit for them.\n\nCreative Fatigue \u2192 One of the biggest reasons performance drops over time.\n\nCreative as a Growth Lever \u2192 Increasingly, the quality of your creative has more impact than campaign settings.\n\nThe reality is that performance marketing isn't won through platform hacks anymore.\n\nIt's won through: Better creative. Better measurement. Better commercial understanding.\n\nLuxury brands that understand these fundamentals make significantly better marketing decisions.\n\nWhich term do you think marketers misuse or misunderstand the most?","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQG5b_6OK7dS0g/feedshare-image-high-res/B4EZ8S1aT9HkAU-/0/1782727419438?e=2147483647&v=beta&t=pUS0l1aEgWX0YXD5DpA4rlbaeOQLPy0jyexpbtXcf3w"},{"name":"Objection dialogue script","library":"millies","lane":"MOFU","archetype":"fictional two-speaker argument (practitioner vs. skeptical boss) that dismantles an orthodoxy objection by objection","hook":"{Role}: {the heresy, stated as a decision}. / {Boss role}: Have you completely lost your mind? That's {the sacred metric}!","skeleton":["Two-line dialogue hook: the heresy + the outraged objection","5\u20138 objection/rebuttal rounds, escalating from tactical to strategic; each rebuttal carries a concrete number or named consequence","The strongest objection saved for late (\"the board tracks MQLs\") answered with the reframe (\"the board tracks revenue\")","Skeptic's grudging pivot or unresolved beat \u2014 the reader finishes the argument"],"examples":[{"url":"https://www.linkedin.com/posts/chrisclickup_head-of-marketing-were-ungating-all-of-activity-7423017247788474368-BNDb","meta":"Chris Cunningham (ClickUp), 1,076 reactions / 161 comments, 2026-01-30"}],"example_text":"Head of Marketing: We're ungating all of our content.\nCEO: Have you completely lost your mind? That's 2,000 leads per quarter!\nHead of Marketing: 2,000 fake emails from people who will never buy.\n\nMeanwhile, our actual buyers can't share our content with their team because it's locked behind a form.\n\nCEO: We need leads for Sales.\n\nHead of Marketing: Sales hates these leads. Ask them. Jessica told me yesterday she'd rather have 10 people who actually read our content than 1,000 who used burner emails for a download.\n\nCEO: The board tracks MQLs.\n\nHead of Marketing: The board tracks revenue. Our competitors ungated everything last year. Their traffic 5x'd. Their sales cycles dropped 20%. Why? Because entire buying committees could actually access their content.\n\nCEO: But how do we know who's interested?\n\nHead of Marketing: Intent data. If someone reads 5 articles, watches 2 videos, and visits pricing, they're interested. If someone downloads one PDF and ghosts, they're not.\n\nCEO: This is insane.\n\nHead of Marketing: You know what's insane? Watching our gated content get 500 views while our competitor's free guide gets 50,000 and becomes the industry standard.\n\nCEO: That sounds like a content problem...\n\nHead of Marketing: No. It's a distribution problem because it doesn't have the chance to actually get shared.\n\nCEO: Okay. But marketing will have no metrics.\n\nHead of Marketing: We'[...]","linkOnly":false,"note":"","labels":[]},{"name":"Platform-mechanics teardown","library":"millies","lane":"MOFU","archetype":"\"I've spent ${huge n} on {channel}\" + why the conventional wisdom breaks on a specific platform, mechanism by mechanism, ending in a gated deep-dive","hook":"I've spent ${n} on {channel}. The best {channel A} {assets} always fail on {channel B}.","skeleton":["Spend-credibility hook + the counterintuitive failure claim","The mechanism contrast, arrow-bulleted: how channel A works vs. how channel B works (user behavior level)","The tactical consequence: what to do differently, step by step (\"the first 3s are irrelevant... hit them with your strongest CTA at exactly the right time\")","The gated asset: \"I spent the week creating a full guide\" + contents list","Gate close: connect + comment keyword"],"examples":[{"url":"https://www.linkedin.com/feed/update/urn:li:activity:7423009624120823809","meta":"Curtis Howland, 312 reactions / 1,149 comments, 2026-01-31"}],"example_text":"I've spent $100M on ads\n\nThe best Meta ads always fail on AppLovin.\n\nIt's because of how ads work on AppLovin\n\nFacebook & Instagram\n\u2192 You are interrupting the scroll\n\u2192 The 3s hook is everything\n\nAppLovin (& reward video channels)\n\u2192 The user cannot skip for 15-30 seconds\n\u2192 They watch to get whatever in-game reward they've been promised (extra lives, bonuses, in-game currencies)\n\nIf your user cannot skip, the first 3s are irrelevant\u2026\n\u2192 They're annoyed they had to watch the ad\n\u2192 So tell a story / show a satisfying product demo.\n\u2192 Build a narrative arc that doesn't feel like a hard sell\n\u2192 Entertain them while they wait.\n\nBut what happens in the last 3s before they can play again?\n\u2192 They're watching your ad\n\u2192 Wait until just before they can close the ad\n\u2192 Hit them with your strongest CTA at exactly the right time\n\u2192 E.g. \"Get 50% Off Now - \"Claim Your One-Time Bundle.\"\n\nI spent the week creating a full guide on how to design ad creatives for AppLovin\n\nIt covers:\n\u2192 Creative attention curves\n\u2192 AppLovin ad placements\n\u2192 Creative Strategy Breakdown (by second)\n\u2192 AppLovin demographics\n\u2192 DTC AppLovin case studies\n\u2192 Platform risks\n\u2192 Technical set up & attribution\n\nWant it?\n\nSend me a connect, comment 'applovin' and I'll DM it over asap!","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQGUSubkUBMTNg/feedshare-shrink_800/B4DZwO76CBJcAg-/0/1769777111614?e=2147483647&v=beta&t=bTbgbjFgdajm1c5Qvq8YvXn3cARxrLWgOovrUtJmUJM"},{"name":"Stakeholder playbook","library":"millies","lane":"MOFU","archetype":"\"I've done ${result}, here's exactly how\" \u2014 numbered tactical playbook with mini-stories per tactic","hook":"I've now {result with number}. Here's how I {the skill}, for each {unit}:","skeleton":["Result hook (number first, no context padding)","3\u20135 numbered tactics, each: name \u2192 the move in 2\u20133 lines \u2192 a verbatim artifact (quoted script, tool, document) \u2192 the outcome it produced","Divider lines between tactics (\"-----\")","One tactic carries a mini-case (\"in one deal, I kept getting polite interest...\") \u2014 the story beat","Principle close: the through-line of all tactics \u2014 no hard CTA"],"examples":[{"url":"https://www.linkedin.com/posts/zhu-amanda_ive-now-closed-7m-in-enterprise-deals-activity-7413249035068841990-8lCZ","meta":"Amanda Zhu, 208 reactions / 12 comments, 2026-01-03"}],"example_text":"I've now closed $7M in enterprise deals. Here's how I personalize the pitch for each stakeholder:\n\n1/ Talk to THEIR customers\n\nBefore the first pitch, I talk to people who already use their product.\n\nInstead of selling features,\nI use their users' words to diagnose their problem:\n\n\"I talked to a few of your customers,\nand they mentioned that X was a pain.\nWhat if there was a way to have [solution]?\"\n\n-----\n\n2/ Reframe using analyst positioning\n\nI read reports from Gartner, Forrester, or G2\nto see who the buyer is being lumped in with.\nBecause every enterprise buyer has a comparison they hate.\n\nI'll often anchor the conversation with:\n\"This gives you a concrete way to separate from X, Y, and Z when those comparisons come up.\"\n\nThis gets us talking about positioning, risk, and narrative,\nwhich helps me uncover what the execs actually care about.\n\n-----\n\n3/ 10-K reports are your friend\n\nA 10-K is the company telling you what matters this year.\n\nIn one deal, I kept getting polite interest,\nbut no urgency.\n\nSo before the next meeting, I read their most recent 10-K.\n\nOne thing jumped out:\nthey had explicitly committed to improving reliability as a top company priority.\n\nIn the next call, I honed in on how we can help with that.\nThat was the first time the conversation clicked.\n\nSuddenly, we were tied to something leadership had already promised the market.\n\n-----\n\nThe goal of all [...]","linkOnly":false,"note":"","labels":[]},{"name":"Tool workflow demo","library":"millies","lane":"MOFU","archetype":"\"let me show you how I use {tool} for {job}\" \u2014 a real working system walked through step by step, with results and a gate","hook":"Let me show you how to use {tool} for {job}. It's like having {enormous equivalent} working for you.\" / \"I used {tool} for my {job} for {n} days. The result: {number}.","skeleton":["Demo-invitation or experiment-result hook with one arresting equivalence/number","System credibility line: the scale of what's running (APIs, scripts, prompts)","The old-way/new-way contrast (why the default approach fails)","The walkthrough: numbered stages, each with what the tool actually does (named steps like \"The Recon\", \"The Signal\")","Honest mechanics note (what it adapts to, what it can't do)","Gate or follow close: comment keyword for the system/prompts"],"examples":[{"url":"https://www.linkedin.com/posts/michaelbfishbein_let-me-show-you-how-to-use-claude-code-for-share-7427338897921318912-06NQ","meta":"Mike Fishbein, 730 reactions / 1,964 comments, 2026-02-17"},{"url":"https://www.linkedin.com/posts/jonathan-peslar_i-used-claude-cowork-for-my-seo-for-30-days-share-7428114528657272832-uUly","meta":"John Peslar, 294 reactions / 923 comments, 2026-02-17"}],"example_text":"Let me show you how to use Claude Code for gtm. It's like having 10k SDRs working for you.\n\nThe agent system I built runs on 11 APIs and 72 automation scripts. Instead of building rigid workflows that break and miss context, I give agents access to tools and let them decide what to do based on my subject matter expertise in Skills.\n\nHere's how it works:\n\n1. CAMPAIGN STRATEGY\n\n- Claude Code reads my positioning frameworks, targeting strategies, and copywriting guides\n\n- Generates campaigns based on observable buying signals, problem symptoms, and ICP fit\n\n- Writes personalized copy variations for email and LinkedIn and adapts for each campaign context\n\n2. LIST BUILDING AND OUTREACH\n\n- Agent selects the right API tools for each campaign and enrichment\n\n- Finds companies and contacts who need what you sell and gets their emails\n\n- Sends outreach via Sales Engagement Platform I custom built (like Instantly but mine)\n\nIt adapts and builds the workflow based on the context its given, not what I hardcoded six months ago. So it can do a variety of things for a variety of campaigns, not just [...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQHsI5U60VgXIQ/feedshare-shrink_1280/B4EZxM1XvCIMAc-/0/1770815585932?e=2147483647&v=beta&t=JBJWaAM1yk90VjUYSvHhbmdX-XcrtyrEkh2RFcwg0bg"},{"name":"Transparent budget breakdown","library":"millies","lane":"MOFU","archetype":"open-books line-item budget with the reasoning behind every allocation change","hook":"We're spending ${total} on {function} in {year} at {company} (up {n}% from {last year}).","skeleton":["Total-number hook with year-over-year delta","Transparency credo, one line (\"I've always believed in being transparent... here's the full breakup\")","Line items: \"\u2192 ${amount} - {category}\" each followed by 2\u20134 lines of what changed and WHY (cut from X, testing Y, bet on Z)","Items ordered biggest-first; every item names a decision, not just a number","(Optional) what-we're-NOT-spending-on beat \u2014 soft comment prompt close"],"examples":[{"url":"https://www.linkedin.com/posts/madhavbhandari_were-spending-33m-on-marketing-in-2026-activity-7430219623037407232-AwZY","meta":"Madhav Bhandari (Storylane), 848 reactions / 191 comments, 2026-02-19"}],"example_text":"We're spending $3.3M on marketing in 2026 at Storylane (up 10% from 2025).\n\nI've always believed in being transparent with what we do, so here's the full breakup:\n\n\u2192 $1.2M - Paid Ads\nSame as last year. LinkedIn $500K, Google/Bing $500K, Meta $200K (new). LinkedIn CPMs up 30-40%. Testing B2C channels to reach B2B audiences at lower cost.\n\n\u2192 $250K - Influencer Program\nCut from $500K. Used only $200K last year. Working great but scaling profitably is hard. Maintaining core LinkedIn portfolio, testing B2B creators on TikTok/Instagram for virality.\n\n\u2192 $550K - Conferences & Events\nUp from $400K. Betting big on IRL. Sponsoring, speaking, recording customer content, hosting side events. Good pre/post-event ops. Flywheel is real - brand grows, booth traffic increases, meetings get better.\n\n\u2192 $250K - Community Sponsorships\nDown from $300K. Still supporting CMO, pre-sales, product marketing communities. Investing $350K to build our own community instead. Forward bet on owned community.\n\n\u2192 $200K - SEO\nSame as last year. Most efficient PLG channel. Used 1/4 last year (LLM SEO uncertainty). Clear [...]","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGHUrcCyaoOJA/feedshare-shrink_1280/B4EZx1WQpeH0Ac-/0/1771495296218?e=2147483647&v=beta&t=DnhPwnfswI20Z4R3SQfBVICvzwH7z_ss1TvdfHqwWwU"},{"name":"\"Of course\" listicle","library":"virio","lane":"MOFU","archetype":"\"I'm a {role}. Of course I {insider truth}\" anaphora + soft community invite","hook":"I'm a {role}. Of course, I'll {insider truth #1}","skeleton":["Four \"I'm a {role}. Of course, I {truth}\" lines \u2014 escalating from relatable to only-us","Separator (\u2014)","Soft pivot: \"Hi! I'm {name}. Check out my profile and join my {n}+ community for more on {topics}\""],"examples":[{"url":"https://www.linkedin.com/posts/patrice-dussault-translator-writer_litranslators-interpreters-activity-7323317989376679936-9H0R","meta":"Patrice Dussault, 512 reactions / 92 comments, 2025-04-30"},{"url":"https://www.linkedin.com/posts/danielhemhauser_im-a-project-manager-im-a-project-manager-activity-7286769529186066432-Q5qK","meta":"Daniel Hemhauser, 409 reactions / 90 comments, 2025-07-14"}],"example_text":"I'm a translator. Of course, I'll forget some words in my mother tongue\nI'm a translator. Of course, I'll find mistakes in subtitles on Netflix\nI'm a translator. Of course, your cousin \"can do it too easily\"\nI'm a translator. Of course, I dream in my 2nd language\n\n\u2014\n\nHi! I'm Patrice. Check out my profile and join my 13,000+ community for more content on #LiTranslators and #interpreters","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFl9cTjyub41Q/feedshare-shrink_800/B4EZaGm50wIAAg-/0/1746015067814?e=2147483647&v=beta&t=sDFvxiCHg-4wlxDMZZh1Y7K7W1stqSqFHArnCVx3u5Q"},{"name":"Automation stack drop","library":"virio","lane":"MOFU","archetype":"\"We replaced {expensive thing} with {system}\" + the system itself, comment-gated","hook":"We replaced a {$X/year cost center} with {n} {new-tech units}","skeleton":["Replacement-claim hook with the dollar figure","One-line system description (what the units do end-to-end)","Social-proof tiers: \"I've shared this with top {ICP} from:\" + dash list of impressive categories","Adoption line (\"Every one of them started using it\")","\"Here's how it works:\" \u2014 2-step mechanism, concrete","The give: \"I'm giving you access to the full stack\"","Gate: comment \"{keyword}\" (+ connected) + P.S. repost-for-early-access"],"examples":[{"url":"https://www.linkedin.com/posts/george-stock-17a9101b0_we-replaced-a-300kyear-marketing-team-with-activity-7345816838510944256-pB1d","meta":"George Stock, 889 reactions / 4,952 comments, 2025-07-01"},{"url":"https://www.linkedin.com/posts/cas-feijen-66634426b_these-7-ai-marketing-agents-made-us-256983-activity-7345442234810458112-0Kzj","meta":"Cas Feijen (MakeUGC), 794 reactions / 2,415 comments, 2025-06-30"}],"example_text":"We replaced a $300K/year marketing team with 7 AI Agents\n\nWe built a fully automated system using 7 AI marketing agents that repurpose, localize, and launch winning ads on autopilot.\n\nI've shared this with top marketers from:\n- Leading VC's\n- 8-figure DTC brands\n- $100M+ creative agencies\n- YC startups\n\nEvery one of them started using it \u2014 and the results have been insane.\n\nHere's how it works:\n- Drop in one winning ad. Get dozens of AI-optimized, launch-ready creatives.\n- They even upload everything straight to Meta \u2014 no touchpoints, no delays.\n\nI'm giving you access to the full stack \u2014 all 7 AI agents, ready to plug into your workflow today.\n\nComment \"Agent\" and I'll send you all of them.\n\n(must be connected)\n\nPS - Repost for early access to the all 7 AI agents.","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQEtGCsom0j8Nw/thumbnail-with-play-button-overlay-high/B4EZfGVemyHYD4-/0/1751379211140?e=2147483647&v=beta&t=ifA3v-2Hs05CQVEF3lGIJgFltDewJBH8zSMGJamSeI4"},{"name":"Client words verbatim","library":"virio","lane":"MOFU","archetype":"A client's casual quote, relayed verbatim, then decoded into the transformation mechanism","hook":"He said it casually like it was nothing. (But damn, it said everything.)","skeleton":["Understated hook + parenthetical","The verbatim quote, multi-line, with its human specifics intact","The spillover proof (not just her \u2014 his wife, his friends, his team)","The decode: \"He didn't get those results by {obvious approach}\u2026 He got there by {the actual mechanism}\"","Staccato mechanism lines (\"More grounded. More still. More in control.\")","Stakes fork: \"Don't get this right and: -{cost list}. But when you do? -{payoff list}\""],"examples":[{"url":"https://www.linkedin.com/posts/klaudia-slosarova-marriage-mechanic_he-said-it-casually-like-it-was-nothing-activity-7329104332614737920-S5Mg","meta":"Klaudia Slosarova, 607 reactions / 42 comments, 2025-05-16"},{"url":"https://www.linkedin.com/posts/marjolainesavoie_can-my-free-sales-masterclass-really-be-more-activity-7339236208411140096-J2xW","meta":"Marjolaine Savoie, 338 reactions / 55 comments, 2025-06-13"}],"example_text":"He said it casually like it was nothing\n(But damn, it said everything)\n\n\u201cKlaudia\u2026 my daughter hugs me now.\nA month ago, she wanted nothing to do with me.\nNow I get daily hugs. She even asked me for advice yesterday. I had to play it cool, but damn, that hit.\n\nAnd it\u2019s not just her. My wife looks at me differently now. One of my friends even asked: \"What the hell are you doing lately?\"\n\nAt work, conversations just flow. People who used to stay quiet are actually speaking up around me.\u201d\n\nHe didn\u2019t get those results by talking more.\n\nOr by becoming someone he\u2019s not.\n\nHe got there by shifting how he showed up without losing himself.\n\nMore grounded. More still. More in control.\n\nNot just with his wife.\nNot just with his daughter.\nEverywhere.\n\nBecause people respond to your energy not your explanations.\n\nAnd his energy now invites respect, not tension.\n\nThat\u2019s what happens when you stop overexplaining and start moving like the man they haven\u2019t seen in years.\n\nDon\u2019t get this right and:\n-Your kids keep their distance\n-She stops looking at you like a man\n-At work, no one brings you the real problems\n-Conversations stay polite but nothing moves\n\nBut when you do?\n-Her guard drops without warning\n-Your daughter hugs you first\n-Your friends ask what changed\n-Your team speaks up because leadership finally showed up\n\nYou stop performing. You start leading\n\n\u201cMaybe it\u2019ll fix itself.\u201d?, I hear you say\n\nSure. Just like eating 2 salads a month turns your gut into a six-pack.\n\nLet me know how that works out.\n\nP.S. Want to keep reading posts like this? Join my Marriage Mechanic newsletter and get a free \ud83c\udf81 today (link in my bio/comments below)\n\nP.P.S. Sick of feeling like a failure at home? DM me \"RESET\" and I'll show you what you can do today","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQGiQtZnTMNnHQ/thumbnail-with-play-button-overlay-high/B4EZbYXvQGHADo-/0/1747386828549?e=2147483647&v=beta&t=xH6rBAItfuzEHWbnEec3J7O40ehKGewTmcYCL_DTSLo"},{"name":"Community rescue spotlight","library":"virio","lane":"MOFU","archetype":"Advocate spotlights one struggling ICP member and mobilizes the network for them","hook":"{Age/status}. {Devastating one-word situation}. {Second devastating line}. Not because {they failed}, but because {the systemic problem}.","skeleton":["Staccato devastation hook (3 fragment lines)","System indictment line (shifts blame from person to market)","\"Meet {name} \ud83d\udc4b\ud83c\udffc\" + their credential in one line","The irony line (the professional everyone depends on, discarded)","Their words, quoted verbatim","What employers are missing: \u2b50 list of their real qualifications","What they're looking for + location/availability","Dignity framing (\"She doesn't want pity\u2026 she wants to work\")","Mobilization close (\"A share takes two seconds. Do your thing, LinkedIn \ud83d\udc4a\ud83c\udffc\")"],"examples":[{"url":"https://www.linkedin.com/posts/joeemerywrites-forbondfansonly_shes-56-bankrupt-back-in-her-parents-activity-7405290346076631040-FMUp","meta":"Joe Emery (Karen Workman), 3,852 reactions / 340 comments, 2025-12-13"},{"url":"https://www.linkedin.com/posts/ramjijaiswal01_from-leading-it-projects-to-driving-an-auto-activity-7345639488183795712-mjT0","meta":"Ramji Jaiswal, 1,575 reactions / 45 comments, 2025-07-01"}],"example_text":"She's 56.\nBankrupt.\nBack in her parents' spare room.\n\nNot because she failed, but because today's job ma caveat (\"It's not making decisions for our users\u2026\")","Soft gate: numbered micro-steps (\"1. Connect with me 2. Comment '{KEYWORD}'\")"],"examples":[{"url":"https://www.linkedin.com/posts/tylersellars_never-struggle-with-underwriting-deadlines-activity-7340727923437387778-Gvx4","meta":"Tyler Sellars, 138 reactions / 535 comments, 2025-06-17"},{"url":"https://www.linkedin.com/posts/adam-higgins-b1a286267_stop-paying-3000month-to-an-ai-automation-activity-7334669058006519808-N8mv","meta":"Adam Higgins (Perspective), 343 reactions / 2,200 comments, 2025-05-31"}],"example_text":"Never struggle with underwriting deadlines again\n\nWhile most analysts were:\n\u2022 Spending 40+ hours per deal on research\n\u2022 Manually pulling comps from CoStar\n\u2022 Missing key risks in documentation\n\u2022 Struggling with complex financial models\n\nWe built an AI underwriter that:\n\u2192 Analyzes 100+ page OM and financial docs in minutes\n\u2192 Auto-pulls relevant market comps against existing rent roll\n\u2192 Identifies hidden risks and red flags\n\u2192 Generates complete underwriting packages\n\nThe results?\n\u2022 98.3% reduction in analysis time\n\u2022 99.8% accuracy rate on financials\n\u2022 Complex deals underwritten in hours, not weeks\n\nTraditional underwriting is dead.\n\nBut here's what's important. It's not making decisions for our users, it's bringing the data to the forefront.\n\nOur users now bring us their models. We just let it run while they sleep.\n\nWant to see how it works?\n1. Connect with me\n2. Comment \"CRE\"","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGLI34W5nbG6g/feedshare-image-high-res/B4EZd9Hb2THsAw-/0/1750150791799?e=2147483647&v=beta&t=asw5wpNLNRTG9lQoEM666lmbwGnHSvM0eossNBtRmS4"},{"name":"Origin-story raise","library":"virio","lane":"MOFU","archetype":"Funding/traction announcement wrapped in a childhood-obsession origin story","hook":"We just {milestone} after {traction stat}. The crazy part is this almost never happened.","skeleton":["Milestone + traction hook, then the \"almost never happened\" turn","Origin scene, dated and specific (the movie, the all-nighter, the secret coding)","The obsession, named in one line (\"making computers understand us like humans do\")","\"Fast forward to today:\" \u2014 dash list of 4 traction stats","The backers, with their credential one-liners","\"But here's what matters more than the money:\" \u2014 the product truth","(Optional gate/CTA for the product)"],"examples":[{"url":"https://www.linkedin.com/posts/tankots_we-just-raised-another-25m-after-10xing-activity-7397302293429268480-Yf3H","meta":"Tanay Kothari (Wispr Flow), 3,291 reactions / 562 comments, 2025-11-20"},{"url":"https://www.linkedin.com/posts/markphillips11t_big-news-we-closed-our-oversubscribed-fund-activity-7317939652420587522-KEG5","meta":"Mark Phillips (11 Tribes Ventures), 971 reactions / 228 comments, 2025-04-15"}],"example_text":"We just raised another $25M after 10x'ing our ARR in 5 months. The crazy part is this almost never happened.\n\n17 years ago, I watched Iron Man as a 10-year-old kid in Delhi. That night, I pulled my first all-nighter teaching myself to code. Not because I wanted to build apps or make money.\n\nBecause I wanted to build Jarvis.\n\nMy parents gave me 1 hour of screen time per day. So I coded in secret, sleeping every alternate night through middle school and high school. Built 50+ apps. Got a cease and desist from Google at age 12.\n\nAll for this one obsession: making computers understand us like humans do.\n\nFast forward to today:\n- We've raised $81M total to build the voice operating system\n- Growing revenue 40% month-over-month this year\n- 70% user retention after one year (unheard of in consumer)\n- Teams at 270 of the Fortune 500 use Wispr Flow daily\n\nOur Series A2 was led by Hans Tung at Notable Capital (who was an early investor in five companies that made it to $100B valuation like Slack, Tiktok, and Airbnb). Steven Bartlett also joined as an investor and partner. \n\nBut here's what matters more than the money:\n\nWe cracked voice input. Not transcription - actual understanding. Our users hit \"send\" in under 0.5 seconds without checking. They trust it blindly. That's never existed before.\n\nIn a recent benchmark, Wispr came out as 3-4x more accurate than OpenAI, ElevenLabs, and Siri. \n\nAnd we're just getting started. Voice input was step one. Now we're building the assistant that actually does things for you.\n\nTo my co-founder Sahaj Garg - there's no one else I'd rather build Jarvis with than my college roommate and closest friend.\n\nTo our team pulling all-nighters and shipping magic - you're the reason that 10-year-old kid's dream is becoming real.\n\nWe're hiring cracked engineers and growth marketers who want to build the future of human-computer interaction.\n\nThe keyboard had a good 150-year run.\n\nTime to build what comes next.\n\nPS: like, repost, and comment \"Wispr\" to get Wispr Flow for free for 3 months \u2764\ufe0f\n\n\u2014 Written with Wispr Flow","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D5605AQGFogNf3FPTWg/thumbnail-with-play-button-overlay-high/B56Zqh_KjpKADM-/0/1763654287915?e=2147483647&v=beta&t=MCt1vpPw4eG3QygaSLaJbwecPWQN6KTTmAqLg7rMOak"},{"name":"Steal this tactic","library":"virio","lane":"MOFU","archetype":"One field-tested tactic handed over via attached artifact, framed by the objection it kills","hook":"If you {suffer the micro-moment} \u2014 Stop.","skeleton":["Conditional hook + one-word imperative","The reframe (\"'{Common brush-off}' isn't an objection\")","The evidence beat (why the reframe is true, one line)","\"Steal this {tactic}\" + the receipt (what it won: a C-suite meeting in a Tier A account, from someone who'd hung up)","Tag-a-friend ask","Personal callback (\"Kyle - this is the one I was telling you about\") \u2014 makes it feel like overheard advice"],"examples":[{"url":"https://www.linkedin.com/posts/will-falkenborg-%F0%9F%8C%AD-73617910a_if-you-get-hung-up-on-when-you-cold-call-activity-7265056267373600768-XxLA","meta":"Will Falkenborg, 1,574 reactions / 251 comments, 2024-11-20"},{"url":"https://www.linkedin.com/posts/colin-gallagher-growlancer_i-just-analyzed-2000000-linkedin-dms-sent-activity-7351524109182197760-jhz6","meta":"Colin Gallagher, 353 reactions / 1,196 comments, 2025-07-17"}],"example_text":"If you get hung up on when you cold call\n\nStop\n\n\"I'm not interested\" isn't an objection\n\nEspecially when all you have said is \"hi this is (name) from company\"\n\nSteal this pattern interrupt that booked me a meeting with a C suite in a Tier A account who previously hung up on me\n\nTag a friend who has to try this now\n\nKyle - this is the one I was telling you about","linkOnly":false,"note":"","labels":[]},{"name":"Tiny-win confession","library":"virio","lane":"MOFU","archetype":"Playful confession of a small, specific win \u2192 gated how-to","hook":"{Playful exclamation}\u2026 I {tiny specific act} for {small cost} (it made me {larger return})","skeleton":["Playful confession hook with cost-vs-return parenthetical","The reveal/twist line (\"and the video below. Is FULLY AI\")","Problem context: the known blocker this sidesteps, one line + arrow resolution","Effort stat (\"takes less than 1 minute\", \"saving me thousands every month\")","Gate: \"I put together a full guide \u2014 want me to DM it for free?\"","Mechanics: like + comment \"{KEYWORD}\" (+ must-be-connected note)"],"examples":[{"url":"https://www.linkedin.com/posts/cas-feijen-66634426b_mom-i-did-it-i-made-a-ugc-creator-hold-activity-7269735561567899649-NwEI","meta":"Cas Feijen, 876 reactions / 3,047 comments, 2024-12-03"},{"url":"https://www.linkedin.com/posts/matt-vinall_i-just-bought-a-brand-new-laptop-and-i-did-activity-7356012178224656385-5yxk","meta":"Matt Vinall (DMAND), 345 reactions / 1,142 comments, 2025-07-29"}],"example_text":"Mom I did it...\n\nI made a UGC creator hold my product for $9\n(it made me $4,635)\n\nand the video below. Is FULLY AI\n\nA major problem with AI UGC is that creators can't hold your product\n\u2192 Now they can...\n\nVideo takes less than 1 minute to make and is saving me thousands every month\n\nI put together a full guide to show you how to do the same\n\nWant me to DM it to you for free?\n\nLike this post, comment \"MAKE\" and I'll send it to you!\n\n(must be connected)","linkOnly":false,"note":"","labels":[]},{"name":"Unfiltered feedback ask","library":"virio","lane":"MOFU","archetype":"Insider invites raw feedback on the thing they build, with an incentive","hook":"Hey {audience}! I'm {insider credential} \u2014 and I want your UNFILTERED feedback. What do you HATE the most about {the thing}?","skeleton":["Direct-address hook: credential + permission-to-vent question","Audience enumeration (\"Whether you're a: > recruiter > job seeker > creator\u2026\") \u2014 everyone finds their line","Re-focus line: don't care WHY you're here, tell me WHAT frustrates you","Commitment: \"I'll read every single one \u2014 even the spicy ones\"","Incentive with a real number (\"6 months of Premium, $180 worth, for the best suggestion\")"],"examples":[{"url":"https://www.linkedin.com/posts/sugju-choi_hey-linkedin-im-linkedins-one-of-the-first-activity-7419070510862319616-tSUL","meta":"Sugi Choi, 1,627 reactions / 960 comments, 2026-01-19"},{"url":"https://www.linkedin.com/posts/laurensurman_as-a-candidate-can-you-help-me-out-last-activity-7269695949705252864-n-lB","meta":"Lauren Surman, 336 reactions / 574 comments, 2024-12-03"}],"example_text":"Hey LinkedIn! I'm LinkedIn's one of the first ever Product Builder - and I want your UNFILTERED feedback.\n\nWhat do you HATE the most about LinkedIn?\n\nWhether you're a:\n> recruiter or a founder looking for the right talent\n> job seeker hunting for opportunities\n> creator building your personal brand\n> developer sharing your work\n> or just here to network\n\nDoesn't matter WHY you're here, but I wanna know WHAT frustrates you the most .\n\nLeave a comment below, I'll read every single one - even the spicy ones.\n\nBonus - I will give 6 month of FREE LinkedIn premium ($180 worth) to the best suggestion! \ud83d\udc97","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQFK9bz6nxNQUQ/feedshare-shrink_800/B56ZvXVUIPIcAg-/0/1768844248372?e=2147483647&v=beta&t=CVEHReg_C4eQp5KbR4uNbFzOaYorLutqdQF_Lrnh4X4"},{"name":"Unseen work anthem","library":"virio","lane":"MOFU","archetype":"\"Not everyone will see\u2026\" triplet \u2192 \"but the right people will feel it\" turn","hook":"Not everyone will see {specific invisible labor}.","skeleton":["\"Not everyone will see\u2026\" \u00d7 3, each naming a real, specific burden","The turn, styled for emphasis: \"But the right people will feel it.\"","Who the right people are: \u2728 list of 3 (each a relationship the ICP treasures)","The reframe aphorism (\"{Field} isn't about recognition, it's about impact\")","Quiet encouragement close + community hashtags"],"examples":[{"url":"https://www.linkedin.com/posts/iamjulieturney_hrsupport-yourhrcoach-keepgoing-activity-7312864549433466881-bzXL","meta":"Julie Turney, 1,807 reactions / 64 comments, 2025-04-01"}],"example_text":"Not everyone will see the late nights you spend handling tough conversations.\n\nNot everyone will notice the effort it takes to create a culture where people feel safe, valued, and heard.\n\nNot everyone will understand the weight you carry when balancing business needs with employee well-being.\n\n\ud835\ude3d\ud835\ude6a\ud835\ude69 \ud835\ude69\ud835\ude5d\ud835\ude5a \ud835\ude67\ud835\ude5e\ud835\ude5c\ud835\ude5d\ud835\ude69 \ud835\ude65\ud835\ude5a\ud835\ude64\ud835\ude65\ud835\ude61\ud835\ude5a \ud835\ude6c\ud835\ude5e\ud835\ude61\ud835\ude61 \ud835\ude5b\ud835\ude5a\ud835\ude5a\ud835\ude61 \ud835\ude5e\ud835\ude69.\n\n\u2728\ufe0fThe employees who trust you because they know you have their back.\n\n\u2728\ufe0fThe leaders who rely on your guidance to navigate challenges.\n\n\u2728\ufe0fThe new hires who feel welcomed because of the culture you help shape.\n\nHR isn't about recognition it's about impact. And even when it feels like no one is watching, the work you do matters.\n\n#HRSupport #yourhrcoach #KeepGoing #ThriveInHR","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4E05AQEbBSW_6CrAig/thumbnail-with-play-button-overlay-high/B4EZXyDiauGgDI-/0/1743522770771?e=2147483647&v=beta&t=TJ8EwslhM6BSHkBQyGlN2PEuy4UpZInhBlCmtWl9MhE"},{"name":"Vulnerable direct ask","library":"virio","lane":"MOFU","archetype":"Stakes-on-the-table confession + a direct, specific ask to a named audience","hook":"I'm writing this post as a final, last ditch effort. After {quantified attempts}, this is the only thing I haven't tried.","skeleton":["Last-resort framing + the quantified attempts","Pre-empting advice: \"I don't need new strategies\" + the list of everything already tried","The named-audience turn: \"If you are {segment}, this message is for you\"","The confident core: what I bring, with concrete capabilities (not adjectives)","The honest cost of the situation (confidence, false hope)","The ask, stated once, plainly"],"examples":[{"url":"https://www.linkedin.com/posts/jrecoon_im-writing-this-post-as-a-final-last-ditch-activity-7387198614332346368-dJjP","meta":"Jacob Recoon, 2,266 reactions / 301 comments, 2025-10-26"},{"url":"https://www.linkedin.com/posts/samiradhikari_ive-applied-to-more-than-3000-of-engineering-activity-7476276720644497408-fQUB","meta":"Sam Adhikari, 382 reactions / 47 comments, 2026-06-30"}],"example_text":"I'm writing this post as a final, last ditch effort. After 8 months and 825+ applications, this is the only thing I haven't tried. This is my cry for help. My life as I know it is ending. My savings that I was responsible to have are gone. Everything I've built is falling apart and I am very close to losing everything.\n\nI don't need new strategies. I've changed resumes, messaged recruiters, had direct referrals, contacted headhunters, tried roles within my network, outside. If you can think of it, I've tried it. There's no \"strategy\" that will work for me.\n\nIf you are a hiring manager or a direct recruiter this message is for you. I'm confident enough to know what I can bring. You will not find a harder worker, and I have results to prove it. I bring innovative solution, creative ideas, and stability to teams in need, as a Scrum Master or a Project Manager. I have a background in software engineering, so I can be a bridge between high ranking stakeholders and dev teams. I have a passion for finishing complex projects, many times multiple at a time, and seeing things through from start to finish.\n\nEverything that has come close has just been false hope, and it has destroyed what confidence I still had in myself. Some may view this as \"unprofessional\" but the right organization for me would see this and be understanding. I didn't ask to be put in this position. I loved my job, and they unceremoniously dismissed me at a moments notice over a 1 way video call. I'm not sure what deity I pissed off but I can't get anything going for myself. I have valuable experience and a valuable education, I just need someone to realize that.\n\nSo here's what I'm asking for: connect me DIRECTLY with someone who is hiring for a job in my field, Scrum Master, Project Manager, or anything similar. I don't need links to job boards, I don't need links to roles with no human connection. If those worked, I wouldn't be writing this now. And no, I don't need \"words of encouragement\". I'm sorry if that comes across as rude or mean, but nice words will not pay my bills.\n\nThank you for taking the time to read this. I wish none of this had to be written. This is an extremely vulnerable post for me, but my life is at a tipping point and I can't wait any longer. Please help.","linkOnly":false,"note":"","labels":[]},{"name":"Client-work showcase","library":"virio","lane":"BOFU","archetype":"Finished client work presented with warmth + full credits","hook":"We worked with {client}, to produce {deliverable} for {occasion/campaign}.","skeleton":["Plain statement of client + deliverable + purpose (no adjectives yet)","One warm line about the joy/challenge of the collaboration","Credits block: role \u2014 names, one role per line","(The attached work \u2014 video/images \u2014 carries the proof)"],"examples":[{"url":"https://www.linkedin.com/posts/benfromthewirral_we-worked-with-beijing-based-design-agency-activity-7300118119442784258-_JHv","meta":"Ben Marsh (Yatta), 2,573 reactions / 70 comments, 2025-02-25"},{"url":"https://www.linkedin.com/posts/jonathan-parker-0b688167_every-brief-is-an-opportunity-to-build-a-activity-7290078152071000064-agGN","meta":"Jonathan Parker (VCCP \u00d7 Cadbury), 1,615 reactions / 99 comments, 2025-01-28"}],"example_text":"We worked with Beijing based design agency Weestar Studio, to produce an animated film showcasing their work for Douban Ulink Festival.\n\nIt was a joy to bring these cute characters to life and it's always fun to collaborate with a studio on the other side of the world \ud83c\udf10\n\nCredits:\nAnimation - Rosie Bowers, Jordan Pledge, Ben Marsh\nDesign - Weestar Studio , Xiaolang Yuan, Haonan Chi\nSound - Adam Legg","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D5605AQFOv_yja5WOpA/thumbnail-with-play-button-overlay-high/B56ZU86kWGHQDQ-/0/1740483777401?e=2147483647&v=beta&t=oL2yvKbiUDns93LBmk5bte6_wW6ShbOh8bUgoZyEl5k"},{"name":"Community shoutout roll","library":"virio","lane":"BOFU","archetype":"Mass appreciation roll-call of named community members + bonus resource block","hook":"{OCCASION}! If you're going to spend time on {platform}, make it time well spent.","skeleton":["Occasion hook (a recurring, ownable slot \u2014 \"Shoutout Saturday\")","The promise (these people make your feed smarter)","The roll: \u25fe list of names, grouped under a bold topic header","Separator","Bonus resource block: numbered links that justify the save","Credits + hashtags"],"examples":[{"url":"https://www.linkedin.com/posts/progressivethinker_softwaredevelopment-systemdesign-ai-activity-7375064667431419904-98sT","meta":"Pallavi A. (Shoutout Saturday), 777 reactions / 55 comments, 2025-09-20"},{"url":"https://www.linkedin.com/posts/charlie-hills_i-learned-more-from-these-26-creators-than-activity-7415346616624152576-jLCL","meta":"Charlie Hills (2026 follow list), 859 reactions / 483 comments, 2026-01-09"}],"example_text":"SHOUTOUT SATURDAY!\n\nIf you\u2019re going to spend time on LinkedIn, make it time well spent.\n\nThese creators make my feed smarter, sharper, and way more inspiring.\n\nA little weekend appreciation for the people who\u2019ve turned my scroll into a masterclass.\n\nIf they\u2019re not already on your follow list, you might want to fix that \ud83d\udc47\n\n\ud835\udc0c\ud835\udc0b/\ud835\udc00\ud835\udc08, \ud835\udc03\ud835\udc1a\ud835\udc2d\ud835\udc1a, \ud835\udc12\ud835\udc28\ud835\udc1f\ud835\udc2d\ud835\udc30\ud835\udc1a\ud835\udc2b\ud835\udc1e \ud835\udc03\ud835\udc1e\ud835\udc2f\ud835\udc1e\ud835\udc25\ud835\udc28\ud835\udc29\ud835\udc26\ud835\udc1e\ud835\udc27\ud835\udc2d/\ud835\udc12\ud835\udc32\ud835\udc2c\ud835\udc2d\ud835\udc1e\ud835\udc26 \ud835\udc03\ud835\udc1e\ud835\udc2c\ud835\udc22\ud835\udc20\ud835\udc27 \ud835\udc13\ud835\udc28\ud835\udc29\ud835\udc22\ud835\udc1c\ud835\udc2c\n\n\u25fe Timur Bikmukhametov, PhD\n\u25fe Victoria Slocum\n\u25fe Femke Plantinga\n\u25fe Sebastian Raschka, PhD\n\u25fe Krish Naik\n\u25fe Mayank A.\n\u25fe Miguel Otero Pedrido\n\u25fe Paul Iusztin\n\u25fe Akshay Pachaar\n\u25fe Alex Razvant\n\u25fe Tony Kipkemboi\n\u25fe Abby Morgan\n\u25fe Claire Longo\n\u25fe Pavan Belagatti\n\u25fe Dawn Choo\n\u25fe Raul Junco\n\u25fe Shivani Virdi\n\u25fe Avi Chawla\n\u25fe Maria Vechtomova\n\u25fe Aurimas Grici\u016bnas\n\u25fe Shirin Khosravi Jam\n\u25fe Louis-Fran\u00e7ois Bouchard\n\u25fe Sumanth P\n\u25fe Sairam Sundaresan\n\u25fe Shantanu Ladhwe\n\u25fe Khizer Abbas\n\u25fe Banias Baabe\n\u25fe Eevamaija Virtanen\n\u25fe Aishwarya Naresh Reganti\n\u25fe Venkata Naga Sai Kumar Bysani\n\u25fe Alex Cinovoj\n\u25fe Aakriti Aggarwal\n\u25fe Anas Riad\n\u25fe Andreas Horn\n\u25fe Kamran Ali\n\u25fe Paolo Perrone\n\u25fe Eric Roby\n\u25fe Shalini Goyal\n\u25fe Pallavi\n\n---------\n\nSome valuable resources - \n\n1./ Best tool for creating content/slides - https://lnkd.in/efbTKQwe\n\n2./ Resources on RAG -\nVanilla RAG: https://lnkd.in/eZEXwaZU\nAdvanced RAG: https://lnkd.in/eC5Y_pCU\nMultimodal RAG: https://lnkd.in/e68XEE9p\nAgentic RAG: https://lnkd.in/eDku9pR5\n\n\nImage credits - Weaviate\nThe image is a cheat sheet of 7 of the most popular RAG architectures.\n\n#softwaredevelopment #systemdesign #ai #ml #data","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQF_YP2TWoVxng/feedshare-shrink_800/B4EZll.OrkIkAg-/0/1758352436996?e=2147483647&v=beta&t=AV_KN6X_i1xHog_rjf42LXO006tSdt2UF24dB6VZwnk"},{"name":"Decade-later testimonial","library":"virio","lane":"BOFU","archetype":"Unsolicited endorsement proven by relationship longevity","hook":"When I met {person} over a decade ago when {original context}, he told me that {the promise/differentiator}.","skeleton":["Origin-story hook: the meeting + the promise made back then","The receipts: \"Well, not only was {promise kept}, but {beyond-the-call specifics}\"","The present-day moment that prompted the post (a visit, a milestone)","Direct recommendation to the reader's segment (\"For those young entrepreneurs looking to\u2026, there is none better\")"],"examples":[{"url":"https://www.linkedin.com/posts/michael-g-levine-b82a524_when-i-met-amir-goldman-over-a-decade-ago-activity-7293080798520328193-LDNt","meta":"Michael G. Levine (Fireblocks CFO), 353 reactions / 5 comments, 2025-02-05"},{"url":"https://www.linkedin.com/posts/matiii_andreessen-horowitz-has-supported-us-at-elevenlabs-activity-7382455199350673409-GR7m","meta":"Mati Staniszewski (ElevenLabs, on a16z), 1,481 reactions / 40 comments, 2025-10-10"}],"example_text":"When I met Amir Goldman over a decade ago when he was thinking of investing in Payoneer, he told me that Susquehanna Growth Equity (SGE) was different because they didn't have a time horizon that they had to exit an investment/relationship. Well, not only was SGE a great investor who is still invested in Payoneer, and Amir a great Board Member, but Amir has proactively maintained a personal relationship with me even after I left the firm.\n\nIt was an honor to host Amir when he stopped by Fireblocks to check in to see how I was doing. For those young entrepreneurs looking to bring on an investor that will stick with you and support you, there is none better than Amir and SGE.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFp2lvUHKFEvg/feedshare-shrink_800/B4EZTY6UssHgAg-/0/1738805958726?e=2147483647&v=beta&t=CpXbqHdR1iLvNwa2h2jn7UPJVo_cXuQAtmdRj2d3MlY"},{"name":"Early-adopter endorsement","library":"virio","lane":"BOFU","archetype":"Credentialed early adopter endorses a product through their own documented usage","hook":"Thrilled to be an early adopter of {product} \u2013 a company redefining what {category} should look like.","skeleton":["Early-adopter hook + category reframe","Dual-identity frame (\"As a {professional role}\u2026 As a human\u2026\")","Usage receipts: dash list of what the author actually did/underwent","\"Why?\" \u2014 the belief that motivated the usage","What the company is building (the author's own words, not the brand's)","Thesis close (the category's future) + personal stake line"],"examples":[{"url":"https://www.linkedin.com/posts/paolo-pio_preventivehealth-longevity-elevatehealth-activity-7316076145274159104-Uap7","meta":"Paolo Pio (Elevate Health), 304 reactions / 30 comments, 2025-04-10"},{"url":"https://www.linkedin.com/posts/caleb-ulffers_i-just-discovered-one-of-the-most-revolutionary-activity-7338944064882470912-S6rf","meta":"Caleb Ulffers (ex-Haven), 257 reactions / 453 comments, 2025-06-12"}],"example_text":"\ud83e\uddec Thrilled to be an early adopter of Elevate Health \u2013 a company redefining what mainstream preventive health should look like.\n\nAs a VC, I\u2019m constantly on the lookout for founders building impactful, scalable solutions. As a human, I want to live a long, strong, healthy and happy life. With Elevate Health, I get to do both.\n\nOver the past few weeks, I\u2019ve undergone:\n- A full-body MRI\n- A complete medical check-up and blood panel\n- Wearing a continuous glucose monitor (on my arm \ud83e\uddbe)\n- And a chest ECG Holter (basically a super powerful heart activity monitor)\n\nWhy?\nBecause feeling good doesn\u2019t always equal being in the clear. Prevention only works if you actually look under the hood before the engine light turns on.\n\nWhat Elevate Health is building is the future of health \u2014 data-driven, accessible, beautifully designed, and empowering. Their app puts your whole-body health in your pocket. It\u2019s sleek, smart, and makes managing your health feel less clinical and more personal.\n\nWe believe the best founders of this decade will build solutions that help people stay healthy \u2014 not just get treated when they\u2019re not.\n\n\ud83d\udc5f I train hard, I work in a high-performance environment, and I care deeply about my long-term health. But without tools like Elevate Health, even the most disciplined routines can miss what\u2019s hiding underneath.\n\nMassive thanks to Adil Mohammed, Elevate\u2019s founder, for the vision, hustle, and heart he\u2019s poured into this product. It\u2019s rare to see this level of thoughtfulness in both tech and care delivery.\n\nCan\u2019t wait to get the results, dive into the data, and stay at the top of my game.\nLet\u2019s make preventive health mainstream \ud83d\udcaa.\n\n#PreventiveHealth #Longevity #ElevateHealth #FutureOfWellness #VC #StartupLife #Healthspan #VentureCapital #ExceptionalVentures #LongevityInvesting #Joyspan\u00ae\ufe0f #Health #HealthAndWellness \n\nMatt Cooper, Anna Fortuny-Gomez, PhD, Michella Botto Andrade, Katharina Soell, Alexander S\u00f6derman, ACCA","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQFaryMSVECHTg/feedshare-shrink_1280/B4EZYfseYtHUAo-/0/1744288476941?e=2147483647&v=beta&t=DpX5LI1EsieYdv9Lk3ifpuq0XNVNHyV0H0bSq0mhac8"},{"name":"Flagship project story","library":"virio","lane":"BOFU","archetype":"Agency narrates its biggest-ever project for a marquee client, then invites the next one","hook":"When {marquee client} set out to create {their superlative project}, {we} were entrusted to {the mission, in their brand's language}.","skeleton":["Entrusted hook: client + superlative + mission","Elevation line (\"this wasn't just about X - it was about shaping how the world experiences it\")","The delivery: what was built, with the named sub-brands/details that prove intimacy","The method paragraph (\"Our strength lies in\u2026\") \u2014 the agency's transferable philosophy","Full tag roll: every collaborator on both sides","Experience invitation (\"Flying into Mumbai soon? Step in\") + next-buyer line"],"examples":[{"url":"https://www.linkedin.com/posts/sanghvianshul_when-suntory-global-spirits-set-out-to-create-activity-7359440742529884160-w8nD","meta":"Anshul Jain (WHITE \u00d7 Suntory), 356 reactions / 15 comments, 2025-08-07"},{"url":"https://www.linkedin.com/posts/freeform_megatall-construction-planning-activity-7254740867205230593-lLHV","meta":"James Bowles (Freeform \u00d7 Jeddah Tower), 5,952 reactions / 227 comments, 2024-10-22"}],"example_text":"When Suntory Global Spirits set out to create its largest-ever shop-in-shop at Mumbai\u2019s Chhatrapati Shivaji Maharaj International Airport (Arrivals), WHITE was entrusted to translate their gold-and-wooden barrel universe into an experience that global travellers won\u2019t forget.\n\nThis wasn\u2019t just about showcasing spirits - it was about shaping how the world experiences them. In partnership with Ospree Duty Free, we brought to life a first-of-its-kind, multi-brand concept that housed icons like Hibiki, Bowmore, Maker\u2019s Mark, Roku, and Haku\u2014all under one beautifully curated space.\n\nAt White, our strength lies in converting positioning into presence. Every design choice - material, print, texture, and prop - was deliberately crafted to echo Suntory Global Spirits\u2019 legacy and modern luxury codes. The result? A sensorial journey that reflects the best of East and West, where storytelling and spatial design come together seamlessly.\n\nAshish Gandham Alasdair Dickinson Cai Ping Tan Mandeep Singh Thukral Heena Saxena Shomita Sah Suntory Global Spirits\n\nSheetal Kachroo Ajit Singh Khurana Vishal Kareer Daksh Narula Percy Domingo Ospree Duty Free (MTRPL)\n\nFlying into Mumbai soon? Step in and experience the space. And if you\u2019re looking to elevate your brand in the travel retail or luxury landscape, let\u2019s talk. White is where brand worlds come alive.","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQF5BhRwC4eUKg/feedshare-shrink_800/B4DZiGovGUHsAg-/0/1754605483617?e=2147483647&v=beta&t=tg5dew4xt2HdbwMYvZ9UoGW8VeASEaRMtWXvHrTQqWg"},{"name":"Founder farewell tribute","library":"virio","lane":"BOFU","archetype":"Executive honors a departing founder/leader, itemizing their legacy","hook":"This week marked a very unique milestone in {company}'s history. {Timespan} after {founding act}, we honored {name} as {transition}.","skeleton":["Milestone hook with the timespan (half a century \u2014 the scale is the hook)","Direct address to the honoree: what made them singular, in craft terms","Personal thread: how the author's own path crossed theirs (the PhD student detail)","Legacy itemization: the named things they built/introduced (HANA, design thinking) \u2014 each a still-living asset","Continuity close: what carries forward"],"examples":[{"url":"https://www.linkedin.com/posts/juergmueller_this-week-marked-a-very-unique-milestone-activity-7197231011980541953-xMx6","meta":"Juergen Mueller (SAP, Hasso Plattner), 3,409 reactions / 24 comments, 2024-05-17"},{"url":"https://www.linkedin.com/posts/navin-arora_few-ceos-have-the-opportunity-to-lead-a-activity-7476335714209787904-Emo-","meta":"Navin Arora (TELUS, Darren Entwistle), 624 reactions / 18 comments, 2026-06-26"}],"example_text":"This week marked a very unique milestone in SAP\u2019s history. More than half a century after co-founding SAP, we honored Hasso Plattner as he retired from the role of Chairman of the SAP Supervisory Board. \n\nHasso, your vision and understanding of how technology should work to meet customer needs in a business context is unmatched! You have built an incredible legacy at SAP and beyond and have inspired so many of us with your vision, courage and passion. Thank you, for paving the way for software engineering in Germany. I consider myself extremely fortunate for the opportunity to join your journey about 17 years ago as a PhD student at the Hasso Plattner Institute in Potsdam. Until today, I continue to be impressed with how you combine engineering precision and decades of experience with an unparalleled curiosity about new developments and opportunities.  \n\nYou never shied away from any discipline, thereby revolutionizing how enterprise software is built, introducing design thinking in Europe and re-thinking data management with SAP HANA \u2013 to name just a few of the many impressive accomplishments. Besides inspiring myself, it\u2019s no secret that your lessons, leadership, knowledge, foresight and not to forget your charisma, have laid the foundations of technology at SAP and thereby transformed how businesses across the world operate. \n\nWe will continue carrying your pioneering spirit forward for our customers and partners in this new chapter and I\u2019m filled with excitement about the innovations yet to come!","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQHYA-UpVa2kVg/feedshare-shrink_800/feedshare-shrink_800/0/1715953584265?e=2147483647&v=beta&t=RhrNHCMzXOMtljTG38JuL9Y9PaWnP4YNd3H81FFK_gE"},{"name":"Impact witness post","library":"virio","lane":"BOFU","archetype":"Third party spontaneously testifies to a company's real-world impact they encountered","hook":"Thank you, {company}, and all who care. I recently saw {the concrete artifact} and it reminded me of the real impact {kind of support} can make.","skeleton":["Gratitude hook naming the company and the encounter","Program context with real numbers (322 ambulances, 50 out of service, Rs. 525M contributed)","The gap-and-response mechanic (the need, and who stepped up)","The reframe line (\"This isn't just CSR. It's life-saving.\")","Repeat thanks widened to all participants","Provenance note (\"Photo: I saw this ambulance yesterday, rushing to save a life\")"],"examples":[{"url":"https://www.linkedin.com/posts/amithe-gamage_srilanka-1990suwaseriya-publicprivatepartnership-activity-7336225258124791808-kE9w","meta":"Amithe Gamage (WSO2 / Suwa Seriya), 1,840 reactions / 31 comments, 2025-06-05"},{"url":"https://www.linkedin.com/posts/erinnordbywest_whatifwecould-activity-7338265142100471809-g6DK","meta":"Erin West (Operation Shamrock), 825 reactions / 51 comments, 2025-06-10"}],"example_text":"Thank you, WSO2, and all who care.\nI recently saw an ambulance adopted by WSO2 as part of Sri Lanka's 1990 Suwa Seriya emergency service, and it reminded me of the real impact corporate support can make.\nAs of 2025, Suwa Seriya (One of the world's most digitally advanced and free ambulance services in Sri Lanka, called '1990 Suwa Seriya) operates 322 ambulances, providing free emergency care islandwide. But due to funding and maintenance challenges, over 50 are currently out of service.\nTo bridge the gap, the \"Adopt an Ambulance\" initiative was launched. Private companies have already stepped up, adopting over 100 ambulances and contributing more than Rs. 525 million to keep them running.\nThis isn't just CSR. It's life-saving.\nThank you, WSO2, and all the organizations choosing to invest in something that touches real lives.\nPhoto: I saw this ambulance yesterday, rushing to save a life.\n#srilanka #1990suwaseriya #publicprivatepartnership #CSR","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQHY4EiUXKAckw/feedshare-shrink_800/B56Zc8GqxnHUAk-/0/1749060071942?e=2147483647&v=beta&t=UUZ1Olj73S1xTtzi3lcRLaBbs1cCn6oxQpNqYrw11TU"},{"name":"Innovation pilot peek","library":"virio","lane":"BOFU","archetype":"Sneak peek of a frontier-tech pilot with a named partner, framed as early days","hook":"Get a sneak peek of our collaboration with {partner} and their {frontier thing}, which visited us at {our site}.","skeleton":["Sneak-peek hook naming the partner and the artifact","What was explored, grounded in the workforce (\"potential opportunities\u2026 to help out our team members\")","Humility + horizon line (\"very beginning of this exciting technological journey to shape the future of {domain}\")","Category hashtags"],"examples":[{"url":"https://www.linkedin.com/posts/joerg-burzer_mercedesbenz-mo-artificialintelligence-activity-7174328548340473856-c6U5","meta":"Joerg Burzer (Mercedes-Benz \u00d7 Apptronik), 1,580 reactions / 66 comments, 2024-03-15"},{"url":"https://www.linkedin.com/posts/philipjohnst0n_we-just-trained-the-first-llm-in-space-using-activity-7404538879334326272-IljT","meta":"Philip Johnston (Starcloud \u00d7 NVIDIA), 3,020 reactions / 227 comments, 2025-12-10"}],"example_text":"Get a sneak peek of our collaboration with Apptronik and their robot Apollo, which visited us at our plant. Together with the great team on site, we took a look at the potential opportunities for highly automated robots to help out our team members.\nWe are at the very beginning of this exciting technological journey to shape the future of production with the help of robots and artificial intelligence.\n\n#mercedesbenz #mo #artificialintelligence #digitalization #robotics","linkOnly":false,"note":"","labels":[],"image":"https://dms.licdn.com/playlist/vid/v2/D4D05AQH0QY2r6oyQRw/thumbnail-with-play-button-overlay-high/B4DZosc.p6JUB4-/0/1761682385838?e=2147483647&v=beta&t=lpiGMC7etwSecIY3A4Txt3qVCyDzEbGHMvT_f_Ti4_Y"},{"name":"Insider leader vouch","library":"virio","lane":"BOFU","archetype":"Employee testifies to their own leadership's genius with witnessed specifics","hook":"One of the smartest and most successful {role}s of our time, {name}.","skeleton":["Flat superlative hook, then straight into the witnessed scene (\"While sitting in one of my very first meetings\u2026\")","The impossible-to-fake detail (decimal-level recall, user-navigation fluency)","The dual-ability frame (masters the detail AND casts the 10-year vision)","The founding thesis and its vintage (\"back in 2001\u2026 before those terms were in vogue\")","Receipts peg (yesterday's results as the thesis playing out)","Gratitude close + culture hashtag + \"p.s. we're hiring ;)\""],"examples":[{"url":"https://www.linkedin.com/posts/asharanchhod_wearecapitec-activity-7247086175050452992-dUxS","meta":"Asha Patel (Capitec CEO), 1,401 reactions / 138 comments, 2024-10-01"},{"url":"https://www.linkedin.com/posts/yuchinyeoh_call-me-crazy-but-i-called-my-ex-boss-and-activity-7348350196830846976-NpKu","meta":"YuChin Yeoh (Commvault), 388 reactions / 105 comments, 2025-07-08"}],"example_text":"One of the smartest and most successful CEOs of our time, Gerrie Fourie. While sitting in one of my very first meetings when joining Capitec to discuss our app, I was struck by Gerrie\u2019s detailed knowledge and insight on things like user navigation. He knows his entire business like the back of his hand, and amongst many things, can quote the income statement (down to the decimal) from 10 years ago. \nAt the same time, he has the unique ability to craft and inspire the organisation with his vision for the next 10 years. \nAs one of the founders, back in 2001, they crafted a business plan which set out to bring the fundamentals of Simplicity, Affordability, Accessibility and Personal Service to a complex Banking industry way before those terms were in vogue. If you caught yesterday\u2019s interim results - you would have seen how that vision continues to be brought to life through solutions that truly add value and remove friction in the lives of the clients we serve. \nIt really is quite remarkable, and it\u2019s been a privilege to be part of this team and learn from their genius. \n#WeAreCapitec\n\nand p.s we\u2019re hiring ;)","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4D22AQH8DXlO6RtbJQ/feedshare-image-high-res/feedshare-image-high-res/0/1727839985177?e=2147483647&v=beta&t=QPY9EG1wgl0joGhI5BUWgYpzNN_Mh6JvlvswIiiaTCw"},{"name":"Partner manifesto","library":"virio","lane":"BOFU","archetype":"Sponsored partnership disclosed inside a personal philosophy the product happens to complete","hook":"We tell ourselves we'll start when things 'settle down'...","skeleton":["Universal self-deception hook (the excuse everyone recognizes)","The two what-if questions that corner it","The philosophy line (\"Growth doesn't happen when life clears a path\u2026\")","Partnership disclosure, woven in (\"That's why I'm happy to partner with {brand}\")","Why THIS partner fits the philosophy (the product attribute that resolves the tension)","The permission line (\"the right moment is whenever you decide to start\")","Arrow CTA + single link + partner hashtags"],"examples":[{"url":"https://www.linkedin.com/posts/tayloramelia_nationaluniversity-levelupnu-nationaluniversitypartner-activity-7305210934581473280-1eut","meta":"Amelia Taylor (National University), 1,479 reactions / 31 comments, 2025-03-11"},{"url":"https://www.linkedin.com/posts/marcelsantilli_1b-in-arr-profitable-no-funding-5-years-activity-7346174642446848000-T4X0","meta":"Marcel Santilli (GrowthX AI \u00d7 Surge AI), 613 reactions / 71 comments, 2025-07-02"}],"example_text":"We tell ourselves we\u2019ll start when things \u201csettle down\u201d...\n\n\nWhen the timing is perfect. When life finally slows its relentless pace.\n\nBut what if it never does? What if waiting is the very thing keeping you from where you\u2019re meant to be?\n\nGrowth doesn\u2019t happen when life clears a path for you. It happens when you decide to make space for it. That\u2019s why I\u2019m happy to partner with National University. \n\nBetween career moves, parenting moments, late night thinking, and early morning ambition. The people who grow - who truly level up - are the ones who make a commitment to themselves even when life is full.\n\nThis is the exact reason as to why National University resonates so deeply with me. Their flexible, accredited online graduate programs - perfect for those who refuse to put their future on hold because real life doesn\u2019t come with perfect timing as we all know. \n\nIf you\u2019re waiting for the right moment, consider this: the right moment is whenever you decide to start.\n\n\u2192 Ready to move on your terms? This is for you: https://tag.gs/rAIz\n\n\u2026NU meets you exactly where you are, which is exactly what we all need, most. \n\n\n#NationalUniversity #LevelUpNU #NationalUniversityPartner","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D4E22AQGIgRVV2s0Xxg/feedshare-image-high-res/B4EZWBW2XxHUA0-/0/1741632007197?e=2147483647&v=beta&t=STtsrlofYbqTJyufGEUvg9N9sgEXhX5yRS-YfxC_-b4"},{"name":"Receipts testimonial","library":"virio","lane":"BOFU","archetype":"Customer testifies with the exact promise made, the promise beaten, and the numbers","hook":"{Name} texted me a few months ago saying {vendor} could get {company} {specific promise}. They ended up getting us {bigger number} in {shorter time}\u2026","skeleton":["Promise hook, with names and the original claim","The beat: delivery exceeded promise (bigger number, less time)","The blind-spot confession (\"I had no clue we were leaving tens of thousands on the table\")","The service detail (24/7 texting, 5-minute replies \u2014 oddly specific)","Direct recommendation naming the exact buyer (\"If you're a founder who wants to\u2026\")"],"examples":[{"url":"https://www.linkedin.com/posts/nicoaferr_cyrus-shirazi-texted-me-a-few-months-ago-activity-7312878138370240515-IYuM","meta":"Nico F. (Haven / Default), 211 reactions / 20 comments, 2025-04-01"},{"url":"https://www.linkedin.com/posts/robertreffkin_thank-you-andy-florance-ceo-costar-group-activity-7352789119678251009-URoE","meta":"Robert Reffkin (Compass, on Homes.com), 480 reactions / 41 comments, 2025-07-20"}],"example_text":"Cyrus Shirazi texted me a few months ago saying Haven could get Default $30K in R&D tax credits in a day.\n\nThey ended up getting us $50K in 10 minutes\u2026\n\nI had no clue we were leaving tens of thousands of dollars in R&D tax credits on the table, but their team found them and got us taken care of lightning-fast.\n\nI also think Cyrus Shirazi might be our only vendor who I can text 24/7 and get a reply from within 5 minutes.\n\nIf you're a founder who wants to free yourself up to focus 100% on building (and potentially uncover massive refunds for your startup) Haven is the team to trust.","linkOnly":false,"note":"","labels":[]},{"name":"Relationship-receipts story","library":"virio","lane":"BOFU","archetype":"Decades-spanning personal story proving what a partner is like over time","hook":"In {year} I was {low moment}. {One vivid sentence of the scene.}","skeleton":["Dated low-moment hook, told plainly","The person who showed up: what they said/did, with one oddly specific detail (the washed fruit)","Time jump: \"Today, two decades later\u2026\" \u2014 where both parties landed","The reunion scene: proof the character held (\"some things don't change\")","The credential reveal: who this person turned out to be","One-line moral (\"Sometimes the good guys win\")","Engagement invitation: \"share/tag someone who\u2026\""],"examples":[{"url":"https://www.linkedin.com/posts/crystal-lim-lange_leadership-activity-7245301455186788352-gKam","meta":"Crystal Lim-Lange, 1,930 reactions / 103 comments, 2024-09-27"},{"url":"https://www.linkedin.com/posts/josephdesena_one-minute-i-was-in-the-back-of-a-taxi-in-activity-7341068070196527105-8KyS","meta":"Joe De Sena (Spartan), 769 reactions / 94 comments, 2025-06-18"}],"example_text":"In 2003 I was retrenched from an investment bank. I had to pack up my things in front of everyone, and I was in shock. This colleague of mine, Vineet Mishra pulled me aside, and he told me that he wasn't sad for me. He said that years from now I would look back and realise that there was something better for me out there.\n\nToday 2 decades later, I'm my own boss with 3 successful companies, doing what I love every day. I still think of Vineet and how kind he was. He looked out for all of us junior analysts when we worked till 3 am in the morning and told us to chill. He nagged me about not eating and one time he even washed my office fruit for me and made me eat it to ward off scurvy.\n\nYesterday I had lunch with him and connected for the first time in 17 years. He told me I wasn't eating enough and tried to make me finish my chicken. Some things don't change \ud83d\ude02\n\nIt made me so proud and happy to hear that he was now a Managing Director running Investment Banking for the region at J.P. Morgan. It's rare to find someone in this industry who is as solid and kind as they are competent.\n\nSometimes the good guys win. \ud83e\udd79\n\nThanks Vineet\u2764\ufe0f\n\nShare with me in the comments if you have someone who has touched your life and made a difference in your career, and tag them!","linkOnly":false,"note":"","labels":[],"image":"https://media.licdn.com/dms/image/v2/D5622AQGk4trND3Vq6A/feedshare-shrink_800/feedshare-shrink_800/0/1727414476301?e=2147483647&v=beta&t=wwKte36xr_EcFkPKVHgVhITjzaC-Xr5eNkLeh8EJ5xc"},{"name":"Steady-hand statement","library":"virio","lane":"BOFU","archetype":"Leader's calm, forward-moving statement amid visible turbulence","hook":"We remain committed to {the relationship/promise} and have confidence in {roadmap/ability to deliver}.","skeleton":["Commitment + confidence line, naming what customers actually care about (roadmap, support, continuity)","Graceful nod to the changed situation, no drama, names used respectfully","The decisive move: the concrete action being taken, announced plainly","Forward line: speed and resources (\"moving quickly to provide them with the resources needed\")"],"examples":[{"url":"https://www.linkedin.com/posts/satyanadella_we-remain-committed-to-our-partnership-with-activity-7132274707701059585-cKA3","meta":"Satya Nadella (Microsoft, during the OpenAI board crisis), 72,232 reactions / 2,365 comments, 2023-11-20"},{"url":"https://www.linkedin.com/posts/ugcPost-7350650246009401345-xizz","meta":"Zach Diamond (Windsurf \u2192 Cognition, during the Windsurf split), 484 reactions / 20 comments, 2025-07-15"}],"example_text":"We remain committed to our partnership with OpenAI and have confidence in our product roadmap, our ability to continue to innovate with everything we announced at Microsoft Ignite, and in continuing to support our customers and partners. We look forward to getting to know Emmett Shear and OAI's new leadership team and working with them. And we're extremely excited to share the news that Sam Altman and Greg Brockman, together with colleagues, will be joining Microsoft to lead a new advanced AI research team. We look for
